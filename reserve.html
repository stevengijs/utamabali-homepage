<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="referrer" content="no-referrer">
  <script src="/t.js" defer></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Reserveer je unit · UTAMA</title>
<style>
  :root{--bg:#f5f6f5;--panel:#fff;--ink:#12211c;--muted:#5f6f68;--line:#e3e7e4;--brand:#0f6b4f;--brand2:#14b37d;--danger:#c0392b;--radius:14px}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1000px 500px at 70% -10%,#12332a,#0c1a15);min-height:100vh;color:var(--ink);font-size:15px;line-height:1.5;padding:24px 16px}
  .wrap{max-width:640px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .brand b{color:#fff;letter-spacing:.5px}
  .card{background:var(--panel);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;margin-bottom:18px}
  .card-h{padding:18px 22px;border-bottom:1px solid var(--line)}
  .card-h h1{font-size:19px;margin:0}
  .card-h .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .card-b{padding:22px}
  .sum{display:flex;flex-wrap:wrap;gap:14px 26px;background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .sum .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .sum .v{font-size:16px;font-weight:700}
  .steps{display:flex;gap:8px;margin-bottom:20px}
  .step{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:8px 4px;border-radius:9px;background:#eef0ef;border:1px solid var(--line)}
  .step.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .step.done{background:#e7f6ef;color:var(--brand);border-color:#c6ead9}
  .itp{border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-height:320px;overflow:auto;font-size:13.5px;background:#fff}
  .itp h2{font-size:15px;margin:0 0 4px}
  .itp h3{font-size:13px;margin:16px 0 4px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .itp p{margin:0 0 18px}
  .itp p:last-child{margin-bottom:0}
  .field{margin:16px 0}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}
  .field input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,179,125,.15)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:14px 0}
  .check input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand)}
  /* Handtekeningveld: de notaris wil een echte krabbel onder de ITP zien. */
  .sig-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;position:relative;overflow:hidden}
  .sig-wrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
  .sig-lijn{position:absolute;left:18px;right:18px;bottom:38px;border-bottom:1px solid #d9e0dc;pointer-events:none}
  .sig-hint{position:absolute;left:18px;bottom:14px;font-size:12px;color:#98a29d;pointer-events:none}
  .sig-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
  .sig-clear{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
  .itp-sig{max-width:220px;max-height:80px;display:block;margin:2px 0 2px}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:11px;background:var(--brand);color:#fff;font-weight:750;font-size:16px;cursor:pointer}
  .btn:hover{background:#0b573f}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* Tweede knop, rustiger dan de hoofdknop: het downloaden is een naslagactie. */
  .btn-sec{width:auto;padding:11px 16px;font-size:14px;background:#fff;color:var(--brand);border:1px solid var(--line);font-weight:700}
  .btn-sec:hover{background:#f2f8f5}
  .muted{color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
  .err{background:#fbeeec;border:1px solid #f0d3ce;color:#a3271b;border-radius:10px;padding:12px 14px;font-size:13.5px;margin:12px 0}
  .ok-badge{display:inline-flex;align-items:center;gap:7px;background:#e7f6ef;color:var(--brand);border:1px solid #c6ead9;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
  .center{text-align:center}
  .big-ok{width:64px;height:64px;border-radius:50%;background:#e7f6ef;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
  .bank{background:#f7faf8;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .bank .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .bank .v{font-size:13px;line-height:1.5}
  .banks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.banks{grid-template-columns:1fr}}
  .bank2{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .bank2 .bt{font-weight:750;font-size:13px;margin-bottom:8px}
  .bank2 .row{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;flex-wrap:wrap}
  .bank2 .row span{color:var(--muted);min-width:82px}
  .bank2 .row b{word-break:break-all}
  .cp{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11px;padding:3px 8px;cursor:pointer;color:var(--brand);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">U</div><b>UTAMA</b></div>
  <div class="card">
    <div class="card-h"><h1 id="title">Reserveer je unit</h1><div class="sub" id="subtitle">Bevestig en beveilig je unit met een aanbetaling.</div></div>
    <div class="card-b" id="body"><div class="center muted" style="padding:30px">Laden…</div></div>
  </div>
  <div class="note">Beveiligd · UTAMA Bali</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const EP="https://gcpachivrwalsneuvlsa.supabase.co/functions/v1/reservation";
const token=new URLSearchParams(location.search).get("token");
const $=s=>document.querySelector(s);
const body=$("#body");
let RES=null;
function euro(n){n=Number(n)||0;return "€"+n.toLocaleString("nl-NL");}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// Bankgegevens per verkopende PT. Houd EXACT in sync met admin.html (PT_BANK in de
// ITP-generator) en met projects.legal_entity. Uitsluitend PT-rekeningen, nooit
// privé. The Maison + The Reload = PT. BANGUNAN BETON INDONESIA; MOKA = PT. BALI
// UTAMA PROPERTY. Onbekend project -> geen nummer (nooit naar de verkeerde PT).
const PROJECT_PT={"the maison":"PT. BANGUNAN BETON INDONESIA","the reload":"PT. BANGUNAN BETON INDONESIA","moka":"PT. BALI UTAMA PROPERTY"};
const PT_BANK={
  "PT. BANGUNAN BETON INDONESIA":{bank:"OCBC NISP",name:"PT. BANGUNAN BETON INDONESIA",acct:"160800023303",swift:"NISPIDJAXXX",branch:"7160",code:"028",address:"Jl. Teuku Umar No. 2-4, Denpasar 80114, Bali, Indonesia"},
  "PT. BALI UTAMA PROPERTY":{bank:"OCBC NISP",name:"PT Bali Utama Property",acct:"160800023394",swift:"NISPIDJAXXX",branch:"7160",code:"028",address:"Jl. Teuku Umar No. 2-4, Denpasar 80114, Bali, Indonesia"}
};
function ptFor(r){return PT_BANK[PROJECT_PT[((r&&r.project)||"").trim().toLowerCase()]]||null;}
function sellerName(r){const b=ptFor(r);return b?b.name:"UTAMA";}
// Allowlist-sanitizer: de ITP-body is rijke HTML die door het team is opgesteld,
// maar wordt hier aan de klant getoond. Deny-by-default zodat een eventuele
// script/onerror-payload nooit in de browser van de klant uitvoert.
function sanitizeHtml(dirty){
  if(dirty==null)return "";
  const allowed={A:1,B:1,STRONG:1,I:1,EM:1,U:1,P:1,BR:1,UL:1,OL:1,LI:1,SPAN:1,DIV:1,H1:1,H2:1,H3:1,H4:1,BLOCKQUOTE:1,HR:1};
  const drop={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,SVG:1,MATH:1,IMG:1,VIDEO:1,AUDIO:1,SOURCE:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,BASE:1};
  const doc=new DOMParser().parseFromString('<div id="__sz">'+String(dirty)+'</div>',"text/html");
  const root=doc.getElementById("__sz");
  const walk=node=>{[...node.childNodes].forEach(ch=>{
    if(ch.nodeType===8){ch.remove();return;}
    if(ch.nodeType!==1)return;
    const tag=ch.tagName;
    if(drop[tag]){ch.remove();return;}
    if(!allowed[tag]){walk(ch);while(ch.firstChild)node.insertBefore(ch.firstChild,ch);node.removeChild(ch);return;}
    [...ch.attributes].forEach(a=>{
      if(tag==="A"&&a.name.toLowerCase()==="href"){const v=(a.value||"").trim();if(/^(https?:|mailto:)/i.test(v)){ch.setAttribute("href",v);ch.setAttribute("rel","noopener noreferrer");ch.setAttribute("target","_blank");}else ch.removeAttribute("href");}
      else ch.removeAttribute(a.name);
    });
    walk(ch);
  });};
  walk(root);
  return root.innerHTML;
}
function itpToHtml(body){if(!body)return "";if(/<\w+[^>]*>/.test(body))return sanitizeHtml(body);return body.split("\n").map(line=>{const t=line.trim();if(t&&t===t.toUpperCase()&&/[A-Z]/.test(t)&&t.length<44)return "<b>"+esc(t)+"</b>";return esc(line);}).join("<br>");}
function htmlToPlain(h){return (h||"").replace(/<\/(p|div|h[1-6])>/gi,"\n\n").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<").replace(/&gt;/gi,">").replace(/\n{3,}/g,"\n\n").trim();}
function isHeadingLine(t){t=(t||"").trim();return !!(t&&t===t.toUpperCase()&&/[A-Z]/.test(t)&&t.length<44);}
async function api(action,extra){
  // Nooit laten crashen op netwerk-/serverfouten: geef altijd een {ok:false,error}
  // terug zodat de knoppen herstellen en de klant een nette melding ziet
  // (voorheen bleef de pagina hangen op "Laden…" of de knop op "Bezig…").
  try{
    const r=await fetch(EP,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,...(extra||{})})});
    if(!r.ok){return {ok:false,error:"De server reageert even niet (status "+r.status+"). Probeer het over een minuut opnieuw."};}
    return await r.json();
  }catch(e){
    return {ok:false,error:"Geen verbinding met de server. Controleer je internet en probeer het opnieuw."};
  }
}
function refText(r){return `${r.project||""} ${r.unit||""} deposit`.replace(/\s+/g," ").trim();}
function itpFilled(r){
  let b=itpToHtml(r.itp_body)||"";
  if(!b)return b;
  // Verkoper tekent bij uitgifte: een leeg verkopersblok wordt altijd gevuld,
  // ook op ITP's die zijn aangemaakt voordat de standaardtekst dit meekreeg.
  const uit=new Date(r.sent_at||r.created_at||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  b=b.replace(/(<b>\s*ACCEPTED BY SELLER\s*<\/b>[\s\S]{0,260}?)Signature:\s*(<br\s*\/?>)\s*Date:(?=\s*<)/i,(m,voor,br)=>voor+"Signature: \u2713 Digitally signed"+br+"Date: "+esc(uit));
  if(r.itp_signed_at){
    const d=new Date(r.itp_signed_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
    const wie=r.itp_signer_name||r.name||"";
    // Is er een getekende handtekening, dan komt die in beeld; de naam blijft
    // eronder staan zodat het document leesbaar blijft zonder afbeelding.
    const krabbel=r.itp_signature?`<br><img class="itp-sig" src="${esc(r.itp_signature)}" alt="Handtekening ${esc(wie)}">`:"";
    b=b.replace(/(<b>\s*BUYER\s*<\/b>[\s\S]{0,220}?)Signature:\s*(<br\s*\/?>)\s*Date:(?=\s*<)/i,(m,voor,br)=>voor+"Signature: "+(r.itp_signature?"":"\u2713 ")+"Digitally signed by "+esc(wie)+krabbel+br+"Date: "+esc(d));
  }else{
    // Nog niet getekend: maak duidelijk dat dit vanzelf wordt ingevuld,
    // anders lijkt het alsof de koper hier zelf iets moet invullen.
    b=b.replace(/(<b>\s*BUYER\s*<\/b>[\s\S]{0,220}?)Signature:\s*(<br\s*\/?>)\s*Date:(?=\s*<)/i,(m,voor,br)=>voor+'Signature: <i style="color:#6f7f78">filled in automatically after you sign digitally below</i>'+br+'Date: <i style="color:#6f7f78">filled in automatically</i>');
  }
  return b;
}
function itpText(r){
  const today=new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
  if(r.itp_body&&r.itp_body.trim()){
    const banner=r.itp_signed_at?`<div class="ok-badge" style="display:block;margin:0 0 12px">\u2713 Signed by both parties: ${esc(r.itp_signer_name||r.name||"")} on ${new Date(r.itp_signed_at).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})} \u00b7 UTAMA digitally upon issuance</div>`:"";
    const prepared=new Date(r.sent_at||r.created_at||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
    return `<h2>Intent to Purchase (ITP)</h2><p class="muted">Prepared on ${prepared}</p>${banner}<div>${itpFilled(r)}</div>`;
  }
  return `
    <h2>Intentieverklaring tot aankoop (ITP)</h2>
    <p class="muted">Opgesteld op ${today}</p>
    <h3>Partijen</h3>
    <p><b>Verkoper:</b> ${esc(sellerName(r))}<br><b>Koper:</b> ${esc(r.name||"—")}${r.email?` (${esc(r.email)})`:""}</p>
    <h3>Object</h3>
    <p><b>Project:</b> ${esc(r.project||"—")}<br><b>Unit:</b> ${esc(r.unit||"—")}${r.unit_price?`<br><b>Indicatieve koopsom:</b> ${euro(r.unit_price)}`:""}</p>
    <h3>Reserveringsdeposit</h3>
    <p>De koper betaalt een reserveringsdeposit van <b>${euro(r.deposit_amount)}</b> aan ${esc(sellerName(r))} om de bovengenoemde unit te reserveren. Deze aanbetaling wordt verrekend met de eerste termijn onder de Development and Construction Agreement ("credited against the first payment due under the Development and Construction Agreement").</p>
    <h3>Vervolg</h3>
    <p>Het restant van de koopsom wordt voldaan volgens het betaalschema nadat alle definitieve contracten (leasehold deed en construction agreement) zijn getekend bij de notaris. Deze ITP is een intentieverklaring en geen notariële, bindende koopakte.</p>
    <h3>Voorwaarden deposit</h3>
    <p>Restitutievoorwaarden worden vastgelegd in de definitieve overeenkomst. Deze tekst is een concept en kan door UTAMA worden aangepast.</p>
  `;
}
function steps(active){
  const s=["ITP","Onder&shy;tekenen","Aanbetaling"];
  return `<div class="steps">${s.map((x,i)=>{const n=i+1;const cls=n<active?"done":(n===active?"on":"");return `<div class="step ${cls}">${n<active?"✓ ":""}${x}</div>`;}).join("")}</div>`;
}
function summary(r){
  return `<div class="sum">
    <div><div class="k">Project</div><div class="v">${esc(r.project||"—")}</div></div>
    <div><div class="k">Unit</div><div class="v">${esc(r.unit||"—")}</div></div>
    <div><div class="k">Aanbetaling</div><div class="v">${euro(r.deposit_amount)}</div></div>
  </div>`;
}
function bankBlock(r){
  const ref=refText(r);
  const b=ptFor(r);
  const rows=b?`<div class="bank2"><div class="bt">Bankoverschrijving · Indonesië</div>
        <div class="row"><span>Bank</span><b>${esc(b.bank)}</b></div>
        <div class="row"><span>Naam</span><b>${esc(b.name)}</b></div>
        <div class="row"><span>Rekeningnr.</span><b>${esc(b.acct)}</b><button class="cp" data-copy="${esc(b.acct)}">Kopieer</button></div>
        <div class="row"><span>SWIFT</span><b>${esc(b.swift)}</b></div>
        <div class="row"><span>Branch</span><b>${esc(b.branch)}</b></div>
        <div class="row"><span>Bank code</span><b>${esc(b.code)}</b></div>
        <div class="row"><span>Adres</span><b>${esc(b.address)}</b></div>
      </div>`:`<div class="bank2"><div class="row"><span>Bank</span><b>De bankgegevens worden apart per e-mail verstrekt.</b></div></div>`;
  return `<h3 style="margin:6px 0 4px;font-size:15px">Aanbetaling van ${euro(r.deposit_amount)}</h3>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Maak de aanbetaling over aan <b>${esc(sellerName(r))}</b> met onderstaand betalingskenmerk.</p>
    <div class="bank"><div class="k">Betalingskenmerk (vermeld dit bij je overschrijving)</div><div class="v" id="ref">${esc(ref)}</div><div style="margin-top:8px"><button class="cp" data-copy="${esc(ref)}">Kopieer kenmerk</button></div></div>
    <div class="banks">${rows}</div>`;
}
function render(){
  const r=RES;
  if(!r){body.innerHTML='<div class="err">Reservering niet gevonden. Controleer je link of neem contact met ons op.</div>';return;}
  if(r.status==="deposit_paid"||r.payment_status==="paid"){
    body.innerHTML=`<div class="center" style="padding:16px 0">
      <div class="big-ok">✓</div>
      <h2 style="margin:0 0 6px">Je unit is gereserveerd!</h2>
      <p class="muted">We hebben je aanbetaling van ${euro(r.deposit_amount)} ontvangen en je ITP is ondertekend. Je ontvangt een bevestiging per e-mail. We nemen contact op voor de vervolgstappen.</p>
      <div style="margin-top:16px" class="ok-badge">${esc(r.project||"")} · ${esc(r.unit||"")}</div>
    </div>`;
    return;
  }
  const signed=!!r.itp_signed_at;
  let h=summary(r)+steps(signed?3:1);
  h+=`<div class="itp" id="itpbox">${itpText(r)}</div>`;
  if(!signed){
    h+=`<div class="field" style="margin-top:18px"><label>Volledige naam (digitale handtekening)</label><input type="text" id="signer" placeholder="Voor- en achternaam" value="${esc(r.name||"")}"></div>
      <div class="field" style="margin-top:14px"><label>Handtekening</label>
        <div class="sig-wrap"><canvas id="sigpad"></canvas><div class="sig-lijn"></div><div class="sig-hint" id="sighint">Teken hier met je muis of vinger</div></div>
        <div class="sig-bar"><span class="note" style="margin:0">De notaris heeft een echte handtekening nodig.</span><button type="button" class="sig-clear" id="sigclear">Opnieuw</button></div>
      </div>
      <label class="check"><input type="checkbox" id="agree"><span>Ik heb de intentieverklaring gelezen en ga akkoord met de reservering en de aanbetaling van ${euro(r.deposit_amount)}.</span></label>
      <div id="msg"></div>
      <button class="btn" id="signBtn">Onderteken de ITP</button>
      <div class="note">Ondertekenen legt je intentie vast met tijdstempel. De aanbetaling volgt in de volgende stap.</div>`;
  }else{
    const reported=r.payment_status==="transfer_reported";
    h+=`<div style="margin:16px 0"><span class="ok-badge">✓ ITP ondertekend door ${esc(r.itp_signer_name||r.name||"")}${r.itp_signed_at?" op "+new Date(r.itp_signed_at).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"}):""}</span></div>`;
    // De klant houdt zelf een exemplaar: het getekende bestand met handtekening,
    // hetzelfde dat wij en de notaris zien.
    h+=`<div style="margin:0 0 16px"><button class="btn btn-sec" id="dlItp">⬇ Download je getekende ITP (PDF)</button></div>`;
    h+=bankBlock(r);
    h+=`<div id="msg"></div>`;
    if(reported){
      h+=`<div class="ok-badge" style="background:#fdf3e2;color:#8a6410;border-color:#f4e2c1;margin-top:12px">⏳ Betaling gemeld — we bevestigen je reservering zodra de aanbetaling binnen is.</div>`;
    }else{
      h+=`<button class="btn" id="paidBtn" style="margin-top:14px">Ik heb de overschrijving gedaan</button>
        <div class="note">Klik nadat je de overschrijving hebt gedaan. We bevestigen zodra het bedrag is ontvangen.</div>`;
    }
  }
  body.innerHTML=h;
  sigInit();
  const sb=$("#signBtn"); if(sb)sb.onclick=doSign;
  const pb=$("#paidBtn"); if(pb)pb.onclick=doMarkTransfer;
  const dl=$("#dlItp"); if(dl)dl.onclick=doDownloadItp;
  document.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.copy);const t=b.textContent;b.textContent="Gekopieerd";setTimeout(()=>b.textContent=t,1200);}catch(e){}});
}
/* Het handtekeningveld. Tekent op een canvas op werkelijke schermresolutie,
   zodat de krabbel scherp op papier komt en niet als blokkerige uitvergroting.
   Werkt met muis, trackpad en vinger; pointer events dekken alle drie. */
let SIG=null;
function sigInit(){
  const c=document.getElementById("sigpad"); if(!c) { SIG=null; return; }
  const ctx=c.getContext("2d");
  const schaal=()=>{
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    const beeld=c.width?ctx.getImageData(0,0,c.width,c.height):null;
    c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#12211c";
    if(beeld&&SIG&&SIG.leeg===false){ try{ ctx.putImageData(beeld,0,0); }catch(e){} }
  };
  schaal();
  window.addEventListener("resize",schaal);
  let bezig=false,leeg=true;
  const punt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left, e.clientY-r.top];};
  const hint=document.getElementById("sighint");
  c.addEventListener("pointerdown",e=>{
    bezig=true; c.setPointerCapture(e.pointerId);
    const [x,y]=punt(e); ctx.beginPath(); ctx.moveTo(x,y);
    if(leeg&&hint) hint.style.display="none";
    leeg=false; SIG.leeg=false;
  });
  c.addEventListener("pointermove",e=>{ if(!bezig)return; const [x,y]=punt(e); ctx.lineTo(x,y); ctx.stroke(); });
  const stop=()=>{bezig=false;};
  c.addEventListener("pointerup",stop); c.addEventListener("pointercancel",stop); c.addEventListener("pointerleave",stop);
  const wis=document.getElementById("sigclear");
  if(wis) wis.onclick=()=>{ ctx.clearRect(0,0,c.width,c.height); leeg=true; SIG.leeg=true; if(hint) hint.style.display=""; };
  SIG={ leeg:true, isLeeg:()=>leeg, dataUrl:()=>leeg?null:c.toDataURL("image/png") };
}
function makePdf(r,signer,sigData){
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"a4"});
    const M=56;let y=64;const W=doc.internal.pageSize.getWidth()-M*2;
    doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("UTAMA: Intent to Purchase (ITP)",M,y);y+=26;
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(30);
    const rr=Object.assign({},r,{itp_signed_at:r.itp_signed_at||new Date().toISOString(),itp_signer_name:signer});
    const lines=(r.itp_body&&r.itp_body.trim())?[
      "Prepared on "+new Date(r.sent_at||r.created_at||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),"",
      ...htmlToPlain(itpFilled(rr)).split("\n"),"",
      "SIGNATURES",
      "Buyer: signed by "+signer+" on "+new Date().toLocaleString("en-GB"),
      "Seller: digitally signed upon issuance of this ITP"
    ]:[
      "Prepared on "+new Date(r.sent_at||r.created_at||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),"",
      "PARTIJEN","Verkoper: PT Bali Utama Property","Koper: "+(r.name||"—")+(r.email?" ("+r.email+")":""),"",
      "OBJECT","Project: "+(r.project||"—"),"Unit: "+(r.unit||"—"),(r.unit_price?"Indicatieve koopsom: €"+Number(r.unit_price).toLocaleString("nl-NL"):""),"",
      "RESERVERINGSDEPOSIT","Reserveringsdeposit: €"+Number(r.deposit_amount||0).toLocaleString("nl-NL")+" aan PT Bali Utama Property.",
      "Referentie: "+refText(r),
      "Deze aanbetaling wordt verrekend met de eerste termijn onder de Development and Construction Agreement.","",
      "VERVOLG","Het restant van de koopsom wordt voldaan volgens het betaalschema nadat alle","definitieve contracten zijn getekend bij de notaris. Deze ITP is een intentieverklaring","en geen notariële, bindende koopakte.","",
      "SIGNATURES",
      "Buyer: digitally signed by "+signer+" on "+new Date().toLocaleString("en-GB"),
      "Seller: digitally signed upon issuance of this ITP"
    ];
    lines.forEach(t=>{
      const kop=isHeadingLine(t);
      const m=!kop&&/^([A-Za-z][A-Za-z .]{0,24}:)\s(.+)$/.exec(t);
      if(m){
        doc.setFont("helvetica","bold");
        const lw=doc.getTextWidth(m[1]+" ");
        if(lw+doc.getTextWidth(m[2])<=W){
          if(y>780){doc.addPage();y=64;}
          doc.text(m[1],M,y);doc.setFont("helvetica","normal");doc.text(m[2],M+lw,y);y+=15;return;
        }
      }
      doc.setFont("helvetica",kop?"bold":"normal");
      const wrapped=doc.splitTextToSize(t,W);wrapped.forEach(w=>{if(y>780){doc.addPage();y=64;}doc.text(w,M,y);y+=15;});
    });
    // De getekende handtekening onder de tekst, met een lijn eronder en de
    // naam eronder: zo staat er op papier wat de notaris wil zien.
    if(sigData){
      try{
        if(y>700){doc.addPage();y=64;}
        y+=6;
        doc.addImage(sigData,"PNG",M,y,150,52,undefined,"FAST");
        y+=58;
        doc.setDrawColor(170); doc.line(M,y,M+220,y); y+=13;
        doc.setFontSize(9.5); doc.setTextColor(90);
        doc.text(signer+" \u00b7 "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),M,y);
        doc.setFontSize(10.5); doc.setTextColor(30); y+=16;
      }catch(e){ /* zonder afbeelding blijft de tekstregel staan */ }
    }
    // Watermerk op elke pagina: dit exemplaar is het getekende exemplaar.
    const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
    for(let i=1;i<=doc.getNumberOfPages();i++){
      doc.setPage(i);doc.saveGraphicsState();doc.setGState(new doc.GState({opacity:0.08}));
      doc.setFont("helvetica","bold");doc.setFontSize(78);doc.setTextColor(15,107,79);
      doc.text("SIGNED",pw/2,ph/2,{angle:45,align:"center"});
      doc.restoreGraphicsState();
    }
    doc.setTextColor(30);
    return doc.output("datauristring").split(",")[1];
  }catch(e){return null;}
}
function itpBestandsnaam(r){
  return ("ITP-"+((r&&r.project)||"UTAMA")+"-"+((r&&r.unit)||"")).replace(/[^A-Za-z0-9-]+/g,"-").replace(/-+$/,"")+".pdf";
}
function bewaarBestand(url){
  const a=document.createElement("a");
  a.href=url; a.download=itpBestandsnaam(RES); a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
/* De getekende ITP downloaden. Eerst het exemplaar dat bij het ondertekenen is
   vastgelegd (dat is wat de notaris krijgt); lukt dat niet, dan maken we het
   document ter plekke opnieuw op, zodat de klant nooit met lege handen staat. */
async function doDownloadItp(){
  const btn=$("#dlItp"); const oud=btn.textContent;
  btn.disabled=true; btn.textContent="Bezig…";
  try{
    const res=await api("pdf_url");
    if(res&&res.ok&&res.url){ bewaarBestand(res.url+"&download="+encodeURIComponent(itpBestandsnaam(RES))); return; }
  }catch(e){}
  try{
    const b64=makePdf(RES,RES.itp_signer_name||RES.name||"",RES.itp_signature||null);
    if(b64) bewaarBestand("data:application/pdf;base64,"+b64);
  }catch(e){}
  finally{ btn.disabled=false; btn.textContent=oud; }
}
async function doSign(){
  const signer=($("#signer").value||"").trim();const agree=$("#agree").checked;const msg=$("#msg");
  if(!signer){msg.innerHTML='<div class="err">Vul je volledige naam in.</div>';return;}
  // De handtekening is verplicht: zonder krabbel heeft de notaris niets aan
  // het document, en dat wil je merken vóór het tekenen, niet erna.
  const sigData=SIG?SIG.dataUrl():null;
  if(!sigData){msg.innerHTML='<div class="err">Zet je handtekening in het vak hierboven.</div>';return;}
  if(!agree){msg.innerHTML='<div class="err">Vink het akkoord aan om te ondertekenen.</div>';return;}
  const btn=$("#signBtn");btn.disabled=true;btn.textContent="Bezig…";
  const pdf=makePdf(RES,signer,sigData);
  const res=await api("sign",{signer_name:signer,pdf_base64:pdf,signature:sigData});
  if(res&&res.ok){RES=await api("get");render();}
  else{btn.disabled=false;btn.textContent="Onderteken de ITP";msg.innerHTML='<div class="err">'+esc((res&&res.error)||"Er ging iets mis.")+'</div>';}
}
async function doMarkTransfer(){
  const btn=$("#paidBtn");btn.disabled=true;btn.textContent="Bezig…";const msg=$("#msg");
  const res=await api("mark_transfer",{});
  if(res&&res.ok){RES=await api("get");render();}
  else{btn.disabled=false;btn.textContent="Ik heb de overschrijving gedaan";msg.innerHTML='<div class="err">'+esc((res&&res.error)||"Er ging iets mis.")+'</div>';}
}
(async function(){
  if(!token){body.innerHTML='<div class="err">Geen reservering opgegeven.</div>';return;}
  RES=await api("get");
  if(!RES||RES.ok===false||RES.error){
    body.innerHTML='<div class="err" style="margin:20px">'+esc((RES&&RES.error)||"Kon de reservering niet laden.")+' <a href="javascript:location.reload()">Opnieuw proberen</a></div>';
    return;
  }
  render();
})();
