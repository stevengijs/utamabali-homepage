  document.body.insertAdjacentHTML('beforeend',`
    <div id="bib_speler" style="position:fixed;inset:0;z-index:9999;background:rgba(10,15,12,.75);display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="position:relative;max-width:400px;width:100%">
        <video src="${ctPubliek(pad)}" controls autoplay playsinline style="width:100%;border-radius:12px;background:#000;max-height:80vh"></video>
        <button id="bib_speler_dicht" style="position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;border:none;background:#fff;font-size:15px;cursor:pointer">✕</button>
      </div>
    </div>`);
  const dicht=()=>{const el=document.querySelector('#bib_speler'); if(el){el.querySelector('video').pause();el.remove();}};
  $('#bib_speler_dicht').onclick=dicht;
  $('#bib_speler').onclick=e=>{if(e.target.id==='bib_speler')dicht();};
}

async function bibTekenen(){
  const grid=$('#bib_grid'); if(!grid) return;
  await bibLaden();
  const teller=$('#bib_teller');
  if(teller) teller.textContent=BIB.rijen.length?`(${BIB.rijen.length} beelden)`:'';
  const det=$('#bib_details');
  if(det&&!det.dataset.koppel){det.dataset.koppel='1';det.addEventListener('toggle',()=>{if(det.open)bibTekenenStil();});}
  // Het taggen loopt altijd door, ook met de bibliotheek dichtgeklapt; alleen
  // het tekenen van de grid wacht tot hij open is.
  if(det&&!det.open){
    const onget0=BIB.rijen.filter(r=>!r.getagd_at&&(r.soort==='foto'||r.thumb_path));
    if(onget0.length) bibTaggen(onget0);
    return;
  }
  if(!BIB.rijen.length){ grid.innerHTML='<span class="muted" style="font-size:13px;grid-column:1/-1">Nog leeg. Upload een eerste lading; vanaf je iPhone kies je zo vijftig beelden tegelijk.</span>'; return; }
  bibTekenenStil();
  const onget=BIB.rijen.filter(r=>!r.getagd_at&&(r.soort==='foto'||r.thumb_path));
  if(onget.length) bibTaggen(onget);
}

async function bibUpload(){
  const k=document.createElement('input'); k.type='file'; k.accept='image/*,video/*'; k.multiple=true;
  k.onchange=async()=>{
    const files=Array.from(k.files||[]); if(!files.length) return;
    const st=$('#bib_status'); let n=0;
    for(const f of files){
      n++; st.textContent=`Uploaden ${n}/${files.length}…`;
      const isVideo=/^video\//.test(f.type);
      let blob=f, extOverride=null, typeOverride=null;
      if(/^image\//.test(f.type)){ try{ blob=(await pmCompress(f)).blob; }catch(e){} }
      if(isVideo&&f.size>VIDEO_VERKLEIN_GRENS){
        try{
          const kv=await videoVerkleinen(f, t=>{st.textContent=`${f.name}: ${t}`;});
          blob=kv.blob; extOverride=kv.ext; typeOverride=kv.type;
          st.textContent=`${f.name}: verkleind van ${Math.round(f.size/1048576)} naar ${Math.round(blob.size/1048576)} MB, uploaden…`;
        }catch(e){ toast(`${f.name}: verkleinen mislukte (${e.message}), origineel wordt geprobeerd`,'err'); }
      }
      const ext=extOverride||(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
      const pad=`bibliotheek/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const up=await sb.storage.from(CT_BUCKET).upload(pad,blob,{contentType:typeOverride||f.type||'application/octet-stream'});
      if(up.error){ toast(`${f.name}: ${up.error.message}`,'err'); continue; }
      let thumb=null;
      if(isVideo){
        // Een beeld uit de video vissen zodat vision er iets mee kan en de
        // grid iets kan tonen.
        try{ thumb=await bibVideoThumb(URL.createObjectURL(f)); }catch(e){}
      }
      await sb.from('content_bibliotheek').insert({path:pad, soort:isVideo?'video':'foto', thumb_path:thumb});
    }
    st.textContent='Klaar. De beelden worden nu bekeken en getagd…';
    bibTekenen();
    setTimeout(()=>{st.textContent='';},4000);
  };
  k.click();
}

async function bibVideoThumb(url){
  const v=document.createElement('video'); v.src=url; v.muted=true; v.playsInline=true;
  await new Promise((ok,nee)=>{v.onloadeddata=ok;v.onerror=nee;});
  v.currentTime=Math.min(1,(v.duration||2)/2);
  await new Promise(ok=>{v.onseeked=ok;setTimeout(ok,1500);});
  const c=document.createElement('canvas'); c.width=540; c.height=Math.round(540*v.videoHeight/Math.max(v.videoWidth,1));
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.8));
  const pad=`bibliotheek/thumb-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  const up=await sb.storage.from(CT_BUCKET).upload(pad,blob,{contentType:'image/jpeg'});
  if(up.error) return null;
  return pad;
}

let BIB_TAGT=false;
async function bibTaggen(rijen){
  if(BIB_TAGT) return; BIB_TAGT=true;
  try{
    const st=$('#bib_status');
    const teDoen=rijen.filter(r=>r.thumb_path||r.soort==='foto');
    for(let i=0;i<teDoen.length;i+=8){
      const brok=teDoen.slice(i,i+8);
      if(st) st.textContent=`Beelden bekijken: ${Math.min(i+8,teDoen.length)}/${teDoen.length}…`;
      await sb.functions.invoke('content-maker',{body:{actie:'media_tag',
        items:brok.map(r=>({id:r.id,url:bibThumb(r)}))}});
    }
    if(st) st.textContent='';
    await bibLaden();
    const grid=$('#bib_grid'); if(grid) bibTekenenStil();
  } finally { BIB_TAGT=false; }
}
function bibTekenenStil(){
  // hertekenen zonder opnieuw te gaan taggen (anders blijft hij rondzingen)
  const grid=$('#bib_grid'); if(!grid) return;
  grid.innerHTML=BIB.rijen.slice(0,120).map(r=>`
    <div class="bib-item" data-bib="${r.id}" title="${esc(r.beschrijving||'')}">
      ${bibTegelMedia(r)}
      ${r.score?`<span class="sc ${r.score>=8?'top':''}">${r.score}</span>`:''}
      ${r.soort==='video'?`<button class="vid" data-speel="${esc(r.path)}" title="Afspelen">▶</button>`:''}
      <div class="kies">＋ in je post</div>
      <div class="om">${esc((r.tags||[]).slice(0,3).join(' · ')||'')}</div>
    </div>`).join('');
  grid.querySelectorAll('[data-speel]').forEach(b=>b.onclick=e=>{e.stopPropagation();bibSpeler(b.dataset.speel);});
  grid.querySelectorAll('[data-bib]').forEach(b=>b.onclick=()=>{
    const r=BIB.rijen.find(x=>x.id===b.dataset.bib); if(r) bibGebruik(r);
  });
}

/* Een bibliotheekbeeld in de huidige post zetten. Gedeeld door de kiezer
   (bieb-knop) en de grid onderaan: overal waar je een beeld aanklikt doet hij
   hetzelfde. Soort-bewaking zit hier: een video kan alleen in een reel, een
   foto niet als b-roll. */
function bibGebruik(r){
  if(CT.soort==='reel'&&r.soort!=='video'){toast('Een reel heeft video nodig; deze foto kan in een post of carousel','err');return false;}
  if(CT.soort!=='reel'&&r.soort==='video'){toast('Video kan alleen in een reel; wissel eerst van soort','err');return false;}
  if(CT.soort!=='carousel') CT.media=[];
  CT.media.push({path:r.path,type:r.soort==='video'?'video/mp4':'image/jpeg'});
  sb.from('content_bibliotheek').update({laatst_gebruikt:new Date().toISOString()}).eq('id',r.id).then(()=>{});
  ctMediaTekenen(); ctPreviewTekenen();
  toast(CT.soort==='carousel'?`Toegevoegd (${CT.media.length} beelden)`:'Staat in je post','ok');
  $('#ct_media').scrollIntoView({behavior:'smooth',block:'center'});
  return true;
}

/* De kiezer in de maker: gesorteerd op wat bij deze post past. */
async function bibKiezer(){
  await bibLaden();
  if(!BIB.rijen.length){toast('De bibliotheek is nog leeg; upload eerst beelden onderaan de pagina','err');return;}
  const onderwerp=($('#ct_onderwerp')&&$('#ct_onderwerp').value||'').toLowerCase();
  const rubriek=(CT.lijst.find(x=>x.id===CT.postId)||{}).rubriek||'';
  const woorden=onderwerp.split(/\W+/).filter(w=>w.length>3);
  const wilVideo=CT.soort==='reel';
  const past=r=>{
    if(wilVideo&&r.soort!=='video') return -1;
    if(!wilVideo&&r.soort!=='foto') return -1;
    let sc=(r.score||4)/2;
    if(rubriek&&(r.rubrieken||[]).includes(rubriek)) sc+=3;
    const tekst=((r.tags||[]).join(' ')+' '+(r.beschrijving||'')).toLowerCase();
    sc+=woorden.filter(w=>tekst.includes(w)).length*1.5;
    if(r.laatst_gebruikt&&Date.now()-new Date(r.laatst_gebruikt).getTime()<21*864e5) sc-=4;
    return sc;
  };
  const passend=BIB.rijen.map(r=>({r,sc:past(r)})).filter(x=>x.sc>=0);
  if(!passend.length){toast(wilVideo?'Geen video\'s in de bibliotheek; upload eerst b-roll':'Geen foto\'s in de bibliotheek','err');return;}
  // Twee secties: de beste matches voor deze post bovenaan, en daaronder
  // gewoon de rest op datum, want soms weet Steven zelf al welk beeld hij
  // zoekt en dan moet hij niet door een voorselectie gehinderd worden.
  const voorgesteld=[...passend].sort((a,b)=>b.sc-a.sc).slice(0,12);
  const voorIds=new Set(voorgesteld.map(x=>x.r.id));
  const andere=passend.filter(x=>!voorIds.has(x.r.id))
    .sort((a,b)=>new Date(b.r.aangemaakt_at)-new Date(a.r.aangemaakt_at)).slice(0,200);
  const tegel=x=>`
    <div class="bib-item" data-bibpak="${x.r.id}" title="${esc(x.r.beschrijving||'')}">
      ${bibTegelMedia(x.r)}
      ${x.r.score?`<span class="sc ${x.r.score>=8?'top':''}">${x.r.score}</span>`:''}
      ${x.r.soort==='video'?`<button class="vid" data-speel="${esc(x.r.path)}" title="Afspelen">▶</button>`:''}
      <div class="kies">＋ gebruik</div>
      <div class="om">${esc((x.r.tags||[]).slice(0,3).join(' · '))}</div>
    </div>`;
  const bestaand=document.querySelector('#bib_paneel'); if(bestaand) bestaand.remove();
  document.body.insertAdjacentHTML('beforeend',`
    <div id="bib_paneel" style="position:fixed;inset:0;z-index:9998;background:rgba(15,25,20,.5);display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="background:#fff;border-radius:14px;max-width:860px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <b>Kies uit je bibliotheek</b>
          <button class="bc-zoekactie" id="bib_sluit" style="margin-left:auto">✕ sluiten</button></div>
        <div class="bc-lab" style="margin:6px 0 0">Voorgesteld voor deze post</div>
        <div class="bib-grid">${voorgesteld.map(tegel).join('')}</div>
        ${andere.length?`<div class="bc-lab" style="margin:16px 0 0">Alle andere (nieuwste eerst)</div>
        <div class="bib-grid">${andere.map(tegel).join('')}</div>`:''}
      </div>
    </div>`);
  $('#bib_sluit').onclick=()=>$('#bib_paneel').remove();
  document.querySelectorAll('#bib_paneel [data-speel]').forEach(b=>b.onclick=e=>{e.stopPropagation();bibSpeler(b.dataset.speel);});
  document.querySelectorAll('[data-bibpak]').forEach(b=>b.onclick=()=>{
    const r=BIB.rijen.find(x=>x.id===b.dataset.bibpak); if(!r) return;
    if(bibGebruik(r)&&CT.soort!=='carousel') $('#bib_paneel').remove();
  });
}

/* ============== DE AUTOMAAT ==============
   Een klik en de hele post ligt klaar: onderwerp uit de weekplanning van
   vandaag, pakket van de generator (die de accountlessen al meeneemt zodra
   Instagram gekoppeld is), beelden automatisch uit de bibliotheek gekozen met
   dezelfde scoring als de kiezer, teksten erop gebakken (carousel) of het
   overlay-script in de video (reel, met de laatst gekozen muziek eronder als
   die er is). Steven checkt en plaatst; dat is alles. */
async function ctVerrasMe(){
  const knop=$('#ct_verras'), st=$('#ct_verras_status');
  knop.disabled=true;
  const zeg=t=>{if(st)st.textContent=t;};
  try{
    // 1. een geheel nieuw idee, los van de weekplanning
    zeg('Een nieuw idee bedenken…');
    const ideeR=await sb.functions.invoke('content-maker',{body:{actie:'idee'}});
    if(ideeR.error||!ideeR.data||ideeR.data.ok===false){
      toast((ideeR.data&&ideeR.data.reden)||'Kon geen idee bedenken','err');return;
    }
    const plan={...ideeR.data.idee, rubriek:null};
    CT.soort=plan.soort||'reel'; CT.postId=null; CT.project=plan.project||'';
    CT.doel='comments'; CT.pakket=null; CT.media=[]; CT.mediaOrigineel=null;
    $('#ct_onderwerp').value=plan.onderwerp||'';
    document.querySelectorAll('[data-ctproject]').forEach(x=>x.classList.toggle('on',x.dataset.ctproject===CT.project));
    document.querySelectorAll('[data-ctdoel]').forEach(x=>x.classList.toggle('on',x.dataset.ctdoel===CT.doel));
    ctTeken();

    // 2. beelden kiezen met dezelfde scoring als de kiezer
    zeg('Beelden kiezen uit je bibliotheek…');
    await bibLaden();
    const woorden=(plan.onderwerp||'').toLowerCase().split(/\W+/).filter(w=>w.length>3);
    const wilVideo=CT.soort==='reel';
    const scoor=r=>{
      if(wilVideo&&r.soort!=='video') return -1;
      if(!wilVideo&&r.soort!=='foto') return -1;
      let sc=(r.score||4)/2;
      if(plan.rubriek&&(r.rubrieken||[]).includes(plan.rubriek)) sc+=3;
      const tekst=((r.tags||[]).join(' ')+' '+(r.beschrijving||'')).toLowerCase();
      sc+=woorden.filter(w=>tekst.includes(w)).length*1.5;
      if(r.laatst_gebruikt&&Date.now()-new Date(r.laatst_gebruikt).getTime()<21*864e5) sc-=4;
      return sc;
    };
    const kandidaten=BIB.rijen.map(r=>({r,sc:scoor(r)})).filter(x=>x.sc>=0).sort((a,b)=>b.sc-a.sc);
    if(!kandidaten.length){toast(wilVideo?'Geen video in de bibliotheek voor deze reel':'Geen passende foto in de bibliotheek','err');return;}
    const aantal=CT.soort==='carousel'?Math.min(5,kandidaten.length):1;
    const gekozen=kandidaten.slice(0,aantal).map(x=>x.r);
    CT.media=gekozen.map(r=>({path:r.path,type:r.soort==='video'?'video/mp4':'image/jpeg'}));
    gekozen.forEach(r=>sb.from('content_bibliotheek').update({laatst_gebruikt:new Date().toISOString()}).eq('id',r.id).then(()=>{}));
    ctMediaTekenen();

    // 3. het pakket
    zeg('Hook, caption en teksten schrijven…');
    await ctGenereer();
    if(!CT.pakket){return;}

    // 4. afwerken per soort
    if(CT.soort==='carousel'&&CT.pakket.slides&&CT.pakket.slides.length){
      zeg('Teksten op de beelden zetten…');
      await ctSlidesBakken();
    }else if(CT.soort==='reel'){
      zeg('Video maken met het overlay-script'+(VO.muziekUrl?' en muziek':'')+'…');
      await voRender(true);
      if(VO.stand==='video'){ await voGebruik(); }
    }

    await ctOpslaan('klaar');
    zeg('');
    toast('Klaar om te checken en te plaatsen','ok');
    const fr=document.querySelector('.ig-rij');
    if(fr) fr.scrollIntoView({behavior:'smooth',block:'center'});
  } finally { knop.disabled=false; }
}

/* ============== ONDERWERP INSPREKEN ==============
   Steven vertelt hardop waar de post over moet gaan; de spraakherkenning
   schrijft live mee in het onderwerpveld en zodra hij stopt wordt het pakket
   vanzelf gemaakt. Het gesprokene hoeft niet netjes te zijn: het is een
   prompt, geen caption, en de generator maakt er toch zijn eigen tekst van.
   Zelfde motor als de voice-over (Chrome, nl-NL). */
let CT_SPREEK=null;
function ctSpreek(){
  const knop=$('#ct_spreek'), tijd=$('#ct_spreektijd'), ta=$('#ct_onderwerp');
  if(CT_SPREEK){ try{CT_SPREEK.stop();}catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Spraakherkenning werkt alleen in Chrome','err');return;}
  const sr=new SR(); CT_SPREEK=sr;
  sr.lang='nl-NL'; sr.continuous=true; sr.interimResults=true;
  const basis=ta.value.trim()?ta.value.trim()+' ':'';
  let vast='';
  const t0=Date.now();
  knop.textContent='◼ Klaar'; tijd.style.display='';
  const klok=setInterval(()=>{const t=(Date.now()-t0)/1000;
    tijd.textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;},500);
  sr.onresult=ev=>{
    // Alles opnieuw opbouwen uit de resultaten: vaste stukken plus wat er nu
    // nog hardop gezegd wordt, live in het veld.
    vast=''; let los='';
    for(let i=0;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal) vast+=r[0].transcript+' '; else los+=r[0].transcript;
    }
    ta.value=(basis+vast+los).replace(/\s+/g,' ').trim();
  };
  sr.onerror=e=>{
    const uitleg={
      'not-allowed':'Geen toegang tot de microfoon. Klik op het slotje links van het webadres en zet Microfoon op Toestaan.',
      'audio-capture':'Geen microfoon gevonden. Controleer je invoerapparaat in macOS.',
      'network':'De spraakherkenning kon de spraakdienst niet bereiken; typ het onderwerp of probeer zo nog eens.',
      'service-not-allowed':'De browser blokkeert de spraakdienst; typ het onderwerp in.',
    };
    if(e.error!=='no-speech'&&e.error!=='aborted') toast(uitleg[e.error]||('Opname-fout: '+e.error),'err');
  };
  sr.onend=()=>{
    clearInterval(klok); CT_SPREEK=null; CT.gesproken=true;
    knop.textContent='🎙 Spreek in'; tijd.style.display='none';
    if(ta.value.trim().length>=10){
      $('#ct_spreekhint').textContent='Opgenomen. Het pakket wordt gemaakt…';
      ctGenereer().finally(()=>{$('#ct_spreekhint').textContent='Twee zinnen is genoeg. Dit is de boodschap; de hook en de caption doen het werk. Inspreken mag ook: zodra je stopt wordt het pakket vanzelf gemaakt.';});
    }
  };
  try{ sr.start(); }catch(e){ clearInterval(klok); CT_SPREEK=null; knop.textContent='🎙 Spreek in'; toast('Opname starten mislukte','err'); }
}

/* ============== SLIDES BAKKEN ==============
   Zet de slide-teksten op de geuploade afbeeldingen, zodat de carousel af is
   zonder Canva. Vast stramien van het account: de cover gecentreerd met een
   grote titel en @stevenbalivillas eronder; binnenslides een compacte
   profielregel bovenin en de kop met ondertekst op een donker verloop
   onderin. 1080x1350 (4:5), het formaat dat Instagram voor feed-carousels
   aanhoudt. De gebakken beelden vervangen de media van de post; de originelen
   blijven in de opslag staan. */
function ctWikkel(ctx,tekst,maxB){
  const woorden=String(tekst||'').split(/\s+/).filter(Boolean); const regels=[]; let r='';
  for(const w of woorden){ const kand=r?r+' '+w:w;
    if(ctx.measureText(kand).width>maxB&&r){regels.push(r);r=w;} else r=kand; }
  if(r)regels.push(r); return regels;
}
async function ctSlidesBakken(){
  const pk=CT.pakket; if(!pk||!pk.slides||!pk.slides.length){toast('Geen slide-teksten','err');return;}
  if(!CT.media.length){toast('Upload eerst je afbeeldingen','err');return;}
  const st=$('#ct_slides_status'); const knop=$('#ct_slides_bakken'); knop.disabled=true;
  try{
    // De schone beelden onthouden: bij een nieuw pakket (nieuwe teksten) komen
    // die terug, anders bak je tekst over oude tekst heen.
    if(!CT.mediaOrigineel||!CT.mediaOrigineel.length) CT.mediaOrigineel=[...CT.media];
    if(CT.pakket) CT.pakket.media_origineel=CT.mediaOrigineel;
    const nieuw=[];
    for(let i=0;i<CT.media.length;i++){
      st.innerHTML=`<span class="muted" style="font-size:13px">Slide ${i+1} van ${CT.media.length}…</span>`;
      const sl=pk.slides[i]||pk.slides[pk.slides.length-1]||{kop:''};
      const img=new Image(); img.crossOrigin='anonymous'; img.src=ctPubliek(CT.media[i].path);
      await new Promise((ok,nee)=>{img.onload=ok;img.onerror=()=>nee(new Error('afbeelding '+(i+1)+' laden mislukt'));});
      const c=document.createElement('canvas'); c.width=1080; c.height=1350;
      const x=c.getContext('2d');
      const sch=Math.max(1080/img.naturalWidth,1350/img.naturalHeight);
      x.drawImage(img,(1080-img.naturalWidth*sch)/2,(1350-img.naturalHeight*sch)/2,
                  img.naturalWidth*sch,img.naturalHeight*sch);
      x.textAlign='center';
      if(i===0){
        // Cover: rustig donker waas, grote titel in het midden, handle eronder
        x.fillStyle='rgba(0,0,0,.38)'; x.fillRect(0,0,1080,1350);
        x.fillStyle='#fff'; x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=16;
        x.font='800 84px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        const regels=ctWikkel(x,sl.kop,880);
        const y0=675-(regels.length-1)*52;
        regels.forEach((r,ri)=>x.fillText(r,540,y0+ri*104));
        x.shadowBlur=0;
      }else{
        // Binnenslide: profielregel boven, kop en ondertekst op verloop onder
        x.textAlign='left';
        x.fillStyle='rgba(0,0,0,.45)';
        x.beginPath(); x.roundRect(48,48,470,72,999); x.fill();
        x.fillStyle='#fff'; x.beginPath(); x.arc(90,84,26,0,7); x.fill();
        x.fillStyle='#1d5c43'; x.font='800 26px -apple-system,sans-serif'; x.textAlign='center';
        x.fillText('S',90,93);
        x.fillStyle='#fff'; x.textAlign='left'; x.font='600 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        x.fillText('@stevenbalivillas',132,95);
        const grad=x.createLinearGradient(0,880,0,1350);
        grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,.78)');
        x.fillStyle=grad; x.fillRect(0,880,1080,470);
        x.fillStyle='#fff'; x.shadowColor='rgba(0,0,0,.45)'; x.shadowBlur=10;
        x.font='800 60px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        const kopR=ctWikkel(x,sl.kop,940);
        x.font='400 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        const subR=ctWikkel(x,sl.sub||'',940);
        const totH=kopR.length*74+(subR.length?14+subR.length*54:0);
        let y=1350-80-totH+62;
        x.font='800 60px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        kopR.forEach(r=>{x.fillText(r,70,y);y+=74;});
        if(subR.length){ y+=6; x.font='400 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
          x.fillStyle='rgba(255,255,255,.94)'; subR.forEach(r=>{x.fillText(r,70,y);y+=54;}); }
        x.shadowBlur=0;
      }
      const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.9));
      const pad=`carousel/af-${Date.now()}-${i+1}.jpg`;
      const up=await sb.storage.from(CT_BUCKET).upload(pad,blob,{contentType:'image/jpeg'});
      if(up.error) throw new Error('upload slide '+(i+1)+': '+up.error.message);
      nieuw.push({path:pad,type:'image/jpeg'});
    }
    CT.media=nieuw;
    await ctOpslaan(null);
    ctMediaTekenen(); ctPreviewTekenen();
    st.innerHTML='<span style="font-size:13px;color:var(--ok)">Klaar. De teksten staan op de beelden; zo gaan ze ook naar Instagram.</span>';
    toast('Slides zijn af','ok');
  }catch(e){
    st.innerHTML=`<span class="err" style="font-size:13px">${esc(String(e&&e.message||e))}</span>`;
  } finally { knop.disabled=false; }
}

/* ============== ACTUELE MARKTCIJFERS (met bron) ==============
   Claude zoekt live naar cijfers die bij het onderwerp passen (toerisme Bali,
   huurprijzen, regelgeving, NL-rente ter vergelijking) en levert elk cijfer
   met bron-URL en datum. De cijfers gaan bewust NIET vanzelf de tekst in:
   Steven checkt de bron en klikt zelf in wat hij wil gebruiken. Zo blijft de
   regel overeind dat er nooit een onverifieerbaar getal onder zijn naam
   staat. Cache aan de serverkant: per onderwerp een dag. */
async function feitenOphalen(onderwerp, vak, invoeg){
  vak.innerHTML='<span class="muted" style="font-size:13px">🔎 Zoeken naar actuele cijfers, dit duurt zo’n halve minuut…</span>';
  let data;
  try{
    const r=await sb.functions.invoke('content-maker',{body:{actie:'feiten',onderwerp}});
    if(r.error||!r.data||r.data.ok===false){
      let reden=(r.data&&r.data.reden)||'';
      if(!reden&&r.error&&r.error.context){ try{ reden=(await r.error.context.json()).reden||''; }catch(e){} }
      vak.innerHTML=`<span class="err" style="font-size:13px">${esc(reden||(r.error&&r.error.message)||'zoeken mislukte')} · <a href="#" onclick="return false" id="ct_feiten_retry" style="cursor:pointer">probeer opnieuw</a></span>`;
      const rt=vak.querySelector('#ct_feiten_retry'); if(rt) rt.onclick=()=>{feitenOphalen(onderwerp,vak,invoeg);return false;};
      return;
    }
    data=r.data;
    if(data.bezig){
      // Het zoeken loopt in de achtergrond door; hier pollen tot het
      // resultaat in markt_feiten staat (of na 3 minuten opgeven).
      const sleutel=data.sleutel;
      for(let i=0;i<36;i++){
        await new Promise(rs=>setTimeout(rs,5000));
        vak.innerHTML=`<span class="muted" style="font-size:13px">🔎 Zoeken loopt… (${(i+1)*5}s)</span>`;
        const {data:rij}=await sb.from('markt_feiten').select('feiten,opgehaald_at').eq('id',sleutel).maybeSingle();
        if(rij){ data={ok:true,feiten:rij.feiten,uit_cache:false}; break; }
      }
      if(data.bezig){
        vak.innerHTML=`<span class="err" style="font-size:13px">Het zoeken duurt te lang; <a href="#" onclick="return false" id="ct_feiten_retry2" style="cursor:pointer">probeer later opnieuw</a></span>`;
        const rt2=vak.querySelector('#ct_feiten_retry2'); if(rt2) rt2.onclick=()=>{feitenOphalen(onderwerp,vak,invoeg);return false;};
        return;
      }
    }
  }catch(e){ vak.innerHTML=`<span class="err" style="font-size:13px">${esc(String(e&&e.message||e))}</span>`; return; }
  const feiten=data.feiten||[];
  if(!feiten.length){ vak.innerHTML='<span class="muted" style="font-size:13px">Geen controleerbare cijfers gevonden voor dit onderwerp. Beter geen getal dan een vaag getal.</span>'; return; }
  vak.innerHTML=`
    <div class="bc-hint" style="margin:0 0 8px">Check de bron voordat je een cijfer gebruikt; jouw naam staat eronder.${data.uit_cache?' (uit de cache van vandaag)':''}</div>
    ${feiten.map((f,i)=>`
      <div class="ct-regel" style="align-items:flex-start">
        <span style="flex:1">${esc(f.feit)}<br>
          <a href="${esc(f.bron_url)}" target="_blank" rel="noopener" style="font-size:12px">${esc(f.bron_titel||f.bron_url)}</a>
          ${f.datum?`<span class="muted" style="font-size:12px"> · ${esc(f.datum)}</span>`:''}</span>
        <button class="bc-zoekactie" data-feit="${i}" style="flex:none">↩ gebruik</button>
      </div>`).join('')}`;
  vak.querySelectorAll('[data-feit]').forEach(b=>b.onclick=()=>{
    invoeg(feiten[Number(b.dataset.feit)]);
    const t=b.textContent; b.textContent='✓'; setTimeout(()=>b.textContent=t,1200);
  });
}

/* De weekstrip: zeven dagen, elke dag zijn rubriek en onderwerp uit de
   planner. Vandaag is uitgelicht met een maakknop die alles voorinvult; de
   enige beslissingen die overblijven zijn media uploaden en op maken klikken.
   Dat is waar de 10 minuten per dag vandaan komen. */
const WK_DAGEN=['zo','ma','di','wo','do','vr','za'];
async function wkTekenen(){
  const vak=$('#wk_strip'); if(!vak) return;
  const {data,error}=await sb.rpc('content_posts_lijst');
  if(error||!Array.isArray(data)){vak.innerHTML='<span class="muted" style="font-size:12px">Kon de planning niet laden.</span>';return;}
  const vandaag=new Date(); vandaag.setHours(0,0,0,0);
  const dagen=[]; for(let i=0;i<7;i++){const d=new Date(vandaag.getTime()+i*864e5);dagen.push(d);}
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const perDag=new Map();
  data.forEach(p0=>{ if(p0.gepland_voor) perDag.set(p0.gepland_voor, p0); });
  if(!perDag.size){
    vak.innerHTML='<span class="muted" style="font-size:12px;grid-column:1/-1">Nog geen weekplanning. Klik op <b>Plan de week</b>; daarna staat hier elke dag klaar wat je maakt (vanaf maandag plant hij zichzelf).</span>';
    return;
  }
  vak.innerHTML=dagen.map((d,i)=>{
    const p0=perDag.get(iso(d));
    const isVandaag=i===0;
    return `<div class="wk-dag ${isVandaag?'vandaag':''}">
      <div class="kop"><span>${WK_DAGEN[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</span><span>${p0?esc(p0.soort):''}</span></div>
      ${p0?`
        <div class="rubriek">${esc(p0.rubriek||'')}</div>
        <div class="onderwerp">${esc(p0.onderwerp||'')}</div>
        ${p0.status==='gepost'?'<span class="st gepost">✓ gepost</span>':
          p0.status!=='gepland'?`<span class="st">${esc(p0.status)}</span>`:''}
        ${p0.status!=='gepost'?`<div style="display:flex;gap:8px;align-items:center;margin-top:auto">
            ${isVandaag?`<button class="btn btn-primary btn-sm" data-wkmaak="${p0.id}" style="flex:1">➜ Maak deze</button>`
                       :`<button class="bc-zoekactie" data-wkmaak="${p0.id}" style="padding:0">openen</button>`}
            <button class="bc-zoekactie" data-wkregen="${p0.id}" title="Nieuw onderwerp voor deze dag (zelfde rubriek)" style="padding:0">↻</button>
          </div>`:''}
      `:`<div class="onderwerp">Niets gepland</div>`}
    </div>`;
  }).join('');
  vak.querySelectorAll('[data-wkregen]').forEach(b=>b.onclick=async()=>{
    const p0=data.find(x=>x.id===b.dataset.wkregen); if(!p0) return;
    b.textContent='…'; b.disabled=true;
    try{
      const r=await sb.functions.invoke('content-maker',{body:{actie:'idee',rubriek:p0.rubriek||'',soort:p0.soort}});
      if(r.error||!r.data||r.data.ok===false){toast((r.data&&r.data.reden)||'Regenereren mislukte','err');return;}
      const idee=r.data.idee;
      await sb.rpc('content_post_opslaan',{p_id:p0.id, p_soort:p0.soort, p_onderwerp:idee.onderwerp,
        p_project:idee.project||null, p_doel:p0.doel||'comments', p_media:null,
        p_pakket:{...(p0.pakket||{}), hookrichting:idee.hookrichting||'', aanlevering:idee.aanlevering||''},
        p_status:null});
      toast('Nieuw onderwerp voor deze dag','ok');
      wkTekenen();
    } finally { b.disabled=false; b.textContent='↻'; }
  });
  vak.querySelectorAll('[data-wkmaak]').forEach(b=>b.onclick=()=>{
    const p0=data.find(x=>x.id===b.dataset.wkmaak); if(!p0) return;
    CT.soort=p0.soort; CT.postId=p0.id; CT.project=p0.project||''; CT.doel=p0.doel||'comments';
    CT.media=Array.isArray(p0.media)?p0.media:[]; CT.pakket=(p0.pakket&&p0.pakket.caption)?p0.pakket:null;
    $('#ct_onderwerp').value=p0.onderwerp||'';
    document.querySelectorAll('[data-ctproject]').forEach(x=>x.classList.toggle('on',x.dataset.ctproject===CT.project));
    document.querySelectorAll('[data-ctdoel]').forEach(x=>x.classList.toggle('on',x.dataset.ctdoel===CT.doel));
    ctTeken();
    const hint=p0.pakket&&p0.pakket.aanlevering;
    if(hint) toast('Uploaden: '+hint,'ok');
    if(CT.pakket) ctPakketTekenen(); else $('#ct_pakket').style.display='none';
    $('#ct_media').scrollIntoView({behavior:'smooth',block:'center'});
  });
}

/* ================= VOICE-OVER =================
   Steven spreekt de caption in; de gesproken tekst komt als meelopende
   ondertiteling in beeld en het geheel wordt met de b-roll tot een video
   gebakken. Alles gebeurt in de browser: MediaRecorder voor de opname,
   SpeechRecognition om per woord het tijdstip te vangen (hij leest een TEKST
   DIE WE AL KENNEN, dus we hoeven alleen te horen wanneer welk woord valt,
   niet wat er gezegd wordt), en een canvas-render die b-roll, stem en
   karaoketekst samenvoegt. Herkent de browser de spraak niet (of matcht het
   slecht), dan verdelen we de woorden naar rato van hun lengte over de duur
   van de opname; bij normaal voorleestempo zit dat er dicht op. */
let VO={stand:'leeg', blob:null, url:null, woorden:[], duur:0, rec:null, spraak:null,
        t0:0, wijzer:0, video:null, videoPad:null, mime:'',
        muziek:null, muziekUrl:null, muziekVol:0.25};

function voWoorden(){
  const cap=(($('#ct_caption')&&$('#ct_caption').value)||'').trim();
  return cap.split(/\s+/).filter(Boolean);
}
const voKaal=w=>w.toLowerCase().replace(/[^a-z0-9à-ÿ]/g,'');

function voTekenen(){
  const vak=$('#ct_voice'); if(!vak) return;

  /* De muziekrij staat los van de opname-toestand: muziek kan onder een
     voice-over (gedempt, jouw stem blijft verstaanbaar) of als enige audio
     onder de b-roll. Instagram voegt zelf geen audio toe aan wat de API
     plaatst, dus wat je hier mixt is wat de kijker hoort. */
  const muziekRij=`
    <div class="vo-knoppen" style="margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)">
      ${VO.muziek
        ? `<span style="font-size:13px">🎵 <b>${esc(VO.muziek.name)}</b></span>
           <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)">volume
             <input type="range" id="vo_mvol" min="0" max="100" value="${Math.round(VO.muziekVol*100)}" style="width:130px">
             <span id="vo_mvolpct" style="min-width:34px">${Math.round(VO.muziekVol*100)}%</span></label>
           <button class="bc-zoekactie" id="vo_mtest">▶ test</button>
           <button class="bc-zoekactie" id="vo_mweg">✕ weg</button>`
        : `<button class="btn btn-ghost btn-sm" id="vo_muziek">🎵 Muziek toevoegen</button>
           <span class="muted" style="font-size:12.5px">mp3 of m4a; onder een voice-over zet hem rond de 20-30%</span>`}
    </div>`;
  const muziekKoppelen=()=>{
    const kies=$('#vo_muziek');
    if(kies) kies.onclick=()=>{
      const k=document.createElement('input'); k.type='file'; k.accept='audio/*';
      k.onchange=()=>{ const f=k.files&&k.files[0]; if(!f) return;
        if(VO.muziekUrl) URL.revokeObjectURL(VO.muziekUrl);
        VO.muziek=f; VO.muziekUrl=URL.createObjectURL(f); voTekenen(); };
      k.click();
    };
    const vol=$('#vo_mvol');
    if(vol) vol.oninput=()=>{ VO.muziekVol=Number(vol.value)/100; $('#vo_mvolpct').textContent=vol.value+'%';
      if(VO._mtest) VO._mtest.volume=VO.muziekVol; };
    const test=$('#vo_mtest');
    if(test) test.onclick=()=>{
      if(VO._mtest){ VO._mtest.pause(); VO._mtest=null; test.textContent='▶ test'; return; }
      VO._mtest=new Audio(VO.muziekUrl); VO._mtest.volume=VO.muziekVol; VO._mtest.play();
      test.textContent='◼ stop';
      VO._mtest.onended=()=>{VO._mtest=null; if($('#vo_mtest'))$('#vo_mtest').textContent='▶ test';};
    };
    const weg=$('#vo_mweg');
    if(weg) weg.onclick=()=>{ if(VO._mtest){VO._mtest.pause();VO._mtest=null;}
      if(VO.muziekUrl) URL.revokeObjectURL(VO.muziekUrl); VO.muziek=null; VO.muziekUrl=null; voTekenen(); };
  };

  if(VO.stand==='leeg'){
    vak.innerHTML=muziekRij+`
      <div class="bc-hint" style="margin:0 0 8px">Spreek de caption in als voice-over. Terwijl je leest loopt de tekst mee; daarna bakken we stem, tekst${VO.muziek?', muziek':''} en je b-roll tot een reel. Werkt het best in Chrome, met toestemming voor de microfoon.</div>
      <div class="vo-knoppen">
        <button class="btn btn-primary btn-sm" id="vo_start">🎙 Neem voice-over op</button>
        ${VO.muziek?`<button class="btn btn-ghost btn-sm" id="vo_alleenmuziek">🎬 Video met alleen muziek</button>`:''}
      </div>`;
    muziekKoppelen();
    $('#vo_start').onclick=voStart;
    const am=$('#vo_alleenmuziek');
    if(am) am.onclick=()=>{ if(!CT.media.length){toast('Upload eerst je b-roll','err');return;} voRender(true); };
  }else if(VO.stand==='opnemen'){
    vak.innerHTML=`
      <div class="vo-tele" id="vo_tele">${voWoorden().map((w,i)=>`<span data-w="${i}">${esc(w)} </span>`).join('')}</div>
      <div class="vo-knoppen">
        <span class="vo-tijd" id="vo_tijd">0:00</span>
        <button class="btn btn-primary btn-sm" id="vo_stop">■ Klaar</button>
        <button class="btn btn-ghost btn-sm" id="vo_weg">Annuleer</button>
      </div>`;
    $('#vo_stop').onclick=()=>voStop(false);
    $('#vo_weg').onclick=()=>voStop(true);
  }else if(VO.stand==='klaar'){
    const dekking=VO.woorden.filter(w=>w.gehoord).length/Math.max(VO.woorden.length,1);
    vak.innerHTML=muziekRij+`
      <div class="bc-hint" style="margin:0 0 8px">Opname van ${VO.duur.toFixed(1)}s.
        ${dekking>=0.6?`De tekst is per woord meegeluisterd, de ondertiteling loopt strak mee.`
                      :`De spraakherkenning ving te weinig op; de tekst wordt gelijkmatig over de opname verdeeld, dat oogt bij rustig voorlezen prima.`}</div>
      <audio controls src="${VO.url}" style="width:100%;max-width:420px"></audio>
      <div class="vo-knoppen">
        <button class="btn btn-primary btn-sm" id="vo_render">🎬 Maak de video</button>
        <button class="btn btn-ghost btn-sm" id="vo_opnieuw">↻ Opnieuw opnemen</button>
      </div>`;
    muziekKoppelen();
    $('#vo_render').onclick=()=>voRender(false);
    $('#vo_opnieuw').onclick=()=>{VO={...VO,stand:'leeg',blob:null,woorden:[]};voTekenen();};
  }else if(VO.stand==='renderen'){
    vak.innerHTML=`<div class="bc-hint" style="margin:0">🎬 Video maken: b-roll, je stem en de meelopende tekst worden samengevoegd. Dit duurt ongeveer zo lang als de opname zelf (<span id="vo_rprog">0</span>%). Laat dit tabblad open en zichtbaar.</div>`;
  }else if(VO.stand==='video'){
    vak.innerHTML=`
      <video class="vo-klaarvideo" controls src="${VO.video}"></video>
      <div class="vo-knoppen">
        <button class="btn btn-primary btn-sm" id="vo_gebruik">✓ Gebruik als reel-video</button>
        <a class="btn btn-ghost btn-sm" href="${VO.video}" download="reel-voiceover">⬇ Download</a>
        <button class="btn btn-ghost btn-sm" id="vo_opnieuw2">↻ Opnieuw</button>
      </div>
      <div class="bc-hint">${VO.mime.includes('mp4')?'MP4, klaar om direct via de plaatsknop te publiceren.':'Deze browser kan alleen webm opnemen en Instagram wil mp4: download hem en plaats via de app, of haal hem even door CapCut.'}</div>`;
    $('#vo_gebruik').onclick=voGebruik;
    $('#vo_opnieuw2').onclick=()=>{VO={...VO,stand:'klaar'};voTekenen();};
  }
}

async function voStart(){
  const woorden=voWoorden();
  if(!woorden.length){toast('Er is nog geen caption om in te spreken','err');return;}
  if(!CT.media.length){toast('Upload eerst je b-roll, die is de achtergrond van de video','err');return;}
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){
    toast(e.name==='NotAllowedError'
      ? 'De microfoon is geblokkeerd voor deze site. Klik op het slotje links van het webadres en zet Microfoon op Toestaan, ververs daarna de pagina.'
      : 'Geen toegang tot de microfoon: '+e.message,'err');
    return;
  }

  VO.woorden=woorden.map(w=>({w, t:null, gehoord:false}));
  VO.wijzer=0; VO.t0=performance.now();
  const brokken=[];
  try{ VO.rec=new MediaRecorder(stream); }
  catch(e){ stream.getTracks().forEach(t=>t.stop());
    toast('Opnemen lukt niet in deze browser: '+e.message,'err'); return; }
  VO.rec.ondataavailable=e=>{if(e.data.size)brokken.push(e.data);};
  VO.rec.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    if(VO.stand!=='opnemen') return; // geannuleerd
    VO.blob=new Blob(brokken,{type:VO.rec.mimeType||'audio/webm'});
    VO.url=URL.createObjectURL(VO.blob);
    VO.duur=(performance.now()-VO.t0)/1000;
    // Gaten opvullen: niet-gehoorde woorden naar rato van woordlengte tussen
    // de wel-gehoorde ankers (of over de hele duur als er niets gehoord is).
    voTijdenAanvullen();
    VO.stand='klaar'; voTekenen();
  };
  VO.rec.start(250);

  // Meeluisteren welk woord wanneer valt. De herkende woorden worden fuzzy
  // tegen de caption gelegd met een wijzer die alleen vooruit mag; een misser
  // van de herkenning schuift dan hooguit een paar woorden op.
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    VO.spraak=new SR();
    VO.spraak.lang='nl-NL'; VO.spraak.continuous=true; VO.spraak.interimResults=true;
    VO.spraak.onresult=ev=>{
      const nu=(performance.now()-VO.t0)/1000;
      const laatste=ev.results[ev.results.length-1];
      const gezegd=String(laatste[0].transcript||'').trim().split(/\s+/).map(voKaal).filter(Boolean);
      for(const g of gezegd.slice(-4)){
        for(let i=VO.wijzer;i<Math.min(VO.wijzer+5,VO.woorden.length);i++){
          const doelw=voKaal(VO.woorden[i].w);
          if(doelw&&(doelw===g||doelw.startsWith(g)||g.startsWith(doelw))){
            for(let j=VO.wijzer;j<=i;j++) if(VO.woorden[j].t===null) VO.woorden[j].t=nu;
            VO.woorden[i].t=nu; VO.woorden[i].gehoord=true; VO.wijzer=i+1;
            break;
          }
        }
      }
      const tele=$('#vo_tele');
      if(tele) tele.querySelectorAll('span').forEach((sp,i)=>{
        sp.classList.toggle('gehad',i<VO.wijzer-1);
        sp.classList.toggle('nu',i===Math.max(VO.wijzer-1,0));
      });
      const nuEl=tele&&tele.querySelector('span.nu');
      if(nuEl) nuEl.scrollIntoView({block:'center',behavior:'smooth'});
    };
    VO.spraak.onerror=()=>{}; // stil: de naar-rato-verdeling vangt het op
    try{ VO.spraak.start(); }catch(e){}
  }

  VO.stand='opnemen'; voTekenen();
  const klok=()=>{ if(VO.stand!=='opnemen') return;
    const t=(performance.now()-VO.t0)/1000;
    const el=$('#vo_tijd'); if(el) el.textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
    requestAnimationFrame(klok); };
  klok();
}

function voStop(annuleer){
  if(annuleer) VO.stand='leeg';
  try{ VO.spraak&&VO.spraak.stop(); }catch(e){}
  try{ VO.rec&&VO.rec.state!=='inactive'&&VO.rec.stop(); }catch(e){}
  if(annuleer) voTekenen();
}

function voTijdenAanvullen(){
  const ws=VO.woorden; if(!ws.length) return;
  const gewicht=w=>Math.max(voKaal(w).length,2);
  let vorigeT=0, vorigeI=-1;
  const stukken=[];
  ws.forEach((w,i)=>{ if(w.t!==null&&w.gehoord){ stukken.push({van:vorigeI,tot:i,t0:vorigeT,t1:w.t}); vorigeI=i; vorigeT=w.t; } });
  stukken.push({van:vorigeI,tot:ws.length,t0:vorigeT,t1:VO.duur});
  for(const st of stukken){
    const tussen=[]; for(let i=st.van+1;i<st.tot;i++) tussen.push(i);
    if(!tussen.length) continue;
    const tot=tussen.reduce((a,i)=>a+gewicht(ws[i].w),0)+0.0001;
    let lopend=st.t0;
    for(const i of tussen){ lopend+=(st.t1-st.t0)*gewicht(ws[i].w)/tot; ws[i].t=Math.min(lopend,VO.duur); }
  }
}

/* De render: 1080x1920-canvas, b-roll gedempt op de achtergrond (in een lus
   als hij korter is dan de stem), de karaoketekst in brokken van ~4 woorden,
   en de opgenomen stem als audiospoor. MediaRecorder maakt er mp4 van waar de
   browser dat kan; anders webm, en dan zegt de UI eerlijk dat Instagram mp4
   wil. */
async function voRender(alleenMuziek){
  const m0=CT.media[0];
  const isVideo=/\.(mp4|mov|webm|m4v)$/i.test(m0.path)||String(m0.type||'').startsWith('video');
  const metStem=!alleenMuziek&&!!VO.url;
  const heeftOverlays=CT.pakket&&Array.isArray(CT.pakket.overlays)&&CT.pakket.overlays.length>0;
  if(!metStem&&!VO.muziekUrl&&!heeftOverlays){toast('Geen audio: neem een voice-over op of voeg muziek toe','err');return;}
  if(VO._mtest){VO._mtest.pause();VO._mtest=null;}
  VO.stand='renderen'; voTekenen();
  try{
    const bron=document.createElement(isVideo?'video':'img');
    bron.crossOrigin='anonymous'; bron.src=ctPubliek(m0.path);
    if(isVideo){ bron.muted=true; bron.loop=true; bron.playsInline=true; }
    await new Promise((ok,nee)=>{ bron.onerror=()=>nee(new Error('b-roll laden mislukt'));
      if(isVideo){bron.onloadeddata=ok;} else {bron.onload=ok;} });

    // Het leidende spoor bepaalt de lengte: de stem als die er is, anders de
    // b-roll-video, anders (foto plus muziek) een vast kort formaat.
    let stem=null, duur;
    if(metStem){
      stem=new Audio(VO.url);
      await new Promise(ok=>{stem.onloadedmetadata=ok; stem.load();});
      duur=isFinite(stem.duration)&&stem.duration>0?stem.duration:VO.duur;
    }else{
      duur=isVideo?Math.min(bron.duration||15,60):15;
      if(!isVideo&&heeftOverlays){
        const eind=Math.max(...CT.pakket.overlays.map(o=>{
          const m=String(o.tijd||'').match(/-\s*([\d.]+)/); return m?parseFloat(m[1]):0; }));
        if(eind>3) duur=Math.min(eind+0.6,60);
      }
    }

    const canvas=document.createElement('canvas'); canvas.width=1080; canvas.height=1920;
    const ctx=canvas.getContext('2d');

    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const bestem=ac.createMediaStreamDestination();
    if(stem) ac.createMediaElementSource(stem).connect(bestem);

    // De muziek loopt in een lus onder het geheel, door een volumeknop. Onder
    // een voice-over hoort die laag te staan; de slider is wat de kijker hoort.
    let muziek=null;
    if(VO.muziekUrl){
      muziek=new Audio(VO.muziekUrl); muziek.loop=true;
      const gain=ac.createGain(); gain.gain.value=VO.muziekVol;
      ac.createMediaElementSource(muziek).connect(gain); gain.connect(bestem);
    }

    const beeldStroom=canvas.captureStream(30);
    const mix=new MediaStream([...beeldStroom.getVideoTracks(),...bestem.stream.getAudioTracks()]);
    VO.mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm']
      .find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'video/webm';
    const uit=[]; const opn=new MediaRecorder(mix,{mimeType:VO.mime,videoBitsPerSecond:6_000_000});
    opn.ondataavailable=e=>{if(e.data.size)uit.push(e.data);};
    const klaarBelofte=new Promise(ok=>{opn.onstop=ok;});

    const brokken=[]; let brok=[];
    if(metStem){
      VO.woorden.forEach(w=>{ brok.push(w);
        if(brok.length>=4||/[.!?]$/.test(w.w)){brokken.push(brok);brok=[];} });
      if(brok.length)brokken.push(brok);
    }
    // Zonder stem maar met een overlay-script uit het pakket: elke regel op
    // zijn eigen tijdvak ("0-2s") in beeld, in de gekozen opmaak. Zo kan de
    // automaat een reel volledig af opleveren zonder opname.
    let ovl=null;
    if(!metStem&&heeftOverlays){
      ovl=CT.pakket.overlays.map(o=>{
        const m=String(o.tijd||'').match(/([\d.]+)\s*-\s*([\d.]+)/);
        return {van:m?parseFloat(m[1]):0, tot:m?parseFloat(m[2]):duur, tekst:String(o.tekst||'')};
      }).filter(o=>o.tekst);
    }
    const brokVoor=t=>{ for(let i=brokken.length-1;i>=0;i--){ const b=brokken[i];
        if(t>=(b[0].t||0)) return {b,i}; } return null; };

    // De klok is leidend, niet stem.currentTime: dan werkt dezelfde tekenlus
    // ook zonder stem (alleen muziek).
    const start=performance.now();
    const teken=()=>{
      const t=(performance.now()-start)/1000;
      const bw=isVideo?bron.videoWidth:bron.naturalWidth, bh=isVideo?bron.videoHeight:bron.naturalHeight;
      const sch=Math.max(1080/bw,1920/bh);
      ctx.fillStyle='#000'; ctx.fillRect(0,0,1080,1920);
      ctx.drawImage(bron,(1080-bw*sch)/2,(1920-bh*sch)/2,bw*sch,bh*sch);
      if(ovl){
        const actief=ovl.find(o=>t>=o.van&&t<=o.tot);
        if(actief){
          const om=CT_OPMAAK||{achtergrond:'geen',accent:false,font:'klassiek'};
          const f=CT_FONTS.find(z=>z.key===om.font)||CT_FONTS[0];
          ctx.font=`${f.dik} 58px ${f.css}`;
          const toonO=w=>f.caps?w.toUpperCase():w;
          // regelterugloop binnen 940px
          const woordenO=actief.tekst.split(/\s+/); const regelsO=[]; let rO='';
          for(const w of woordenO){const kand=rO?rO+' '+toonO(w):toonO(w);
            if(ctx.measureText(kand).width>940&&rO){regelsO.push(rO);rO=toonO(w);} else rO=kand;}
          if(rO)regelsO.push(rO);
          let yO=960-(regelsO.length-1)*40;
          for(const regel of regelsO){
            const breedO=ctx.measureText(regel).width; const xO=540-breedO/2;
            if(om.achtergrond!=='geen'){
              const wit=om.achtergrond==='wit';
              ctx.shadowColor='transparent'; ctx.shadowBlur=0;
              ctx.fillStyle=wit?'#ffffff':'#111111';
              ctx.beginPath(); ctx.roundRect(xO-20,yO-58,breedO+40,82,13); ctx.fill();
              ctx.fillStyle=wit?'#111111':'#ffffff';
            }else{
              ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=16; ctx.lineWidth=f.rand?11:7;
              ctx.fillStyle='#ffffff'; ctx.strokeStyle=f.rand?'#000000':'rgba(0,0,0,.45)';
              ctx.strokeText(regel,xO,yO);
            }
            ctx.fillText(regel,xO,yO); yO+=80;
          }
          ctx.shadowBlur=0;
        }
      }
      const hit=brokVoor(t);
      if(hit){
        const woorden=hit.b, van=woorden[0].t||0;
        const tot=(woorden[woorden.length-1].t??duur)+0.35;
        if(t<=tot){
          // in de opmaak die in de preview gekozen is: font, achtergrond,
          // accent; de tekstkleur keert om met de achtergrond
          const om=CT_OPMAAK||{achtergrond:'geen',accent:false,font:'klassiek'};
          const f=CT_FONTS.find(z=>z.key===om.font)||CT_FONTS[0];
          ctx.font=`${f.dik} 64px ${f.css}`;
          try{ ctx.letterSpacing=f.spatie?'6px':'0px'; }catch(e){}
          const toon=w=>f.caps?w.toUpperCase():w;
          const y=1490;
          const breed=woorden.reduce((a,w)=>a+ctx.measureText(toon(w.w)+' ').width,0);
          let x=540-breed/2;
          if(om.achtergrond!=='geen'){
            const wit=om.achtergrond==='wit';
            ctx.shadowColor='transparent'; ctx.shadowBlur=0;
            const pad=22, hgt=92;
            ctx.fillStyle=wit?'#ffffff':'#111111';
            ctx.beginPath(); ctx.roundRect(x-pad,y-66,breed+pad*2,hgt,14); ctx.fill();
            for(const w of woorden){
              const gezegd=t>=(w.t||0);
              ctx.fillStyle = om.accent&&/\d|%|euro|bali|passief|rendement|cash|verkocht|laatste/i.test(w.w)
                ? '#c9a400'
                : (wit ? (gezegd?'#111111':'#8a8a8a') : (gezegd?'#ffffff':'#9a9a9a'));
              ctx.fillText(toon(w.w),x,y); x+=ctx.measureText(toon(w.w)+' ').width;
            }
          }else{
            const accent=w=>/\d|%|euro|bali|passief|rendement|cash|verkocht|laatste/i.test(w);
            if(f.gloed){ ctx.shadowColor='rgba(255,255,255,.85)'; ctx.shadowBlur=26; }
            else { ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=18; }
            ctx.lineWidth=f.rand?12:8;
            for(const w of woorden){
              const gezegd=t>=(w.t||0);
              ctx.fillStyle = om.accent&&accent(w.w) ? '#FFE234' : '#ffffff';
              ctx.globalAlpha = gezegd?1:0.55;
              if(!f.gloed){ ctx.strokeStyle=f.rand?'#000000':'rgba(0,0,0,.45)'; ctx.strokeText(toon(w.w),x,y); }
              ctx.fillText(toon(w.w),x,y);
              x+=ctx.measureText(toon(w.w)+' ').width;
            }
            ctx.globalAlpha=1;
          }
          try{ ctx.letterSpacing='0px'; }catch(e){}
        }
      }
      const prog=$('#vo_rprog'); if(prog) prog.textContent=Math.min(Math.round(t/duur*100),99);
      if(t<duur+0.1) requestAnimationFrame(teken);
    };

    if(isVideo){ bron.currentTime=0; await bron.play(); }
    await ac.resume(); opn.start(500);
    if(stem) await stem.play();
    if(muziek) await muziek.play();
    requestAnimationFrame(teken);
    await new Promise(ok=>setTimeout(ok,(duur+0.4)*1000));
    if(isVideo) bron.pause();
    if(stem) stem.pause();
    if(muziek) muziek.pause();
    opn.stop(); await klaarBelofte; try{ac.close();}catch(e){}

    const vblob=new Blob(uit,{type:VO.mime.split(';')[0]});
    VO.videoBlob=vblob; VO.video=URL.createObjectURL(vblob);
    VO.stand='video'; voTekenen();
  }catch(e){
    VO.stand=VO.url?'klaar':'leeg'; voTekenen();
    toast('Video maken mislukte: '+(e&&e.message||e),'err');
  }
}

async function voGebruik(){
  const ext=VO.mime.includes('mp4')?'mp4':'webm';
  const pad=`reel/voiceover-${Date.now()}.${ext}`;
  toast('Video uploaden…','ok');
  const up=await sb.storage.from(CT_BUCKET).upload(pad,VO.videoBlob,{contentType:VO.mime.split(';')[0]});
  if(up.error){toast('Upload mislukt: '+up.error.message,'err');return;}
  CT.media=[{path:pad,type:'video/'+ext}];
  await ctOpslaan(null);
  ctMediaTekenen(); ctPreviewTekenen();
  toast('De reel gebruikt nu de video met voice-over','ok');
}

/* Echt publiceren kan zodra de Instagram-koppeling er is; de check vertelt wat
   er eventueel nog ontbreekt en de knop verschijnt alleen als het kan. */
let CT_IG=null; // uitkomst van de check, 1x per sessie
async function ctPlaatsTekenen(){
  const vak=$('#ct_plaats'); if(!vak) return;
  if(CT_IG===null){
    try{ const {data}=await sb.functions.invoke('ig-publiceren',{body:{actie:'check'}}); CT_IG=data||{ok:false,reden:'geen antwoord'}; }
    catch(e){ CT_IG={ok:false,reden:String(e&&e.message||e)}; }
  }
  if(!$('#ct_plaats')) return; // intussen weggeklikt
  if(CT_IG.klaar){
    vak.innerHTML=`
      <div class="bc-hint" style="margin:0 0 8px">Gekoppeld aan <b>@${esc(CT_IG.account)}</b>. Caption en hashtags-reactie gaan automatisch mee.</div>
      <button class="btn btn-primary btn-sm" id="ct_publiceer">📤 Plaats op Instagram</button>
      <div class="muted" id="ct_plaatsstatus" style="font-size:13px;margin-top:6px"></div>`;
    $('#ct_publiceer').onclick=ctPubliceer;
  }else if(CT_IG.gevonden&&CT_IG.gevonden.length){
    vak.innerHTML=`<div class="bc-hint" style="margin:0">Bijna: je Meta-token ziet <b>@${esc(CT_IG.gevonden[0].ig_naam)}</b> al (ig-id ${esc(CT_IG.gevonden[0].ig_id)}). Zet die id als <code>ig_user_id</code> in integration_config en publiceren staat aan.</div>`;
  }else{
    vak.innerHTML=`<div class="bc-hint" style="margin:0">Rechtstreeks plaatsen staat nog uit: ${esc(CT_IG.reden||'Instagram is niet gekoppeld')}.<br>
      Tot die tijd: kopieer de caption en hashtags hiernaast en plaats via de Instagram-app; dat is twee minuten werk met dit pakket ernaast.</div>`;
  }
}

async function ctPubliceer(){
  if(!CT.postId){await ctOpslaan(null); if(!CT.postId){toast('Kon de post niet opslaan','err');return;}}
  else await ctOpslaan(null); // laatste captionwijzigingen mee
  const knop=$('#ct_publiceer'), st=$('#ct_plaatsstatus');
  knop.disabled=true; st.textContent=CT.soort==='reel'?'Video naar Meta, verwerken kan een minuut duren…':'Plaatsen…';
  try{
    const {data,error}=await sb.functions.invoke('ig-publiceren',{body:{actie:'publiceer',post_id:CT.postId}});
    if(error||!data||data.ok===false){
      st.innerHTML=`<span class="err">${esc((data&&data.reden)||(error&&error.message)||'mislukt')}</span>`;
      knop.disabled=false; return;
    }
    if(data.bezig){ st.textContent='Meta verwerkt de video nog. Klik over een minuut nog een keer, dan wordt hij afgerond.'; knop.disabled=false; return; }
    st.innerHTML=`Geplaatst!${data.permalink?` <a href="${esc(data.permalink)}" target="_blank" rel="noopener">Bekijk hem op Instagram</a>.`:''}`+
      (data.eerste_reactie_geplaatst?' Hashtags staan als eerste reactie eronder.':' <span class="err">De hashtags-reactie lukte niet; plak hem zelf even onder de post.</span>');
    knop.textContent='✓ Geplaatst'; toast('Post staat op Instagram','ok'); ctLijstLaden();
  }catch(e){ st.innerHTML=`<span class="err">${esc(String(e&&e.message||e))}</span>`; knop.disabled=false; }
}

async function ctOpslaan(status){
  const {data,error}=await sb.rpc('content_post_opslaan',{
    p_id:CT.postId, p_soort:CT.soort, p_onderwerp:$('#ct_onderwerp').value.trim()||null,
    p_project:CT.project||null, p_doel:CT.doel, p_media:CT.media,
    p_pakket:CT.pakket?{...CT.pakket,stijl:CT.stijl,opmaak:{...CT_OPMAAK}}:null, p_caption:($('#ct_caption')&&$('#ct_caption').value)||null,
    p_status:status||null});
  if(error){toast('Opslaan mislukt: '+error.message,'err');return;}
  CT.postId=data.id;
  if(status==='klaar')toast('Klaar om te plaatsen. Alles staat bewaard.','ok');
  if(status==='gepost')toast('Gemarkeerd als gepost','ok');
  ctLijstLaden();
}

async function ctLijstLaden(){
  const vak=$('#ct_lijst'); if(!vak) return;
  const {data,error}=await sb.rpc('content_posts_lijst');
  if(error||!Array.isArray(data)){vak.innerHTML='<span class="muted" style="font-size:13px">Kon de lijst niet laden.</span>';return;}
  CT.lijst=data;
  // De geplande dagen staan al in de weekstrip bovenaan; hier alleen wat echt
  // gemaakt of gepost is, anders staat alles er dubbel.
  const gemaakt=data.filter(p=>p.status!=='gepland');
  if(!gemaakt.length){vak.innerHTML='<span class="muted" style="font-size:13px">Nog geen posts. Je eerste pakket verschijnt hier.</span>';return;}
  const rij=p=>`
    <div class="ct-item" data-open="${p.id}">
      <button class="bc-zoekactie" data-ster="${p.id}" title="${p.favoriet?'Favoriet, klik om te verwijderen':'Bewaar als favoriet'}" style="padding:0 4px;font-size:15px">${p.favoriet?'⭐':'☆'}</button>

/* ================= ANALYTICS ================= */
let ANALYTICS_RANGE='30d';
let ANALYTICS_CUSTOM={from:null,to:null};
function anRangeCalc(){
  const startOfDay=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);return x;};
  const today0=startOfDay(new Date());const r=ANALYTICS_RANGE;
  let since,until,label;
  if(r==='today'){since=today0;until=new Date();label='Today';}
  else if(r==='yesterday'){until=today0;since=new Date(today0.getTime()-864e5);label='Yesterday';}
  else if(r==='custom'&&ANALYTICS_CUSTOM.from&&ANALYTICS_CUSTOM.to){since=startOfDay(ANALYTICS_CUSTOM.from);until=new Date(startOfDay(ANALYTICS_CUSTOM.to).getTime()+864e5-1);label=ANALYTICS_CUSTOM.from+' → '+ANALYTICS_CUSTOM.to;}
  else{const n=parseInt(r)||30;since=new Date(Date.now()-n*864e5);until=new Date();label='Last '+n+' days';}
  return {since,until,label};
}
function anInt(n){return (n||0).toLocaleString('en-US');}
function anPct(x){if(!isFinite(x))return '—';const p=x*100;return (p>=10||p===0?p.toFixed(0):p.toFixed(1))+'%';}
function anDur(ms){if(!ms||ms<=0)return '—';const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);return m+'m '+(s%60)+'s';}
function anMoney(n){n=Number(n)||0;return '€'+Math.round(n).toLocaleString('nl-NL');}
function anBars(rows,color){
  if(!rows.length)return '<div class="empty" style="padding:22px">No data in this period yet.</div>';
  const max=Math.max.apply(null,rows.map(r=>r.value))||1;
  return '<div class="anbars">'+rows.map(r=>`<div class="anbar"><div class="anbar-l" title="${esc(r.label)}">${esc(r.label)}</div><div class="anbar-t"><div class="anbar-f" style="width:${Math.max(2,r.value/max*100).toFixed(1)}%;background:${color||'var(--brand-2)'}"></div></div><div class="anbar-v">${r.display!=null?r.display:anInt(r.value)}${r.sub?` <span class="muted" style="font-weight:500">${esc(r.sub)}</span>`:''}</div></div>`).join('')+'</div>';
}
function anLine(series){
  const w=760,h=210,pad=26,n=series.length;
  if(!n)return '<div class="empty" style="padding:30px">No traffic recorded yet.</div>';
  const maxPv=Math.max(1,...series.map(s=>s.pv));
  const X=i=>pad+(w-2*pad)*(n<=1?0.5:i/(n-1));
  const Y=v=>(h-pad)-(h-2*pad)*(v/maxPv);
  const path=k=>series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(s[k]).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${(h-pad)} ${series.map((s,i)=>`L${X(i).toFixed(1)},${Y(s.pv).toFixed(1)}`).join(' ')} L${X(n-1).toFixed(1)},${(h-pad)} Z`;
  const dfmt=d=>{const p=d.split('-');return p[2]+'/'+p[1];};
  const ticks=[0,Math.floor((n-1)/2),n-1].filter((x,i,a)=>a.indexOf(x)===i);
  return `<div style="padding:8px 14px 4px">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="220" preserveAspectRatio="none" style="display:block">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e3e7e4"/>
      <path d="${area}" fill="rgba(20,179,125,.10)"/>
      <path d="${path('pv')}" fill="none" stroke="#14b37d" stroke-width="2.2"/>
      <path d="${path('vis')}" fill="none" stroke="#0f6b4f" stroke-width="2.2" stroke-dasharray="4 3"/>
      ${series.map((s,i)=>s.pv>0?`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.pv).toFixed(1)}" r="3.2" fill="#14b37d"/>`:'').join('')}
      <text x="${pad}" y="16" font-size="11" fill="#5f6f68">max ${maxPv}</text>
      ${ticks.map(i=>`<text x="${X(i).toFixed(1)}" y="${h-8}" font-size="10" fill="#5f6f68" text-anchor="middle">${dfmt(series[i].date)}</text>`).join('')}
    </svg>
    <div style="display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--muted);padding:2px 0 8px">
      <span><span style="display:inline-block;width:14px;height:3px;background:#14b37d;vertical-align:middle;margin-right:5px"></span>Page views</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:3px dashed #0f6b4f;vertical-align:middle;margin-right:5px"></span>Unique visitors</span>
    </div></div>`;
}
function anMatchProj(val,name,slug){
  if(!val)return false;const v=String(val).toLowerCase().trim();
  const nm=(name||'').toLowerCase().trim(),sl=(slug||'').toLowerCase().trim();
  if(nm&&(v===nm||v.includes(nm)||nm.includes(v)))return true;
  if(sl&&(v===sl||v.includes(sl)))return true;
  return false;
}

async function inboxPoll(){

  if(INBOX.sel){await sb.rpc('inbox_mark_read',{p_id:INBOX.sel});}

async function inboxOpen(id,keepDraft){
  INBOX.sel=id;
  document.querySelectorAll('.ibx-row').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
  const c=INBOX.convos.find(x=>x.id===id);
  // Altijd markeren als gelezen bij openen, ook als de lokale teller al 0 stond
  // (bijv. geopend vanuit het CRM of via een deeplink, of teller al lokaal gewist).
  // Fouten stil laten verdwijnen zou de badge na refresh laten terugkomen.
  if(c)c.unread_count=0;
  { const rr=document.querySelector(`.ibx-row[data-id="${id}"]`);if(rr){rr.classList.remove('unread');const u=rr.querySelector('.ibx-unread');if(u)u.remove();} }
  sb.rpc('inbox_mark_read',{p_id:id}).then(({error})=>{if(error)console.error('mark_read faalde:',error.message);});
  const t=$('#ibx_thread');if(!t)return;
  t.innerHTML='<div class="muted" style="padding:20px">Gesprek laden…</div>';
  const info=$('#ibx_info');if(info)info.innerHTML='<div class="muted" style="padding:16px;font-size:12.5px">Klantinfo laden…</div>';
  const [tr,cr]=await Promise.all([
    sb.rpc('inbox_thread',{p_id:id}),
    sb.rpc('inbox_contact_context',{p_id:id})
  ]);
  if(INBOX.sel!==id)return; // switched away while loading
  if(tr.error||!tr.data||!tr.data.conversation){t.innerHTML=`<div class="empty" style="padding:20px">Kon gesprek niet laden${tr.error?': '+esc(tr.error.message):''}.</div>`;return;}
  inboxDrawThread(tr.data,keepDraft);
  inboxDrawInfo((cr&&cr.data)?cr.data:{conversation:tr.data.conversation});
  // Vanuit "Mailen" op contactkaart/pipeline-drawer: composer meteen op het
  // gevraagde kanaal zetten zodra het gesprek getekend is.
  if(INBOX.pendingSendCh){const ch=INBOX.pendingSendCh;INBOX.pendingSendCh=null;inboxComposeVia(ch);}
}

      ${edit?`
        <div class="ibx-modetabs" id="ibx_modetabs">

        <div class="ibx-sendhint" id="ibx_sendhint">${inboxComposerHint()}</div>
        <div class="ibx-crow">

          <button class="btn ibx-sendbtn" id="ibx_send">Sturen</button>
        </div>`:`<div class="muted" style="padding:10px 14px;font-size:12px">Alleen-lezen — je hebt geen bewerkrechten voor de inbox.</div>`}
    </div>`;
  inboxRenderMsgs(msgs);
  if(edit){
    INBOX.composeMode='msg';
    document.querySelectorAll('#ibx_chsel .ibx-chselb').forEach(b=>b.onclick=()=>inboxSetSendCh(b.dataset.ch));
    document.querySelectorAll('#ibx_modetabs button').forEach(b=>b.onclick=()=>inboxSetMode(b.dataset.mode));
    inboxSetSendCh(def);

    if(inp){

function inboxRenderMsgs(msgs){
  const box=$('#ibx_msgs');if(!box)return;
  const cur=INBOX.cur||{};let lastDay='';
  // Skip empty placeholder messages so they can't leave a stray bubble/time.
  const list=(msgs||[]).filter(m=>((m.body||'').trim())||(m.attachments&&m.attachments.length));
  box.innerHTML=list.map((m,i)=>{
    // Centered date separator when the calendar day changes (like WhatsApp/IG).
    const day=inboxDayKey(m.created_at);let sep='';
    if(day&&day!==lastDay){sep=`<div class="ibx-daysep"><span>${esc(inboxDayLabel(m.created_at))}</span></div>`;lastDay=day;}
    // Internal note — a team-only sticky in the same thread; never sent to the lead.
    if(m.is_note){
      return `${sep}<div class="ibx-note"><div class="ibx-note-h">📝 Interne notitie · ${esc((m.sender_name||'Team').split('@')[0])} · ${esc(inboxClock(m.created_at))}</div><div class="ibx-note-b">${esc(m.body||'')}</div></div>`;
    }
    const out=m.direction==='out';const who=m.sender;
    const mch=m.channel||cur.channel||'instagram';
    const med=INBOX_CH[mch]||INBOX_CH.instagram;
    const chCls=(mch==='instagram'||mch==='whatsapp'||mch==='email')?' ch-'+mch:'';
    // Automatische e-mail (sequence/outreach): duidelijk gelabeld én standaard ingeklapt,
    // zodat de lange mailtekst het overzicht in de chat niet verstoort.
    if(out&&who==='ai'&&mch==='email'){
      const raw=String(m.body||'');
      // Portaal-bevestigingen (bijv. betaalbevestiging) starten met 💶 en krijgen een
      // eigen groene badge, zodat ze los staan van de marketing-sequencemails.
      const isPay=/^\s*💶/.test(raw);
      const mm=raw.match(/^\s*(?:✉️|💶)?\s*(.*?)(?:\n{2,}([\s\S]*))?$/);
      const subject=(mm&&mm[1]?mm[1]:'').trim();
      const bodyText=(mm&&mm[2]?mm[2]:(subject?'':raw)).trim();
      const tagCls=isPay?'ibx-autoem-tag pay':'ibx-autoem-tag';
      const tagLbl=isPay?'💶 Betaalbevestiging':'🤖 Automatische e-mail';
      const blkCls=isPay?'ibx-autoem pay':'ibx-autoem';
      // Sommige oude logregels bevatten alleen het onderwerp en geen tekst. Die
      // niet als uitklapbaar tonen, anders klik je open op een lege ruimte.
      if(!bodyText){
        return `${sep}<div class="${blkCls} leeg"><div class="ibx-autoem-h"><span class="${tagCls}">${tagLbl}</span><span class="ibx-autoem-sub">${esc(subject||'(zonder onderwerp)')}</span><span class="ibx-autoem-t">${esc(inboxClock(m.created_at))}</span><span class="ibx-autoem-t">geen tekst bewaard</span></div></div>`;
      }
      // Expliciete knop-toggle i.p.v. native <details>: dat element bleek in de
      // praktijk soms als lege stippellijn te renderen (summary onzichtbaar).
      return `${sep}<div class="${blkCls}" data-autoem>
        <button type="button" class="ibx-autoem-h" data-autoem-t><span class="${tagCls}">${tagLbl}</span><span class="ibx-autoem-sub">${esc(subject||'(zonder onderwerp)')}</span><span class="ibx-autoem-t">${esc(inboxClock(m.created_at))}</span><span class="ibx-autoem-x"></span></button>
        <div class="ibx-autoem-b" hidden>${esc(bodyText).replace(/\n/g,'<br>')}</div>
      </div>`;
    }
    const biz=BIZ_ACCOUNTS[mch]||'';
    // Twee dingen die los van elkaar staan, dus ook op twee regels: WIE het bericht
    // stuurde (de bot automatisch, of een teamlid dat het zelf tikte) en VANAF WELK
    // zakelijk account het de deur uit ging. +31 6 12005900 is het UTAMA-nummer,
    // niet het prive-nummer van degene die typte.
    let tag='';
    if(out&&(who==='ai'||who==='human')){
      const wie=who==='ai'?'UTAMA-bot':esc(teamName(m.sender_name));
      const hoe=who==='ai'?'automatisch':'handmatig via portal';
      const acct=biz?`<span class="ibx-acct">UTAMA-account · ${esc(med.label)} ${esc(biz)}</span>`:'';
      tag=`<div class="ibx-bhead"><span class="ibx-who">${wie}</span><span class="ibx-how">${hoe}</span>${acct}</div>`;
    }
    const undel=out&&(m.delivery_status==='pending'||m.delivery_status==='failed');
    const undelNote=undel?`<div class="ibx-undel">${m.delivery_status==='failed'?'⚠︎ Niet afgeleverd':'⏳ Niet verzonden — kanaal nog niet gekoppeld'}</div>`:'';
    // Instagram-style: a small avatar next to the LEAD's messages, shown only on
    // the last of a consecutive incoming run; hover shows the name.
    let avatar='';
    if(!out){
      const next=list[i+1];
      const lastOfRun=!next||next.direction==='out'||next.is_note;
      const nm=cur.name||m.sender_name||'';
      avatar=lastOfRun
        ? `<div class="ibx-msgav" title="${esc(nm)}">${esc(inboxInitials(nm))}${cur.avatar?`<img src="${esc(cur.avatar)}" alt="" class="ibx-avimg" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>`
        : `<div class="ibx-msgav ph"></div>`;
    }
    // Show the time only once per minute-cluster: on the last message before the
    // clock minute changes (or the last message / a day change). Avoids repeating
    // the same "23:44" under every bubble.
    // Foto's apart tonen; is de tekst alleen de fotolink, dan die niet herhalen.
    const media=msgMedia(m);
    const rawBody=String(m.body||'').trim();
    const bodyTxt=(media.length===1&&rawBody===media[0])?'':rawBody;
    const nx=list[i+1];
    const showTime=!nx||inboxClock(nx.created_at)!==inboxClock(m.created_at)||inboxDayKey(nx.created_at)!==day;
    // Meta line under each bubble: the message's medium icon always (so it's
    // clear which channel it came via), plus the time once per minute-cluster.
    const metaHtml=`<div class="ibx-btime"><span class="ibx-medico" title="${esc(med.label)}">${med.icon}</span>${showTime?' '+esc(inboxClock(m.created_at)):''}</div>`;
    return `${sep}<div class="ibx-mrow ${out?'out':'in'}">
      <div class="ibx-mline">${avatar}<div class="ibx-bub ${out?(who==='human'?'human':'ai'):'lead'}${chCls}">${tag}${media.length?imgHtml(media):''}${bodyTxt?`<div class="ibx-btext">${esc(bodyTxt)}</div>`:''}${undelNote}</div></div>
      ${metaHtml}</div>`;
  }).join('');
  // Foto op ware grootte bekijken.
  box.querySelectorAll('[data-zoom]').forEach(im=>im.onclick=()=>{
    const ov=document.createElement('div');
    ov.className='ibx-lightbox';
    ov.innerHTML=`<img src="${esc(im.dataset.zoom)}" alt="" referrerpolicy="no-referrer">`;
    const sluit=()=>{ov.remove();document.removeEventListener('keydown',esc2);};
    const esc2=e=>{if(e.key==='Escape')sluit();};
    ov.onclick=sluit; document.addEventListener('keydown',esc2);
    document.body.appendChild(ov);
  });
  // Toggle van de ingeklapte automatische e-mails (expliciete knop, geen <details>).
  box.querySelectorAll('[data-autoem-t]').forEach(b=>b.onclick=()=>{
    const w=b.closest('[data-autoem]');const bd=w&&w.querySelector('.ibx-autoem-b');if(!bd)return;
    const open=bd.hasAttribute('hidden');
    if(open){bd.removeAttribute('hidden');w.classList.add('open');}
    else{bd.setAttribute('hidden','');w.classList.remove('open');}
  });
  box.scrollTop=box.scrollHeight;
}

async function inboxRelatie(id,aan,forceer){
  // De database beslist, niet de knop: relatie_markeer weigert zodra er een
  // lead, reservering of aankoop op het contact staat. Voor de bot is dat een
  // harde grens. Jij mag hem overrulen, maar dan wel bewust: je krijgt eerst te
  // zien wát je overrult. Verplaatsen is niet destructief (de kaart verhuist,
  // notities en taken blijven staan) en "Toch een lead" zet alles terug.
  const {data,error}=await sb.rpc('relatie_markeer',{p_conversation:id,p_aan:aan,p_forceer:!!forceer});
  if(error){toast('Mislukt: '+esc(error.message),'err');return;}
  if(data&&data.ok===false){
    if(data.te_forceren&&!forceer){
      if(confirm('Let op: '+(data.reden||'dit contact hoort mogelijk in de verkooppijplijn')+'.\n\nToch verplaatsen naar Relaties & overig? Je kunt dit altijd terugdraaien met "Toch een lead".')){
        return inboxRelatie(id,aan,true);
      }
      return;
    }
    toast('Kan niet: '+esc(data.reden||'onbekende reden'),'err');return;
  }
  toast(aan?(data&&data.geforceerd?'Verplaatst naar Relaties & overig (geforceerd)':'Verplaatst naar Relaties & overig'):'Terug in de leadpijplijn','ok');
  await inboxOpen(id,true);await inboxLoad();
}

async function renderLiveVisitors(){
  const box=$('#live_visitors');
  if(!box){ if(LIVE_TIMER){clearInterval(LIVE_TIMER);LIVE_TIMER=null;} return; }
  const now=Date.now();
  const since=new Date(now-30*60000).toISOString();
  const {data,error}=await sb.from('analytics_events')
    .select('session_id,visitor_hash,visitor_id,site,path,page_title,project,channel,referrer_host,utm_source,utm_campaign,country,city,device,browser,created_at')
    .gte('created_at',since).order('created_at',{ascending:false}).limit(5000);
  if(!$('#live_visitors'))return; // navigated away while loading
  if(error){box.innerHTML=`<div class="empty" style="padding:18px">Live data niet beschikbaar: ${esc(error.message)}</div>`;return;}
  const rows=data||[];
  // latest event per session (rows already newest-first)
  const seen={},sessions=[];
  rows.forEach(e=>{if(!e.session_id||seen[e.session_id])return;seen[e.session_id]=1;sessions.push(e);});
  const LIVE_WINDOW=5*60000;
  const active=sessions.filter(s=>now-new Date(s.created_at).getTime()<=LIVE_WINDOW);
  const n=active.length, last30=sessions.length;
  // Identify visitors who signed up: match by session (this visit) OR by persistent visitor id (returning visitor)
  const idMap={},vidMap={};
  const actIds=[...new Set(active.map(s=>s.session_id).filter(Boolean))];
  const actVids=[...new Set(active.map(s=>s.visitor_id).filter(Boolean))];
  if(actIds.length){
    const {data:ld}=await sb.from('leads').select('ua_session,contact_id,name,email').not('ua_session','is',null).in('ua_session',actIds);
    if(!$('#live_visitors'))return;
    (ld||[]).forEach(l=>{const k=l.ua_session;if(k&&!idMap[k])idMap[k]={cid:l.contact_id,name:l.name,email:l.email};});
  }
  if(actVids.length){
    const {data:ld2}=await sb.from('leads').select('ua_vid,contact_id,name,email,created_at').not('ua_vid','is',null).in('ua_vid',actVids).order('created_at',{ascending:false});
    if(!$('#live_visitors'))return;
    (ld2||[]).forEach(l=>{const k=l.ua_vid;if(k&&!vidMap[k])vidMap[k]={cid:l.contact_id,name:l.name,email:l.email};});
  }
  const {data:kvd}=await sb.from('analytics_known_visitors').select('visitor_id,label');
  if(!$('#live_visitors'))return;
  const knownMap={};(kvd||[]).forEach(k=>{knownMap[k.visitor_id]=k.label;});
  const dev=d=>({desktop:'🖥️',mobile:'📱',tablet:'📲'}[d]||'💻');
  const ago=ms=>{const s=Math.max(0,Math.round(ms/1000));if(s<15)return 'net nu';if(s<60)return s+' sec geleden';const m=Math.round(s/60);return m+' min geleden';};
  const projName=s=>({'the-maison':'The Maison','moka':'MOKA','the-reload':'The Reload'}[s]||null);
  const pageName=path=>{
    let p=(path||'/').split('?')[0].split('#')[0];
    if(p==='/'||p==='')return 'Homepage';
    const seg=p.replace(/^\/+|\/+$/g,'').split('/');
    let name=projName(seg[0])||({referral:'Referral',portal:'Investeerdersportaal',dataroom:'Dataroom',webinar:'Webinar',webinar3:'Webinar','the-maison-brochure':'The Maison'}[seg[0]]||seg[0].replace(/-/g,' '));
    if(/\/brochure(\/|$)/.test(p))name+=' — Brochure';
    else if(/\/dataroom(\/|$)/.test(p))name+=' — Dataroom';
    else if(/\/dashboard(\/|$)/.test(p))name+=' — Dashboard';
    return name;
  };
  const srcOf=e=>{const c=(e.channel||'direct').toLowerCase();let detail='';
    if(e.utm_campaign)detail=metaName(e.utm_campaign);else if(e.utm_source)detail=e.utm_source;else if(e.referrer_host)detail=e.referrer_host;
    else detail={direct:'directe link',organic:'zoekmachine',social:'social',paid:'advertentie',referral:'verwijzing',campaign:'campagne',email:'e-mail',internal:'intern'}[c]||c;
    return {c,detail};};
  await resolveMetaNames(active.map(e=>e.utm_campaign));
  if(!$('#live_visitors'))return;
  let h=`<div class="live-head" style="padding:6px 18px 12px"><span class="live-count">${n}</span><span class="live-sub">${n===1?'bezoeker nu online':'bezoekers nu online'} · laatste 5 min · <b>${last30}</b> in laatste 30 min</span></div>`;
  if(!n){
    h+=`<div class="muted" style="padding:4px 18px 16px;font-size:13px">Niemand is op dit moment op de site. Zodra iemand de website bezoekt, verschijnt die hier live — met pagina en bron.${last30?` Er ${last30===1?'was 1 bezoeker':'waren '+last30+' bezoekers'} in de afgelopen 30 minuten.`:''}</div>`;
  }else{
    h+=`<div class="table-wrap" style="max-height:360px;overflow:auto"><table class="live-tbl"><thead><tr><th>Bezoeker</th><th>Huidige pagina</th><th>Bron</th><th>Sinds</th></tr></thead><tbody>`;
    const cleanCity=c=>c?c.replace(/^(Gemeente|Municipality of|Municipality|Provincie|Province of|Regency of|Kota|Kabupaten)\s+/i,'').trim():c;
    active.forEach(e=>{const s=srcOf(e);const loc=[cleanCity(e.city),e.country].filter(Boolean).map(esc).join(', ')||'—';
      const known=knownMap[e.visitor_id];const id=idMap[e.session_id]||vidMap[e.visitor_id];const isKnown=!!known;const who=known||(id?(id.name||id.email||'Bekende lead'):null);
      h+=`<tr${(!isKnown&&id&&id.cid)?` class="live-known" data-cid="${esc(id.cid)}" title="Open contact in CRM"`:''}><td>${who?`<div class="live-name"${isKnown?' style="color:#0891b2"':''}>${isKnown?'🏷️':'👤'} ${esc(who)}${isKnown?' <span class="muted" style="font-size:11px;font-weight:400">intern</span>':''}</div>`:''}<span class="live-meta">${dev(e.device)} ${esc(e.device||'—')}${e.browser?' · '+esc(e.browser):''}<br>${loc}</span></td>`
       +`<td><div class="live-path">${esc(pageName(e.path))}</div><div class="live-ttl">${esc((e.site||'')+(e.path||'/').split('?')[0].split('#')[0])}</div></td>`
       +`<td><span class="src-badge ${chanClass(s.c)}">${esc(s.c)}</span><div class="live-meta" style="margin-top:3px">${esc(s.detail)}</div></td>`
       +`<td class="live-ago">${ago(now-new Date(e.created_at).getTime())}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll('tr[data-cid]').forEach(tr=>tr.onclick=()=>openLivePerson(tr.dataset.cid));
}
let PENDING_OPEN_PERSON=null;
