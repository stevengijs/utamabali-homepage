  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--brand)}

  #login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% -10%,#12332a,#0c1a15)}
  .login-card{background:var(--panel);width:360px;max-width:92vw;padding:32px;border-radius:16px;box-shadow:var(--shadow)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .login-card h1{font-size:19px;margin:14px 0 2px}
  .login-card p.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.15)}
  .field input:disabled{background:#f4f6f5;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:14px}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#0b573f}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{background:#f2f4f2}
  .btn-danger{background:#fff;border-color:#eccfcb;color:var(--danger)}
  .btn-danger:hover{background:#fbeeec}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn-block{width:100%}
  .login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:4px}

  #app{display:none;height:100%}
  .shell{display:grid;grid-template-columns:240px 1fr;height:100vh}
  aside{background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;padding:16px 12px}
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .side-brand b{color:#fff;font-size:15px;letter-spacing:.3px}
  .side-brand small{display:block;color:#6f8c81;font-size:11px;font-weight:600}
  nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--sidebar-ink);text-decoration:none;font-weight:500;border:none;background:none;width:100%;text-align:left;font-size:14px}
  .nav-item:hover{background:#12271f}
  .nav-item.active{background:var(--sidebar-active);color:#fff}
  .nav-item .ic{width:18px;text-align:center;opacity:.9}
  .side-foot{border-top:1px solid #17352b;padding-top:12px;margin-top:8px}
  .side-user{font-size:12px;color:#8fa89e;padding:0 8px 8px;word-break:break-all}
  .side-user b{color:#e8efeb;display:block;font-size:13px}

  main{overflow:auto}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(245,246,245,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
  .topbar h2{margin:0;font-size:18px}
  .topbar .crumb{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .content{padding:24px 28px 60px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:28px;font-weight:750;margin-top:6px}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px}
  .stat[data-go]{transition:border-color .15s,box-shadow .15s,transform .1s}
  .stat[data-go]:hover{border-color:var(--brand-2);box-shadow:0 6px 18px rgba(20,179,125,.18)}
  .stat[data-go]:active{transform:translateY(1px)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
  .panel-head h3{margin:0;font-size:15px}
  .panel-head .desc{color:var(--muted);font-size:12px;margin-top:2px}
  .toolbar{display:flex;gap:8px;align-items:center}
  .search{padding:8px 11px;border:1px solid var(--line);border-radius:8px;min-width:180px;outline:none}
  .search:focus{border-color:var(--brand-2)}
  .count-pill{font-size:11px;font-weight:700;color:var(--muted);background:#eef0ef;border:1px solid var(--line);padding:3px 8px;border-radius:999px}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fafbfa}
  tbody tr:hover{background:#fafbfa}
  td .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .table-wrap{overflow:auto;max-height:70vh}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}

  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#f2f4f2;color:#41514a;white-space:nowrap}
  .badge.green{background:#e7f6ef;color:#0f6b4f;border-color:#c6ead9}
  .badge.blue{background:#e8f0fb;color:#1d4ed8;border-color:#cfe0f7}
  .badge.amber{background:#fdf3e2;color:#9a6410;border-color:#f4e2c1}
  .badge.red{background:#fbeeec;color:#b0362a;border-color:#f0d3ce}
  .badge.grey{background:#eef0ef;color:#5f6f68}

  .chip{display:inline-block;padding:2px 8px;border-radius:7px;background:#eef4f1;color:#2c5a4a;font-size:11px;margin:1px 3px 1px 0}

  .overlay{position:fixed;inset:0;background:rgba(12,26,21,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal{background:#fff;border-radius:14px;width:600px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .modal-head h3{margin:0;font-size:16px}
  .modal-body{padding:20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}

  .perm-table{width:100%;border-collapse:collapse;margin-top:4px}
  .perm-table th,.perm-table td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .perm-table td.center,.perm-table th.center{text-align:center}
  .perm-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}

  .toast-wrap{position:fixed;bottom:22px;right:22px;z-index:90;display:flex;flex-direction:column;gap:10px}
  .toast{background:#12211c;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;max-width:340px}
  .toast.err{background:#7a271a}
  .toast.ok{background:#0f6b4f}

  /* rich text ITP editor */
  .rte-tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .rte-tb button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;min-width:32px}
  .rte-tb button:hover{background:#f2f4f2}
  .rte{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:280px;max-height:50vh;overflow:auto;font-size:13px;line-height:1.55;outline:none}
  .rte:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.12)}
  .rte p{margin:0 0 10px}
  .itp-view p{margin:0 0 10px}
  /* notifications */
  .notif-bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .notif-bell:hover{background:#f2f4f2}
  .notif-count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center}
  .nrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 2px;border-bottom:1px solid var(--line)}
  .nrow .row-actions{flex-wrap:wrap;justify-content:flex-end}
  .ntab{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
  .ntab button{border:none;background:#fff;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
  .ntab button.on{background:var(--brand);color:#fff}
  /* analytics */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:none;background:#fff;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.an-grid{grid-template-columns:1fr}}
  .anbars{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
  .anbar{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;font-size:13px}
  .anbar-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .anbar-t{background:#eef0ef;border-radius:6px;height:10px;overflow:hidden}
  .anbar-f{height:100%;border-radius:6px;transition:width .3s}
  .anbar-v{font-weight:700;white-space:nowrap}
  .funnel{display:flex;flex-direction:column;gap:12px;padding:20px}
  .fstep{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .fbar-wrap{display:flex;align-items:center;gap:12px}
  .fbar{height:46px;border-radius:9px;display:flex;align-items:center;padding:0 16px;color:#fff;font-weight:750;min-width:92px;font-size:15px;transition:width .3s}
  .fstep .fmeta{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
  .an-note{margin-bottom:16px;padding:12px 16px;background:#e8f0fb;border:1px solid #cfe0f7;border-radius:10px;color:#1d4ed8;font-size:13px}
  .rev-row{display:flex;gap:26px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line)}
  .rev-row .rk{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .rev-row .rv{font-size:22px;font-weight:750}
  .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 0 rgba(22,163,74,.55);animation:livePulse 1.8s infinite}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  .live-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:2px 0}
  .live-count{font-size:30px;font-weight:800;color:var(--brand-ink);line-height:1}
  .live-sub{font-size:12.5px;color:var(--muted)}
  .live-tbl{width:100%;border-collapse:collapse;font-size:13px}
  .live-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:8px 18px;border-bottom:1px solid var(--line)}
  .live-tbl td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:top}
  .live-tbl tr:last-child td{border-bottom:none}
  .live-path{font-weight:650;color:var(--ink);word-break:break-all}
  .live-ttl{font-size:11.5px;color:var(--muted);word-break:break-all}
  .live-tbl td:nth-child(2){max-width:340px}
  .src-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
  .src-badge.paid{background:#fef2f2;color:#b91c1c}.src-badge.organic{background:#ecfdf5;color:#047857}.src-badge.social{background:#eff6ff;color:#1d4ed8}.src-badge.direct{background:#f1f5f9;color:#475569}.src-badge.referral{background:#faf5ff;color:#7c3aed}.src-badge.campaign{background:#fffbeb;color:#b45309}.src-badge.email{background:#fdf4ff;color:#a21caf}
  .live-meta{font-size:12px;color:var(--muted)}
  .live-ago{white-space:nowrap;font-weight:650;color:#16a34a}
  .live-name{font-weight:750;color:var(--brand);margin-bottom:3px}
  .live-tbl tr.live-known{cursor:pointer;transition:background .12s}
  .live-tbl tr.live-known:hover{background:#f0faf6}
  .lock-note{padding:40px;text-align:center;color:var(--muted)}
  .readonly-tag{font-size:11px;font-weight:700;color:var(--warn);background:#fdf3e2;border:1px solid #f4e2c1;padding:3px 9px;border-radius:999px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  /* ---- sales pipeline board ---- */
  .pipe-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .pipe-toolbar select,.pipe-toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff}
  .pipe-board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;align-items:flex-start}
  .pipe-col{flex:0 0 268px;background:#f4f6f5;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 240px)}
  .pipe-col-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);position:sticky;top:0}
  .pipe-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pipe-col-title{font-weight:700;font-size:13px}
  .pipe-colgrip{cursor:grab;color:#b3bcb7;font-size:13px;line-height:1;letter-spacing:-1px;user-select:none}
  .pipe-colgrip:active{cursor:grabbing}
  .pipe-col.col-drop{outline:2px dashed #8fd3ba;outline-offset:-3px;border-radius:12px}
  .pipe-col.col-dragging{opacity:.4;box-shadow:0 8px 24px rgba(0,0,0,.14)}
  .pipe-col-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .pipe-col-sum{font-size:11px;color:var(--muted);padding:0 12px 6px}
  .pipe-cards{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px;flex:1}
  .pipe-cards.drag-over{background:#e7f3ee;outline:2px dashed #8fd3ba;outline-offset:-4px;border-radius:8px}
  .pipe-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:grab;transition:box-shadow .12s,transform .06s}
  .pipe-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.09)}
  .pipe-card.dragging{opacity:.5}
  .pipe-card-title{font-weight:700;font-size:13.5px;margin-bottom:5px;line-height:1.25}
  .pipe-card-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .pipe-chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:#eef2ff;color:#3730a3}
  .pipe-chip.val{background:#ecfdf5;color:#047857}
  .pipe-chip.proj{background:#f1f5f9;color:#334155}
  .pipe-chip.crm{background:#eff6ff;color:#1d4ed8;cursor:pointer}
  .pipe-chip.budget{background:#fffbeb;color:#b45309}
  .pipe-chip.tl{background:#f1f5f9;color:#475569}
  .pipe-wa{width:24px;height:24px;border-radius:50%;background:#25D366;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;text-decoration:none}
  .pipe-wa:hover{filter:brightness(.94)}
  /* card detail drawer */
  .pdrawer-back{position:fixed;inset:0;background:rgba(15,23,42,.30);z-index:60;opacity:0;transition:opacity .18s}
  .pdrawer-back.open{opacity:1}
  .pdrawer{position:fixed;top:0;right:0;height:100vh;width:430px;max-width:94vw;background:#fff;box-shadow:-10px 0 34px rgba(0,0,0,.20);z-index:61;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .pdrawer.open{transform:translateX(0)}
  .pdrawer-head{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  .pdrawer-body{padding:16px 18px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
  .pdrawer-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .pdr-actions{display:flex;gap:8px;flex-wrap:wrap}
  .pdr-act{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink,#111)}
  .pdr-act:hover{background:#f5f7f6}
  .pdr-act.wa{background:#25D366;color:#fff;border-color:#25D366}
  .pdr-act.wa:hover{filter:brightness(.95)}
  .pdr-stages{display:flex;gap:6px;flex-wrap:wrap}
  .pdr-stage{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--muted);transition:all .1s}
  .pdr-stage:hover{background:#f2f5f4}
  .pdr-stage.active{color:#fff;border-color:transparent}
  .pdr-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
  .pdr-field input,.pdr-field select,.pdr-field textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit}
  .pdr-field textarea{resize:vertical}
  .pdr-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pdr-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pdr-fact{background:#f7faf8;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .pdr-fact .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b}
  .pdr-fact .v{font-size:14px;font-weight:700;margin-top:3px;color:#0f172a;word-break:break-word}
  .pdr-title{font-size:19px;font-weight:800;border:none;padding:2px 0;width:100%;outline:none;font-family:inherit}
  .pdr-title:focus{border-bottom:2px solid var(--brand,#0f6b4f)}
  .pipe-av{width:24px;height:24px;border-radius:50%;background:var(--brand,#0f6b4f);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pipe-card-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .pipe-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid #eef1f0}
  .pipe-foot-right{display:inline-flex;align-items:center;gap:7px;margin-left:auto}
  .pipe-add{margin:0 8px 8px;padding:7px;border:1px dashed #c7cfcb;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;width:calc(100% - 16px)}
  .pipe-add:hover{background:#eef2f0;color:var(--ink,#111)}
  .pc-form label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
  .pc-in{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit}
  textarea.pc-in{resize:vertical}
  @media(max-width:820px){.shell{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand-row"><div class="logo">U</div><div><b style="font-size:15px">UTAMA</b><div style="font-size:11px;color:var(--muted);font-weight:600">TEAM ADMIN</div></div></div>
    <h1>Sign in</h1>
    <p class="sub">Access the team admin backend.</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign in</button>
      <div class="login-err" id="loginErr"></div>
    </form>

/* ================= STATE ================= */
let ME=null, PERMS={}, SESSION=null, CURRENT='dashboard';
let _cache={};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function toast(msg,type){const t=el('div','toast '+(type||''),msg);$('#toasts').append(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},3600);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){if(v==null||v==='')return '—';return '€'+Number(v).toLocaleString('nl-NL');}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return d.toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(v){if(!v)return '—';const d=new Date(v);return d.toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function toLocalInput(v){if(!v)return '';const d=new Date(v);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function isAdmin(){return ME && ME.is_admin;}
function canView(p){return isAdmin() || (PERMS[p] && PERMS[p].can_view);}
function canEdit(p){return isAdmin() || (PERMS[p] && PERMS[p].can_edit);}
function shortId(v){return v?String(v).slice(0,8)+'…':'—';}

const STATUS_COLOR = {
  new:'blue',inquiry:'blue',contacted:'amber',qualified:'green',won:'green',lost:'red',
  reservation:'amber',dataroom_request:'blue',
  reserved:'amber',contracted:'blue',completed:'green',cancelled:'red',
  pending:'amber',invoiced:'blue',paid:'green',overdue:'red',
  planned:'grey',in_progress:'blue',delayed:'red',
  eligible:'blue',void:'grey',
  scheduled:'blue',live:'green',draft:'grey',review:'amber',published:'green',archived:'grey',active:'green',paused:'amber',
  in_ontwikkeling:'amber',in_verkoop:'green',uitverkocht:'grey',afgerond:'grey',
  due_diligence:'blue',contract_voorbeeld:'amber',overig:'grey',
  construction:'blue',leasehold:'amber',furniture:'green',other:'grey'
};
function statusBadge(v){if(v==null||v==='')return '<span class="badge grey">—</span>';const c=STATUS_COLOR[v]||'grey';return `<span class="badge ${c}">${esc(v)}</span>`;}
function boolBadge(v){return v?'<span class="badge green">Yes</span>':'<span class="badge grey">No</span>';}

function cell(resKey,f,row){
  const v=row[f];
  const def=(RES[resKey].fields.find(x=>x.k===f))||{};
  if(f==='status'||f==='type'||f==='category'||f==='agreement')return statusBadge(v);
  if(def.type==='bool')return boolBadge(v);
  if(def.money)return money(v);
  if(def.type==='tags'){const a=v||[];return a.length?a.map(t=>`<span class="chip">${esc(t)}</span>`).join(''):'<span class="muted">—</span>';}
  if(def.type==='datetime')return fmtDateTime(v);
  if(def.type==='date')return fmtDate(v);
  if(f.endsWith('_id'))return `<span class="muted" title="${esc(v)}">${shortId(v)}</span>`;
  if(f==='url'||f.endsWith('_url'))return v?`<a href="${esc(v)}" target="_blank" rel="noopener">link ↗</a>`:'<span class="muted">—</span>';
  if(v==null||v==='')return '<span class="muted">—</span>';
  return esc(v);
}

/* ================= AUTH ================= */
sb.auth.onAuthStateChange((_e,s)=>{SESSION=s;});
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#loginErr').textContent='';
  const btn=$('#loginBtn');btn.disabled=true;btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPass').value});
  btn.disabled=false;btn.textContent='Sign in';
  if(error){$('#loginErr').textContent=error.message;return;}
  await boot();
});
$('#logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
$('#changePwBtn').addEventListener('click',openChangePw);

async function boot(){
  const {data:{session}}=await sb.auth.getSession();SESSION=session;
  if(!session){$('#login').style.display='flex';$('#app').style.display='none';return;}
  const {data:prof,error:pe}=await sb.from('adm_profiles').select('*').eq('id',session.user.id).single();
  if(pe||!prof){$('#login').style.display='flex';$('#app').style.display='none';toast('No admin profile found for this account.','err');return;}
  ME=prof;
  const {data:perms}=await sb.from('adm_permissions').select('*').eq('user_id',session.user.id);
  PERMS={};(perms||[]).forEach(p=>{PERMS[p.page]={can_view:p.can_view,can_edit:p.can_edit};});
  $('#login').style.display='none';$('#app').style.display='block';
  $('#meName').textContent=ME.full_name||ME.email;
  $('#meRole').textContent=isAdmin()?'Admin':'Team member';
  buildNav();
  if(!handleDeepLink())go('dashboard');
  window.addEventListener('hashchange',handleDeepLink);
  const bell=$('#notifBell');if(bell)bell.onclick=openNotifications;
  refreshNotifBadge();
}
/* Shareable deep links: utamabali.com/admin#contact/<id> opens that contact for the team */
function crmDeepLink(contactId){return location.origin+location.pathname+'#contact/'+contactId;}
function copyLink(url){
  const done=()=>toast('Link gekopieerd — plak in WhatsApp of mail voor je team','ok');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>fallback());return;} }catch(e){}
  fallback();
  function fallback(){try{const t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();done();}catch(e){prompt('Kopieer deze link:',url);}}
}
function handleDeepLink(){
  const m=(location.hash||'').match(/^#contact\/([0-9a-fA-F-]{8,})/);
  if(!m)return false;
  const id=m[1];
  if(!canView('leads')){toast('Je hebt geen toegang tot Leads / CRM','err');return true;}
  if(CURRENT!=='leads')go('leads');
  (async()=>{try{const {data}=await sb.from('contacts').select('*').eq('id',id).single();if(data)openPerson(data);else toast('Contact niet gevonden','err');}catch(e){toast('Kon contact niet openen','err');}})();
  return true;
}

/* ================= NAV ================= */
function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  const dash=el('button','nav-item','<span class="ic">▚</span> Dashboard');dash.onclick=()=>go('dashboard');dash.dataset.k='dashboard';nav.append(dash);
  PAGES.forEach(p=>{if(!canView(p.key))return;const b=el('button','nav-item',`<span class="ic">${p.icon}</span> ${p.label}`);b.dataset.k=p.key;b.onclick=()=>go(p.key);nav.append(b);});
}
function setActive(k){document.querySelectorAll('.nav-item[data-k]').forEach(n=>n.classList.toggle('active',n.dataset.k===k));}

function go(k){
  CURRENT=k;setActive(k);$('#topRight').innerHTML='';
  const titles={dashboard:'Dashboard',analytics:'Analytics',revenue:'Revenue',leads:'Leads / CRM',pipeline:'Pipeline',webinars:'Webinar',projects:'Projects',portal:'Portal & Investors',referrals:'Referrals',users:'Team & Users'};
  $('#pageTitle').textContent=titles[k]||k;
  if(k==='dashboard')return renderDashboard();
  if(k==='analytics')return renderAnalytics();
  if(k==='revenue')return renderRevenue();
  if(k==='users')return renderUsers();
  if(!canView(k)){$('#view').innerHTML='<div class="panel"><div class="lock-note">You don’t have access to this page.</div></div>';return;}
  if(k==='leads')return renderPeople();

let ANALYTICS_RANGE='30d';
let ANALYTICS_CUSTOM={from:null,to:null};
function anRangeCalc(){
  const startOfDay=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);return x;};
  const today0=startOfDay(new Date());const r=ANALYTICS_RANGE;
  let since,until,label;
  if(r==='today'){since=today0;until=new Date();label='Today';}
  else if(r==='yesterday'){until=today0;since=new Date(today0.getTime()-864e5);label='Yesterday';}
  else if(r==='custom'&&ANALYTICS_CUSTOM.from&&ANALYTICS_CUSTOM.to){since=startOfDay(ANALYTICS_CUSTOM.from);until=new Date(startOfDay(ANALYTICS_CUSTOM.to).getTime()+864e5-1);label=ANALYTICS_CUSTOM.from+' → '+ANALYTICS_CUSTOM.to;}
  else{const n=parseInt(r)||30;since=new Date(Date.now()-n*864e5);until=new Date();label='Last '+n+' days';}
  return {since,until,label};
}
function anInt(n){return (n||0).toLocaleString('en-US');}
function anPct(x){if(!isFinite(x))return '—';const p=x*100;return (p>=10||p===0?p.toFixed(0):p.toFixed(1))+'%';}
function anDur(ms){if(!ms||ms<=0)return '—';const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);return m+'m '+(s%60)+'s';}
function anMoney(n){n=Number(n)||0;return '€'+Math.round(n).toLocaleString('nl-NL');}
function anBars(rows,color){
  if(!rows.length)return '<div class="empty" style="padding:22px">No data in this period yet.</div>';
  const max=Math.max.apply(null,rows.map(r=>r.value))||1;
  return '<div class="anbars">'+rows.map(r=>`<div class="anbar"><div class="anbar-l" title="${esc(r.label)}">${esc(r.label)}</div><div class="anbar-t"><div class="anbar-f" style="width:${Math.max(2,r.value/max*100).toFixed(1)}%;background:${color||'var(--brand-2)'}"></div></div><div class="anbar-v">${r.display!=null?r.display:anInt(r.value)}${r.sub?` <span class="muted" style="font-weight:500">${esc(r.sub)}</span>`:''}</div></div>`).join('')+'</div>';
}
function anLine(series){
  const w=760,h=210,pad=26,n=series.length;
  if(!n)return '<div class="empty" style="padding:30px">No traffic recorded yet.</div>';
  const maxPv=Math.max(1,...series.map(s=>s.pv));
  const X=i=>pad+(w-2*pad)*(n<=1?0.5:i/(n-1));
  const Y=v=>(h-pad)-(h-2*pad)*(v/maxPv);
  const path=k=>series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(s[k]).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${(h-pad)} ${series.map((s,i)=>`L${X(i).toFixed(1)},${Y(s.pv).toFixed(1)}`).join(' ')} L${X(n-1).toFixed(1)},${(h-pad)} Z`;
  const dfmt=d=>{const p=d.split('-');return p[2]+'/'+p[1];};
  const ticks=[0,Math.floor((n-1)/2),n-1].filter((x,i,a)=>a.indexOf(x)===i);
  return `<div style="padding:8px 14px 4px">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="220" preserveAspectRatio="none" style="display:block">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e3e7e4"/>
      <path d="${area}" fill="rgba(20,179,125,.10)"/>
      <path d="${path('pv')}" fill="none" stroke="#14b37d" stroke-width="2.2"/>
      <path d="${path('vis')}" fill="none" stroke="#0f6b4f" stroke-width="2.2" stroke-dasharray="4 3"/>
      ${series.map((s,i)=>s.pv>0?`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.pv).toFixed(1)}" r="3.2" fill="#14b37d"/>`:'').join('')}
      <text x="${pad}" y="16" font-size="11" fill="#5f6f68">max ${maxPv}</text>
      ${ticks.map(i=>`<text x="${X(i).toFixed(1)}" y="${h-8}" font-size="10" fill="#5f6f68" text-anchor="middle">${dfmt(series[i].date)}</text>`).join('')}
    </svg>
    <div style="display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--muted);padding:2px 0 8px">
      <span><span style="display:inline-block;width:14px;height:3px;background:#14b37d;vertical-align:middle;margin-right:5px"></span>Page views</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:3px dashed #0f6b4f;vertical-align:middle;margin-right:5px"></span>Unique visitors</span>
    </div></div>`;
}
function anMatchProj(val,name,slug){
  if(!val)return false;const v=String(val).toLowerCase().trim();
  const nm=(name||'').toLowerCase().trim(),sl=(slug||'').toLowerCase().trim();
  if(nm&&(v===nm||v.includes(nm)||nm.includes(v)))return true;
  if(sl&&(v===sl||v.includes(sl)))return true;
  return false;
}
async function renderAnalytics(){
  const v=$('#view');

  v.innerHTML='<div class="muted" style="padding:8px">Loading analytics…</div>';
  const {since:sinceD,until:untilD,label:rangeLabel}=anRangeCalc();
  const since=sinceD.toISOString(),until=untilD.toISOString();
  const spanDays=Math.max(1,Math.round((untilD-sinceD)/864e5));
  const [evR,leadsR,purchR,webR,projR,intR]=await Promise.all([
    sb.from('analytics_events').select('event_id,session_id,visitor_hash,is_new_session,path,referrer_host,channel,utm_source,utm_campaign,country,device,browser,duration_ms,created_at,page_title').gte('created_at',since).lte('created_at',until).order('created_at',{ascending:false}).limit(50000),
    sb.from('leads').select('contact_id,project,source_page,type,created_at').gte('created_at',since).lte('created_at',until),
    sb.from('purchases').select('project,price,deposit_amount,status,created_at'),
    sb.from('webinar_registrations').select('call_booked,attended,created_at').gte('created_at',since).lte('created_at',until),
    sb.from('projects').select('name,slug,status,sort_order').order('sort_order',{ascending:true}),
    sb.from('analytics_interactions').select('kind,label,project,visitor_hash,created_at').gte('created_at',since).lte('created_at',until).limit(50000),
  ]);
  if(evR.error){v.innerHTML=`<div class="panel"><div class="empty">Couldn’t load analytics: ${esc(evR.error.message)}</div></div>`;return;}
  const ev=evR.data||[],leads=leadsR.data||[],webs=webR.data||[],projs=projR.data||[];
  const interactions=intR&&intR.data?intR.data:[];
  const _intGrp=k=>{const m={};interactions.filter(x=>x.kind===k).forEach(x=>{const l=x.label||'—';(m[l]=m[l]||{n:0,uv:new Set()});m[l].n++;if(x.visitor_hash)m[l].uv.add(x.visitor_hash);});return Object.entries(m).map(([label,x])=>({label,value:x.n,uv:x.uv.size})).sort((a,b)=>b.value-a.value);};
  const chapterViews=_intGrp('chapter'), faqViews=_intGrp('faq'), toolViews=[..._intGrp('tool'),..._intGrp('download')].sort((a,b)=>b.value-a.value);
  // brochure-only engagement (time spent on the /brochure pages, split out from the project page)
  const brochureEng=projs.map(pr=>{
    const slug=(pr.slug||'').toLowerCase();
    const bpv=slug?ev.filter(e=>(e.path||'').toLowerCase().indexOf('/'+slug+'/brochure')===0||(e.path||'').toLowerCase().includes('/'+slug+'/brochure')):[];
    const dd=bpv.map(e=>e.duration_ms).filter(d=>d>0);
    return {name:pr.name,views:bpv.length,uv:new Set(bpv.map(e=>e.visitor_hash).filter(Boolean)).size,avg:dd.length?dd.reduce((a,b)=>a+b,0)/dd.length:0};
  }).filter(r=>r.views>0).sort((a,b)=>b.views-a.views);
  const purch=(purchR.data||[]).filter(x=>x.created_at&&x.created_at>=since&&x.created_at<=until);

  const pageviews=ev.length;
  const visitors=new Set(ev.map(e=>e.visitor_hash).filter(Boolean)).size;
  const sessCounts={};ev.forEach(e=>{if(e.session_id)sessCounts[e.session_id]=(sessCounts[e.session_id]||0)+1;});
  const sessions=Object.keys(sessCounts).length;
  const bounces=Object.values(sessCounts).filter(c=>c===1).length;
  const durs=ev.map(e=>e.duration_ms).filter(d=>d>0);
  const avgDur=durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:0;

  // daily series across the selected range — keys in UTC to match event created_at (UTC)
  const byDay={};
  const dayKeys=[];
  let cur=new Date(sinceD.toISOString().slice(0,10)+'T00:00:00Z');
  const endD=new Date(untilD.toISOString().slice(0,10)+'T00:00:00Z');
  while(cur<=endD&&dayKeys.length<200){const d=cur.toISOString().slice(0,10);dayKeys.push(d);byDay[d]={date:d,pv:0,vis:new Set()};cur=new Date(cur.getTime()+864e5);}
  ev.forEach(e=>{const d=(e.created_at||'').slice(0,10);if(byDay[d]){byDay[d].pv++;if(e.visitor_hash)byDay[d].vis.add(e.visitor_hash);}});

  // top pages
  const pageMap={};
  ev.forEach(e=>{const p=e.path||'/';(pageMap[p]=pageMap[p]||{pv:0,vis:new Set(),dur:[],title:e.page_title});pageMap[p].pv++;if(e.visitor_hash)pageMap[p].vis.add(e.visitor_hash);if(e.duration_ms>0)pageMap[p].dur.push(e.duration_ms);});
  const pages=Object.entries(pageMap).map(([p,x])=>({path:p,pv:x.pv,vis:x.vis.size,avg:x.dur.length?x.dur.reduce((a,b)=>a+b,0)/x.dur.length:0})).sort((a,b)=>b.pv-a.pv).slice(0,12);

  // channels / referrers / campaigns / geo / devices
  const grp=(key,uniqKey)=>{const m={};ev.forEach(e=>{const k=e[key];if(!k)return;(m[k]=m[k]||new Set()).add(e[uniqKey]||Math.random());});return Object.entries(m).map(([k,s])=>({k,n:s.size})).sort((a,b)=>b.n-a.n);};
  const channels=grp('channel','session_id');
  const referrers=grp('referrer_host','session_id').slice(0,8);
  const campaigns=grp('utm_campaign','session_id').slice(0,8);
  const countries=grp('country','visitor_hash').slice(0,8);
  const devices=grp('device','session_id');
  const leadSrc=(()=>{const m={};leads.forEach(l=>{const k=l.source_page||'(unknown)';m[k]=(m[k]||0)+1;});return Object.entries(m).map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n).slice(0,8);})();

  // brochure sign-ups (leads via a /brochure page or brochure-type request)
  // A brochure / interest sign-up = any lead form fill (across every project), except the two action types.

  const brochure=leads.filter(l=>{const t=(l.type||'').toLowerCase();return t!=='reservation'&&t!=='dataroom_request';});
  // unique people who signed up (dedupe by contact) — a person who requests twice counts once

  const brByProj=(()=>{const m={};brochure.forEach(l=>{const k=l.project||'(onbekend)';m[k]=(m[k]||0)+1;});return Object.entries(m).map(([k,n])=>({label:k,value:n,display:anInt(n)})).sort((a,b)=>b.value-a.value);})();

  // funnel + revenue
  const nLeads=leads.length, nCalls=webs.filter(w=>w.call_booked).length, nPurch=purch.length;
  const revenue=purch.reduce((a,x)=>a+(Number(x.price)||0),0);
  const deposits=purch.reduce((a,x)=>a+(Number(x.deposit_amount)||0),0);
  const fmax=Math.max(1,visitors,nLeads,nCalls,nPurch);
  const fsteps=[{l:'Visitors',n:visitors,c:'#14b37d'},{l:'Leads / inquiries',n:nLeads,c:'#0f9d74'},{l:'Calls booked',n:nCalls,c:'#0c7a5b'},{l:'Purchases',n:nPurch,c:'#0c1a15'}];

  }).sort((a,b)=>b.views-a.views);

  html+=`<div class="panel" id="live_panel"><div class="panel-head"><div><h3><span class="live-dot"></span>Nu live op de site</h3><div class="desc">Bezoekers die nu actief zijn — op welke pagina en waar ze vandaan komen. Ververst automatisch elke 20 sec.</div></div></div><div id="live_visitors"><div class="muted" style="padding:8px 18px">Live bezoekers laden…</div></div></div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Recente bezoekers</h3><div class="desc">De laatste bezoekers — ook als ze al weg zijn. Met naam (indien aangemeld), locatie, pagina, duur en tijd.</div></div></div><div id="recent_visitors"><div class="muted" style="padding:8px 18px">Laden…</div></div></div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Traffic over time</h3><div class="desc">Page views and unique visitors per day.</div></div></div>${anLine(series)}</div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Conversion funnel to revenue</h3><div class="desc">From anonymous visitor to paying investor · ${esc(rangeLabel.toLowerCase())}.</div></div></div>
    <div class="funnel">${fsteps.map((s,i)=>{const prev=i?fsteps[i-1].n:0;const conv=i&&prev?` · ${anPct(Math.min(1,s.n/prev))} of previous`:'';return `<div class="fstep"><div class="fbar-wrap"><div class="fbar" style="width:${Math.max(8,s.n/fmax*100)}%;background:${s.c}">${anInt(s.n)}</div><div style="font-weight:650">${s.l}</div></div><div class="fmeta">${i===0?(visitors?'top of funnel':'—'):conv.replace(' · ','')}</div></div>`;}).join('')}</div>

let META_NAMES={};

    if(!want.length||!sb.functions||!sb.functions.invoke)return;

  }catch(e){}
}

const REV_BOOKED=['contracted','signed','completed','delivered','sold','paid','closed','won'];
const REV_PIPELINE=['reserved','reservation','option','pending','deposit','offer','negotiation','intent'];
const REV_LOST=['cancelled','canceled','refunded','lost','withdrawn','declined'];
function revClass(s){s=(s||'').toLowerCase().trim();if(REV_BOOKED.includes(s))return 'booked';if(REV_PIPELINE.includes(s))return 'pipeline';if(REV_LOST.includes(s))return 'lost';return 'other';}
function revBadgeClass(c){return c==='booked'?'green':c==='pipeline'?'blue':c==='lost'?'red':'grey';}
let REV_PROJ='';
async function renderRevenue(){
  const v=$('#view');v.innerHTML='<div class="muted" style="padding:8px">Loading revenue…</div>';
  const [projR,purR]=await Promise.all([
    sb.from('projects').select('name,slug,status,units_total,units_available,price_start,price_current,reservation_amount,sort_order').order('sort_order',{ascending:true}),
    sb.from('purchases').select('project,unit,buyer_name,status,price,deposit_amount,received_amount,contract_signed_at,created_at').order('contract_signed_at',{ascending:false,nullsFirst:false}),
  ]);
  if(purR.error){v.innerHTML=`<div class="panel"><div class="empty">Couldn’t load revenue: ${esc(purR.error.message)}</div></div>`;return;}
  const projs=projR.data||[],P=purR.data||[];
  P.forEach(x=>{x._c=revClass(x.status);x._p=Number(x.price)||0;x._d=Number(x.deposit_amount)||0;x._r=(x.received_amount==null)?null:Number(x.received_amount);});
  const sales=P.filter(x=>x._c!=='lost'&&x._c!=='pipeline');

  // per project: sold units & revenue come from actual deals (real per-unit prices); remaining from project inventory
  const rows=projs.map(pr=>{
    const deals=sales.filter(x=>anMatchProj(x.project,pr.name,pr.slug));
    const sold=deals.length, soldRev=deals.reduce((a,x)=>a+x._p,0);
    const dt=deals.filter(x=>x._r!=null);
    const recv=dt.reduce((a,x)=>a+x._r,0), toRecv=dt.reduce((a,x)=>a+Math.max(0,x._p-x._r),0);
    const untrk=deals.some(x=>x._r==null);
    const askPrice=Number(pr.price_current||pr.price_start)||0;
    const avail=(pr.units_available==null)?Math.max(0,(Number(pr.units_total)||sold)-sold):Number(pr.units_available);
    return {name:pr.name,slug:pr.slug,status:pr.status,sold,soldRev,recv,toRecv,untrk,askPrice,avail,
      remaining:avail*askPrice, total:sold+avail, avg:sold?soldRev/sold:0, deals};
  });
  // deals whose project isn't in the projects table
  const known=new Set(projs.map(p=>(p.name||'').toLowerCase()));
  const orphan=sales.filter(x=>!projs.some(pr=>anMatchProj(x.project,pr.name,pr.slug)));
  // Deals for projects not in the active projects table (e.g. earlier sold-out projects) — group by their own name.
  const orphanByName={};

  Object.keys(orphanByName).sort().forEach(nm=>{
    const ds=orphanByName[nm];const orv=ds.reduce((a,x)=>a+x._p,0);const odt=ds.filter(x=>x._r!=null);
    rows.push({name:nm,slug:null,status:'uitverkocht',sold:ds.length,soldRev:orv,recv:odt.reduce((a,x)=>a+x._r,0),toRecv:odt.reduce((a,x)=>a+Math.max(0,x._p-x._r),0),untrk:ds.some(x=>x._r==null),askPrice:0,avail:0,remaining:0,total:ds.length,avg:orv/ds.length,deals:ds});
  });

  // ----- project filter (dropdown at top): scope all figures to one project, or all -----
  const projNames=rows.map(r=>r.name);
  const selRow=REV_PROJ?rows.find(r=>r.name===REV_PROJ):null;
  if(REV_PROJ&&!selRow)REV_PROJ=''; // selected project no longer exists → reset to all
  const scopeRows=selRow?[selRow]:rows;
  const scopeSales=selRow?selRow.deals:sales;
  // all deals (incl. lost/pipeline) for the deals table, scoped to the selected project
  const dealProjName=x=>{const pr=projs.find(pp=>anMatchProj(x.project,pp.name,pp.slug));return pr?pr.name:(x.project||'Overig').trim();};
  const scopeAllDeals=selRow?P.filter(x=>dealProjName(x)===selRow.name):P;

  const totalRevenue=scopeSales.reduce((a,x)=>a+x._p,0);
  const totalSold=scopeSales.length;
  const remainingValue=scopeRows.reduce((a,r)=>a+r.remaining,0);
  const totalAvail=scopeRows.reduce((a,r)=>a+r.avail,0);
  const portfolioValue=totalRevenue+remainingValue;
  const avgPrice=totalSold?totalRevenue/totalSold:0;
  const sellThrough=(totalSold+totalAvail)?totalSold/(totalSold+totalAvail):0;
  // Funds received vs still to come (per-deal received_amount; deals without a figure are 'untracked')
  const tracked=scopeSales.filter(x=>x._r!=null), untracked=scopeSales.filter(x=>x._r==null);
  const received=tracked.reduce((a,x)=>a+x._r,0);
  const toReceive=tracked.reduce((a,x)=>a+Math.max(0,x._p-x._r),0);
  const untrackedVal=untracked.reduce((a,x)=>a+x._p,0);

  const kpis=[

    ['Nog te ontvangen',anMoney(toReceive),'openstaande termijnen · excl. voorraad','#b7791f'],
    ['Avg. sale price',totalSold?anMoney(avgPrice):'—','per sold unit'],
    ['Remaining inventory',anMoney(remainingValue),totalAvail+' units for sale'],
    ['Sell-through rate',anPct(sellThrough),totalSold+' of '+(totalSold+totalAvail)+' units'],
    ['Total portfolio value',anMoney(portfolioValue),'sold + remaining'],
  ];

  let html='';
  html+=`<div class="an-note">💰 <b>Deals to date</b> = contractwaarde van reeds verkochte units. <b>Ontvangen</b> = daarvan al binnengekomen. <b>Nog te ontvangen</b> = openstaande termijnen op díe verkochte units — dus <b>exclusief</b> nog te verkopen voorraad; de waarde van onverkochte units staat apart onder <b>Voorraad (te verkopen)</b>. Bron: <b>MASTER_MOKA_MAISON.xlsx</b> (Moneybird UTAMA + Maison + Privé) — laatste sync 31 jul 2026.${untrackedVal>0?` Let op: <b>${anMoney(untrackedVal)}</b> (${untracked.length} deal${untracked.length===1?'':'s'}) nog niet bijgehouden.`:''}</div>`;
  const revOpts=`<option value="">Alle projecten</option>`+projNames.map(n=>`<option value="${esc(n)}"${REV_PROJ===n?' selected':''}>${esc(n)}</option>`).join('');
  html+=`<div class="toolbar" style="margin:0 0 14px;display:flex;align-items:center;gap:10px"><label class="muted" style="font-size:13px;font-weight:600">Project</label><select id="rev_proj" style="padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;min-width:220px">${revOpts}</select>${selRow?`<span class="muted" style="font-size:13px">— alle cijfers hieronder tonen alleen <b>${esc(selRow.name)}</b></span>`:''}</div>`;
  html+='<div class="cards">'+kpis.map(k=>`<div class="stat"><div class="k">${k[0]}</div><div class="v"${k[3]?` style="color:${k[3]}"`:''}>${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')+'</div>';

  html+=`<div class="panel"><div class="panel-head"><div><h3>Land lease — privé (30%)</h3><div class="desc">30% van de totale dealwaarde die jij privé ontvangt als land lease — conform MASTER_MOKA_MAISON.xlsx.</div></div></div>
    <div class="rev-row"><div><div class="rk">Reeds ontvangen</div><div class="rv" style="color:#0f9d74">${anMoney(Math.round(received*0.3))}</div></div><div><div class="rk">Nog te ontvangen</div><div class="rv" style="color:#b7791f">${anMoney(Math.round(toReceive*0.3))}</div></div><div><div class="rk">Totaal potentieel</div><div class="rv">${anMoney(Math.round((received+toReceive)*0.3))}</div></div></div></div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Revenue by project</h3><div class="desc">Gerealiseerde omzet uit verkochte units, plus resterende voorraadwaarde.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Project</th><th>Status</th><th>Units sold</th><th>Deal value</th><th>Ontvangen</th><th>Nog te ontvangen</th><th>Voorraad (te verkopen)</th></tr></thead><tbody>
    ${scopeRows.length?scopeRows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.status?`<span class="badge grey">${esc(p.status)}</span>`:'—'}</td><td>${anInt(p.sold)} / ${anInt(p.total)}</td><td><b>${p.soldRev?anMoney(p.soldRev):'—'}</b></td><td style="color:#0f9d74">${p.recv?anMoney(p.recv):(p.untrk?'<span class="muted">n.v.t.</span>':'—')}</td><td style="color:#b7791f">${p.toRecv?anMoney(p.toRecv):(p.untrk&&!p.recv?'<span class="muted">n.v.t.</span>':'—')}</td><td>${p.remaining?anMoney(p.remaining):'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No projects yet.</td></tr>'}
    </tbody><tfoot><tr style="font-weight:750;background:#fafbfa"><td>Total</td><td></td><td>${anInt(totalSold)} / ${anInt(totalSold+totalAvail)}</td><td>${anMoney(totalRevenue)}</td><td style="color:#0f9d74">${anMoney(received)}</td><td style="color:#b7791f">${anMoney(toReceive)}</td><td>${anMoney(remainingValue)}</td></tr></tfoot></table></div></div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Ontvangen per project</h3><div class="desc">Geld dat al binnen is.</div></div></div>${anBars(scopeRows.filter(r=>r.recv>0).map(r=>({label:r.name,value:r.recv,display:anMoney(r.recv),sub:'· van '+anMoney(r.soldRev)})),'#0f9d74')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Nog te ontvangen per project</h3><div class="desc">Resterende contracttermijnen die nog binnen moeten komen.</div></div></div>${anBars(scopeRows.filter(r=>r.toRecv>0).map(r=>({label:r.name,value:r.toRecv,display:anMoney(r.toRecv),sub:'· van '+anMoney(r.soldRev)})),'#b7791f')}</div>
  </div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Deal value by project</h3><div class="desc">Contractwaarde uit verkochte units.</div></div></div>${anBars(scopeRows.filter(r=>r.soldRev>0).map(r=>({label:r.name,value:r.soldRev,display:anMoney(r.soldRev),sub:'· '+r.sold+' sold'})),'#14b37d')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Remaining inventory value</h3><div class="desc">Nog te verkopen voorraad × vraagprijs.</div></div></div>${anBars(scopeRows.filter(r=>r.remaining>0).map(r=>({label:r.name,value:r.remaining,display:anMoney(r.remaining),sub:'· '+r.avail+' left'})),'#b7791f')}</div>

  const recent=scopeAllDeals.slice(0,40);
  html+=`<div class="panel"><div class="panel-head"><div><h3>Deals (${scopeAllDeals.length})</h3><div class="desc">Verkochte units — wie kocht welke villa, voor welke prijs en wanneer.</div></div></div>

async function renderResource(resKey,mount){
  const R=RES[resKey];const editable=canEdit(R.page)&&!R.readOnly;const canCreate=editable&&!R.noCreate;
  mount.innerHTML=`<div class="panel"><div class="panel-head"><div><h3>${R.title} <span class="count-pill" id="cnt_${resKey}">…</span></h3><div class="desc">${R.desc||''}</div></div>

    <div class="table-wrap" id="tw_${resKey}"><div class="empty">Loading…</div></div></div>`;
  const ob=R.orderBy||'created_at';
  const {data,error}=await sb.from(R.table).select('*').order(ob,{ascending:!!R.asc,nullsFirst:false});
  if(error){$('#tw_'+resKey).innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`;const c=$('#cnt_'+resKey);if(c)c.textContent='!';return;}

function drawTable(resKey){
  const R=RES[resKey];const editable=canEdit(R.page)&&!R.readOnly;
  const q=($('#search_'+resKey)?.value||'').toLowerCase();
  let rows=_cache[resKey]||[];
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  const tw=$('#tw_'+resKey);if(!tw)return;
  if(!rows.length){tw.innerHTML='<div class="empty">No records'+(q?' match your search.':' yet.')+'</div>';return;}
  let h='<table><thead><tr>';
  R.cols.forEach(c=>{const def=R.fields.find(f=>f.k===c);h+=`<th>${esc(def?def.label:c)}</th>`;});
  h+='<th style="text-align:right">'+(editable?'Actions':'')+'</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+=`<tr data-row="${r.id}" style="cursor:pointer">`;R.cols.forEach(c=>{h+=`<td>${cell(resKey,c,r)}</td>`;});
    h+='<td><div class="row-actions">';
    if(editable){h+=`<button class="btn btn-ghost btn-sm" data-edit="${r.id}">Open</button><button class="btn btn-danger btn-sm" data-del="${r.id}">Delete</button>`;}
    h+='</div></td></tr>';
  });
  h+='</tbody></table>';tw.innerHTML=h;
  tw.querySelectorAll('tr[data-row]').forEach(tr=>tr.onclick=(e)=>{if(e.target.closest('.row-actions'))return;openForm(resKey,rows.find(x=>String(x.id)===tr.dataset.row));});
  tw.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(resKey,rows.find(x=>String(x.id)===b.dataset.edit)));
  tw.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRecord(resKey,b.dataset.del));
}
async function delRecord(resKey,id){
  const R=RES[resKey];
  if(!confirm('Delete this '+R.single.toLowerCase()+'? This changes your live data and cannot be undone.'))return;
  const {error}=await sb.from(R.table).delete().eq('id',id);
  if(error)return toast(error.message,'err');
  toast(R.single+' deleted','ok');
  _cache[resKey]=(_cache[resKey]||[]).filter(x=>String(x.id)!==String(id));
  const _ce=$('#cnt_'+resKey);if(_ce)_ce.textContent=_cache[resKey].length;drawTable(resKey);
}

async function openForm(resKey,row){
  const R=RES[resKey];const ro=!!R.readOnly;const isEdit=!!row;row=row||{};
  const editFields=R.fields.filter(f=>!f.ro||isEdit);
  let body='';
  if(ro)body+=`<div class="lock-note" style="margin-bottom:16px">🔒 View only. Project data is changed via Claude so it stays in sync everywhere (utamabali.com, invest. and the brochures).</div>`;
  body+='<div class="grid2">';
  editFields.forEach(f=>{
    const full=(f.type==='textarea'||f.type==='tags')?' style="grid-column:1/-1"':'';
    const val=row[f.k];const dis=(f.ro||ro)?' disabled':'';
    let input='';
    if(f.type==='textarea')input=`<textarea id="f_${f.k}" rows="3"${dis}>${esc(val||'')}</textarea>`;
    else if(f.type==='select')input=`<select id="f_${f.k}"${dis}><option value="">—</option>`+f.opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')+`</select>`;
    else if(f.type==='bool')input=`<select id="f_${f.k}"${dis}><option value="false" ${!val?'selected':''}>No</option><option value="true" ${val?'selected':''}>Yes</option></select>`;
    else if(f.type==='tags')input=`<input id="f_${f.k}" value="${esc((val||[]).join(', '))}"${dis}>`;
    else if(f.type==='number')input=`<input id="f_${f.k}" type="number" step="any" value="${val==null?'':esc(val)}"${dis}>`;
    else if(f.type==='date')input=`<input id="f_${f.k}" type="date" value="${val?String(val).slice(0,10):''}"${dis}>`;
    else if(f.type==='datetime')input=`<input id="f_${f.k}" type="datetime-local" value="${toLocalInput(val)}"${dis}>`;
    else input=`<input id="f_${f.k}" value="${esc(val==null?'':val)}"${dis}>`;
    body+=`<div class="field"${full}><label>${esc(f.label)}${f.req?' *':''}</label>${input}</div>`;
  });
  body+='</div>';
  if(ro){
    if(resKey==='projects'&&isEdit)body+=`<div id="proj_purchases" style="margin-top:20px"><div class="muted" style="font-size:13px">Aankopen laden…</div></div>`;
    showDetail(`${esc(R.single)}${row[R.fields[0].k]?' · '+esc(row[R.fields[0].k]):''}`,body);
    if(resKey==='projects'&&isEdit){
      const {data:pp}=await sb.from('purchases').select('buyer_name,unit,price,status,contract_signed_at,created_at').eq('project',row.name).order('contract_signed_at',{ascending:false,nullsFirst:false});
      const el=$('#proj_purchases');
      if(el){const list=pp||[];
        el.innerHTML=_sec('Aankopen ('+list.length+')',list.length?_mt(['Koper','Unit','Prijs','Datum'],list.map(x=>[`<b>${esc(x.buyer_name||'—')}</b>`,esc(x.unit||'—'),money(x.price),fmtDate(x.contract_signed_at||x.created_at)])):'<div class="muted" style="font-size:13px">Nog geen aankopen voor dit project.</div>');
      }
    }
    return;
  }
  showModal(`${isEdit?'Edit':'New'} ${R.single}`,body,async()=>{
    const payload={};let ok=true;
    R.fields.filter(f=>!f.ro).forEach(f=>{
      const e=$('#f_'+f.k);if(!e)return;let v=e.value;
      if(f.type==='tags')v=v.split(',').map(s=>s.trim()).filter(Boolean);
      else if(f.type==='bool')v=(v==='true');
      else if(f.type==='number')v=v===''?null:Number(v);
      else if(f.type==='datetime')v=v?new Date(v).toISOString():null;
      else if(f.type==='date')v=v||null;
      else v=v===''?null:v;
      if(f.req&&(v==null||v===''))ok=false;
      payload[f.k]=v;
    });
    if(!ok){toast('Please fill in required fields','err');return false;}
    let res;
    if(isEdit)res=await sb.from(R.table).update(payload).eq('id',row.id).select().single();
    else res=await sb.from(R.table).insert(payload).select().single();
    if(res.error){toast(res.error.message,'err');return false;}
    toast(R.single+(isEdit?' updated':' created'),'ok');
    if(isEdit)_cache[resKey]=(_cache[resKey]||[]).map(x=>String(x.id)===String(row.id)?res.data:x);
    else _cache[resKey]=[res.data,...(_cache[resKey]||[])];

let PEOPLE=[];
async function renderPeople(){
  const v=$('#view');
  v.innerHTML=`<div id="people_banner"></div><div class="panel"><div class="panel-head"><div><h3>People <span class="count-pill" id="cnt_people">…</span></h3><div class="desc">One record per email — click a person for all their data, activity & history.</div></div><div class="toolbar"><input class="search" id="search_people" placeholder="Search people…"></div></div><div class="table-wrap" id="tw_people"><div class="empty">Loading…</div></div></div>`;
  const [cr,lr,dr,rv]=await Promise.all([
    sb.from('contacts').select('*').order('last_activity_at',{ascending:false,nullsFirst:false}),
    sb.from('leads').select('id,contact_id,type,project,unit,source_page,created_at,handled_at'),
    sb.from('dataroom_access').select('contact_id,contact_email,project,granted_at'),
    sb.from('reservations').select('id,contact_id,email,project,unit,deposit_amount,status,itp_signed_at,itp_signer_name,payment_status'),
  ]);
  if(cr.error){$('#tw_people').innerHTML='<div class="empty">'+esc(cr.error.message)+'</div>';return;}
  const byC={};(lr.data||[]).forEach(l=>{(byC[l.contact_id]=byC[l.contact_id]||[]).push(l);});
  const drById={},drByEmail={};(dr.data||[]).forEach(x=>{if(x.contact_id)(drById[x.contact_id]=drById[x.contact_id]||[]).push(x);const e=(x.contact_email||'').toLowerCase();if(e)(drByEmail[e]=drByEmail[e]||[]).push(x);});
  const rvById={},rvByEmail={};(rv.data||[]).forEach(x=>{if(x.contact_id)(rvById[x.contact_id]=rvById[x.contact_id]||[]).push(x);const e=(x.email||'').toLowerCase();if(e)(rvByEmail[e]=rvByEmail[e]||[]).push(x);});
  const now=Date.now(),WK=7*864e5;
  PEOPLE=(cr.data||[]).map(c=>{
    const leads=byC[c.id]||[];
    const dra=[...(drById[c.id]||[]),...(drByEmail[(c.email||'').toLowerCase()]||[])];
    const grantedProj=new Set(dra.filter(x=>x.granted_at).map(x=>(x.project||'').toLowerCase()));
    // OPEN action items — persist until handled_at is set (dataroom also closes when access granted)
    const items=[];
    leads.filter(l=>!l.handled_at).forEach(l=>{
      if(l.type==='dataroom_request'&&!grantedProj.has((l.project||'').toLowerCase()))
        items.push({kind:'dataroom',leadId:l.id,project:l.project||'',unit:l.unit||'',at:l.created_at});
      else if(l.type==='reservation')
        items.push({kind:'reservation',leadId:l.id,project:l.project||'',unit:l.unit||'',at:l.created_at});
    });
    const myRes=[...(rvById[c.id]||[]),...(rvByEmail[(c.email||'').toLowerCase()]||[])];
    const seenRv=new Set();
    myRes.forEach(rvw=>{
      if(seenRv.has(rvw.id))return;seenRv.add(rvw.id);
      const paid=(rvw.status==='deposit_paid'||rvw.payment_status==='paid');
      if(paid)return;
      if(rvw.payment_status==='transfer_reported')
        items.push({kind:'deposit',resId:rvw.id,project:rvw.project||'',unit:rvw.unit||'',amount:rvw.deposit_amount,at:rvw.itp_signed_at});
      else if(rvw.itp_signed_at)
        items.push({kind:'itp',resId:rvw.id,project:rvw.project||'',unit:rvw.unit||'',amount:rvw.deposit_amount,at:rvw.itp_signed_at});
    });
    const newestLead=leads.reduce((m,l)=>Math.max(m,l.created_at?new Date(l.created_at).getTime():0),0);
    const lastAct=c.last_activity_at?new Date(c.last_activity_at).getTime():0;
    return {...c,_leads:leads,_items:items,
      _pending:items.filter(i=>i.kind==='dataroom').map(i=>i.project),
      _resv:items.filter(i=>i.kind==='reservation'),
      _itp:items.filter(i=>i.kind==='itp').length,
      _deposit:items.filter(i=>i.kind==='deposit').length,
      _isNew:(now-Math.max(lastAct,newestLead))<WK,_activeDr:grantedProj.size};
  });
  const cel=$('#cnt_people');if(cel)cel.textContent=PEOPLE.length;
  drawRecentSignups();
  drawPeople();
  warmthLoad(PEOPLE.map(p=>p.id)).then(()=>{if(CURRENT==='leads')drawPeople();});
  $('#search_people').addEventListener('input',drawPeople);
  if(PENDING_OPEN_PERSON){const p=PEOPLE.find(x=>x.id===PENDING_OPEN_PERSON);PENDING_OPEN_PERSON=null;if(p)openPerson(p);}
}
let SIGNUPS_LIMIT=25,SIGNUPS_DAYS=null;

  if(SIGNUPS_DAYS){const cut=Date.now()-SIGNUPS_DAYS*864e5;bro=bro.filter(x=>{const t=x.created_at?new Date(x.created_at).getTime():0;return t&&t>=cut;});}
  bro.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));

  if(!shown.length)h+='<tr><td colspan="5" class="empty">Geen brochure-aanvragen in deze periode.</td></tr>';
  shown.forEach(l=>{
    h+=`<tr data-openp="${l.pid}" style="cursor:pointer"><td><b>${esc(l.who||'—')}</b>${l._n>1?` <span class="badge grey" title="Aantal aanvragen">${l._n}×</span>`:''}</td><td>${l.email?`<a href="mailto:${esc(l.email)}" onclick="event.stopPropagation()">${esc(l.email)}</a>`:'—'}</td><td>${l.phone?`<a href="https://wa.me/${(l.phone||'').replace(/[^0-9]/g,'')}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:#0f6b4f">${esc(l.phone)}</a>`:'—'}</td><td>${esc(l.project||'—')}</td><td>${fmtDateTime(l.created_at)}</td></tr>`;

  h+='</div>';
  el.innerHTML=h;
  const sel=$('#signups_limit');if(sel)sel.onchange=()=>{SIGNUPS_LIMIT=Number(sel.value);drawRecentSignups();};
  const per=$('#signups_period');if(per)per.onchange=()=>{SIGNUPS_DAYS=per.value?Number(per.value):null;drawRecentSignups();};

async function loadActionItems(){
  const [lr,rr,dr]=await Promise.all([
    sb.from('leads').select('id,contact_id,type,project,unit,created_at,handled_at,name,email,phone').in('type',['dataroom_request','reservation']).order('created_at',{ascending:false}),
    sb.from('reservations').select('id,contact_id,email,name,project,unit,deposit_amount,status,itp_signed_at,payment_status,paid_at,cleared_at,updated_at').order('updated_at',{ascending:false}),
    sb.from('dataroom_access').select('contact_id,contact_email,project,granted_at'),
  ]);
  const granted=new Set();(dr.data||[]).forEach(x=>{if(!x.granted_at)return;const p=(x.project||'').toLowerCase();if(x.contact_id)granted.add(x.contact_id+'|'+p);if(x.contact_email)granted.add((x.contact_email||'').toLowerCase()+'|'+p);});
  const open=[],done=[];
  (lr.data||[]).forEach(l=>{
    const base={src:'lead',id:l.id,contact_id:l.contact_id,who:l.name||l.email||'—',email:l.email,project:l.project||'',unit:l.unit||'',at:l.created_at};
    if(l.type==='dataroom_request'){
      const g=granted.has(l.contact_id+'|'+(l.project||'').toLowerCase())||granted.has((l.email||'').toLowerCase()+'|'+(l.project||'').toLowerCase());
      if(l.handled_at||g)done.push({...base,kind:'dataroom',doneAt:l.handled_at});else open.push({...base,kind:'dataroom'});
    }else{
      if(l.handled_at)done.push({...base,kind:'reservation',doneAt:l.handled_at});else open.push({...base,kind:'reservation'});
    }
  });
  (rr.data||[]).forEach(r=>{
    const paid=(r.status==='deposit_paid'||r.payment_status==='paid');
    const base={src:'resv',id:r.id,contact_id:r.contact_id,who:r.name||r.email||'—',email:r.email,project:r.project||'',unit:r.unit||'',amount:r.deposit_amount,at:r.itp_signed_at||r.updated_at};
    if(!paid&&!r.cleared_at&&r.payment_status==='transfer_reported')open.push({...base,kind:'deposit'});
    else if(!paid&&!r.cleared_at&&r.itp_signed_at)open.push({...base,kind:'itp'});
    else if((paid||r.cleared_at)&&(r.itp_signed_at||r.payment_status))done.push({...base,kind:paid?'deposit_paid':'itp',doneAt:r.paid_at||r.cleared_at});
  });
  open.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  done.sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  return {open,done};
}

/* Time-of-day greeting based on the lead's timezone (derived from phone country code). */
function _greetForPhone(phone){
  const d=(phone||'').replace(/[^0-9+]/g,'');
  let tz='Europe/Amsterdam';
  const map=[['+351','Europe/Lisbon'],['+971','Asia/Dubai'],['+62','Asia/Makassar'],['+49','Europe/Berlin'],['+32','Europe/Brussels'],['+44','Europe/London'],['+41','Europe/Zurich'],['+43','Europe/Vienna'],['+33','Europe/Paris'],['+34','Europe/Madrid'],['+65','Asia/Singapore'],['+66','Asia/Bangkok'],['+61','Australia/Sydney'],['+1','America/New_York'],['+31','Europe/Amsterdam']];
  for(const [cc,z] of map){ if(d.startsWith(cc)){tz=z;break;} }
  let hr=12;
  try{ hr=Number(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'numeric',hour12:false}).format(new Date())); }catch(e){}
  if(hr>=6&&hr<12)return 'Goedemorgen';
  if(hr>=12&&hr<18)return 'Goedemiddag';
  return 'Goedenavond';
}
/* Fallback country from phone country code (when no IP/session location is available). */
function _countryFromPhone(phone){
  const d=(phone||'').replace(/[^0-9+]/g,'');
  if(!d)return '';
  const map=[['+351','Portugal'],['+971','UAE'],['+62','Indonesia'],['+49','Germany'],['+32','Belgium'],['+44','United Kingdom'],['+41','Switzerland'],['+43','Austria'],['+33','France'],['+34','Spain'],['+65','Singapore'],['+66','Thailand'],['+61','Australia'],['+1','United States'],['+31','Netherlands']];
  for(const [cc,name] of map){ if(d.startsWith(cc))return name; }
  if(/^0[1-9]/.test(d))return 'Netherlands'; // Dutch national format (06…, 0…)
  return '';
}
/* Build a WhatsApp deep-link with a personal opening message for a new sign-up. */
/* Normalise a phone to WhatsApp international digits (no +). Returns '' if not a plausible number. */
function _waDigits(phone){
  let d=(phone||'').replace(/[^0-9]/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);            // 00 international prefix
  else if(d.startsWith('0'))d='31'+d.replace(/^0+/,''); // Dutch national 06…/0… -> +31
  if(d.length<9||d.length>15)return '';          // implausible / truncated
  return d;
}
function _helloWaUrl(phone,name,project){
  const digits=_waDigits(phone);
  if(!digits)return '';                           // no valid number -> no link (avoids WhatsApp contact-picker)
  const first=(name||'').trim().split(/\s+/)[0]||'';
  const sender=(ME&&(ME.full_name||ME.email))||'UTAMA Bali';
  const title=(ME&&ME.title)?(', '+ME.title):'';
  const greet=_greetForPhone(phone);
  const hi=first?`${greet} ${first},`:`${greet},`;
  const projPhrase=project?`ons project, ${project}`:'ons project';
  const msg=`${hi} dit is ${sender}${title}. We hebben zojuist een aanmelding ontvangen voor ${projPhrase}. Klopt dat?\n\nIk stuur na iedere aanmelding altijd even persoonlijk een bericht om kennis te maken.`;
  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(msg);
}

}

function downloadItpPdf(r){
  if(!window.jspdf){toast('PDF-bibliotheek nog aan het laden, probeer zo nog eens','err');return;}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  const M=56;let y=64;const W=doc.internal.pageSize.getWidth()-M*2;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('UTAMA — Intentieverklaring tot aankoop',M,y);y+=26;
  doc.setFontSize(10.5);doc.setTextColor(30);
  const body=htmlToPlain(itpToHtml(r.itp_body)||itpDraft(r));
  const lines=['Opgesteld op '+new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}),'',...body.split('\n')];
  if(r.itp_signed_at)lines.push('','ONDERTEKENING','Digitaal ondertekend door: '+(r.itp_signer_name||''),'Datum: '+fmtDateTime(r.itp_signed_at),'Verificatie-hash: '+(r.itp_hash||''));
  lines.forEach(t=>{doc.setFont('helvetica',isHeadingLine(t)?'bold':'normal');const w=doc.splitTextToSize(t,W);w.forEach(x=>{if(y>790){doc.addPage();y=64;}doc.text(x,M,y);y+=15;});});
  doc.save('ITP-'+((r.project||'')+'-'+(r.unit||'')).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf');
  toast('ITP-PDF gedownload','ok');
}
async function sendReservation(r,person,via){

    const digits=((r.phone||person.phone||'')+'').replace(/[^0-9]/g,'');

  else{try{navigator.clipboard.writeText(msg+'\n'+link);}catch(e){}toast('Pop-up geblokkeerd — bericht + link zijn gekopieerd, plak ze in '+(via==='whatsapp'?'WhatsApp':'je e-mail'),'err');}

async function renderPipeline(){
