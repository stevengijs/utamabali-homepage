/* ================= BROADCAST =================
   Campagnes naar de geimporteerde adressenlijst (broadcast_contacten).

   Waarom een aparte tabel en pagina: dit zijn geen lopende verkooptrajecten.
   Alles wat in contacts belandt wordt door pipeline_sync_contact opgepikt en
   krijgt een kaart in Discovery. Deze lijst staat er fysiek buiten, dus dat kan
   niet per ongeluk gebeuren.

   Twee dingen die de vorm bepalen:
   - De lijst kwam oorspronkelijk uit meerdere bedrijven (StevenExits, Yep,
     TinnitusRescue). Die zijn eruit gehaald, dus alles hier is UTAMA en een
     herkomstkeuze is overbodig geworden. Het veld bron_bedrijf en het filter
     erop staan nog wel in de database, zodat de scheiding terug is als er ooit
     weer een andere lijst bij komt.
   - Deze leads gaven vooral een telefoonnummer, geen e-mail (bij MOKA 3BR is dat
     1 tegen 84). Standaard filteren op "heeft e-mail" verbergt tweederde, dus
     het kanaal is een expliciete keuze.

   Verzenden gebeurt op een vastgelegde ontvangerslijst, niet op de filters.
   Wat je op het scherm afvinkt is precies wat er uitgaat. */
let BC = {fac:null, sjablonen:[],
          bronnen:[], funnels:[], projecten:[], banden:[], timings:[], talen:[],
          vastgoed:[], doelen:[], statussen:[], temperaturen:[], account:[], klant:[],
          periode:'', kanaal:'email', lijstOpen:false, zoek:'',
          verzendKanaal:'email', waTpls:null, waStatus:null, waTpl:null, waTplNaam:null, waVars:[], golf:40, waGolven:0,
          sel:null, uit:new Set(), open:new Set(), ddOpen:null, camp:null, stap:'kiezen'};

const bcArg = a => a && a.length ? a : null;
const bcFilters = () => ({
  bronnen:bcArg(BC.bronnen), funnels:bcArg(BC.funnels), projecten:bcArg(BC.projecten),
  banden:bcArg(BC.banden), timings:bcArg(BC.timings), talen:bcArg(BC.talen),
  vastgoed:bcArg(BC.vastgoed), doelen:bcArg(BC.doelen), statussen:bcArg(BC.statussen),
  temperaturen:bcArg(BC.temperaturen), account:bcArg(BC.account), klant:bcArg(BC.klant),
  periode:BC.periode||null, kanaal:BC.kanaal});

/* De groepen met aanvinkvakjes, in schermvolgorde. Kanaal en periode staan er
   niet bij: dat zijn enkele keuzes met hun eigen stukje staat. */
const BC_GROEPEN = ['bronnen','funnels','projecten','banden','timings','doelen',
                    'vastgoed','statussen','temperaturen','account','klant','talen'];
const bcActieveFilters = () =>
  BC_GROEPEN.reduce((n,g)=>n+BC[g].length,0) + (BC.periode?1:0);

/* De drie bronnen gebruiken elk hun eigen woorden voor dezelfde dingen. In de
   database staan ze vertaald naar één sleutel; hier staat hoe die sleutel op
   het scherm heet. */
const BC_LABELS = {
  bronnen:      {perspective:'Perspective', facebook:'Facebook', portaal:'Portaal'},
  timings:      {nu:'Direct', weken:'Binnen enkele weken', '3mnd':'Binnen 3 maanden',
                 enkele_mnd:'Over enkele maanden', '6mnd':'Binnen 6 maanden',
                 '12mnd':'Binnen 12 maanden', later:'Over een jaar of later',
                 orienterend:'Oriënteert zich', onbekend:'Weet het nog niet'},
  doelen:       {wonen:'Wonen', flippen:'Flippen', verhuur:'Verhuur', gemengd:'Gemengd'},
  vastgoed:     {ja:'Ja, kocht al eerder', nee:'Nee, eerste keer'},
  statussen:    {open:'Open', won:'Gewonnen', lost:'Verloren', abandoned:'Doodgebloed'},
  temperaturen: {hot:'Hot', warm:'Warm', cold:'Cold'},
  // "Portaalaccount" las als "staat in het portaal", en dat doen ze allemaal.
  // Het gaat erom of iemand ooit een inloglink heeft aangevraagd; dat gebeurt
  // alleen voor de dataroom.
  account:      {ja:'Heeft ingelogd', nee:'Nog nooit ingelogd'},
  klant:        {ja:'Is al klant', nee:'Nog geen klant'},
  talen:        {nl:'Nederlands', en:'Engels'},
};
const bcLabel = (groep, waarde) =>
  (BC_LABELS[groep] && BC_LABELS[groep][waarde]) || String(waarde);

const bcDatum = d => !d ? '' : new Date(d).toLocaleDateString('nl-NL',
  {day:'numeric', month:'short', year:'numeric'});

/* Zoeken binnen de selectie die de filters al hebben opgeleverd. Bewust
   alleen in de weergave: het verandert niet wie er meegaat, alleen wat je op
   dit moment ziet. Anders zou je bij het opzoeken van één persoon je hele
   verzendlijst inperken zonder het door te hebben. */
function bcPastBijZoek(x, q){
  if(!q) return true;
  if(String(x.naam||'').toLowerCase().includes(q)) return true;
  if(String(x.email||'').toLowerCase().includes(q)) return true;
  const cijfers = q.replace(/[^0-9]/g,'');
  if(cijfers.length >= 3){
    const tel = String(x.telefoon||'').replace(/[^0-9]/g,'');
    // Wie 06-12345678 intikt moet ook +31 6 12345678 vinden, en andersom.
    const varianten = [cijfers];
    if(cijfers.startsWith('0'))  varianten.push('31'+cijfers.slice(1));
    if(cijfers.startsWith('31')) varianten.push('0'+cijfers.slice(2));
    if(varianten.some(v=>tel.includes(v))) return true;
  }
  return false;
}
const bcZichtbaar = () => ((BC.sel&&BC.sel.rijen)||[]).filter(x=>bcPastBijZoek(x, BC.zoek));

/* Het gezochte stukje oplichten in de tabel, zodat je meteen ziet waarom een
   regel er staat. */
function bcMarkeer(tekst, q){
  const t = String(tekst==null?'':tekst);
  if(!q) return esc(t);
  const i = t.toLowerCase().indexOf(q);
  if(i < 0) return esc(t);
  return esc(t.slice(0,i))+'<span class="bc-treffer">'+esc(t.slice(i,i+q.length))+'</span>'+esc(t.slice(i+q.length));
}

/* de contacten die daadwerkelijk meegaan: selectie min de afgevinkte */
const bcGekozen = () => ((BC.sel&&BC.sel.rijen)||[]).filter(r=>!BC.uit.has(r.id));
const bcMailbaar = () => bcGekozen().filter(r=>r.email);

/* Dezelfde toets als broadcast_nep_nummer() in de database. Invulnummers als
   +31 6 12345678 en 06-11111111 staan echt in de data; die kosten je
   kwaliteitsscore bij Meta zonder ooit aan te komen. */
function bcNepNummer(t){
  const d=String(t||'').replace(/[^0-9]/g,'');
  return !d || d.length<9 || /^\d{1,3}(\d)\1{6,}$/.test(d)
      || d.includes('123456') || d.includes('000000')
      || d.includes('111111') || d.includes('654321');
}
const bcAppbaar = () => bcGekozen().filter(r=>!bcNepNummer(r.telefoon));
const bcOntvangers = () => BC.verzendKanaal==='whatsapp' ? bcAppbaar() : bcMailbaar();

/* Een facet uit broadcast_facetten omzetten naar keuzes voor een dropdown. De
   volgorde die de database geeft blijft staan: koopmoment komt chronologisch
   binnen, niet op aantal, en dat wil je zo houden.

   Het getal achter een keuze is ALTIJD het totaal aantal contacten. Eerder
   toonde hij het aantal dat via het gekozen kanaal bereikbaar is, en dan las
   "Utama Investment Funnel 67" als "er zijn maar 67 leads" terwijl het er 117
   zijn waarvan 67 met e-mailadres. Bereikbaarheid staat apart, in het groene
   getal ernaast. */
const bcFacet = (lijst, groep) => (lijst||[]).map(f=>({
  waarde:String(f.waarde), label:bcLabel(groep, f.waarde),
  n:f.n, met_email:f.met_email, met_tel:f.met_tel}));

function bcDD(groep, label, opties, gekozen, enkel){
  const gekozenOpties = opties.filter(o=>gekozen.includes(o.waarde));
  const samenvatting = !gekozenOpties.length ? 'alles'
    : gekozenOpties.length===1 ? gekozenOpties[0].label
    : gekozenOpties.length+' gekozen';
  const titel = gekozenOpties.length>1 ? gekozenOpties.map(o=>o.label).join(', ') : '';
  const rijen = opties.map(o=>{
    const aan = gekozen.includes(o.waarde);
    let bereik = '';
    if(o.n!=null && BC.kanaal!=='alles'){
      const b = BC.kanaal==='telefoon' ? o.met_tel
              : BC.kanaal==='email' ? o.met_email
              : Math.min(o.met_email,o.met_tel);
      if(b<o.n) bereik = `<span class="bc-ddb" title="hiervan bereikbaar via het gekozen kanaal">${b}</span>`;
    }
    return `<label class="bc-ddopt">`+
      `<input type="${enkel?'radio':'checkbox'}" name="bcdd_${groep}" data-groep="${groep}" data-w="${esc(o.waarde)}" ${aan?'checked':''}>`+
      `<span class="bc-ddtxt">${esc(o.label)}</span>`+
      (o.n==null?'':`<span class="bc-ddn">${o.n}</span>${bereik}`)+`</label>`;
  }).join('');
  if(!rijen) return '';
  return `<div class="bc-dd" data-dd="${groep}">
    <button type="button" class="bc-ddknop ${gekozenOpties.length&&!enkel?'actief':''}"${titel?` title="${esc(titel)}"`:''}>
      <span class="bc-ddlab">${esc(label)}</span>
      <span class="bc-ddwaarde">${esc(samenvatting)}</span>
      <span class="bc-ddcar">&#9660;</span></button>
    <div class="bc-ddmenu">${rijen}${enkel?'':
      `<div class="bc-ddvoet"><button type="button" class="bc-ddlink" data-wis="${groep}">Wis deze keuze</button></div>`}
    </div></div>`;
}

function bcFilterHtml(){
  const fac = BC.fac;
  const kanalen = [['email','heeft e-mail'],['telefoon','heeft telefoonnummer'],
                   ['beide','heeft allebei'],['alles','maakt niet uit']]
                  .map(([w,l])=>({waarde:w,label:l}));
  // Terugblik vanaf vandaag, plus de kalenderjaren die in de data zitten.
  const perioden = [{waarde:'',label:'maakt niet uit'},
      {waarde:'30d',label:'laatste 30 dagen'}, {waarde:'3m',label:'laatste 3 maanden'},
      {waarde:'6m',label:'laatste 6 maanden'}, {waarde:'12m',label:'laatste 12 maanden'}]
    .concat((fac.jaren||[]).map(j=>({waarde:'jaar:'+j.waarde, label:'in '+j.waarde, n:j.n,
                                     met_email:j.met_email, met_tel:j.met_tel})));
  const n = bcActieveFilters();
  return bcDD('kanaal','Bereikbaar via',kanalen,[BC.kanaal],true)
       + bcDD('periode','Binnengekomen',perioden,[BC.periode||''],true)
       + bcDD('bronnen','Bron',bcFacet(fac.bronnen,'bronnen'),BC.bronnen)
       + bcDD('projecten','Project',bcFacet(fac.projecten,'projecten'),BC.projecten)
       + bcDD('banden','Budget',bcFacet(fac.banden,'banden'),BC.banden)
       + bcDD('timings','Koopmoment',bcFacet(fac.timings,'timings'),BC.timings)
       + bcDD('doelen','Plan met de woning',bcFacet(fac.doelen,'doelen'),BC.doelen)
       + bcDD('vastgoed','Eerder vastgoed',bcFacet(fac.vastgoed,'vastgoed'),BC.vastgoed)
       + bcDD('klant','Klant',bcFacet(
           [{waarde:'ja',n:fac.met_klant},{waarde:'nee',n:fac.totaal-fac.met_klant}],'klant'),BC.klant)
       + bcDD('account','Ingelogd op invest',bcFacet(
           [{waarde:'ja',n:fac.met_account},{waarde:'nee',n:fac.totaal-fac.met_account}],'account'),BC.account)
       + bcDD('statussen','Verkoopstatus',bcFacet(fac.statussen,'statussen'),BC.statussen)
       + bcDD('temperaturen','Temperatuur',bcFacet(fac.temperaturen,'temperaturen'),BC.temperaturen)
       + bcDD('funnels','Funnel',bcFacet(fac.funnels,'funnels'),BC.funnels)
       + bcDD('talen','Taal',bcFacet(fac.talen,'talen'),BC.talen)
       + (n?`<button type="button" class="bc-wisalles" id="bc_wisalles">Wis alle filters (${n})</button>`:'');
}

/* Opnieuw tekenen na elke wijziging: de aantallen achter de keuzes veranderen
   mee met het kanaal, dus een halve verversing zou verkeerde getallen tonen.
   Het openstaande menu zetten we daarna terug, anders klapt hij dicht zodra je
   het tweede vakje aanvinkt. */
function bcTekenFilters(){
  $('#bc_filters').innerHTML = bcFilterHtml();
  bcBindFilters();
  if(BC.ddOpen){
    const d = document.querySelector(`#bc_filters .bc-dd[data-dd="${BC.ddOpen}"]`);
    if(d) d.classList.add('open');
  }
}

function bcBindFilters(){
  const wrap = $('#bc_filters');
  wrap.querySelectorAll('.bc-ddknop').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const dd = b.closest('.bc-dd'), was = dd.classList.contains('open');
    wrap.querySelectorAll('.bc-dd').forEach(x=>x.classList.remove('open'));
    dd.classList.toggle('open', !was);
    BC.ddOpen = was ? null : dd.dataset.dd;
  });
  wrap.querySelectorAll('.bc-ddmenu').forEach(m=>m.onclick=e=>e.stopPropagation());
  wrap.querySelectorAll('.bc-ddmenu input').forEach(i=>i.onchange=()=>{
    const g = i.dataset.groep, w = i.dataset.w;
    if(g==='kanaal'){ BC.kanaal=w; BC.ddOpen=null; }
    else if(g==='periode'){ BC.periode=w; BC.ddOpen=null; }
    else {
      const k = BC[g].indexOf(w);
      if(i.checked && k<0) BC[g].push(w); else if(!i.checked && k>-1) BC[g].splice(k,1);
    }
    bcTekenFilters(); bcLaad();
  });
  wrap.querySelectorAll('[data-wis]').forEach(b=>b.onclick=()=>{
    BC[b.dataset.wis]=[]; bcTekenFilters(); bcLaad();
  });
  const wis = $('#bc_wisalles');
  if(wis) wis.onclick=()=>{
    BC_GROEPEN.forEach(g=>BC[g]=[]); BC.periode=''; BC.ddOpen=null;
    bcTekenFilters(); bcLaad();
  };
}

        <button class="btn btn-ghost btn-sm" id="bc_lijst"></button>
        <button class="btn btn-ghost btn-sm" id="bc_allemaal">Alles aanvinken</button>

      </div>

               placeholder="Zoek iemand op naam, e-mailadres of telefoonnummer…">
        <span class="bc-zoekinfo" id="bc_zoekinfo"></span>
      </div>
      <div id="bc_tabel"></div>
    </div>
  </div>
  <div id="bc_opstel"></div>`;

  // Buiten een menu klikken sluit het. Eén keer aanhangen, want deze weergave
  // wordt opnieuw getekend bij elke filterwijziging.
  if(!BC.sluiterAan){
    document.addEventListener('click',()=>{
      if(!BC.ddOpen) return;
      BC.ddOpen=null;

    if(BC.open.size) BC.open.clear(); else r.forEach(x=>BC.open.add(x.id));

/* Het overzicht van campagnes. Dit bestond niet: je kon versturen, maar daarna
   nooit meer zien wat ermee gebeurd was, en een campagne die je halverwege had
   verlaten was onvindbaar. Lopende campagnes staan bovenaan met een knop om
   verder te gaan. */
async function bcCampagnesLaden(){
  const vak=$('#bc_campagnes'); if(!vak) return;
  const {data,error}=await sb.rpc('broadcast_campagnes_lijst');
  if(error){ vak.innerHTML=`<div class="bc-hint err">Campagne-overzicht kon niet laden: ${esc(error.message||'onbekend')}</div>`; return; }
  if(!Array.isArray(data)||!data.length){ vak.innerHTML=''; return; }

  // Cijfers van e-mailcampagnes bijwerken uit de gebeurtenissen van Resend.
  // Alleen voor wat recent is: ouder dan een maand verandert toch niet meer.
  const vers=data.filter(c=>c.kanaal==='email' && c.verzonden>0 &&
    (!c.klaar || Date.now()-new Date(c.klaar).getTime() < 31*864e5));
  if(vers.length){
    await Promise.all(vers.slice(0,10).map(c=>
      sb.rpc('broadcast_email_stats_bijwerken',{p_campagne:c.id}).catch(()=>{})));
    const her=await sb.rpc('broadcast_campagnes_lijst');
    if(!her.error && Array.isArray(her.data)) data.length=0, data.push(...her.data);
  }

  const lopend=data.filter(c=>c.status==='bezig');
  const rest=data.filter(c=>c.status!=='bezig').slice(0,6);
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;

  const kaart=c=>{
    const behandeld=c.verzonden+c.mislukt+c.overgeslagen;
    const loopt=c.status==='bezig';
    // Percentages op de basis die past bij het kanaal: opens en clicks reken je
    // over wat is afgeleverd, niet over wat is verstuurd. Een bounce heeft nooit
    // de kans gehad geopend te worden.
    const basis=c.afgeleverd||c.verzonden||0;
    return `<div class="bc-camp ${loopt?'loopt':''}">
      <span class="bc-camp-naam" title="${esc(c.onderwerp||'')}">${esc(c.naam||'(zonder naam)')}</span>
      <span class="bc-camp-kan">${c.kanaal==='whatsapp'?'WhatsApp':'E-mail'}</span>
      <div class="bc-bar" title="${behandeld} van ${c.doel} behandeld"><i style="width:${pct(behandeld,c.doel)}%"></i></div>
      <div class="bc-cijfers">
        <span><b>${c.verzonden}</b> verstuurd</span>
        ${c.afgeleverd?`<span><b>${c.afgeleverd}</b> aangekomen</span>`:''}
        ${c.geopend?`<span class="op"><b>${c.geopend}</b> ${c.kanaal==='whatsapp'?'gelezen':'geopend'} (${pct(c.geopend,basis)}%)</span>`:''}
        ${c.geklikt?`<span class="op"><b>${c.geklikt}</b> geklikt (${pct(c.geklikt,basis)}%)</span>`:''}
        ${c.mislukt?`<span class="err"><b>${c.mislukt}</b> mislukt</span>`:''}
        ${loopt?`<span><b>${c.wachtend}</b> te gaan</span>`:''}
      </div>
      ${loopt?`<button type="button" class="btn btn-primary btn-sm" data-verder="${c.id}">Verder met deze golf</button>`
             :`<button type="button" class="bc-zoekactie" data-detail="${c.id}">Wie kreeg wat</button>`}
    </div>`;
  };

  vak.innerHTML=(lopend.length
      ? `<div class="bc-lab" style="margin:0">Nog niet afgeronde campagnes</div>`+lopend.map(kaart).join('')
      : '')+
    (rest.length?`<details><summary class="bc-zoekactie" style="cursor:pointer;padding:4px 0">Eerdere campagnes (${rest.length})</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${rest.map(kaart).join('')}</div></details>`:'');

  vak.querySelectorAll('[data-verder]').forEach(b=>b.onclick=()=>bcCampagneHervatten(b.dataset.verder));
  vak.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>bcCampagneDetail(b.dataset.detail));
}

/* Verder met een campagne die nog loopt. Alles komt uit de campagne zelf, niet
   uit het geheugen van de pagina: template, variabelen, golfgrootte, tekst. Je
   hoeft dus niets opnieuw in te vullen, en golf 3 luidt gegarandeerd hetzelfde
   als golf 1. De ontvangerslijst ligt al vast en wie al een bericht kreeg wordt
   overgeslagen. */
async function bcCampagneHervatten(id){
  const {data,error}=await sb.rpc('broadcast_campagne_laden',{p_id:id});
  if(error||!data||data.ok===false){toast('Kon de campagne niet laden','err');return;}
  BC.verzendKanaal=data.kanaal||'email';
  BC.camp=data.id;
  BC.waGolven=1;                     // er is al verstuurd, dus niet opnieuw vastleggen
  BC.golf=data.golf_grootte||40;
  BC.layout=data.layout||'utama';
  if(data.kanaal==='whatsapp'){
    BC.waVars=Array.isArray(data.wa_variabelen)?data.wa_variabelen:[];
    BC.waTplNaam=data.wa_template;   // het template zelf komt uit de lijst van Meta
  }
  bcCampBewaren();
  bcOpstellen(data);
  toast(`Verder met "${data.naam||'campagne'}": nog ${data.resterend} te gaan`,'ok');
}

async function bcCampagneDetail(id){
  const {data,error}=await sb.rpc('broadcast_campagne_detail',{p_id:id,p_limit:2000});
  if(error||!data){toast('Kon de details niet laden','err');return;}
  const r=data.rijen||[], c=data.campagne||{};
  const wa=c.kanaal==='whatsapp';
  const dt=v=>v?new Date(v).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
  const root=document.createElement('div');
  root.innerHTML=`<div class="chatpop-back open"></div><div class="chatpop open" style="width:min(940px,96vw);height:min(80vh,780px)">
    <div class="chatpop-head"><div class="chatpop-title">${esc(c.naam||'Campagne')} &middot; ${r.length} ontvangers</div>
    <button class="bcx" style="font-size:22px;background:none;border:none;cursor:pointer;color:var(--muted)">&times;</button></div>
    <div style="flex:1;overflow:auto;padding:0 18px 18px">
      <table><tr><th>Naam</th><th>${wa?'Nummer':'E-mail'}</th><th>Status</th><th>Verstuurd</th>
      <th>Aangekomen</th><th>${wa?'Gelezen':'Geopend'}</th><th>Geklikt</th></tr>
      ${r.map(x=>`<tr><td>${esc(x.naam||'—')}</td><td>${esc((wa?x.telefoon:x.email)||'—')}</td>
        <td>${esc(x.status||'—')}${x.fout?` <span class="muted" title="${esc(x.fout)}">&#9432;</span>`:''}</td>
        <td>${dt(x.verzonden_at)}</td><td>${dt(x.afgeleverd_at)}</td>
        <td>${dt(x.geopend_at)}</td><td>${x.clicks?`${dt(x.geklikt_at)} (${x.clicks}&times;)`:'—'}</td></tr>`).join('')}
      </table>
    </div></div>`;
  document.body.appendChild(root);
  const sluit=()=>root.remove();
  root.querySelector('.chatpop-back').onclick=sluit;
  root.querySelector('.bcx').onclick=sluit;
}

async function bcLaad(){
  const f=bcFilters();
  const {data,error}=await sb.rpc('broadcast_selectie',{
    p_bronnen:f.bronnen, p_funnels:f.funnels, p_projecten:f.projecten, p_banden:f.banden,
    p_timings:f.timings, p_talen:f.talen, p_vastgoed:f.vastgoed, p_doelen:f.doelen,
    p_statussen:f.statussen, p_temperaturen:f.temperaturen, p_account:f.account,
    p_klant:f.klant, p_periode:f.periode, p_kanaal:f.kanaal, p_limit:2000});
  if(error){$('#bc_telling').innerHTML=`<span class="err">${esc(error.message)}</span>`;return;}
  BC.sel=data; BC.uit.clear(); BC.open.clear();
  bcTelling(); bcTabel();
}

function bcTelling(){
  const g=bcGekozen(), m=bcMailbaar(), uit=BC.uit.size;
  const knop=$('#bc_lijst');
  if(knop){
    knop.textContent = (BC.lijstOpen?'▴ Lijst verbergen':'▾ Leads tonen')+` (${g.length})`;
    // Aanvinken en antwoorden slaan nergens op zolang je de lijst niet ziet.
    ['#bc_allemaal','#bc_antwoorden'].forEach(sel=>{
      const b=$(sel); if(b) b.style.display = BC.lijstOpen?'':'none';
    });
  }
  const account=g.filter(r=>r.heeft_account).length;
  const klanten=g.filter(r=>r.klant).length;
  bcZoekInfo();
  $('#bc_telling').innerHTML=
    `<b>${g.length}</b> geselecteerd`+
    (uit?` <span class="muted">(${uit} handmatig afgevinkt)</span>`:'')+
    `, waarvan <b>${m.length}</b> met e-mailadres`+
    (g.length-m.length?` <span class="muted">(${g.length-m.length} alleen telefonisch bereikbaar)</span>`:'')+
    (klanten?` &middot; <span class="bc-let-inline"><b>${klanten}</b> is al klant</span>`:'')+
    (account?` &middot; <b>${account}</b> heeft ingelogd op invest`:'')+
    // Boven de 2000 kapt de server de lijst af. Zonder deze regel stel je een
    // campagne samen die stilzwijgend maar een deel van je selectie dekt.
    ((BC.sel&&BC.sel.afgekapt)?`<div class="err" style="margin-top:6px">Deze selectie is groter dan 2000 en wordt afgekapt. Maak hem kleiner met de filters, anders gaat de campagne maar naar de eerste 2000 op naam.</div>`:'');
}

/* De regel naast het zoekveld: hoeveel je ziet, en twee knoppen om precies de
   gevonden regels in één keer over te slaan of terug te zetten. Dat is waar
   zoeken tijdens het samenstellen voor bedoeld is. */
function bcZoekInfo(){
  const vak=$('#bc_zoekinfo'); if(!vak) return;
  const totaal=((BC.sel&&BC.sel.rijen)||[]).length;
  if(!BC.zoek){
    vak.innerHTML = BC.uit.size
      ? `<b>${BC.uit.size}</b> handmatig overgeslagen. <button type="button" class="bc-zoekactie" id="bc_herstel">Neem ze weer mee</button>`
      : 'Zoeken verandert je selectie niet, alleen wat je hier ziet.';
  } else {
    const gevonden=bcZichtbaar();
    const overgeslagen=gevonden.filter(x=>BC.uit.has(x.id)).length;
    const mee=gevonden.length-overgeslagen;
    vak.innerHTML = `<b>${gevonden.length}</b> van ${totaal} gevonden`+
      (gevonden.length?` &middot; `+
        (mee?`<button type="button" class="bc-zoekactie" id="bc_slaover">Sla deze ${mee} over</button>`:'')+
        (mee&&overgeslagen?' &middot; ':'')+
        (overgeslagen?`<button type="button" class="bc-zoekactie" id="bc_neemmee">Neem deze ${overgeslagen} weer mee</button>`:'')
        :'');
  }
  const aan=(id,fn)=>{const b=$(id); if(b) b.onclick=fn;};
  aan('#bc_herstel',()=>{ BC.uit.clear(); bcTabel(); bcTelling(); });
  aan('#bc_slaover',()=>{ bcZichtbaar().forEach(x=>BC.uit.add(x.id)); bcTabel(); bcTelling(); });
  aan('#bc_neemmee',()=>{ bcZichtbaar().forEach(x=>BC.uit.delete(x.id)); bcTabel(); bcTelling(); });
}

function bcTabel(){
  const r=bcZichtbaar();
  if(!r.length){
    // Nul treffers kan twee dingen betekenen. Zonder die tweede zin denk je al
    // gauw dat iemand niet in de database staat, terwijl hij gewoon buiten je
    // filters valt (bijvoorbeeld iemand zonder e-mailadres terwijl het kanaal
    // op "heeft e-mail" staat).
    $('#bc_tabel').innerHTML=`<div class="empty" style="padding:16px">${BC.zoek
      ? 'Niemand in deze selectie past bij <b>'+esc(BC.zoek)+'</b>.<div class="muted" style="font-size:13px;margin-top:6px">Hij kan wel in de lijst staan maar buiten je huidige filters vallen. Zet <b>Bereikbaar via</b> op \'maakt niet uit\' om breder te zoeken.</div>'
      : 'Niemand voldoet aan deze filters.'}</div>`;
    return;
  }
  // De lijst staat dicht tot je erom vraagt. Met honderden regels duwt hij
  // anders de filters en de telling van het scherm, terwijl je meestal alleen
  // wilt weten hoeveel mensen je selectie oplevert.
  if(!BC.lijstOpen && !BC.zoek){
    $('#bc_tabel').innerHTML=`<div class="bc-dicht">De lijst met ${r.length} contact${r.length===1?'':'en'} staat dicht. Klik op <b>Leads tonen</b> om hem open te klappen.</div>`;
    return;
  }
  const jaNee = v => v==null ? '<span class="muted">—</span>' : (v?'Ja':'Nee');
  $('#bc_tabel').innerHTML=
    `<div class="muted" style="font-size:12px;margin:10px 0 6px">Vink iemand uit om hem over te slaan, bijvoorbeeld een bestaande klant. Klik op het aantal antwoorden om te zien wat iemand destijds invulde.</div>
     <table><tr><th style="width:30px"></th><th>Naam</th><th>Binnengekomen</th><th>Bron</th>
     <th>E-mail</th><th>Telefoon</th><th>Portaal</th><th>Project</th>
     <th>Budget</th><th>Koopmoment</th><th>Plan</th><th>Eerder vastgoed</th><th></th></tr>`+
    r.map(x=>{
      const antw = Array.isArray(x.antwoorden)?x.antwoorden:[];
      const uit = BC.uit.has(x.id), op = BC.open.has(x.id);
      const bronnen = (x.bronnen||[]).map(b=>bcLabel('bronnen',b)).join(', ');
      return `<tr class="${uit?'bc-uit':''}">
      <td><input type="checkbox" class="bc-vink" data-id="${x.id}" ${uit?'':'checked'}></td>
      <td>${x.naam?bcMarkeer(x.naam,BC.zoek):'—'}</td>
      <td>${esc(bcDatum(x.binnengekomen)||'—')}</td>
      <td>${esc(bronnen||'—')}</td>
      <td>${x.email?bcMarkeer(x.email,BC.zoek):'<span class="muted">geen e-mail</span>'}</td>

async function bcExport(){
  const r=bcGekozen();
  if(!r.length){toast('Niets te exporteren','err');return;}
  // De ruwe antwoorden gaan als één kolom mee, zodat de export net zoveel
  // laat zien als het scherm en je hem in een blad kunt openen.
  const kol=['naam','binnengekomen','bronnen','email','telefoon','klant','klantnaam','heeft_account','projecten',
             'funnels','budget','band','timing','doel','eerder_vastgoed','status','sales_stage',
             'temperatuur','taal','antwoorden'];
  const plat=v=>Array.isArray(v)&&v.length&&typeof v[0]==='object'
      ? v.map(a=>`${a.vraag||a.veld}: ${a.antwoord}`).join(' | ')
      : Array.isArray(v) ? v.join(' | ')
      : typeof v==='boolean' ? (v?'ja':'nee')
      : (v==null?'':v);
  const q=v=>`"${String(plat(v)).replace(/"/g,'""')}"`;
  const csv=[kol.join(',')].concat(r.map(x=>kol.map(k=>q(x[k])).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`broadcast-${new Date().toISOString().slice(0,10)}.csv`;a.click();
  toast(`${r.length} contacten geexporteerd`,'ok');
}

  // ontvanger moet de afbeelding van een openbare URL kunnen halen. Breedte
  // vast op 560px met max-width:100%, anders schiet een foto van 2500px breed

/* ---------------- kanaalkeuze: e-mail of WhatsApp ---------------- */

/* Het opstelscherm bedient twee kanalen die weinig gemeen hebben. Bij e-mail
   schrijf je zelf een bericht; bij WhatsApp kies je een door Meta goedgekeurd
   template en vul je alleen de variabelen. Alles wat niet bij het gekozen
   kanaal hoort gaat uit beeld, want half ingevulde velden die nergens heen gaan
   zijn erger dan een scherm dat verandert. */
function bcKanaalTekenen(){
  const wa = BC.verzendKanaal==='whatsapp';
  const n  = bcOntvangers().length;
  document.querySelectorAll('[data-kanaal]').forEach(b=>
    b.classList.toggle('on', b.dataset.kanaal===BC.verzendKanaal));
  document.querySelectorAll('.bc-emailonly').forEach(e=>e.style.display = wa?'none':'');
  const waVak=$('#bc_wa'); if(waVak) waVak.style.display = wa?'':'none';

  $('#bc_kop').innerHTML = n
    ? `Gaat naar <b>${n}</b> ${wa?'telefoonnummer':'ontvanger'}${n===1?'':'s'}. Deze lijst ligt nu vast, ook als je hierna de filters aanpast.`
    : `<span class="err">Niemand in deze selectie is via dit kanaal bereikbaar.</span>`;
  // Let op de wisselwerking met het filter "Bereikbaar via" bovenaan: staat dat
  // op "heeft e-mail", dan blijven mensen zonder e-mailadres ook hier buiten de
  // selectie, hoe goed hun telefoonnummer ook is.
  const kanaalfilterKnelt = wa && BC.kanaal==='email';
  $('#bc_kanaalhint').innerHTML = wa
    ? 'Mag alleen met een door Meta goedgekeurd template en in golven. Antwoordt iemand met STOP, dan is hij meteen ook uit de e-maillijst.'
      + (kanaalfilterKnelt
         ? ' <b>Let op:</b> het filter <b>Bereikbaar via</b> staat op "heeft e-mail", dus mensen met alleen een nummer zitten er nu niet bij. Zet het op "heeft telefoonnummer" voor je volledige WhatsApp-bereik.'
         : '')
    : 'E-mail is vrije tekst en kan in één keer naar iedereen.';

  // Klanten uitsluiten is een keuze, geen automatisme: soms wil je ze juist
  // wel iets sturen. Maar het mag geen keuze zijn die je per ongeluk maakt door
  // een filter te vergeten, dus als er klanten in zitten staat het er groot bij.
  const klanten=bcOntvangers().filter(r=>r.klant);
  const kw=$('#bc_klantwaarschuwing');
  if(kw){
    if(klanten.length){
      kw.style.display='';
      kw.innerHTML=`Er ${klanten.length===1?'zit':'zitten'} <b>${klanten.length}</b> bestaande ${klanten.length===1?'klant':'klanten'} in deze selectie`+
        ` (${klanten.slice(0,3).map(k=>esc(k.klantnaam||k.naam||'')).join(', ')}${klanten.length>3?' en meer':''}).`+
        ` <button type="button" class="bc-zoekactie" id="bc_klantweg">Sla ${klanten.length===1?'hem':'ze'} over</button>`;
      const weg=$('#bc_klantweg');
      if(weg) weg.onclick=()=>{ klanten.forEach(k=>BC.uit.add(k.id)); bcTelling(); bcTabel(); bcKanaalTekenen(); };
    } else kw.style.display='none';
  }

  const test=$('#bc_test'), verstuur=$('#bc_verstuur');
  test.textContent = wa ? '📲 Proefbericht naar mijn nummer' : '📨 Proefmail naar mezelf';
  verstuur.textContent = wa
    ? `🚀 Golf versturen (${Math.min(BC.golf, n)} van ${n})`
    : `🚀 Versturen naar ${n}`;
  // Bij een campagne die al loopt is het proefbericht allang gestuurd; die knop
  // opnieuw op slot zetten zou je dwingen je eigen lijst nog een testje te sturen.
  const loopt = BC.camp && BC.waGolven > 0;
  verstuur.disabled = !loopt;
  verstuur.title = loopt ? '' : (wa ? 'Stuur eerst een proefbericht' : 'Stuur eerst een proefmail');

  if(wa) bcWaLaden();
}

async function bcWaLaden(){
  // Status en templates komen van hetzelfde eindpunt; één keer ophalen per
  // sessie is genoeg, behalve de status want die verandert.
  const st=$('#bc_wastatus');
  try{
    const {data,error}=await sb.functions.invoke('broadcast-wa',{body:{actie:'status'}});
    if(error||!data||!data.ok){ st.innerHTML=`<span class="err">${esc((data&&data.reden)||(error&&error.message)||'onbekend')}</span>`; }
    else{
      BC.waStatus=data;
      const kleur = data.kwaliteit==='GREEN'?'ok':(data.kwaliteit==='UNKNOWN'?'muted':'err');
      st.innerHTML=`<b>${esc(data.naam||'')}</b> ${esc(data.nummer||'')}<br>`+
        `<span class="${kleur}">Kwaliteit: ${esc(data.kwaliteit)}</span> · doorvoer ${esc(data.doorvoer||'?')}`;
    }
  }catch(e){ st.innerHTML=`<span class="err">${esc(e.message||e)}</span>`; }

  const vak=$('#bc_watpls');
  if(!BC.waTpls){
    const {data,error}=await sb.functions.invoke('broadcast-wa',{body:{actie:'templates'}});
    if(error||!data||!data.ok){
      vak.innerHTML=`<span class="err">Kon de templates niet laden: ${esc((data&&data.reden)||(error&&error.message)||'onbekend')}</span>`;
      return;
    }
    BC.waTpls=data.templates||[];
  }
  const klaar   = BC.waTpls.filter(t=>t.status==='APPROVED');
  const wachtend= BC.waTpls.filter(t=>t.status==='PENDING');
  const afgewezen=BC.waTpls.filter(t=>t.status==='REJECTED');
  if(!klaar.length && !wachtend.length){
    vak.innerHTML='<div class="bc-let">Er is nog geen goedgekeurd MARKETING-template. Dien er een in bij Meta; zodra die is goedgekeurd verschijnt hij hier vanzelf.</div>';
    return;
  }
  vak.innerHTML='<div class="bc-rij">'+klaar.map(t=>
    `<button type="button" class="bc-chip ${BC.waTpl&&BC.waTpl.naam===t.naam?'on':''}" data-watpl="${esc(t.naam)}" title="${esc(t.body)}">${esc(t.naam)} <span class="bc-n">${t.variabelen}</span></button>`).join('')+'</div>'
    // Wachtende templates zichtbaar maar niet aanklikbaar: anders lijkt het of
    // je indiening is verdwenen.
    + (wachtend.length?`<div class="bc-hint" style="margin-top:8px">In review bij Meta: ${wachtend.map(t=>`<b>${esc(t.naam)}</b>`).join(', ')}. Zodra Meta ze goedkeurt staan ze hierboven. Meestal binnen een paar uur; ververs deze pagina.</div>`:'')
    + (afgewezen.length?`<div class="bc-hint" style="margin-top:4px"><span class="err">Afgewezen door Meta: ${afgewezen.map(t=>esc(t.naam)).join(', ')}.</span></div>`:'');
  vak.querySelectorAll('[data-watpl]').forEach(b=>b.onclick=()=>{
    if(BC.camp && BC.waGolven>0){
      toast('Deze campagne loopt al. Een ander template zou golf 4 anders maken dan golf 1.','err');
      return;
    }
    BC.waTpl=BC.waTpls.find(t=>t.naam===b.dataset.watpl);
    BC.waTplNaam=BC.waTpl?BC.waTpl.naam:null;
    // Variabelen resetten: een ander template heeft andere posities.
    BC.waVars=Array.from({length:BC.waTpl.variabelen},(_x,i)=>
      i===0?{bron:'voornaam',waarde:''}:{bron:'tekst',waarde:''});
    BC.camp=null;
    vak.querySelectorAll('[data-watpl]').forEach(x=>x.classList.toggle('on',x===b));
    bcWaVarsTekenen();
  });
  // Hervat je een campagne, dan staat de templatenaam al vast maar was het
  // template zelf nog niet geladen. Nu wel: aanvinken en de variabelen erbij.
  if(!BC.waTpl && BC.waTplNaam){
    BC.waTpl=BC.waTpls.find(t=>t.naam===BC.waTplNaam)||null;
    if(BC.waTpl){
      vak.querySelectorAll('[data-watpl]').forEach(x=>
        x.classList.toggle('on', x.dataset.watpl===BC.waTpl.naam));
      if(!BC.waVars.length)
        BC.waVars=Array.from({length:BC.waTpl.variabelen},(_x,i)=>
          i===0?{bron:'voornaam',waarde:''}:{bron:'tekst',waarde:''});
    }
  }
  if(BC.waTpl) bcWaVarsTekenen();
}

const BC_WA_BRONNEN=[['voornaam','Voornaam van de ontvanger'],['naam','Volledige naam'],
                     ['project','Project van de lead'],['tekst','Vaste tekst'],
                     // Meta rapporteert geen kliks. Kies je Link, dan gaat de
                     // link via utamabali.com/r/<code> en tellen we hem wel.
                     ['link','Link (klik meetbaar)']];

function bcWaVarsTekenen(){
  const vak=$('#bc_wavars'), wrap=$('#bc_wavars_vak');
  if(!BC.waTpl){ wrap.style.display='none'; return; }
  wrap.style.display = BC.waTpl.variabelen ? '' : 'none';
  vak.innerHTML=BC.waVars.map((v,i)=>
    `<div class="bc-wavar">
       <span class="bc-wanr">{{${i+1}}}</span>
       <select data-varbron="${i}">${BC_WA_BRONNEN.map(([k,l])=>
         `<option value="${k}" ${v.bron===k?'selected':''}>${esc(l)}</option>`).join('')}</select>
       <input data-varwaarde="${i}" value="${esc(v.waarde||'')}"
              placeholder="${v.bron==='link'?'https://invest.utamabali.com/moka':'Vaste tekst'}"
              style="${(v.bron==='tekst'||v.bron==='link')?'':'display:none'}">
     </div>`).join('');
  vak.querySelectorAll('[data-varbron]').forEach(sel=>sel.onchange=()=>{

  });
  vak.querySelectorAll('[data-varwaarde]').forEach(inp=>inp.oninput=()=>{
    BC.waVars[Number(inp.dataset.varwaarde)].waarde=inp.value; BC.camp=null; bcWaVoorbeeld();
  });
  bcWaVoorbeeld();
}

/* Het template met de variabelen van een echte ontvanger uit de selectie, zodat
   je ziet wat er straks op iemands telefoon staat en niet alleen {{1}}. */
function bcWaVoorbeeld(){
  const wrap=$('#bc_wavoorbeeld_vak'), vak=$('#bc_wavoorbeeld');
  if(!BC.waTpl){ wrap.style.display='none'; return; }
  wrap.style.display='';
  // Een ontvanger met een volledige naam leest prettiger als voorbeeld dan de
  // eerste op alfabet, die vaak maar één letter heeft.
  const kandidaten=bcAppbaar();
  const voorbeeld = kandidaten.find(x=>/\s/.test(String(x.naam||'')))
                 || kandidaten[0] || {naam:'Steven Gijsman',voornaam:'Steven',projecten:['MOKA']};
  let onvolledig=false;
  const params=BC.waVars.map((v,i)=>{
    const voornaam=(voorbeeld.voornaam||String(voorbeeld.naam||'').split(/\s+/)[0]||'').trim();
    let w = v.bron==='voornaam' ? voornaam
          : v.bron==='naam' ? (voorbeeld.naam||voornaam)
          : v.bron==='project' ? ((voorbeeld.projecten||[])[0]||'')
          : (v.waarde||'');
    w=String(w).trim();
    if(w) return w;
    // Een lege vaste tekst is iets wat jij nog moet doen, geen noodwaarde.
    if(v.bron==='tekst'||v.bron==='link'){ onvolledig=true; return `[{{${i+1}}} nog invullen]`; }
    return v.bron==='project' ? 'onze projecten' : 'daar';
  });
  const tekst=String(BC.waTpl.body||'').replace(/\{\{(\d+)\}\}/g,(_m,n)=>params[Number(n)-1]??`{{${n}}}`);
  vak.innerHTML=esc(tekst).replace(/\n/g,'<br>').replace(/\[\{\{\d+\}\} nog invullen\]/g,m=>`<span class="wa-leeg">${m}</span>`)+
    `<div class="bc-hint" style="margin-top:8px">Voorbeeld met de gegevens van ${esc(voorbeeld.naam||'een ontvanger')}.`+
    (onvolledig?' <span class="err">Vul de rode stukken nog in.</span>':'')+`</div>`;
}

/* De server rendert het voorbeeld, met dezelfde opmaakmodule als het echte
   verzenden. Een eigen kopie in de admin liep achter zodra de mailopmaak
   veranderde, en een preview die iets anders toont dan wat er uitgaat is erger
   dan geen preview. */
async function bcPreview(){
  const body=$('#bc_body').innerHTML.trim();
  if(!body){toast('Schrijf eerst een bericht','err');return;}
  const knop=$('#bc_preview');knop.disabled=true;knop.textContent='Voorbeeld laden…';
  try{
    const {data,error}=await sb.functions.invoke('email-preview',{body:{
      body_html:body, onderwerp:$('#bc_onderwerp').value, preheader:$('#bc_pre').value||null,
      design:BC.layout==='plat'?'plat':'utama'}});
    if(error||!data||!data.ok){toast('Voorbeeld mislukt: '+esc((error&&error.message)||'onbekend'),'err');return;}
    const onderwerp=data.onderwerp||$('#bc_onderwerp').value||'(geen onderwerp)';
    const root=document.createElement('div');root.id='bcprev_root';
    // Zelfde aanpak als de sequence-preview: sandbox zonder allow-scripts, want
    // mail-HTML hoort geen JS te draaien en mag niets in de CRM-sessie kunnen.
    root.innerHTML=`<div class="chatpop-back open"></div><div class="chatpop open" style="width:min(720px,94vw);height:min(760px,90vh)">
      <div class="chatpop-head"><div class="chatpop-title">Voorbeeld · ${esc(onderwerp)}</div>
      <button id="bcprev_x" style="font-size:22px;background:none;border:none;cursor:pointer;color:var(--muted)">×</button></div>
      <div class="bc-prevbar">Zo komt de mail aan. Sleep de rand smaller om te zien hoe hij op een telefoon oogt.</div>
      <iframe sandbox="" style="flex:1;width:100%;border:0;background:#f4f6f5"></iframe></div>`;
    document.body.appendChild(root);
    root.querySelector('iframe').srcdoc=data.html;
    const sluit=()=>root.remove();
    root.querySelector('.chatpop-back').onclick=sluit;
    root.querySelector('#bcprev_x').onclick=sluit;
  } finally { knop.disabled=false; knop.textContent='👁 Voorbeeld bekijken'; }
}

/* Het campagne-id stond alleen in het geheugen van de pagina. Verniste je het
   tabblad halverwege een campagne, dan begon de volgende klik een nieuwe
   campagne met dezelfde ontvangers, en dan is broadcast_verzendingen leeg voor
   dat nieuwe id: de eerste veertig mensen kregen het bericht een tweede keer.
   De server weigert dat inmiddels ook, maar dan sta je met een foutmelding en
   een halve campagne. Daarom onthouden we hem hier. */
const BC_ACTIEF='bc_actieve_campagne';
function bcCampBewaren(){
  try{ localStorage.setItem(BC_ACTIEF, JSON.stringify(
    {id:BC.camp, kanaal:BC.verzendKanaal, golven:BC.waGolven, op:Date.now()})); }catch(e){}
}
function bcCampVergeten(){ try{ localStorage.removeItem(BC_ACTIEF); }catch(e){} }
function bcCampHervatten(){
  try{
    const r=JSON.parse(localStorage.getItem(BC_ACTIEF)||'null');
    // Ouder dan een dag is bijna zeker vergeten werk, geen lopende campagne.
    if(!r||!r.id||Date.now()-r.op>864e5){ bcCampVergeten(); return null; }
    return r;
  }catch(e){ return null; }
}

async function bcBewaar(){
  const wa = BC.verzendKanaal==='whatsapp';
  const ids=bcOntvangers().map(x=>x.id);
  const {data,error}=await sb.rpc('broadcast_campagne_opslaan',{
    p_id:BC.camp, p_naam:$('#bc_naam').value.trim()||null,
    // Bij WhatsApp bestaat er geen onderwerp. De interne naam of de
    // templatenaam vult dat gat, puur zodat de campagne herkenbaar is in de lijst.
    p_onderwerp: wa ? ($('#bc_naam').value.trim() || (BC.waTpl&&BC.waTpl.naam) || 'WhatsApp-bericht')
                    : $('#bc_onderwerp').value.trim(),
    p_preheader: wa ? null : ($('#bc_pre').value.trim()||null),
    p_body_html: wa ? null : $('#bc_body').innerHTML,
    p_ontvangers:ids, p_filters:bcFilters(), p_layout:BC.layout,
    p_kanaal: wa?'whatsapp':'email',
    p_wa_template: wa&&BC.waTpl ? BC.waTpl.naam : null,
    p_wa_template_taal: wa&&BC.waTpl ? BC.waTpl.taal : null,
    p_wa_variabelen: wa ? BC.waVars : null,
    p_golf_grootte: BC.golf});
  if(error) return {fout:error.message};
  if(data&&data.ok===false){
    // De server weigert een tweede campagne zolang een vorige niet af is. Dat
    // is terecht, maar zonder uitweg sta je vast: geef de campagne mee zodat
    // het scherm er een knop van kan maken.
    if(data.lopend_id) return {fout:data.reden, lopend:data};
    return {fout:data.reden};
  }
  BC.camp=data.id;
  bcCampBewaren();
  // De lijst ligt vast zodra er iets verstuurd is; de server zegt dat dan zelf.
  return {id:data.id, ontvangers:data.ontvangers, bevroren:!!data.bevroren};
}

async function bcVerstuur(test){
  if(BC.verzendKanaal==='whatsapp') return bcVerstuurWa(test);
  const st=$('#bc_status'); st.style.display='';
  if(!$('#bc_onderwerp').value.trim()){toast('Vul een onderwerp in','err');return;}
  if(!$('#bc_body').innerHTML.trim()){toast('Schrijf eerst een bericht','err');return;}
  st.textContent=test?'Proefmail versturen…':'Campagne versturen, dit kan even duren…';
  const bewaard=await bcBewaar();
  if(bewaard.fout){
    if(bewaard.lopend) bcToonLopend(st, bewaard.lopend);
    else st.innerHTML=`<span class="err">${esc(bewaard.fout)}</span>`;
    return;
  }

  if(!test){
    const n=bewaard.ontvangers;
    if(!confirm(`Je staat op het punt deze nieuwsbrief te versturen naar ${n} mensen.\n\nDit kun je niet terugdraaien. Doorgaan?`)){
      st.style.display='none';return;
    }
  }
  const {data,error}=await sb.functions.invoke('broadcast-send',{
    body: test ? {campagne_id:BC.camp, test_naar:(ME&&ME.email)||''} : {campagne_id:BC.camp}});
  if(error){st.innerHTML=`<span class="err">Mislukt: ${esc(error.message)}</span>`;return;}
  if(data&&data.ok===false){st.innerHTML=`<span class="err">${esc(data.reden||'mislukt')}</span>`;return;}
  if(test){
    st.innerHTML=`Proefmail verstuurd naar <b>${esc(data.naar)}</b>. Controleer hem, dan kun je versturen.`;
    const b=$('#bc_verstuur'); b.disabled=false; b.title='';
    return;
  }

  // De verzendfunctie stopt uit zichzelf voor de looptijdlimiet van 150
  // seconden en zegt hoeveel er nog te gaan is. Eerder deed hij dat niet: dan
  // sloeg Supabase hem halverwege dood met een 504 en zag Ashley alleen
  // "Edge Function returned a non-2xx status code", met een campagne die op 76
  // van de 244 was blijven staan. Nu roepen we hem net zo vaak opnieuw aan tot
  // de lijst leeg is; wie al een mail heeft wordt overgeslagen.
  let totaal=data.verzonden||0, totMislukt=data.mislukt||0, rest=data.resterend||0;
  const knop=$('#bc_verstuur');
  while(rest>0){
    knop.disabled=true;
    st.innerHTML=`Bezig: <b>${totaal}</b> verstuurd, nog <b>${rest}</b> te gaan. Dit venster mag open blijven staan.`;
    const vervolg=await sb.functions.invoke('broadcast-send',{body:{campagne_id:BC.camp}});
    if(vervolg.error||!vervolg.data||vervolg.data.ok===false){
      st.innerHTML=`<b>${totaal}</b> verstuurd, daarna liep het vast: `+
        `<span class="err">${esc((vervolg.data&&vervolg.data.reden)||(vervolg.error&&vervolg.error.message)||'onbekend')}</span>`+
        `<div class="bc-hint" style="margin-top:6px">Er is nog <b>${rest}</b> te gaan. Klik nogmaals om verder te gaan; wie al een mail kreeg wordt overgeslagen.</div>`;
      knop.disabled=false; knop.textContent=`🚀 Verder versturen naar ${rest}`;
      bcCampagnesLaden();
      return;
    }
    totaal+=vervolg.data.verzonden||0;
    totMislukt+=vervolg.data.mislukt||0;
    rest=vervolg.data.resterend||0;
  }

  st.innerHTML=`Klaar. Verstuurd: <b>${totaal}</b>`+
    (totMislukt?`, mislukt: <b>${totMislukt}</b>`:'')+
    (data.overgeslagen?`, overgeslagen: ${data.overgeslagen}`:'');
  knop.disabled=true; knop.textContent='Alles verstuurd';
  bcCampVergeten();
  bcCampagnesLaden();
  toast(`Nieuwsbrief verstuurd naar ${totaal} mensen`,'ok');
}

/* WhatsApp verstuurt per golf, niet in één keer. Na elke golf staat de nieuwe
   kwaliteitsscore op het scherm: dat is het moment om te besluiten of je
   doorgaat, niet als de hele lijst er al doorheen is. */
/* De weigering "je bent nog niet klaar met X" met twee uitwegen erbij: verder
   met die campagne, of hem afsluiten als je de rest niet meer wilt sturen.
   Zonder deze knoppen is de melding een doodlopende straat. */
function bcToonLopend(st, lopend){
  st.innerHTML=`<span class="err">${esc(lopend.reden)}</span>`+
    `<div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">`+
    `<button type="button" class="bc-zoekactie" id="bc_ganaar">Verder met "${esc(lopend.lopend_naam||'die campagne')}" (${lopend.lopend_resterend} te gaan)</button>`+
    `<button type="button" class="bc-zoekactie" id="bc_rondaf" style="color:var(--muted)">Die is klaar, sluit hem af</button>`+
    `</div>`;
  $('#bc_ganaar').onclick=()=>bcCampagneHervatten(lopend.lopend_id);
  $('#bc_rondaf').onclick=async()=>{
    if(!confirm(`"${lopend.lopend_naam||'Die campagne'}" afsluiten? De resterende ${lopend.lopend_resterend} krijgen dan niets meer.`)) return;
    const {error}=await sb.rpc('broadcast_campagne_afronden',{p_id:lopend.lopend_id});
    if(error){toast('Afsluiten mislukt: '+error.message,'err');return;}
    st.innerHTML='Afgesloten. Je kunt nu een nieuwe campagne beginnen.';
    bcCampagnesLaden();
  };
}

async function bcVerstuurWa(test){
  const st=$('#bc_status'); st.style.display='';
  if(!BC.waTpl){toast('Kies eerst een goedgekeurd template','err');return;}
  const leeg=BC.waVars.findIndex(v=>(v.bron==='tekst'||v.bron==='link') && !String(v.waarde||'').trim());
  if(leeg>-1){toast(`Variabele {{${leeg+1}}} is nog leeg`,'err');return;}
  // De doorstuurlink werkt alleen naar onze eigen domeinen; een open redirect
  // is een cadeau aan phishers, dus de functie weigert de rest.
  const raar=BC.waVars.find(v=>v.bron==='link' && !/^https:\/\/([a-z0-9-]+\.)?utamabali\.com(\/|$)/i.test(String(v.waarde||'').trim()));
  if(raar){toast('Een meetbare link moet naar utamabali.com wijzen','err');return;}

  st.textContent = test ? 'Proefbericht versturen…' : 'Golf versturen…';

  // Opslaan legt de ontvangerslijst vast. Dat mag maar één keer: bij elke golf
  // opnieuw opslaan zou de lijst herberekenen uit de huidige filters, en dan
  // verschuift halverwege de campagne wie er nog aan de beurt is. De kop belooft
  // dat de lijst vastligt; dit maakt dat waar. Verander je het template of een
  // variabele, dan zet die code BC.camp op null en begin je met een nieuwe
  // campagne, dus dan klopt het opnieuw vastleggen wel.
  let bewaard;
  if(BC.waGolven > 0 && BC.camp){
    const r=await sb.from('broadcast_campagnes').select('aantal_doel').eq('id',BC.camp).maybeSingle();
    bewaard={id:BC.camp, ontvangers:(r.data&&r.data.aantal_doel)||0};
  }else{
    bewaard=await bcBewaar();
    if(bewaard.fout){
      if(bewaard.lopend) bcToonLopend(st, bewaard.lopend);
      else st.innerHTML=`<span class="err">${esc(bewaard.fout)}</span>`;
      return;
    }
  }

  if(test){
    // Het testnummer onthouden: je stuurt tijdens het samenstellen meestal een
    // paar proefberichten achter elkaar naar hetzelfde toestel.
    let vorig='+31'; try{ vorig=localStorage.getItem('bc_testnummer')||'+31'; }catch(e){}
    const nummer=prompt('Naar welk nummer sturen we het proefbericht?', vorig);
    if(!nummer){st.style.display='none';return;}
    try{ localStorage.setItem('bc_testnummer', nummer); }catch(e){}
    const {data,error}=await sb.functions.invoke('broadcast-wa',{
      // De templatetekst gaat mee zodat het proefbericht ook in de inbox-thread
      // belandt, net als een echte verzending.
      body:{actie:'test', campagne_id:BC.camp, naar:nummer, template_body:BC.waTpl.body}});
    if(error){st.innerHTML=`<span class="err">Mislukt: ${esc(error.message)}</span>`;return;}
    if(!data||data.ok===false){st.innerHTML=`<span class="err">${esc((data&&(data.detail||data.reden))||'mislukt')}</span>`;return;}
    st.innerHTML=`Proefbericht verstuurd naar <b>${esc(data.naar)}</b>. Controleer het op je telefoon, dan kun je de eerste golf sturen.`;
    const b=$('#bc_verstuur'); b.disabled=false; b.title='';
    return;
  }

  const n=bewaard.ontvangers, golf=Math.min(BC.golf,n);
  if(!confirm(`Je stuurt nu een golf van ${golf} WhatsApp-berichten (van in totaal ${n}).\n\nDit kun je niet terugdraaien. Doorgaan?`)){
    st.style.display='none';return;
  }
  const knop=$('#bc_verstuur'); knop.disabled=true;
  const {data,error}=await sb.functions.invoke('broadcast-wa',{
    body:{actie:'golf', campagne_id:BC.camp, template_body:BC.waTpl.body}});
  knop.disabled=false;
  if(error){st.innerHTML=`<span class="err">Mislukt: ${esc(error.message)}</span>`;return;}
  if(!data||data.ok===false){
    st.innerHTML=`<span class="err">${esc(data&&data.reden||'mislukt')}</span>`;
    if(data&&data.status) st.innerHTML+=` <span class="muted">(score staat op ${esc(data.status.kwaliteit)})</span>`;
    return;
  }
  BC.waGolven++; bcCampBewaren(); bcCampagnesLaden();
  const kleur = data.kwaliteit_na==='GREEN' ? 'ok' : 'err';
  st.innerHTML=`Golf klaar. Verstuurd: <b>${data.verzonden}</b>`+
    (data.mislukt?`, mislukt: <b>${data.mislukt}</b>`:'')+
    (data.overgeslagen?`, overgeslagen: ${data.overgeslagen}`:'')+
    `.<br>Nog <b>${data.resterend}</b> te gaan van ${data.doel}.`+
    (data.kwaliteit_na?` Kwaliteitsscore nu: <span class="${kleur}">${esc(data.kwaliteit_na)}</span>.`:'')+
    (data.waarschuwing?`<div class="bc-let" style="margin:10px 0 0">${esc(data.waarschuwing)}</div>`:'');
  if(data.resterend>0){
    knop.textContent=`🚀 Volgende golf (${Math.min(BC.golf,data.resterend)} van ${data.resterend})`;
    if(data.waarschuwing){ knop.disabled=true; knop.title='Kwaliteitsscore is niet groen'; }
  }else{
    knop.disabled=true; knop.textContent='Alles verstuurd';
    bcCampVergeten();
    toast(`WhatsApp-campagne klaar: ${data.doel} berichten`,'ok');
  }
}

function ctHashtags(t){
  return String(t||'').split(/[\s,]+/).filter(Boolean)
    .map(w=>w.startsWith('#')?w:'#'+w.replace(/^#+/,'')).join(' ');
}
function ctKopieer(tekst, knop){
  const klaar=()=>{ if(knop){const t=knop.textContent; knop.textContent='Gekopieerd'; setTimeout(()=>knop.textContent=t,1400);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(tekst).then(klaar).catch(()=>{}); return; }
  const ta=document.createElement('textarea'); ta.value=tekst; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); klaar();
}

function ctTeken(){
  document.querySelectorAll('[data-ctsoort]').forEach(x=>x.classList.toggle('on',x.dataset.ctsoort===CT.soort));

  $('#ct_medialabel').textContent = wa==='reel'?'Je B-roll (video)':wa==='carousel'?'Je afbeeldingen, in volgorde':'Je foto';

    ? 'Grote clips mogen: boven de 200 MB wordt hij eerst in de browser verkleind naar 1080p (visueel verliesvrij, duurt zo lang als de clip). Het pakket levert het overlay-script; de tekst zet je er in de Instagram-editor of CapCut overheen.'
    : wa==='carousel' ? 'Upload 4 tot 10 beelden. Elke afbeelding krijgt zijn eigen slide-tekst; de eerste wordt de cover.'
    : 'Een sterke foto. De caption doet hier het werk.';
  ctMediaTekenen();
}

function ctMediaTekenen(){
  const vak=$('#ct_media'); if(!vak) return;
  const isVideo=m=>/\.(mp4|mov|webm|m4v)$/i.test(m.path)||String(m.type||'').startsWith('video');
  vak.innerHTML=CT.media.map((m,i)=>`
    <div class="ct-tegel">
      ${isVideo(m)?`<video src="${ctPubliek(m.path)}" muted playsinline preload="metadata"></video>`
                  :`<img src="${ctPubliek(m.path)}" alt="">`}
      ${CT.soort==='carousel'?`<span class="nr">${i+1}</span>`:''}
      <button class="weg" data-weg="${i}" title="Verwijderen">×</button>
      ${CT.soort==='carousel'&&CT.media.length>1?`<span class="schuif">
        <button data-schuif="${i}:-1" ${i===0?'disabled':''} title="Naar voren">◀</button>
        <button data-schuif="${i}:1" ${i===CT.media.length-1?'disabled':''} title="Naar achteren">▶</button>
      </span>`:''}
    </div>`).join('')+
    (()=>{
      // Een reel of post heeft precies EEN beeld (Instagram-regel); staat er
      // al iets, dan is de actie vervangen, geen toevoegen. Alleen een
      // carousel stapelt echt.
      const vol=CT.soort!=='carousel'&&CT.media.length>0;
      return `<button class="ct-upload" id="ct_upload" title="${vol?'Vervangt de huidige':'Media toevoegen'}" style="font-size:${vol?'13px':'26px'}">${vol?'↺<br>vervang':'+'}</button>
     <button class="ct-upload" id="ct_bib_kies" title="${vol?'Vervangen uit de bibliotheek':'Kies uit de bibliotheek'}" style="font-size:13px;line-height:1.4">📚<br>${vol?'vervang<br>uit bieb':'bieb'}</button>`;
    })();
  vak.querySelectorAll('[data-weg]').forEach(b=>b.onclick=()=>{CT.media.splice(Number(b.dataset.weg),1);ctMediaTekenen();ctPreviewTekenen();});
  // Volgorde schuiven: de nummers en de slide-teksten volgen de nieuwe
  // volgorde vanzelf, want die zijn positioneel (slide 1 = eerste afbeelding).
  const bk=$('#ct_bib_kies'); if(bk) bk.onclick=()=>bibKiezer();
  vak.querySelectorAll('[data-schuif]').forEach(b=>b.onclick=()=>{
    const [i,r]=b.dataset.schuif.split(':').map(Number);
    const j=i+r; if(j<0||j>=CT.media.length) return;
    [CT.media[i],CT.media[j]]=[CT.media[j],CT.media[i]];
    ctMediaTekenen(); ctPreviewTekenen();
    if(CT.postId) ctOpslaan(null);
  });
  $('#ct_upload').onclick=()=>{
    const k=document.createElement('input'); k.type='file';
    k.accept=CT.soort==='reel'?'video/*':'image/*';
    k.multiple=CT.soort==='carousel';
    k.onchange=async()=>{
      for(const f of Array.from(k.files||[])){
        // Reel en post: een bestand vervangt het vorige, dat voorkomt het
        // verwarrende geval van twee video's waarvan er stilzwijgend een wint.
        if(CT.soort!=='carousel') CT.media=[];
        $('#ct_status').textContent=`Uploaden: ${f.name}…`;
        let blob=f, extO=null, typeO=null;
        if(/^image\//.test(f.type)){ try{ blob=(await pmCompress(f)).blob; }catch(e){} }
        if(/^video\//.test(f.type)&&f.size>VIDEO_VERKLEIN_GRENS){
          try{
            const kv=await videoVerkleinen(f, t=>{$('#ct_status').textContent=t;});
            blob=kv.blob; extO=kv.ext; typeO=kv.type;
          }catch(e){ toast(`Verkleinen mislukte (${e.message}), origineel wordt geprobeerd`,'err'); }
        }
        const ext=extO||(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
        const pad=`${CT.soort}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
        const up=await sb.storage.from(CT_BUCKET).upload(pad,blob,{contentType:typeO||f.type||'application/octet-stream',upsert:false});
        if(up.error){toast('Upload mislukt: '+up.error.message,'err');continue;}
        CT.media.push({path:pad,type:f.type||''});
        ctMediaTekenen();
      }
      $('#ct_status').textContent='';
    };
    k.click();
  };
}

async function ctGenereer(){
  // Waren de beelden al gebakken (tekst erin), zet dan eerst de schone
  // originelen terug; anders toont de preview de oude tekst en zou een
  // nieuwe bak eroverheen gaan.
  if(CT.soort==='carousel'&&CT.mediaOrigineel&&CT.mediaOrigineel.length){
    CT.media=[...CT.mediaOrigineel];
    ctMediaTekenen();
  }
  const onderwerp=$('#ct_onderwerp').value.trim();
  if(!onderwerp){toast('Vertel eerst in een paar zinnen waar het over gaat','err');return;}
  if(CT.soort==='carousel'&&CT.media.length<2){toast('Upload eerst je afbeeldingen, dan krijgt elke slide zijn eigen tekst','err');return;}
  const knop=$('#ct_genereer'); knop.disabled=true;
  $('#ct_status').textContent='Pakket maken, dit duurt zo’n 20 seconden…';
  try{
    // Wat er op de b-roll staat weet de bibliotheek al (beschrijving en tags
    // van het gekozen beeld); dat gaat automatisch mee zodat het script er
    // losjes naar kan verwijzen. Handmatig geuploade media heeft geen
    // beschrijving en dan staat het script gewoon op zichzelf.
    let broll=null;
    if(CT.soort==='reel'&&CT.media[0]){
      const bib=(BIB.rijen||[]).find(r=>r.path===CT.media[0].path);
      if(bib&&bib.beschrijving) broll=bib.beschrijving+(bib.tags&&bib.tags.length?` (${bib.tags.join(', ')})`:'');
    }
    const {data,error}=await sb.functions.invoke('content-maker',{body:{
      soort:CT.soort, onderwerp, project:CT.project||null, doel:CT.doel,
      broll, gesproken:CT.gesproken||false, aantal_media:CT.media.length}});
    if(error||!data||data.ok===false){
      $('#ct_status').innerHTML=`<span class="err">${esc((data&&data.reden)||(error&&error.message)||'mislukt')}</span>`;return;
    }
    CT.pakket=data.pakket; CT.hookKeus=0;
    ctPakketTekenen();
    await ctOpslaan('concept');
    $('#ct_status').textContent='';
  } finally { knop.disabled=false; }
}

function ctPakketTekenen(){
  const pk=CT.pakket; if(!pk) return;
  const vak=$('#ct_pakket'); vak.style.display='';
  const kop=(t,knopId,kopieTekst)=>`<div class="kopje">${t}${kopieTekst!==undefined?`<button class="bc-zoekactie" data-kopieer="${esc(knopId)}">Kopieer</button>`:''}</div>`;

  vak.innerHTML=`
  <div class="ct-grid2">
    <div class="ct-vak" style="grid-column:1/-1">
      ${kop('Kies je hook')}
      ${(pk.hooks||[]).map((h,i)=>`<button class="ct-hook ${i===CT.hookKeus?'on':''}" data-hook="${i}">${esc(h)}</button>`).join('')}
      <div class="bc-hint">${CT.soort==='reel'?'Dit wordt de tekstoverlay in seconde 1, en de eerste regel van je caption.':'Dit wordt de covertitel en de eerste regel van je caption.'}</div>
    </div>

    <div class="ct-vak">
      ${kop('Caption','caption','x')}
      <textarea class="ct-caption" id="ct_caption" style="min-height:280px;overflow:hidden">${esc(pk.caption||'')}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="ct_feedback" class="ct-caption" style="min-height:0;flex:1;padding:8px 12px"
               placeholder="Wat moet anders? Bijv: korter, minder verkoperig, meer spreektaal, begin met de prijs…">
        <button class="btn btn-ghost btn-sm" id="ct_verbeter" style="flex:none">✨ Pas aan</button>
      </div>
      <div class="bc-hint">De aanwijzing wordt op het hele pakket toegepast (ook hooks en slides), niet alleen de caption. Je eigen wijzigingen in het tekstvak blijven het uitgangspunt.</div>
    </div>

    <div class="ct-vak">
      ${kop('Preview, kies je variant')}
      <div id="ct_preview"></div>
      <div class="bc-hint" id="ct_previewhint"></div>
    </div>


    ${(pk.overlays&&pk.overlays.length)?`<div class="ct-vak">
      ${kop('Overlay-script voor op de b-roll','overlays','x')}
      ${pk.overlays.map(o=>`<div class="ct-regel"><span class="t">${esc(o.tijd||'')}</span><span>${esc(o.tekst||'')}</span></div>`).join('')}
      <div class="bc-hint">Covertekst: <b>${esc(pk.cover_tekst||'')}</b></div>
    </div>`:''}

    ${(pk.slides&&pk.slides.length)?`<div class="ct-vak">
      ${kop('Slide-teksten, in volgorde van je afbeeldingen','slides','x')}
      ${pk.slides.map((sl,i)=>`<div class="ct-regel"><span class="t">${i+1}</span><span><b>${esc(sl.kop||'')}</b>${sl.sub?`<br><span class="muted">${esc(sl.sub)}</span>`:''}</span></div>`).join('')}
      <div class="vo-knoppen" style="margin-top:8px">
        <button class="btn btn-primary btn-sm" id="ct_slides_bakken">🎨 Zet de teksten op je afbeeldingen</button>
      </div>
      <div class="bc-hint">Deze teksten horen op je afbeeldingen te staan. Klik hierboven en ze worden erop gezet: slide 1 als cover (grote titel, gecentreerd, met @stevenbalivillas), de rest met de kop onderin. Daarna zie je het resultaat in de preview en kun je direct plaatsen.</div>
      <div id="ct_slides_status"></div>
    </div>`:''}

    <div class="ct-vak">
      ${kop('Eerste reactie (hashtags)','hashtags','x')}
      <div style="font-size:13px;line-height:1.6;color:var(--muted)" id="ct_hashtags">${esc(ctHashtags(pk.eerste_reactie))}</div>
      <div style="margin-top:10px">${kop('Comment-magneet')}
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px">
          <span class="ct-magneet">${esc(pk.comment_woord||'')}</span>
          <span class="bc-hint" style="margin:0">${esc(pk.dm_belofte||'')}</span>
        </div>
        <div class="bc-hint" style="margin-top:6px">Zet deze flow klaar in de DM-bot voordat je plaatst; anders is de belofte loos.</div>
      </div>
    </div>

    <div class="ct-vak">
      ${kop('Plaatsen')}
      <div id="ct_plaats"><span class="muted" style="font-size:13px">Instagram-koppeling controleren…</span></div>
    </div>

    ${CT.soort==='reel'?`<div class="ct-vak" style="grid-column:1/-1">
      ${kop('Audio: voice-over en muziek')}
      <div id="ct_voice"></div>
    </div>`:''}

    <div class="ct-vak" style="grid-column:1/-1">
      ${kop('Actuele cijfers voor deze post')}
      <div class="vo-knoppen" style="margin:0 0 6px"><button class="btn btn-ghost btn-sm" id="ct_feiten">🔎 Zoek actuele cijfers (met bron)</button></div>
      <div id="ct_feitenvak"><span class="muted" style="font-size:13px">Verse marktdata voor value posts: toerisme, prijzen, regelgeving, NL-vergelijking. Elk cijfer komt met bron, jij beslist wat erin gaat.</span></div>
    </div>

    <div class="ct-vak" style="grid-column:1/-1">
      ${kop('Waarom dit zo in elkaar zit')}
      <div style="font-size:13.5px;line-height:1.6">${esc(pk.waarom||'')}</div>
      <div class="bc-hint">${esc(pk.beste_moment||'')}${pk.alt_tekst?` · Alt-tekst: ${esc(pk.alt_tekst)}`:''}</div>
      <div class="bc-acties" style="padding:10px 0 0">
        <button class="btn btn-primary btn-sm" id="ct_klaar">✓ Klaar om te plaatsen</button>
        <button class="btn btn-ghost btn-sm" id="ct_gepost">Gepost</button>
        <button class="btn btn-ghost btn-sm" id="ct_opnieuw">↻ Nieuwe versie</button>
        <button class="btn btn-ghost btn-sm" id="ct_ster">☆ Favoriet</button>
      </div>
    </div>
  </div>`;

  vak.querySelectorAll('[data-hook]').forEach(b=>b.onclick=()=>{
    CT.hookKeus=Number(b.dataset.hook);
    vak.querySelectorAll('[data-hook]').forEach(x=>x.classList.toggle('on',x===b));
    // De gekozen hook wordt regel 1 van de caption, de rest schuift mee.
    const ta=$('#ct_caption'); const regels=ta.value.split('\n');
    regels[0]=CT.pakket.hooks[CT.hookKeus]||regels[0];
    ta.value=regels.join('\n');
    ctPreviewTekenen();
  });
  // dubbele weergave: de hook-knoppen bovenin en de previewkaarten kiezen hetzelfde
  vak.querySelectorAll('[data-kopieer]').forEach(b=>b.onclick=()=>{
    const wat=b.dataset.kopieer;
    const tekst = wat==='caption' ? $('#ct_caption').value
      : wat==='hashtags' ? ctHashtags(CT.pakket.eerste_reactie)
      : wat==='overlays' ? (CT.pakket.overlays||[]).map(o=>`${o.tijd}  ${o.tekst}`).join('\n')
      : wat==='slides' ? (CT.pakket.slides||[]).map((sl,i)=>`${i+1}. ${sl.kop}${sl.sub?'\n   '+sl.sub:''}`).join('\n')
      : '';
    ctKopieer(tekst, b);
  });
  $('#ct_klaar').onclick=()=>ctOpslaan('klaar');
  $('#ct_gepost').onclick=()=>ctOpslaan('gepost');
  $('#ct_opnieuw').onclick=ctGenereer;
  $('#ct_ster').onclick=async()=>{
    if(!CT.postId){await ctOpslaan(null);}
    await sb.rpc('content_post_opslaan',{p_id:CT.postId,p_soort:null,p_onderwerp:null,p_project:null,
      p_doel:null,p_media:null,p_pakket:null,p_caption:null,p_status:null,p_favoriet:true});
    $('#ct_ster').textContent='⭐ Favoriet'; toast('Bewaard als favoriet','ok'); ctLijstLaden();
  };
  $('#ct_verbeter').onclick=ctVerbeter;
  const bakKnop=$('#ct_slides_bakken');
  if(bakKnop) bakKnop.onclick=ctSlidesBakken;
  $('#ct_feiten').onclick=()=>feitenOphalen(
    $('#ct_onderwerp').value.trim()||CT.pakket.caption.slice(0,140),
    $('#ct_feitenvak'),
    f=>{ const ta=$('#ct_caption'); ta.value=ta.value.replace(/\n*$/,'\n\n')+f.feit; ctPreviewTekenen(); });
  if(CT.soort==='reel') voTekenen();
  $('#ct_feedback').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ctVerbeter();}});
  ctPreviewTekenen(); ctPlaatsTekenen();
}

/* Feedbackronde: het huidige pakket gaat mee (inclusief wat Steven zelf al in
   het tekstvak aanpaste, dat is het uitgangspunt), plus de aanwijzing. Het
   model herschrijft gericht en levert het volledige pakket opnieuw. */
async function ctVerbeter(){
  const feedback=$('#ct_feedback').value.trim();
  if(!feedback){toast('Typ eerst wat er anders moet','err');return;}
  if(!CT.pakket){toast('Maak eerst een pakket','err');return;}
  const knop=$('#ct_verbeter'); knop.disabled=true; knop.textContent='Bezig…';
  try{
    const huidig={...CT.pakket, stijl:CT.stijl, opmaak:{...CT_OPMAAK}, caption:($('#ct_caption')&&$('#ct_caption').value)||CT.pakket.caption};
    const {data,error}=await sb.functions.invoke('content-maker',{body:{
      soort:CT.soort, onderwerp:$('#ct_onderwerp').value.trim(), project:CT.project||null,
      doel:CT.doel, aantal_media:CT.media.length, feedback, huidig}});
    if(error||!data||data.ok===false){
      toast((data&&data.reden)||(error&&error.message)||'Aanpassen mislukt','err');return;
    }
    CT.pakket=data.pakket; CT.hookKeus=0;
    ctPakketTekenen();
    await ctOpslaan(null);
    toast('Pakket aangepast','ok');
  } finally { knop.disabled=false; knop.textContent='✨ Pas aan'; }
}

/* De preview toont wat er werkelijk op Instagram komt: jouw media zoals
   geupload, met de caption eronder en de hashtags als eerste reactie. Bij een
   reel ligt de gekozen hook als voorbeeld over het beeld, maar let op: de API
   plaatst de video zoals hij is, tekstoverlays moeten al in de video zitten
   (CapCut of de Instagram-editor). Daarom staat die kanttekening er ook bij. */
function ctPreviewTekenen(){
  const vak=$('#ct_preview'); if(!vak) return;
  const pk=CT.pakket||{};
  const isVideo=m=>/\.(mp4|mov|webm|m4v)$/i.test(m.path)||String(m.type||'').startsWith('video');
  if(!CT.media.length){
    vak.innerHTML='<div class="muted" style="font-size:13px">Upload eerst media, dan zie je hier drie varianten zoals ze op Instagram komen.</div>';
    $('#ct_previewhint').textContent='';
    return;
  }
  const m0=CT.media[0];
  const beeld=isVideo(m0)
    ? `<video src="${ctPubliek(m0.path)}" muted playsinline loop autoplay></video>`
    : `<img src="${ctPubliek(m0.path)}" alt="">`;
  const basisCap=(($('#ct_caption')&&$('#ct_caption').value)||pk.caption||'');
  const hooks=(pk.hooks&&pk.hooks.length?pk.hooks:[basisCap.split('\n')[0]||'']).slice(0,3);

  // IG-iconen als inline SVG, in de lijnstijl van de app
  const icHart='<svg viewBox="0 0 24 24"><path d="M12 20.5C7 16.5 2.8 12.9 2.8 8.9c0-2.6 2-4.6 4.6-4.6 1.8 0 3.5 1 4.6 2.7 1.1-1.7 2.8-2.7 4.6-2.7 2.6 0 4.6 2 4.6 4.6 0 4-4.2 7.6-9.2 11.6z"/></svg>';
  const icReactie='<svg viewBox="0 0 24 24"><path d="M20.7 12a8.7 8.7 0 0 1-12.6 7.8L3 21l1.2-5.1A8.7 8.7 0 1 1 20.7 12z"/></svg>';
  const icDeel='<svg viewBox="0 0 24 24"><path d="M21 3 9.4 13.3M21 3l-6.9 18-4.7-7.7L2 9.9 21 3z"/></svg>';
  const icBewaar='<svg viewBox="0 0 24 24"><path d="M19 21 12 16.5 5 21V4.5A1.5 1.5 0 0 1 6.5 3h11A1.5 1.5 0 0 1 19 4.5V21z"/></svg>';

  // Bij een reel: de gekozen hook in drie tekst-designs; wat gekozen is wordt
  // bij de voice-over echt zo in de video gebakken.
  const accentWoord=w=>/\d|%|euro|bali|passief|rendement|cash|verkocht|laatste/i.test(w);
  const hookHtml=(hook,om)=>{
    const f=CT_FONTS.find(x=>x.key===om.font)||CT_FONTS[0];
    const tekst=f.caps?hook.toUpperCase():hook;
    const stijlen=[`font-family:${f.css}`,`font-weight:${f.dik}`];
    if(f.spatie) stijlen.push('letter-spacing:.09em');
    if(f.gloed&&om.achtergrond==='geen') stijlen.push('text-shadow:0 0 10px rgba(255,255,255,.85),0 1px 10px rgba(0,0,0,.6)');
    if(f.rand&&om.achtergrond==='geen') stijlen.push('-webkit-text-stroke:1px #000;paint-order:stroke fill');
    const inhoud = om.accent
      ? tekst.split(' ').map(w=>accentWoord(w)?`<b>${esc(w)}</b>`:esc(w)).join(' ')
      : esc(tekst);
    if(om.achtergrond!=='geen'){
      const [bg,fg]=om.achtergrond==='wit'?['#fff','#111']:['#111','#fff'];
      return `<span style="${stijlen.join(';')}"><i style="background:${bg};color:${fg}">${inhoud}</i></span>`;
    }
    return `<span style="${stijlen.join(';')}">${inhoud}</span>`;
  };
  const hookOpmaak=(hook,stijlKey)=>{
    const st=CT_STIJLEN.find(x=>x.key===stijlKey);
    const om={...st.opmaak,font:CT_OPMAAK.font};
    // De Tekstblok-kaart volgt de gekozen blokkleur van de achtergrondknop
    if(stijlKey==='blok'&&CT_OPMAAK.achtergrond==='zwart') om.achtergrond='zwart';
    return hookHtml(hook,om);
  };
  const kaart=(hook,i,stijl)=>{
    // Elke variant: de hook als regel 1, de rest van de caption blijft gelijk
    const regels=basisCap.split('\n'); regels[0]=hook; const cap=regels.join('\n');
    // "… meer" werkt zoals in de app: klik en de hele caption klapt uit
    const dicht=cap.length>110?cap.slice(0,110).replace(/\s+\S*$/,''):cap;
    const kort=CT.capOpen?cap:dicht;
    const meerHtml=cap.length>dicht.length
      ? (CT.capOpen?' <span class="meer" data-meer style="cursor:pointer">minder</span>'
                   :'<span class="meer" data-meer style="cursor:pointer">… meer</span>')
      : '';

    if(CT.soort==='reel'){
      const st=CT_STIJLEN[i];
      const actief=st.key==='blok'
        ? (CT_OPMAAK.achtergrond!=='geen'&&!CT_OPMAAK.accent)
        : (CT_OPMAAK.achtergrond===st.opmaak.achtergrond&&CT_OPMAAK.accent===st.opmaak.accent);
      return `<div class="ig-kaart ${actief?'on':''}" data-igstijl="${st.key}">
        <div class="keuze"><span>${esc(st.naam)}</span><span>${actief?'✓ gekozen':'klik om te kiezen'}</span></div>
        <div class="ig-frame reel"><div class="ig-media">
          ${beeld}
          <div class="ig-hooktekst ${st.key}">${hookOpmaak(hook,st.key)}</div>
          <div class="ig-reelhud">
            <div class="onder">
              <div class="wie"><span class="ig-avatar"><i>S</i></span> stevenbalivillas <span class="volg">Volgen</span></div>
              <div class="cap" style="${CT.capOpen?'display:block;-webkit-line-clamp:unset':''}">${esc(kort)}${meerHtml}</div>
              <div class="audio">♫ stevenbalivillas · Origineel audio</div>
            </div>
            <div class="zij">
              <span>${icHart}12,4K</span><span>${icReactie}214</span><span>${icDeel}</span>
            </div>
          </div>
        </div></div>
      </div>`;
    }
    return `<div class="ig-kaart ${i===CT.hookKeus?'on':''}" data-igkeuze="${i}">
      <div class="keuze"><span>Optie ${i+1}</span><span>${i===CT.hookKeus?'✓ gekozen':'klik om te kiezen'}</span></div>
      <div class="ig-frame">
        <div class="ig-kop"><span class="ig-avatar"><i>S</i></span><b>stevenbalivillas</b><span class="ig-meer">···</span></div>
        <div class="ig-media">${beeld}
          ${CT.soort==='carousel'&&CT.media.length>1?`<span class="ig-teller">1/${CT.media.length}</span>`:''}
        </div>
        ${CT.soort==='carousel'&&CT.media.length>1?`<div class="ig-dots">${CT.media.map((_,d)=>`<i class="${d===0?'on':''}"></i>`).join('')}</div>`:''}
        <div class="ig-acties">${icHart}${icReactie}${icDeel}<span class="rechts">${icBewaar}</span></div>
        <div class="ig-likes">1.204 vind-ik-leuks</div>
        <div class="ig-caption"><b>stevenbalivillas</b>${esc(kort)}${meerHtml}</div>
        <div class="ig-reacties">Alle 89 reacties bekijken</div>
        <div class="ig-tijd">1 uur geleden</div>
      </div>
    </div>`;
  };

  const gekozenHook=hooks[Math.min(CT.hookKeus,hooks.length-1)]||hooks[0];
  const bewerkBalk=CT.soort!=='reel'?'':`
    <div class="vo-knoppen" style="margin-top:2px;flex-wrap:wrap">
      <span class="muted" style="font-size:12px;font-weight:700">FONT</span>
      ${CT_FONTS.map(f=>`<button class="bc-chip ${CT_OPMAAK.font===f.key?'on':''}" data-igfont="${f.key}" title="Zoals in de Instagram-editor">${f.naam}</button>`).join('')}
      <span class="muted" style="font-size:12px;font-weight:700;margin-left:10px">ACHTERGROND</span>
      ${[['geen','Geen'],['wit','Wit'],['zwart','Zwart']].map(([k,n])=>`<button class="bc-chip ${CT_OPMAAK.achtergrond===k?'on':''}" data-igbg="${k}">${n}</button>`).join('')}
    </div>`;
  vak.innerHTML=`<div class="ig-rij">${CT.soort==='reel'
    ? CT_STIJLEN.map((st,i)=>kaart(gekozenHook,i)).join('')
    : hooks.map((h,i)=>kaart(h,i)).join('')}</div>`+bewerkBalk;
  // De caption groeit mee met de inhoud zodat je nooit in het vak scrollt
  const capTa=document.querySelector('#ct_caption');
  if(capTa&&!capTa.dataset.groei){
    capTa.dataset.groei='1';
    const groei=()=>{capTa.style.height='auto';capTa.style.height=Math.max(capTa.scrollHeight+4,280)+'px';};
    capTa.addEventListener('input',groei); setTimeout(groei,0);
  }
  vak.querySelectorAll('[data-meer]').forEach(m=>m.onclick=e=>{
    e.stopPropagation(); CT.capOpen=!CT.capOpen; ctPreviewTekenen();
  });
  vak.querySelectorAll('[data-igstijl]').forEach(k=>k.onclick=()=>{
    CT.stijl=k.dataset.igstijl;
    const st=CT_STIJLEN.find(x=>x.key===CT.stijl);
    CT_OPMAAK={...CT_OPMAAK,...st.opmaak};
    if(CT.pakket){CT.pakket.stijl=CT.stijl;CT.pakket.opmaak={...CT_OPMAAK};}
    ctPreviewTekenen();
  });
  vak.querySelectorAll('[data-igfont]').forEach(k=>k.onclick=()=>{
    CT_OPMAAK.font=k.dataset.igfont;
    if(CT.pakket)CT.pakket.opmaak={...CT_OPMAAK};
    ctPreviewTekenen();
  });
  vak.querySelectorAll('[data-igbg]').forEach(k=>k.onclick=()=>{
    // De A-knop: de tekstkleur keert automatisch om met de achtergrond
    CT_OPMAAK.achtergrond=k.dataset.igbg;
    if(CT.pakket)CT.pakket.opmaak={...CT_OPMAAK};
    ctPreviewTekenen();
  });
  vak.querySelectorAll('[data-igkeuze]').forEach(k=>k.onclick=()=>{
    CT.hookKeus=Number(k.dataset.igkeuze);
    const ta=$('#ct_caption');
    if(ta){const regels=ta.value.split('\n');regels[0]=hooks[CT.hookKeus]||regels[0];ta.value=regels.join('\n');}
    document.querySelectorAll('[data-hook]').forEach(b=>b.classList.toggle('on',Number(b.dataset.hook)===CT.hookKeus));
    ctPreviewTekenen();
  });

  $('#ct_previewhint').innerHTML = (CT.soort==='reel'
    ? 'Drie tekst-designs met je gekozen hook (wissel de hook met de knoppen hierboven). Kies een stijl en de voice-over-video wordt precies zo gebakken; zet je de tekst zelf in CapCut, gebruik hem dan als voorbeeld. De cijfers en knoppen zijn decor.'
    : 'Klik de variant die je wilt; de hook wordt regel 1 van je caption. De cijfers en de knoppen zijn decor, zodat je hem ziet zoals een volger hem in de app ziet.');
  const ta=$('#ct_caption');
  if(ta&&!ta.dataset.previewkoppeling){ta.dataset.previewkoppeling='1';let t;ta.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(ctPreviewTekenen,400);});}
}

/* ============== GROTE VIDEO'S VERKLEINEN ==============
   iPhone-video's zijn 4K HEVC met bitrates van 50 Mbps en meer; een clip van
   een paar minuten is dan honderden MB's. Instagram codeert alles toch terug
   naar zo'n 1080p, dus we doen dat hier alvast: opnieuw coderen op 1080p met
   10 Mbps. Visueel verliesvrij voor social (echt lossless verkleinen bestaat
   niet), en een factor vijf a tien kleiner. Het duurt wel zo lang als de clip
   zelf duurt: de browser speelt hem af en neemt het resultaat op, dezelfde
   beproefde pijplijn als de voice-over-render. Audio gaat mee via de
   AudioContext (het element zelf blijft stil).
   Boven deze grens wordt automatisch verkleind: */
const VIDEO_VERKLEIN_GRENS = 200*1048576;

async function videoVerkleinen(file, status){
  const url=URL.createObjectURL(file);
  try{
    const v=document.createElement('video'); v.src=url; v.playsInline=true;
    await new Promise((ok,nee)=>{v.onloadedmetadata=ok; v.onerror=()=>nee(new Error('video niet afspeelbaar in deze browser'));});
    const duur=v.duration;
    if(!isFinite(duur)||duur<=0) throw new Error('videoduur onbekend');
    if(duur>15*60) throw new Error('langer dan 15 minuten; knip hem eerst');

    // 1080 op de korte zijde, de verhouding blijft
    const sch=Math.min(1, 1080/Math.min(v.videoWidth, v.videoHeight));
    const bw=Math.round(v.videoWidth*sch/2)*2, bh=Math.round(v.videoHeight*sch/2)*2;
    const canvas=document.createElement('canvas'); canvas.width=bw; canvas.height=bh;
    const ctx=canvas.getContext('2d');

    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const bestem=ac.createMediaStreamDestination();
    ac.createMediaElementSource(v).connect(bestem);

    const beeld=canvas.captureStream(30);
    const sporen=[...beeld.getVideoTracks(),...bestem.stream.getAudioTracks()];
    const mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm']
      .find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'video/webm';
    const uit=[]; const opn=new MediaRecorder(new MediaStream(sporen),{mimeType:mime,videoBitsPerSecond:10_000_000,audioBitsPerSecond:128_000});
    opn.ondataavailable=e=>{if(e.data.size)uit.push(e.data);};
    const klaar=new Promise(ok=>{opn.onstop=ok;});

    const teken=()=>{ if(v.ended) return;
      ctx.drawImage(v,0,0,bw,bh);
      if(status) status(`Video verkleinen: ${Math.round(v.currentTime/duur*100)}% (duurt zo lang als de clip zelf)`);
      requestAnimationFrame(teken); };

    await ac.resume(); opn.start(1000); await v.play();
    requestAnimationFrame(teken);
    await new Promise(ok=>{v.onended=ok; setTimeout(ok,(duur+3)*1000);});
    opn.stop(); await klaar; try{ac.close();}catch(e){}

    const blob=new Blob(uit,{type:mime.split(';')[0]});
    if(!blob.size) throw new Error('verkleinen leverde niets op');
    return {blob, ext:mime.includes('mp4')?'mp4':'webm', type:mime.split(';')[0]};
  } finally { URL.revokeObjectURL(url); }
}

/* ============== MEDIABIBLIOTHEEK ==============
   Stevens foto's en video's, bulk geupload (vanaf de iPhone is dat de directe
   brug naar iCloud Photos: de bestandskiezer opent daar de fotorol). Na de
   upload bekijkt vision elk beeld en slaat op wat erop staat, bij welke
   weekrubriek het past en hoe sterk het is. De kiezer in de maker sorteert
   daarop: rubriek-match eerst, dan score, en wat onlangs gebruikt is zakt
   weg zodat niet elke week hetzelfde beeld terugkomt. */
let BIB={rijen:[],laden:false};

async function bibLaden(){
  const {data,error}=await sb.from('content_bibliotheek').select('*').order('aangemaakt_at',{ascending:false}).limit(400);
  if(!error&&Array.isArray(data)) BIB.rijen=data;
  return BIB.rijen;
}

function bibThumb(r){ return ctPubliek(r.thumb_path||r.path); }

// Tegelbeeld: foto's en video's met thumbnail als afbeelding; video's zonder
// thumbnail als video-element zodat de browser zelf het eerste frame toont
// (anders blijft de tegel zwart).
function bibTegelMedia(r){
  if(r.soort==='video'&&!r.thumb_path)
    return `<video src="${ctPubliek(r.path)}#t=0.5" preload="metadata" muted playsinline></video>`;
  return `<img src="${bibThumb(r)}" loading="lazy" alt="">`;
}

/* Afspeelknop: het filmpje bekijken zonder het te selecteren. */
function bibSpeler(pad){
  const oud=document.querySelector('#bib_speler'); if(oud) oud.remove();
