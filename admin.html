/* ================= REVENUE ================= */
const REV_BOOKED=['contracted','signed','completed','delivered','sold','paid','closed','won'];
const REV_PIPELINE=['reserved','reservation','option','pending','deposit','offer','negotiation','intent'];
const REV_LOST=['cancelled','canceled','refunded','lost','withdrawn','declined'];
function revClass(s){s=(s||'').toLowerCase().trim();if(REV_BOOKED.includes(s))return 'booked';if(REV_PIPELINE.includes(s))return 'pipeline';if(REV_LOST.includes(s))return 'lost';return 'other';}
function revBadgeClass(c){return c==='booked'?'green':c==='pipeline'?'blue':c==='lost'?'red':'grey';}
let REV_PROJ='';
async function renderRevenue(){
  const v=$('#view');v.innerHTML='<div class="muted" style="padding:8px">Loading revenue…</div>';
  const [projR,purR]=await Promise.all([
    sb.from('projects').select('name,slug,status,units_total,units_available,price_start,price_current,reservation_amount,sort_order').order('sort_order',{ascending:true}),
    sb.from('purchases').select('project,unit,buyer_name,status,price,deposit_amount,received_amount,contract_signed_at,created_at').order('contract_signed_at',{ascending:false,nullsFirst:false}),
  ]);
  if(purR.error){v.innerHTML=`<div class="panel"><div class="empty">Couldn’t load revenue: ${esc(purR.error.message)}</div></div>`;return;}
  const projs=projR.data||[],P=purR.data||[];
  // Gereserveerde units telden nergens mee: ze staan niet in purchases (nog niet
  // verkocht) en niet in units_available (terecht niet vrij). The Maison liet
  // daardoor "2 of 4 units" zien terwijl er 6 zijn, en de portefeuillewaarde
  // miste twee villa's. De beschikbaarheid komt uit dezelfde functie als het
  // siteplan op de website, zodat beide altijd hetzelfde zeggen.
  const besch={};
  await Promise.all(projs.filter(pr=>pr.slug).map(async pr=>{
    const {data}=await sb.rpc('project_availability',{p_slug:pr.slug});
    if(data)besch[pr.slug]=data;
  }));
  P.forEach(x=>{x._c=revClass(x.status);x._p=Number(x.price)||0;x._d=Number(x.deposit_amount)||0;x._r=(x.received_amount==null)?null:Number(x.received_amount);});
  const sales=P.filter(x=>x._c!=='lost'&&x._c!=='pipeline');

  // per project: sold units & revenue come from actual deals (real per-unit prices); remaining from project inventory
  const rows=projs.map(pr=>{
    const deals=sales.filter(x=>anMatchProj(x.project,pr.name,pr.slug));
    const sold=deals.length, soldRev=deals.reduce((a,x)=>a+x._p,0);
    const dt=deals.filter(x=>x._r!=null);
    const recv=dt.reduce((a,x)=>a+x._r,0), toRecv=dt.reduce((a,x)=>a+Math.max(0,x._p-x._r),0);
    const untrk=deals.some(x=>x._r==null);
    const askPrice=Number(pr.price_current||pr.price_start)||0;
    const avail=(pr.units_available==null)?Math.max(0,(Number(pr.units_total)||sold)-sold):Number(pr.units_available);
    // Getekend maar nog niet afgerekend. Tegen de huidige vraagprijs, want dat
    // is wat deze units gaan opleveren; de al verkochte staan op hun eigen
    // contractprijs en die kan lager liggen.
    const b=besch[pr.slug];
    const resv=b?(Number(b.reserved)||0):Math.max(0,(Number(pr.units_total)||0)-sold-avail);
    return {name:pr.name,slug:pr.slug,status:pr.status,sold,soldRev,recv,toRecv,untrk,askPrice,avail,
      resv, resvValue:resv*askPrice,
      remaining:avail*askPrice, total:sold+resv+avail, avg:sold?soldRev/sold:0, deals};
  });
  // deals whose project isn't in the projects table
  const known=new Set(projs.map(p=>(p.name||'').toLowerCase()));
  const orphan=sales.filter(x=>!projs.some(pr=>anMatchProj(x.project,pr.name,pr.slug)));
  // Deals for projects not in the active projects table (e.g. earlier sold-out projects) — group by their own name.
  const orphanByName={};
  orphan.forEach(x=>{const k=(x.project||'Overig').trim();(orphanByName[k]=orphanByName[k]||[]).push(x);});
  Object.keys(orphanByName).sort().forEach(nm=>{
    const ds=orphanByName[nm];const orv=ds.reduce((a,x)=>a+x._p,0);const odt=ds.filter(x=>x._r!=null);
    rows.push({name:nm,slug:null,status:'uitverkocht',sold:ds.length,soldRev:orv,recv:odt.reduce((a,x)=>a+x._r,0),toRecv:odt.reduce((a,x)=>a+Math.max(0,x._p-x._r),0),untrk:ds.some(x=>x._r==null),askPrice:0,avail:0,resv:0,resvValue:0,remaining:0,total:ds.length,avg:orv/ds.length,deals:ds});
  });

  // ----- project filter (dropdown at top): scope all figures to one project, or all -----
  const projNames=rows.map(r=>r.name);
  const selRow=REV_PROJ?rows.find(r=>r.name===REV_PROJ):null;
  if(REV_PROJ&&!selRow)REV_PROJ=''; // selected project no longer exists → reset to all
  const scopeRows=selRow?[selRow]:rows;
  const scopeSales=selRow?selRow.deals:sales;
  // all deals (incl. lost/pipeline) for the deals table, scoped to the selected project
  const dealProjName=x=>{const pr=projs.find(pp=>anMatchProj(x.project,pp.name,pp.slug));return pr?pr.name:(x.project||'Overig').trim();};
  const scopeAllDeals=selRow?P.filter(x=>dealProjName(x)===selRow.name):P;

  const totalRevenue=scopeSales.reduce((a,x)=>a+x._p,0);
  const totalSold=scopeSales.length;
  const remainingValue=scopeRows.reduce((a,r)=>a+r.remaining,0);
  const totalAvail=scopeRows.reduce((a,r)=>a+r.avail,0);
  const totalResv=scopeRows.reduce((a,r)=>a+(r.resv||0),0);
  const resvValue=scopeRows.reduce((a,r)=>a+(r.resvValue||0),0);
  // Alle units tellen mee, ook de gereserveerde. Anders klopt de noemer niet:
  // The Maison heeft er 6, niet 4.
  const totalUnits=totalSold+totalResv+totalAvail;
  const portfolioValue=totalRevenue+resvValue+remainingValue;
  const avgPrice=totalSold?totalRevenue/totalSold:0;
  const sellThrough=totalUnits?totalSold/totalUnits:0;
  // Funds received vs still to come (per-deal received_amount; deals without a figure are 'untracked')
  const tracked=scopeSales.filter(x=>x._r!=null), untracked=scopeSales.filter(x=>x._r==null);
  const received=tracked.reduce((a,x)=>a+x._r,0);
  const toReceive=tracked.reduce((a,x)=>a+Math.max(0,x._p-x._r),0);
  const untrackedVal=untracked.reduce((a,x)=>a+x._p,0);

  const kpis=[
    ['Deals to date',anMoney(totalRevenue),totalSold+' unit'+(totalSold===1?'':'s')+' verkocht'],
    ['Ontvangen',anMoney(received),'daadwerkelijk binnengekomen','#0f9d74'],
    ['Nog te ontvangen',anMoney(toReceive),'openstaande termijnen · excl. voorraad','#b7791f'],
    ['Avg. sale price',totalSold?anMoney(avgPrice):'—','per sold unit'],
    ['Gereserveerd',anMoney(resvValue),totalResv+' unit'+(totalResv===1?'':'s')+' · ITP getekend, nog niet afgerekend','#5e30eb'],
    ['Remaining inventory',anMoney(remainingValue),totalAvail+' units for sale'],
    ['Sell-through rate',anPct(sellThrough),totalSold+' of '+totalUnits+' units'],
    ['Total portfolio value',anMoney(portfolioValue),'verkocht + gereserveerd + voorraad'],
  ];

  let html='';
  html+=`<div class="an-note">💰 <b>Deals to date</b> = contractwaarde van reeds verkochte units. <b>Ontvangen</b> = daarvan al binnengekomen. <b>Nog te ontvangen</b> = openstaande termijnen op díe verkochte units — dus <b>exclusief</b> nog te verkopen voorraad; de waarde van onverkochte units staat apart onder <b>Voorraad (te verkopen)</b>. <b>Gereserveerd</b> = units waarvan de ITP is getekend maar de aanbetaling nog niet is afgerekend, gerekend tegen de huidige vraagprijs. Bron: <b>MASTER_MOKA_MAISON.xlsx</b> (Moneybird UTAMA + Maison + Privé) — laatste sync 31 jul 2026.${untrackedVal>0?` Let op: <b>${anMoney(untrackedVal)}</b> (${untracked.length} deal${untracked.length===1?'':'s'}) nog niet bijgehouden.`:''}</div>`;
  const revOpts=`<option value="">Alle projecten</option>`+projNames.map(n=>`<option value="${esc(n)}"${REV_PROJ===n?' selected':''}>${esc(n)}</option>`).join('');
  html+=`<div class="toolbar" style="margin:0 0 14px;display:flex;align-items:center;gap:10px"><label class="muted" style="font-size:13px;font-weight:600">Project</label><select id="rev_proj" style="padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;min-width:220px">${revOpts}</select>${selRow?`<span class="muted" style="font-size:13px">— alle cijfers hieronder tonen alleen <b>${esc(selRow.name)}</b></span>`:''}</div>`;
  html+='<div class="cards">'+kpis.map(k=>`<div class="stat"><div class="k">${k[0]}</div><div class="v"${k[3]?` style="color:${k[3]}"`:''}>${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')+'</div>';

  html+=`<div class="panel"><div class="panel-head"><div><h3>Land lease — privé (30%)</h3><div class="desc">30% van de totale dealwaarde die jij privé ontvangt als land lease — conform MASTER_MOKA_MAISON.xlsx.</div></div></div>
    <div class="rev-row"><div><div class="rk">Reeds ontvangen</div><div class="rv" style="color:#0f9d74">${anMoney(Math.round(received*0.3))}</div></div><div><div class="rk">Nog te ontvangen</div><div class="rv" style="color:#b7791f">${anMoney(Math.round(toReceive*0.3))}</div></div><div><div class="rk">Totaal potentieel</div><div class="rv">${anMoney(Math.round((received+toReceive)*0.3))}</div></div></div></div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Revenue by project</h3><div class="desc">Gerealiseerde omzet uit verkochte units, plus resterende voorraadwaarde.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Project</th><th>Status</th><th>Units sold</th><th>Deal value</th><th>Ontvangen</th><th>Nog te ontvangen</th><th>Voorraad (te verkopen)</th></tr></thead><tbody>
    ${scopeRows.length?scopeRows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.status?`<span class="badge grey">${esc(p.status)}</span>`:'—'}</td><td>${anInt(p.sold)} / ${anInt(p.total)}</td><td><b>${p.soldRev?anMoney(p.soldRev):'—'}</b></td><td style="color:#0f9d74">${p.recv?anMoney(p.recv):(p.untrk?'<span class="muted">n.v.t.</span>':'—')}</td><td style="color:#b7791f">${p.toRecv?anMoney(p.toRecv):(p.untrk&&!p.recv?'<span class="muted">n.v.t.</span>':'—')}</td><td>${p.remaining?anMoney(p.remaining):'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No projects yet.</td></tr>'}
    </tbody><tfoot><tr style="font-weight:750;background:#fafbfa"><td>Total</td><td></td><td>${anInt(totalSold)} / ${anInt(totalSold+totalAvail)}</td><td>${anMoney(totalRevenue)}</td><td style="color:#0f9d74">${anMoney(received)}</td><td style="color:#b7791f">${anMoney(toReceive)}</td><td>${anMoney(remainingValue)}</td></tr></tfoot></table></div></div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Ontvangen per project</h3><div class="desc">Geld dat al binnen is.</div></div></div>${anBars(scopeRows.filter(r=>r.recv>0).map(r=>({label:r.name,value:r.recv,display:anMoney(r.recv),sub:'· van '+anMoney(r.soldRev)})),'#0f9d74')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Nog te ontvangen per project</h3><div class="desc">Resterende contracttermijnen die nog binnen moeten komen.</div></div></div>${anBars(scopeRows.filter(r=>r.toRecv>0).map(r=>({label:r.name,value:r.toRecv,display:anMoney(r.toRecv),sub:'· van '+anMoney(r.soldRev)})),'#b7791f')}</div>
  </div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Deal value by project</h3><div class="desc">Contractwaarde uit verkochte units.</div></div></div>${anBars(scopeRows.filter(r=>r.soldRev>0).map(r=>({label:r.name,value:r.soldRev,display:anMoney(r.soldRev),sub:'· '+r.sold+' sold'})),'#14b37d')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Remaining inventory value</h3><div class="desc">Nog te verkopen voorraad × vraagprijs.</div></div></div>${anBars(scopeRows.filter(r=>r.remaining>0).map(r=>({label:r.name,value:r.remaining,display:anMoney(r.remaining),sub:'· '+r.avail+' left'})),'#b7791f')}</div>
  </div>`;

  const recent=scopeAllDeals.slice(0,40);
  html+=`<div class="panel"><div class="panel-head"><div><h3>Deals (${scopeAllDeals.length})</h3><div class="desc">Verkochte units — wie kocht welke villa, voor welke prijs en wanneer.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Buyer</th><th>Project</th><th>Unit</th><th>Status</th><th>Price</th><th>Contract date</th></tr></thead><tbody>
    ${recent.length?recent.map(x=>`<tr><td><b>${esc(x.buyer_name||'—')}</b></td><td>${esc(x.project||'—')}</td><td>${esc(x.unit||'—')}</td><td><span class="badge ${revBadgeClass(x._c)}">${esc(x.status||'—')}</span></td><td><b>${x._p?anMoney(x._p):'—'}</b></td><td>${x.contract_signed_at?fmtDate(x.contract_signed_at):'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No deals yet.</td></tr>'}
    </tbody></table></div></div>`;

  v.innerHTML=html;
  const rp=$('#rev_proj');if(rp)rp.onchange=()=>{REV_PROJ=rp.value;renderRevenue();};
}

async function renderResource(resKey,mount){
  const R=RES[resKey];const editable=canEdit(R.page)&&!R.readOnly;const canCreate=editable&&!R.noCreate;
  mount.innerHTML=`<div class="panel"><div class="panel-head"><div><h3>${R.title} <span class="count-pill" id="cnt_${resKey}">…</span></h3><div class="desc">${R.desc||''}</div></div>
    <div class="toolbar"><input class="search" id="search_${resKey}" placeholder="Search…">${canCreate?`<button class="btn btn-primary btn-sm" id="add_${resKey}">+ New ${R.single}</button>`:(editable?'':'<span class="readonly-tag">Read only</span>')}</div></div>
    <div class="table-wrap" id="tw_${resKey}"><div class="empty">Loading…</div></div></div>`;
  const ob=R.orderBy||'created_at';
  const {data,error}=await sb.from(R.table).select('*').order(ob,{ascending:!!R.asc,nullsFirst:false});
  if(error){$('#tw_'+resKey).innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`;const c=$('#cnt_'+resKey);if(c)c.textContent='!';return;}
  _cache[resKey]=data||[];
  $('#cnt_'+resKey).textContent=_cache[resKey].length;
  drawTable(resKey);
  if(canCreate)$('#add_'+resKey).onclick=()=>openForm(resKey,null);
  $('#search_'+resKey).addEventListener('input',()=>drawTable(resKey));
}
function drawTable(resKey){
  const R=RES[resKey];const editable=canEdit(R.page)&&!R.readOnly;
  const q=($('#search_'+resKey)?.value||'').toLowerCase();
  let rows=_cache[resKey]||[];
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  const tw=$('#tw_'+resKey);if(!tw)return;
  if(!rows.length){tw.innerHTML='<div class="empty">No records'+(q?' match your search.':' yet.')+'</div>';return;}
  let h='<table><thead><tr>';
  R.cols.forEach(c=>{const def=R.fields.find(f=>f.k===c);h+=`<th>${esc(def?def.label:c)}</th>`;});

const PM_BUCKET='project-media';
function pmPublicUrl(path){try{return sb.storage.from(PM_BUCKET).getPublicUrl(path).data.publicUrl;}catch(e){return '';}}
function pmBytes(n){if(n==null)return '';const u=['B','KB','MB','GB'];let i=0,v=Number(n);while(v>=1024&&i<u.length-1){v/=1024;i++;}return v.toFixed(v<10&&i>0?1:0)+' '+u[i];}
// Verklein grote beelden client-side (canvas) zodat je geen 50MB-renders hoeft te uploaden.
async function pmCompress(file){
  if(!/^image\//.test(file.type))return {blob:file,width:null,height:null,note:'geen afbeelding'};
  try{
    const bmp=await createImageBitmap(file);
    const maxDim=2560;const w=bmp.width,h=bmp.height;
    const scale=Math.min(1,maxDim/Math.max(w,h));
    const cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
    const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
    const cx=cv.getContext('2d');
    // JPEG kent geen transparantie: zonder witte ondergrond worden transparante
    // vlakken zwart (speelde bij plattegronden/PNG's met vrijstaande achtergrond).
    cx.fillStyle='#ffffff'; cx.fillRect(0,0,cw,ch);
    cx.drawImage(bmp,0,0,cw,ch);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
    if(bmp.close)bmp.close();
    if(blob&&blob.size<file.size)return {blob,width:cw,height:ch};
    return {blob:file,width:w,height:h};
  }catch(e){return {blob:file,width:null,height:null};}
}

      t.addEventListener('dragleave',()=>t.classList.remove('pm-drop'));
      t.addEventListener('drop',e=>{if(!PMDRAG)return;e.preventDefault();t.classList.remove('pm-drop');const d=PMDRAG;if(d&&d!==id)projMediaReorderTo(d,id);});
    });
  }
}
async function projMediaUpload(projectId,files){
  const prog=$('#pm_prog');let done=0,fail=0;
  let base=(PMEDIA.items||[]).reduce((mx,x)=>Math.max(mx,x.sort_order||0),-1)+1;
  for(const file of files){
    if(prog)prog.textContent=`Bezig… (${done+1}/${files.length}) ${file.name}`;
    const {blob,width,height}=await pmCompress(file);
    const ext=blob.type==='image/jpeg'?'jpg':((file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin');
    const path=`${projectId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await sb.storage.from(PM_BUCKET).upload(path,blob,{contentType:blob.type||'application/octet-stream',upsert:false});
    if(up.error){fail++;toast('Upload mislukt: '+up.error.message,'err');continue;}
    const ins=await sb.from('project_media').insert({project_id:projectId,path,bytes:blob.size,width,height,sort_order:base++});
    if(ins.error){fail++;toast('Opslaan mislukt: '+ins.error.message,'err');continue;}
    done++;
  }
  if(prog)prog.textContent='';
  if(done)toast(`${done} render${done===1?'':'s'} toegevoegd${fail?` · ${fail} mislukt`:''}`,fail?'err':'ok');
  projMediaReload(projectId);
}
async function projMediaSetKind(id){
  // Wissel tussen 'render' (foto/render, gaat in de galerij) en 'floorplan'
  // (plattegrond, komt in de aparte Plattegronden-sectie in brochure + PDF).
  const it=(PMEDIA.items||[]).find(x=>x.id===id); if(!it) return;
  const next=(it.kind==='floorplan')?'render':'floorplan';
  const {error}=await sb.from('project_media').update({kind:next}).eq('id',id);
  if(error){toast('Kon type niet wijzigen: '+error.message,'err'); return;}
  projMediaReload(PMEDIA.projectId);
}
async function projMediaMove(id,dir){
  const items=(PMEDIA.items||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const i=items.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=items.length)return;
  const tmp=items[i];items[i]=items[j];items[j]=tmp;
  await pmPersistOrder(items);
}
// Sleep-ordenen: verplaats 'dragId' naar de plek van 'targetId'.
async function projMediaReorderTo(dragId,targetId){
  const items=(PMEDIA.items||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const from=items.findIndex(x=>x.id===dragId),to=items.findIndex(x=>x.id===targetId);
  if(from<0||to<0||from===to)return;
  const [moved]=items.splice(from,1);items.splice(to,0,moved);
  await pmPersistOrder(items);
}
async function pmPersistOrder(items){
  const ups=[];items.forEach((it,idx)=>{if(it.sort_order!==idx){it.sort_order=idx;ups.push(sb.from('project_media').update({sort_order:idx}).eq('id',it.id));}});
  PMEDIA.items=items;projMediaRender();
  const rs=await Promise.all(ups);if(rs.some(r=>r&&r.error))toast('Volgorde opslaan mislukt','err');
}
async function projMediaDelete(id){
  const m=(PMEDIA.items||[]).find(x=>x.id===id);if(!m)return;
  if(!confirm('Deze render verwijderen?'))return;
  await sb.storage.from(PM_BUCKET).remove([m.path]);
  const {error}=await sb.from('project_media').delete().eq('id',id);
  if(error){toast('Verwijderen mislukt: '+error.message,'err');return;}
  toast('Verwijderd','ok');projMediaReload(PMEDIA.projectId);
}

    else if(f.type==='date')input=`<input id="f_${f.k}" type="date" value="${val?String(val).slice(0,10):''}"${dis}>`;

      else if(f.type==='datetime')v=v?new Date(v).toISOString():null;

    // OPEN action items — persist until handled_at is set (dataroom also closes when access granted)
    const items=[];
    leads.filter(l=>!l.handled_at).forEach(l=>{
      if(l.type==='dataroom_request'&&!grantedProj.has((l.project||'').toLowerCase()))
        items.push({kind:'dataroom',leadId:l.id,project:l.project||'',unit:l.unit||'',at:l.created_at});
      else if(l.type==='reservation')
        items.push({kind:'reservation',leadId:l.id,project:l.project||'',unit:l.unit||'',at:l.created_at});
    });
    const myRes=[...(rvById[c.id]||[]),...(rvByEmail[(c.email||'').toLowerCase()]||[])];
    const seenRv=new Set();
    myRes.forEach(rvw=>{
      if(seenRv.has(rvw.id))return;seenRv.add(rvw.id);
      const paid=(rvw.status==='deposit_paid'||rvw.payment_status==='paid');
      if(paid)return;
      if(rvw.payment_status==='transfer_reported')
        items.push({kind:'deposit',resId:rvw.id,project:rvw.project||'',unit:rvw.unit||'',amount:rvw.deposit_amount,at:rvw.itp_signed_at});
      else if(rvw.itp_signed_at)
        items.push({kind:'itp',resId:rvw.id,project:rvw.project||'',unit:rvw.unit||'',amount:rvw.deposit_amount,at:rvw.itp_signed_at});
    });
    const newestLead=leads.reduce((m,l)=>Math.max(m,l.created_at?new Date(l.created_at).getTime():0),0);
    const lastAct=c.last_activity_at?new Date(c.last_activity_at).getTime():0;
    return {...c,_leads:leads,_items:items,
      _pending:items.filter(i=>i.kind==='dataroom').map(i=>i.project),
      _resv:items.filter(i=>i.kind==='reservation'),
      _itp:items.filter(i=>i.kind==='itp').length,
      _deposit:items.filter(i=>i.kind==='deposit').length,
      _isNew:(now-Math.max(lastAct,newestLead))<WK,_activeDr:grantedProj.size};
  });
  const cel=$('#cnt_people');if(cel)cel.textContent=PEOPLE.length;
  drawRecentSignups();
  drawPeople();
  warmthLoad(PEOPLE.map(p=>p.id)).then(()=>{if(CURRENT==='leads')drawPeople();});
  $('#search_people').addEventListener('input',drawPeople);
  if(PENDING_OPEN_PERSON){const p=PEOPLE.find(x=>x.id===PENDING_OPEN_PERSON);PENDING_OPEN_PERSON=null;if(p)openPerson(p);}
}
let SIGNUPS_LIMIT=25,SIGNUPS_DAYS=null;
function drawRecentSignups(){
  const el=$('#people_banner');if(!el)return;
  const all=[];PEOPLE.forEach(p=>(p._leads||[]).forEach(l=>all.push({...l,who:p.name||p.email,email:p.email,phone:p.phone,pid:p.id})));
  let bro=all.filter(x=>{const t=(x.type||'').toLowerCase();return t!=='reservation'&&t!=='dataroom_request';});
  if(SIGNUPS_DAYS){const cut=Date.now()-SIGNUPS_DAYS*864e5;bro=bro.filter(x=>{const t=x.created_at?new Date(x.created_at).getTime():0;return t&&t>=cut;});}
  bro.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  // one row per person (most recent sign-up), count how many times they requested
  const byPid={},uniq=[];
  bro.forEach(x=>{const k=x.pid||x.email||JSON.stringify([x.who,x.created_at]);if(byPid[k]){byPid[k]._n++;return;}const row={...x,_n:1};byPid[k]=row;uniq.push(row);});
  const total=uniq.length;
  const shown=uniq.slice(0,SIGNUPS_LIMIT);
  const th='position:sticky;top:0;background:#fafbfa;z-index:1';
  const opts=[10,25,50,100,500].map(n=>`<option value="${n}" ${n===SIGNUPS_LIMIT?'selected':''}>${n}</option>`).join('');
  const perOpts=[['','Alle periodes'],['7','7 dagen'],['30','30 dagen'],['90','90 dagen']].map(([v,l])=>`<option value="${v}" ${String(SIGNUPS_DAYS||'')===v?'selected':''}>${l}</option>`).join('');
  let h=`<div class="panel" style="margin-top:0;margin-bottom:18px"><div class="panel-head"><div><h3>Laatste brochure sign-ups <span class="count-pill">${total}</span></h3><div class="desc">Unieke personen die de brochure aanvroegen — klik op een regel om het contact te openen.</div></div>
      <div class="toolbar"><select id="signups_period" style="padding:6px 9px;border:1px solid var(--line);border-radius:8px">${perOpts}</select><span class="muted" style="font-size:12px">Toon</span><select id="signups_limit" style="padding:6px 9px;border:1px solid var(--line);border-radius:8px">${opts}</select></div></div>
    <div class="table-wrap" style="max-height:360px"><table><thead><tr><th style="${th}">Wie</th><th style="${th}">E-mail</th><th style="${th}">Telefoon</th><th style="${th}">Project</th><th style="${th}">Wanneer</th></tr></thead><tbody>`;
  if(!shown.length)h+='<tr><td colspan="5" class="empty">Geen brochure-aanvragen in deze periode.</td></tr>';
  shown.forEach(l=>{
    h+=`<tr data-openp="${l.pid}" style="cursor:pointer"><td><b>${esc(l.who||'—')}</b>${l._n>1?` <span class="badge grey" title="Aantal aanvragen">${l._n}×</span>`:''}</td><td>${l.email?`<a href="mailto:${esc(l.email)}" onclick="event.stopPropagation()">${esc(l.email)}</a>`:'—'}</td><td>${l.phone?`<a href="https://wa.me/${(l.phone||'').replace(/[^0-9]/g,'')}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:#0f6b4f">${esc(l.phone)}</a>`:'—'}</td><td>${esc(l.project||'—')}</td><td>${fmtDateTime(l.created_at)}</td></tr>`;
  });
  h+='</tbody></table></div>';
  if(total>shown.length)h+=`<div class="muted" style="font-size:12px;padding:8px 18px">${shown.length} van ${total} getoond — kies een hoger aantal of scroll.</div>`;
  h+='</div>';
  el.innerHTML=h;
  const sel=$('#signups_limit');if(sel)sel.onchange=()=>{SIGNUPS_LIMIT=Number(sel.value);drawRecentSignups();};
  const per=$('#signups_period');if(per)per.onchange=()=>{SIGNUPS_DAYS=per.value?Number(per.value):null;drawRecentSignups();};
  el.querySelectorAll('[data-openp]').forEach(tr=>tr.onclick=()=>openPerson(PEOPLE.find(x=>x.id===tr.dataset.openp)));
}

    }else if(i.kind==='itp'){

      if(canAct)btns=`<button class="btn btn-primary btn-sm" data-confirm="${i.resId}" data-amt="${i.amount||''}">Confirm paid</button>`+btns;
    }else if(i.kind==='dataroom'){
      label=`<span class="badge amber">🔓 Dataroom</span> <b>${who}</b> <span class="muted">wil toegang tot</span> <b>${esc(i.project||'algemeen')}</b>`;
      if(canAct){btns=`<button class="btn btn-primary btn-sm" data-grant="${i.p.id}" data-project="${esc(i.project)}" data-lead="${i.leadId}">Grant access</button>`+btns+`<button class="btn btn-ghost btn-sm" data-done="${i.leadId}">Mark done</button>`;}
    }else{
      label=`<span class="badge blue">📌 Reservering</span> <b>${who}</b> <span class="muted">reserveerde</span> <b>${esc(i.project||'')}${unit}</b>`;
      if(canAct)btns+=`<button class="btn btn-ghost btn-sm" data-done="${i.leadId}">Mark done</button>`;
    }

  el.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>bannerMarkDone(b.dataset.done));
  el.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>bannerConfirmPaid(b.dataset.confirm,Number(b.dataset.amt)||null));

async function markLeadHandled(leadId){
  const {error}=await sb.from('leads').update({handled_at:new Date().toISOString(),handled_by:(ME.full_name||ME.email)}).eq('id',leadId);
  if(error){toast(error.message,'err');return false;}
  return true;
}
async function bannerMarkDone(leadId){ if(await markLeadHandled(leadId)){toast('Marked as handled','ok');if(CURRENT==='leads')renderPeople();refreshNotifBadge();} }
async function bannerGrantDataroom(personId,project,leadId){
  const p=PEOPLE.find(x=>x.id===personId);if(!p)return;
  const {error}=await sb.from('dataroom_access').insert({contact_id:p.id,contact_email:p.email,contact_name:p.name,project:project||null,granted_at:new Date().toISOString()});
  if(error){toast(error.message,'err');return;}
  if(leadId)await markLeadHandled(leadId);
  toast('Dataroom access granted'+(project?' · '+project:''),'ok');
  if(CURRENT==='leads')renderPeople();refreshNotifBadge();
}
async function bannerConfirmPaid(resId,amount){
  if(!confirm('Bevestig dat de aanbetaling is ontvangen?'))return;
  const {error}=await sb.from('reservations').update({status:'deposit_paid',payment_status:'paid',paid_at:new Date().toISOString(),paid_amount:amount||null,paid_method:'bank_transfer'}).eq('id',resId);
  if(error){toast(error.message,'err');return;}
  toast('Aanbetaling bevestigd','ok');if(CURRENT==='leads')renderPeople();refreshNotifBadge();
}

async function loadActionItems(){
  const [lr,rr,dr]=await Promise.all([
    sb.from('leads').select('id,contact_id,type,project,unit,created_at,handled_at,name,email,phone').in('type',['dataroom_request','reservation']).order('created_at',{ascending:false}),
    sb.from('reservations').select('id,contact_id,email,name,project,unit,deposit_amount,status,itp_signed_at,payment_status,paid_at,cleared_at,updated_at').order('updated_at',{ascending:false}),
    sb.from('dataroom_access').select('contact_id,contact_email,project,granted_at'),
  ]);
  const granted=new Set();(dr.data||[]).forEach(x=>{if(!x.granted_at)return;const p=(x.project||'').toLowerCase();if(x.contact_id)granted.add(x.contact_id+'|'+p);if(x.contact_email)granted.add((x.contact_email||'').toLowerCase()+'|'+p);});
  const open=[],done=[];
  (lr.data||[]).forEach(l=>{
    const base={src:'lead',id:l.id,contact_id:l.contact_id,who:l.name||l.email||'—',email:l.email,project:l.project||'',unit:l.unit||'',at:l.created_at};
    if(l.type==='dataroom_request'){
      const g=granted.has(l.contact_id+'|'+(l.project||'').toLowerCase())||granted.has((l.email||'').toLowerCase()+'|'+(l.project||'').toLowerCase());
      if(l.handled_at||g)done.push({...base,kind:'dataroom',doneAt:l.handled_at});else open.push({...base,kind:'dataroom'});
    }else{
      if(l.handled_at)done.push({...base,kind:'reservation',doneAt:l.handled_at});else open.push({...base,kind:'reservation'});
    }
  });
  (rr.data||[]).forEach(r=>{
    const paid=(r.status==='deposit_paid'||r.payment_status==='paid');
    const base={src:'resv',id:r.id,contact_id:r.contact_id,who:r.name||r.email||'—',email:r.email,project:r.project||'',unit:r.unit||'',amount:r.deposit_amount,at:r.itp_signed_at||r.updated_at};
    if(!paid&&!r.cleared_at&&r.payment_status==='transfer_reported')open.push({...base,kind:'deposit'});
    else if(!paid&&!r.cleared_at&&r.itp_signed_at)open.push({...base,kind:'itp'});
    else if((paid||r.cleared_at)&&(r.itp_signed_at||r.payment_status))done.push({...base,kind:paid?'deposit_paid':'itp',doneAt:r.paid_at||r.cleared_at});
  });
  open.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  done.sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  return {open,done};
}

  const unit=i.unit?' · '+esc(i.unit):'';
  if(i.kind==='dataroom')return `<span class="badge amber">🔓 Dataroom</span> <b>${esc(i.who)}</b> <span class="muted">wil toegang tot</span> <b>${esc(i.project||'algemeen')}</b>`;
  if(i.kind==='reservation')return `<span class="badge blue">📌 Reserveringsaanvraag</span> <b>${esc(i.who)}</b> <span class="muted">voor</span> <b>${esc(i.project||'')}${unit}</b>`;
  if(i.kind==='itp')return `<span class="badge blue">📝 ITP getekend</span> <b>${esc(i.who)}</b> <span class="muted">— ${esc(i.project||'')}${unit}, wacht op aanbetaling</span>`;
  if(i.kind==='deposit')return `<span class="badge green">💶 Aanbetaling gemeld</span> <b>${esc(i.who)}</b> <span class="muted">— ${esc(i.project||'')}${unit}</span>`;

let NOTIF_TAB='open';
async function openNotifications(){

  const canAct=canEdit('leads')||canEdit('portal');
  const render=()=>{
    let h=`<div class="ntab"><button data-tab="open" class="${NOTIF_TAB==='open'?'on':''}">Open (${open.length})</button><button data-tab="done" class="${NOTIF_TAB==='done'?'on':''}">Afgehandeld</button></div>`;
    const list=NOTIF_TAB==='open'?open:done.slice(0,40);
    if(!list.length)h+=`<div class="muted" style="padding:14px 2px">${NOTIF_TAB==='open'?'Geen open acties. 🎉':'Nog niets afgehandeld.'}</div>`;
    list.forEach(i=>{
      let btns=(i.src==='resv')?`<button class="btn btn-ghost btn-sm" data-openr="${i.id}">Open</button>`:`<button class="btn btn-ghost btn-sm" data-open="${i.contact_id||''}">Open</button>`;
      if(NOTIF_TAB==='open'&&canAct){
        if(i.kind==='dataroom')btns=`<button class="btn btn-primary btn-sm" data-grant="${i.contact_id}" data-project="${esc(i.project)}" data-lead="${i.id}">Grant access</button>`+btns;
        if(i.kind==='reservation')btns=`<button class="btn btn-primary btn-sm" data-makeitp="${i.id}">Maak ITP</button>`+btns;
        if(i.kind==='itp'||i.kind==='deposit')btns=`<button class="btn btn-primary btn-sm" data-confirm="${i.id}" data-amt="${i.amount||''}">Confirm paid</button>`+btns;
        btns+=`<button class="btn btn-ghost btn-sm" data-complete="${i.id}:${(i.src==='lead')?'lead':'resv'}">✓ Afronden</button>`;
      }
      const when=NOTIF_TAB==='open'?fmtDateTime(i.at):('✓ '+fmtDate(i.doneAt));
      h+=`<div class="nrow"><div style="font-size:13px">${notifLabel(i)} <span class="muted" style="font-size:11px">· ${when}</span></div>${NOTIF_TAB==='open'?`<div class="row-actions">${btns}</div>`:''}</div>`;
    });
    const mb=document.querySelector('#overlay .modal-body');if(!mb)return;
    mb.innerHTML=h;
    mb.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{NOTIF_TAB=b.dataset.tab;render();});
    mb.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open){closeOverlay();openContactById(b.dataset.open);}else{toast('Geen contact gekoppeld','err');}});
    mb.querySelectorAll('[data-openr]').forEach(b=>b.onclick=()=>{closeOverlay();openReservation(b.dataset.openr);});
    mb.querySelectorAll('[data-grant]').forEach(b=>b.onclick=async()=>{await bannerGrantDataroom(b.dataset.grant,b.dataset.project,b.dataset.lead);afterNotifAction();});
    mb.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=async()=>{await bannerConfirmPaid(b.dataset.confirm,Number(b.dataset.amt)||null);afterNotifAction();});
    mb.querySelectorAll('[data-makeitp]').forEach(b=>b.onclick=()=>{closeOverlay();makeItpFromReservationLead(b.dataset.makeitp);});
    mb.querySelectorAll('[data-complete]').forEach(b=>b.onclick=async()=>{const parts=b.dataset.complete.split(':');await notifComplete(parts[0],parts[1]);openNotifications();});
  };
  render();
}

function _mt(headers,rows){ if(!rows.length)return '<div class="muted" style="font-size:13px">None.</div>'; let h='<table style="font-size:13px"><thead><tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'; rows.forEach(r=>{h+='<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>';}); return h+'</tbody></table>'; }

function leadTypeBadge(t){const k=(t||'').toLowerCase();const m={inquiry:['blue','Brochure-aanvraag'],brochure:['blue','Brochure-aanvraag'],reservation:['amber','Reserveringsaanvraag'],dataroom_request:['blue','Dataroom-aanvraag']};const x=m[k]||(k?['grey',t]:['blue','Brochure-aanvraag']);return `<span class="badge ${x[0]}">${esc(x[1])}</span>`;}
/* Time-of-day greeting based on the lead's timezone (derived from phone country code). */
function _greetForPhone(phone){
  const d=(phone||'').replace(/[^0-9+]/g,'');
  let tz='Europe/Amsterdam';
  const map=[['+351','Europe/Lisbon'],['+971','Asia/Dubai'],['+62','Asia/Makassar'],['+49','Europe/Berlin'],['+32','Europe/Brussels'],['+44','Europe/London'],['+41','Europe/Zurich'],['+43','Europe/Vienna'],['+33','Europe/Paris'],['+34','Europe/Madrid'],['+65','Asia/Singapore'],['+66','Asia/Bangkok'],['+61','Australia/Sydney'],['+1','America/New_York'],['+31','Europe/Amsterdam']];
  for(const [cc,z] of map){ if(d.startsWith(cc)){tz=z;break;} }
  let hr=12;
  try{ hr=Number(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'numeric',hour12:false}).format(new Date())); }catch(e){}
  if(hr>=6&&hr<12)return 'Goedemorgen';
  if(hr>=12&&hr<18)return 'Goedemiddag';
  return 'Goedenavond';
}
/* Fallback country from phone country code (when no IP/session location is available). */
function _countryFromPhone(phone){
  const d=(phone||'').replace(/[^0-9+]/g,'');
  if(!d)return '';
  const map=[['+351','Portugal'],['+971','UAE'],['+62','Indonesia'],['+49','Germany'],['+32','Belgium'],['+44','United Kingdom'],['+41','Switzerland'],['+43','Austria'],['+33','France'],['+34','Spain'],['+65','Singapore'],['+66','Thailand'],['+61','Australia'],['+1','United States'],['+31','Netherlands']];
  for(const [cc,name] of map){ if(d.startsWith(cc))return name; }
  if(/^0[1-9]/.test(d))return 'Netherlands'; // Dutch national format (06…, 0…)
  return '';
}
/* Build a WhatsApp deep-link with a personal opening message for a new sign-up. */
/* Normalise a phone to WhatsApp international digits (no +). Returns '' if not a plausible number. */
function _waDigits(phone){
  let d=(phone||'').replace(/[^0-9]/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);            // 00 international prefix -> drop
  else if(d.startsWith('0')){
    d=d.replace(/^0+/,'');                        // drop leading zero(s)
    if(!d.startsWith('31'))d='31'+d;             // "06…" national -> +31; "0" + "31…" already has the country code
  }
  else if(d.startsWith('6')&&d.length===9)d='31'+d; // bare NL mobile without leading 0
  if(d.length<9||d.length>15)return '';          // implausible / truncated
  return d;
}
function _helloWaUrl(phone,name,project){
  const digits=_waDigits(phone);
  if(!digits)return '';                           // no valid number -> no link (avoids WhatsApp contact-picker)
  const first=(name||'').trim().split(/\s+/)[0]||'';
  const sender=(ME&&(ME.full_name||ME.email))||'UTAMA Bali';
  const title=(ME&&ME.title)?(', '+ME.title):'';
  const greet=_greetForPhone(phone);
  const hi=first?`${greet} ${first},`:`${greet},`;
  const projPhrase=project?`ons project, ${project}`:'ons project';
  const msg=`${hi} dit is ${sender}${title}. We hebben zojuist een aanmelding ontvangen voor ${projPhrase}. Klopt dat?\n\nIk stuur na iedere aanmelding altijd even persoonlijk een bericht om kennis te maken.`;
  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(msg);
}

async function agTeam(){

function agTeamNaam(id){const t=AG.team.find(x=>x.id===id);return t?(t.full_name||t.email||'?'):'';}
const AG_STATUS={gepland:['Gepland','#2563eb','#eff6ff'],afgerond:['Afgerond','#0f9d74','#ecfdf5'],
  no_show:['No-show','#b91c1c','#fef2f2'],geannuleerd:['Geannuleerd','#64748b','#f8fafc']};
function agKlok(d){return new Date(d).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});}
// Dagsleutel in LOKALE tijd: toISOString() is UTC en zou een afspraak om
// 00:30 's nachts bij de vorige dag indelen.
function agDagsleutel(x){const d=new Date(x);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function agDagkop(d){
  const nu=new Date();
  if(agDagsleutel(d)===agDagsleutel(nu))return 'Vandaag';
  if(agDagsleutel(d)===agDagsleutel(new Date(nu.getTime()+864e5)))return 'Morgen';
  return new Date(d).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
}
async function renderAgenda(){
  const v=$('#view');const edit=canEdit('agenda');
  v.innerHTML='<div class="empty" style="padding:24px">Laden…</div>';
  await agTeam();
  const _anker=AG.anker?new Date(AG.anker):new Date();
  const van=new Date(Math.min(Date.now()-14*864e5,_anker.getTime()-45*864e5)).toISOString();
  const tot=new Date(Math.max(Date.now()+60*864e5,_anker.getTime()+45*864e5)).toISOString();

        ${a.notitie?`<div class="muted" style="font-size:11.5px;margin-top:2px">${esc(a.notitie)}</div>`:''}
      </div>
      ${edit?`<select class="ag-stsel" data-agsel="${esc(a.id)}" style="color:${st[1]};background:${st[2]}" title="Status wijzigen">

        </select>
        <span class="ag-acts"><button class="btn btn-ghost btn-sm" data-agdel="${esc(a.id)}" title="Verwijder deze afspraak definitief">🗑</button></span>`
      :`<span class="ag-badge" style="color:${st[1]};background:${st[2]}">${st[0]}</span>`}
    </div>`;
  };

  const anker=AG.anker?new Date(AG.anker):new Date();

    if(AG.view==='week'){

      const zo=new Date(ma.getTime()+6*864e5);
      return ma.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})+' t/m '+zo.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    }
    if(AG.view==='maand')return anker.toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
    return '';
  })();
  let h=`<div class="pipe-toolbar" style="margin-bottom:14px;flex-wrap:wrap">
    ${edit?`<button class="btn" id="ag_nieuw">＋ Afspraak</button>`:''}
    <span class="ag-views">${['lijst','week','maand'].map(w=>`<button class="ag-vbtn${AG.view===w?' on':''}" data-agview="${w}">${w[0].toUpperCase()+w.slice(1)}</button>`).join('')}</span>
    ${AG.view!=='lijst'?`<span class="ag-nav"><button class="btn btn-ghost btn-sm" data-agnav="-1">‹</button><button class="btn btn-ghost btn-sm" data-agnav="0">Vandaag</button><button class="btn btn-ghost btn-sm" data-agnav="1">›</button><b style="font-size:13px;margin-left:4px">${esc(periode)}</b></span>`:''}

  if(AG.view==='week'){

    let cellen='';
    for(let i=0;i<42;i++){
      const dag=new Date(start.getTime()+i*864e5);
      const k=agDagsleutel(dag);
      const items=alle.filter(a=>agDagsleutel(a.starts_at)===k).sort((x,y)=>new Date(x.starts_at)-new Date(y.starts_at));
      const inMaand=dag.getMonth()===anker.getMonth();

      if(i===41&&dag.getMonth()===anker.getMonth())continue;

  } else if(open.length){

  } else if(komend.length){

  }
  v.innerHTML=h;

  const nw=$('#ag_nieuw');if(nw)nw.onclick=()=>agNieuweAfspraak();
  v.querySelectorAll('[data-agview]').forEach(b=>b.onclick=()=>{AG.view=b.dataset.agview;renderAgenda();});
  v.querySelectorAll('[data-agnav]').forEach(b=>b.onclick=()=>{
    const r=parseInt(b.dataset.agnav,10);

    else{const d=AG.anker?new Date(AG.anker):new Date();
      // eerst naar de 1e, anders schiet 31 aug +1 maand door naar 1 oktober
      if(AG.view==='maand'){d.setDate(1);d.setMonth(d.getMonth()+r);}else d.setDate(d.getDate()+7*r);

   Koud gebelde formulier-leads nemen niet op: onbekend nummer, onverwacht

   dat van de mislukte call alsnog een chat maakt. Binnen het 24u-venster gaat
   het als vrije tekst, daarbuiten via het goedgekeurde Meta-template. */
function belTekst(type,voornaam,beller,tijd,nummer){
  return type==='gemist'
    ? `Hoi ${voornaam}, ${beller} van UTAMA probeerde je net te bereiken over je aanvraag. Antwoord hier gerust met een moment dat jou beter uitkomt, dan plannen we het even in.`
    : `Hoi ${voornaam}, ${beller} van UTAMA belt je ${tijd}${nummer?' vanaf '+nummer:''} over je aanvraag. Sla het nummer gerust op, dan weet je wie er belt. Komt het niet uit? Stuur hier even een berichtje.`;
}
function belPopup(c){
  const voornaam=(c.name||'').trim().split(/\s+/)[0]||'daar';
  const beller0=localStorage.getItem('utama_beller')||'Ashley';
  const nummer0=localStorage.getItem('utama_bel_nummer')||'+31 6 24845014';
  afPopup(`<div>
    <h3 style="margin:0 0 4px">Belpoging bij ${esc(c.name||'(naamloos)')}</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">Een aangekondigde call wordt vele malen vaker opgenomen dan een koude. Het bericht landt in de WhatsApp-thread van de lead.</div>
    <div class="ag-views" style="margin-bottom:12px"><button class="ag-vbtn on" data-beltype="aankondiging">Kondig call aan</button><button class="ag-vbtn" data-beltype="gemist">Niet opgenomen</button></div>
    <div class="pdr-grid2">
      <div class="pdr-field"><div class="pdr-label">Wie belt</div><input id="bel_wie" class="pc-in" value="${esc(beller0)}"></div>
      <div class="pdr-field" id="bel_nr_veld"><div class="pdr-label">Vanaf nummer</div><input id="bel_nr" class="pc-in" value="${esc(nummer0)}"></div>
    </div>
    <div class="pdr-field" id="bel_tijd_veld"><div class="pdr-label">Wanneer</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${['over 5 minuten','over een kwartier','vandaag rond ','morgen rond '].map((t,i)=>`<button class="btn btn-ghost btn-sm bel-tijd${i===0?' on':''}" data-beltijd="${esc(t)}">${esc(t.trim())}</button>`).join('')}
      <input id="bel_tijd_uur" class="pc-in" type="time" value="15:00" style="width:110px;display:none"></div></div>
    <div class="pdr-field"><div class="pdr-label" style="display:flex;justify-content:space-between;align-items:center"><span>Bericht</span><button type="button" id="bel_reset" class="btn btn-ghost btn-sm" style="display:none">↻ Standaardtekst</button></div>
      <textarea id="bel_msg" class="pc-in" rows="4" style="line-height:1.55;font-size:12.5px"></textarea>
      <div id="bel_hint" class="muted" style="font-size:11.5px;margin-top:4px"></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="bel_ok">Verstuur</button><button class="btn btn-ghost" id="bel_x">Annuleren</button></div>
  </div>`);
  let type='aankondiging', tijdBasis='over 5 minuten', aangepast=false, vensterOpen=null;
  const prev=()=>{
    const uur=$('#bel_tijd_uur');
    const tijd=tijdBasis.endsWith(' ')?tijdBasis+(uur&&uur.value?uur.value:''):tijdBasis;
    // eigen bewerkingen niet overschrijven; de herstelknop zet de standaardtekst terug
    if(!aangepast)$('#bel_msg').value=belTekst(type,voornaam,$('#bel_wie').value.trim()||'Ashley',tijd,$('#bel_nr').value.trim());
    $('#bel_tijd_veld').style.display=type==='gemist'?'none':'';
    $('#bel_nr_veld').style.display=type==='gemist'?'none':'';
    return tijd;
  };
  // venstercheck: binnen 24u mag vrije tekst, daarbuiten gaat het vaste template
  sb.functions.invoke('call-announce',{body:{action:'check',contact_id:c.id}}).then(({data})=>{
    vensterOpen=!!(data&&data.window_open);
    const msg=$('#bel_msg'),hint=$('#bel_hint');if(!msg)return;
    if(vensterOpen){
      hint.textContent='Chatvenster open: dit bericht gaat precies zo de deur uit. Pas het gerust aan.';
    }else{
      msg.readOnly=true;msg.style.background='#f6f8f7';
      const tpl=data&&(type==='gemist'?data.missed_template:data.call_template);
      hint.textContent=tpl
        ? 'Deze lead heeft langer dan 24 uur niets gestuurd, dus Meta staat alleen het vaste goedgekeurde template toe. De tekst hierboven is die templatetekst; aanpassen kan pas als de lead reageert.'
        : 'Chatvenster dicht en er is nog geen goedgekeurd template geregistreerd. Versturen lukt pas na registratie van het template.';
    }
  }).catch(()=>{});
  document.querySelectorAll('[data-beltype]').forEach(b=>b.onclick=()=>{
    type=b.dataset.beltype;
    document.querySelectorAll('[data-beltype]').forEach(x=>x.classList.toggle('on',x===b));
    aangepast=false;$('#bel_reset').style.display='none';
    prev();
  });
  document.querySelectorAll('[data-beltijd]').forEach(b=>b.onclick=()=>{
    tijdBasis=b.dataset.beltijd;
    document.querySelectorAll('[data-beltijd]').forEach(x=>x.classList.toggle('on',x===b));
    $('#bel_tijd_uur').style.display=tijdBasis.endsWith(' ')?'':'none';
    prev();
  });
  $('#bel_tijd_uur').oninput=prev;$('#bel_wie').oninput=prev;$('#bel_nr').oninput=prev;
  $('#bel_msg').addEventListener('input',()=>{aangepast=true;$('#bel_reset').style.display='';});
  $('#bel_reset').onclick=()=>{aangepast=false;$('#bel_reset').style.display='none';prev();};
  prev();
  $('#bel_x').onclick=()=>afPopupSluit();
  $('#bel_ok').onclick=async()=>{
    const tijd=prev();
    const beller=$('#bel_wie').value.trim()||'Ashley';
    const nummer=$('#bel_nr').value.trim();
    localStorage.setItem('utama_beller',beller);localStorage.setItem('utama_bel_nummer',nummer);
    const b=$('#bel_ok');b.disabled=true;b.textContent='Versturen…';
    const {data,error}=await sb.functions.invoke('call-announce',{body:{type,contact_id:c.id,tijd,beller,nummer,tekst:$('#bel_msg').value.trim()}});
    if(error||!data||!data.ok){
      const nb=(data&&data.note)||(data&&data.detail)||(error&&error.message)||'onbekende fout';
      toast('Niet verstuurd: '+nb,'err');b.disabled=false;b.textContent='Verstuur';return;
    }
    toast(data.window_open?'Verstuurd als chatbericht':'Verstuurd via template','ok');
    afPopupSluit();
  };
}

/* ================= LEADS SAMENVOEGEN =================
   Dubbele leads ontstaan als iemand zich twee keer aanmeldt met een tikfout in
   nummer of e-mailadres. De data kan niet weten welk gegeven klopt, dus de

   reserveringen) naar de gekozen lead en verwijdert het duplicaat. */

    <div style="font-size:12.5px;margin-top:5px;line-height:1.55">${regels}</div>
    ${extra?`<div class="muted" style="font-size:11.5px;margin-top:6px">${extra}</div>`:''}`;
}
async function openMergeFlow(p){

async function openPerson(p){
  showDetail('Contact','<div class="muted">Loading…</div>');

    sb.from('leads').select('*').eq('contact_id',p.id).order('created_at',{ascending:false}),

    sb.from('dataroom_access').select('*').or('contact_id.eq.'+p.id+',contact_email.eq.'+p.email),
    sb.from('referrals').select('*').or('referrer_contact_id.eq.'+p.id+',referred_contact_id.eq.'+p.id),
    sb.from('projects').select('name,slug,price_current,legal_entity').order('sort_order',{ascending:true}),

  ]);
  const leads=lr.data||[],purch=pr.data||[],webs=wr.data||[],drs=dr.data||[],refs=rr.data||[],projList=projR.data||[],resvs=rvR.data||[];
  const pCards=pcR.data||[],pLines=plR.data||[];
  await warmthLoad([p.id]);
  const _waProj=(leads.find(l=>l.project)||{}).project||'';
  const _waUrl=_helloWaUrl(p.phone,p.name,_waProj);
  // Where the lead is + how they came in (attributie), via linked analytics sessions/visitor.
  let _loc='',_locSrc='',_attr=null;
  const _sess=[...new Set(leads.map(l=>l.ua_session).filter(Boolean))];
  const _vids=[...new Set(leads.map(l=>l.ua_vid).filter(Boolean))];
  if(_sess.length||_vids.length){
    const SEL='channel,utm_source,utm_medium,utm_campaign,utm_content,utm_term,referrer_host,path,city,country,created_at';
    let evs=[];
    if(_sess.length){const {data}=await sb.from('analytics_events').select(SEL).in('session_id',_sess).order('created_at',{ascending:true}).limit(300);evs=evs.concat(data||[]);}
    if(_vids.length){const {data}=await sb.from('analytics_events').select(SEL).in('visitor_id',_vids).order('created_at',{ascending:true}).limit(300);evs=evs.concat(data||[]);}
    evs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    // location: most recent event that carries a country
    for(let i=evs.length-1;i>=0;i--){if(evs[i].country){const e=evs[i];const city=(e.city||'').replace(/^(Gemeente|Municipality of|Municipality|Provincie|Province of|Kota|Kabupaten)\s+/i,'').trim();_loc=[city,e.country].filter(Boolean).join(', ');if(_loc)_locSrc='ip';break;}}
    // attributie (first touch): vroegste event met campagne/bron/niet-direct kanaal, anders het allereerste event
    _attr=evs.find(e=>e.utm_campaign||e.utm_source||(e.channel&&!['direct','internal'].includes((e.channel||'').toLowerCase())))||evs[0]||null;
  }
  if(!_loc){const c=_countryFromPhone(p.phone);if(c){_loc=c;_locSrc='phone';}}
  // build attribution labels (Meta-aware: resolve campaign/adset/ad IDs to names)
  let _attrChan='',_attrLabel='',_attrBits=[],_attrHead='',_attrNote='';
  if(_attr){
    _attrChan=(_attr.channel||'direct').toLowerCase();
    _attrLabel={direct:'Direct',organic:'Organisch',social:'Social',paid:'Ad',referral:'Referral',campaign:'Campagne',email:'E-mail',internal:'Intern'}[_attrChan]||_attrChan;
    const srcRaw=(_attr.utm_source||'').toLowerCase();
    const isMeta=/^(fb|facebook|ig|instagram|meta)$/.test(srcRaw)||(_attrChan==='paid'&&/facebook|instagram/.test((_attr.referrer_host||'').toLowerCase()));
    // resolve Meta numeric object IDs (campaign/adset/ad) to human names via the meta-names function
    let nm={},hadIds=false,gotNames=false;
    if(isMeta){
      const ids=[_attr.utm_campaign,_attr.utm_content,_attr.utm_term].map(x=>String(x||'')).filter(x=>/^\d{6,}$/.test(x));
      hadIds=ids.length>0;
      if(hadIds&&sb.functions&&sb.functions.invoke){
        try{const {data}=await sb.functions.invoke('meta-names',{body:{ids}});if(data&&data.names){nm=data.names;gotNames=Object.keys(nm).length>0;}}catch(e){}
      }
    }
    const show=v=>{const s=String(v||'');return nm[s]||s;};
    // Distinguish Facebook vs Instagram: utm_source (fb/ig) is authoritative; referrer host is a fallback.
    const rh=(_attr.referrer_host||'').toLowerCase();
    const metaPlat=!isMeta?'':(/^(ig|instagram)$/.test(srcRaw)?'Instagram':/^(fb|facebook)$/.test(srcRaw)?'Facebook':/instagram/.test(rh)?'Instagram':/facebook/.test(rh)?'Facebook':'');
    const bronLabel=isMeta?(metaPlat?metaPlat+' (Meta)':'Facebook / Instagram (Meta)'):_attr.utm_source;
    if(_attr.utm_source||isMeta)_attrBits.push(['Bron',bronLabel]);
    if(_attr.utm_medium)_attrBits.push(['Medium',_attr.utm_medium]);
    if(_attr.utm_campaign)_attrBits.push(['Campagne',show(_attr.utm_campaign)]);
    if(_attr.utm_content)_attrBits.push([isMeta?'Advertentieset':'Advertentie',show(_attr.utm_content)]);
    if(_attr.utm_term)_attrBits.push([isMeta?'Advertentie':'Zoekterm',show(_attr.utm_term)]);
    if(!_attr.utm_source&&_attr.referrer_host)_attrBits.push(['Verwijzer',_attr.referrer_host]);
    _attrHead=_attr.utm_campaign?show(_attr.utm_campaign):(_attr.utm_source?(isMeta?'Meta':_attr.utm_source):'');
    if(_attrChan==='paid'&&!_attr.utm_campaign&&!_attr.utm_source)_attrNote='Herkend als advertentieklik (ad-click-id in de URL), maar er zijn geen campagne-tags meegegeven. Voeg <code>utm_campaign</code>/<code>utm_content</code> toe aan je advertentie-links om te zien wélke advertentie precies.';
    else if(isMeta&&hadIds&&!gotNames)_attrNote='Dit zijn Meta’s campagne-/advertentie-<b>ID’s</b>. Naam-vertaling staat nog uit — zie mijn bericht om die aan te zetten (of tag je ad-links met namen).';
  }
  let body=`<div style="background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap"><span style="font-size:18px;font-weight:750">${esc(p.name||p.email||'Contact')}</span>${p.partner?partnerBadge(p.partner):''}${warmthBadge(WARMTH[p.id],{big:true})?`<span style="display:inline-flex;align-items:center;gap:7px"><span class="muted" style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px">Koopbereidheid</span>${warmthBadge(WARMTH[p.id],{big:true})}</span>`:''}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <a href="mailto:${esc(p.email)}" class="badge blue" style="text-decoration:none">${esc(p.email)}</a>

          ${p.referral_code?`<span class="badge green">ref: ${esc(p.referral_code)}</span>`:''}
          ${p.locale?`<span class="badge grey">${esc(p.locale)}</span>`:''}
          ${_loc?`<span class="badge grey" title="${_locSrc==='ip'?'Locatie bepaald uit het IP-adres van hun websitebezoek (analytics).':'Land geschat uit de landcode van het telefoonnummer. Er is geen websitebezoek (IP-sessie) aan deze lead gekoppeld, dus de exacte plaats is onbekend.'}">📍 ${esc(_loc)}${_locSrc==='phone'?' · land geschat via telefoon':''}</span>`:''}
          ${_attr?`<span class="src-badge ${chanClass(_attrChan)}" title="Hoe deze lead binnenkwam (eerste bezoek)">${esc(_attrLabel)}${_attrHead?' · '+esc(_attrHead):''}</span>`:''}
        </div>
      </div>
      <div class="row-actions" style="display:flex;flex-wrap:wrap;gap:8px;row-gap:8px">
        ${leadActieRij({prefix:'pd',phone:p.phone,email:p.email,waHref:_waUrl||'',waCls:'btn btn-sm lead-wa-groen',mailCompose:false,contactId:p.id,toonCrm:false,
          extraHtml:(canEdit('leads')?`<button class="btn btn-ghost btn-sm" id="pd_editc" title="Contactgegevens bewerken">✏️ Bewerken</button><button class="btn btn-ghost btn-sm" id="pd_merge" title="Voeg een dubbele lead samen met deze">⇄ Samenvoegen</button>`:'')})}
      </div>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:14px">
      <span class="muted" style="font-size:12px"><b style="color:var(--ink,#111);font-weight:600">${leads.length}</b> aanvragen · <b style="color:var(--ink,#111);font-weight:600">${purch.length}</b> aankopen · <b style="color:var(--ink,#111);font-weight:600">${webs.length}</b> webinars</span>
      <span class="muted" style="font-size:12px;margin-left:auto">Eerste contact ${fmtDate(p.first_seen_at)} · Laatste activiteit ${fmtDate(p.last_activity_at)}</span>
    </div>
  </div>
  <hr style="border:none;border-top:1px solid var(--line);margin:22px 0 2px">`;
  // Zelfde kop als inbox-paneel en pipeline-drawer: eerst AI-samenvatting, dan
  // leadgegevens (kwalificatie). Beide worden async bijgeladen na het renderen.
  // Alleen met inbox-kijkrechten: de bron (inbox_conversations/inbox_summaries)

    body+=`<div style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">AI-samenvatting</div>${canEdit('inbox')?`<button type="button" class="ibx-sum-btn" id="pd_sum_btn">✨ Genereren</button>`:''}</div><div id="pd_sum_body" data-cid="${esc(p.id)}">${inboxSummaryHtml(null)}</div></div>`;
    body+=_sec('Leadgegevens',`<div id="pd_kwal" class="pdr-facts" data-cid="${esc(p.id)}"><div class="muted" style="font-size:13px">Laden…</div></div>`);
  }
  // Waar staat deze lead in de pipelines? Stond alleen in de inbox, niet hier.
  {
    const kanPipe=canEdit('pipeline');
    let ph='';
    if(!pCards.length){
      ph = `<div class="muted" style="font-size:13px">Staat in geen enkele pipeline.</div>`;
    } else {
      ph = `<div style="display:flex;flex-direction:column;gap:8px">` + pCards.map(c=>{
        const lijn=pLines.find(x=>x.id===c.pipeline_id);
        const stages=(lijn&&lijn.stages)||[];

async function inboxRenderContactChat(contactId){
  const box=$('#pd_chat');if(!box)return;
  let data,error;
  try{({data,error}=await sb.rpc('inbox_contact_threads',{p_contact:contactId}));}catch(e){error=e;}
  const cur=$('#pd_chat');if(!cur)return; // modal closed/changed
  if(error){cur.innerHTML='<div class="muted" style="font-size:13px">Kon chatgeschiedenis niet laden.</div>';return;}
  const threads=data||[];
  if(!threads.length){cur.innerHTML='<div class="muted" style="font-size:13px">Nog geen gesprekken in de inbox voor dit contact. Instagram- en WhatsApp-chats verschijnen hier zodra ze binnenkomen.</div>';return;}
  // Eén doorlopend gesprek over alle kanalen heen, net als de inbox zelf:
  // alle berichten chronologisch met een kanaal-icoontje per bericht.
  const alle=[];
  threads.forEach(t=>{(t.messages||[]).forEach(m=>alle.push(Object.assign({},m,{channel:m.channel||t.channel})));});
  alle.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const nieuwste=threads.slice().sort((a,b)=>new Date(b.last_message_at||0)-new Date(a.last_message_at||0))[0];
  const kanalen=threads.map(t=>{const ch=INBOX_CH[t.channel]||INBOX_CH.instagram;return `<span class="ibx-chtag" style="color:${ch.color};background:${ch.bg};border-color:${ch.bd}">${ch.icon} ${ch.label}</span>`;}).join(' ');
  const bubbles=alle.map(m=>{
    const out=m.direction==='out',who=m.sender;
    const mch=INBOX_CH[m.channel]||INBOX_CH.instagram;
    const tag=who==='ai'?'AI':who==='human'?esc((m.sender_name||'Team').split('@')[0]):'';
    const undel=out&&(m.delivery_status==='pending'||m.delivery_status==='failed');
    return `<div class="pdc-row ${out?'out':'in'}"><div class="pdc-bub ${out?(who==='human'?'human':'ai'):'lead'}">${tag?`<span class="pdc-tag">${tag}</span>`:''}<span class="pdc-txt">${esc(m.body||'')}</span><span class="pdc-time">${mch.icon} ${inboxRel(m.created_at)}${undel?' · niet geleverd':''}</span></div></div>`;
  }).join('')||'<div class="muted" style="font-size:12px">Geen berichten.</div>';
  cur.innerHTML=`<div class="pdc-thread">
    <div class="pdc-head">${kanalen}
      <span class="muted" style="font-size:12px">${inboxRel(nieuwste.last_message_at)}</span>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="openInboxThread('c:${contactId}')">Open in Inbox →</button></div>
    <div class="pdc-msgs" style="max-height:340px">${bubbles}</div>
  </div>`;
  const ms=cur.querySelector('.pdc-msgs');if(ms)ms.scrollTop=ms.scrollHeight;
}
function openInboxThread(id){INBOX.sel=id;if(!canView('inbox')){toast('Je hebt geen toegang tot de Inbox','err');return;}closeOverlay();go('inbox');}
// Mailen vanaf contactkaart/pipeline-drawer: in de portal-inbox, niet in de
// eigen mailclient. Opent het gesprek van dit contact met de composer op
// e-mail; alleen zonder enig inbox-gesprek valt hij terug op mailto.
async function leadMailViaInbox(contactId,email){
  if(!canView('inbox')){if(email)location.href='mailto:'+email;return;}
  try{
    const {data}=await sb.from('inbox_conversations').select('id,channel').eq('contact_id',contactId);
    const convs=data||[];
    if(convs.length){
      // Open de kanaaloverstijgende tijdlijn van dit contact (groepssleutel), niet
      // één los gesprek, zodat WhatsApp/IG/e-mail samen te zien zijn.
      INBOX.pendingSendCh='email';
      openInboxThread('c:'+contactId);
      return;
    }
  }catch(e){}
  if(email){toast('Nog geen inbox-gesprek met dit contact; je mailclient opent','ok');location.href='mailto:'+email;}
  else toast('Geen e-mailadres bekend','err');
}

function ptBankHtml(entity){
  const b=PT_BANK[entity];
  if(!b)return `<p><i>The bank details for ${esc(entity||'the selling entity')} will be provided separately by email.</i></p>`;
  return `<p><b>Bank Name:</b> ${b.bank}<br><b>Account Name:</b> ${b.name}<br><b>Account Number:</b> ${b.acct}<br><b>Swift Code:</b> ${b.swift}<br><b>Branch Code:</b> ${b.branch}<br><b>Bank Code:</b> ${b.code}<br><b>Clearing Code:</b> ${b.clearing}<br><b>Bank Address:</b> ${b.address}</p>`;
}
function itpDraft(r){
  // Volledige Engelstalige ITP naar het vaste UTAMA-model. Alles is daarna
  // vrij te bewerken in de editor; dit is alleen de gegenereerde beginversie.
  const cur=(r.currency||'EUR').toUpperCase();
  const fmt=v=>(cur==='EUR'?'€':cur+' ')+Number(v).toLocaleString('nl-NL');
  const dep=fmt(r.deposit_amount||10000);
  const price=r.unit_price?fmt(r.unit_price):'(to be confirmed)';
  // Datums staan in een Engelstalig juridisch stuk, dus voluit geschreven:
  // "24 August 2026". Het oude 24-08-2026 is voor een deel van de lezers
  // dubbelzinnig, en juist in dit document mag over een datum geen twijfel zijn.
  const datum=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const vandaag=datum(new Date());
  // Dezelfde datum draagt twee rollen: tot wanneer de ITP geldig is, en tot
  // wanneer de verkoper de unit exclusief vasthoudt (de uitzondering onder
  // CONDITIONS). Eén bron, zodat ze nooit uit elkaar kunnen lopen.
  const geldig=datum(r.hold_expires_at?new Date(r.hold_expires_at):new Date(Date.now()+30*864e5));
  const proj=esc(r.project||''),unit=esc(r.unit||''),naam=esc(r.name||'');
  // De entiteit komt uit projects.legal_entity en verschilt per project. Nooit
  // terugvallen op een echte PT-naam: dan staat er stilzwijgend de verkeerde
  // vennootschap onder een contract. Liever zichtbaar leeg, dan valt het op.
  const ptRaw=r.legal_entity||'(legal entity not set)';
  const pt=esc(ptRaw);
  return `<p><b>INTENT TO PURCHASE (ITP)</b><br>Date: ${vandaag}</p>`
    +`<p><b>FROM</b><br>Name: ${naam}${r.email?'<br>Email: '+esc(r.email):''}${r.phone?'<br>Mobile: '+esc(r.phone):''}</p>`
    +`<p><b>TO</b><br>Steven Gijsman<br>${pt}</p>`
    +`<p><b>SUBJECT</b><br>Intent to Purchase – Leasehold (${proj}${unit?' · '+unit:''})</p>`
    +`<p>Dear Steven Gijsman / ${pt},<br>I, ${naam}, hereby express my intent to purchase a villa within project ${proj}, under the following terms and conditions.</p>`
    +`<p><b>PROPERTY</b><br>Project: ${proj}<br>Unit: ${unit||'Villa selection to be determined.'}<br>Fully furnished, turn-key delivery<br>Leasehold: 30 + 30 years</p>`
    +`<p><b>PURCHASE PRICE</b><br>Total Purchase Price: ${price}</p>`
    +`<p><b>DEPOSIT</b><br>Buyer shall pay ${dep} as a deposit forming part of the Purchase Price (the “Deposit”).<br>The Deposit shall be deducted from the first instalment payable at notary signing.<br>The Deposit shall be fully refundable in the event that:<br>– legal due diligence results in a negative outcome; or<br>– material discrepancies are identified relating to land title, leasehold rights, zoning, permits, or ownership structure.</p>`
    +`<p><b>PAYMENT TERMS</b><br>The total Purchase Price shall be paid in instalments as follows:<br>– ${dep} deposit upon signing of this ITP;<br>– 60% payable upon signing of the notarial leasehold and construction agreements, minus the deposit;<br>– 20% payable after milestone 3 (as detailed in the notarised contracts);<br>– 10% payable after milestone 4 (as detailed in the notarised contracts);<br>– 10% payable upon final completion of the villa and key handover.<br>Notary costs amount to 1% of the transaction value and are payable by the Buyer, in addition to the Purchase Price.</p>`
    +`<p><b>FORMALISATION</b><br>The payment schedule, construction milestones, deliverables and timelines referred to in this Intent to Purchase are indicative only and shall be further detailed, formalised and become legally binding solely in the definitive leasehold agreement and construction contract.</p>`
    +`<p><b>SELLER REPRESENTATIONS</b><br>The Seller represents and warrants that:<br>– the land status and leasehold title are valid and undisputed;<br>– the lessor is fully authorized to grant and extend the leasehold;<br>– the land is correctly zoned for the intended development; and<br>– all applicable permits and approvals required for construction and delivery are in place or will be lawfully obtained.</p>`
    +`<p><b>CONDITIONS</b><br>1. This Letter of Intent serves as a preliminary agreement. The formal purchase agreement will be drafted by the notary based on the details of the reservation contract.<br>2. If negotiations are terminated due to the fault or breach of ${pt}, the full reservation fee will be refunded to the Buyer.<br>3. The Buyer must sign the purchase agreement and complete the transaction within 14 days of signing this Letter of Intent, unless otherwise agreed in writing.<br>Exception: Regardless of the 14-day period, the Seller agrees to hold the unit exclusively for the Buyer until ${geldig}. If the Buyer has not completed the transaction by this date, the Seller may release the unit back to the market without refund of the reservation fee.</p>`
    +`<p><b>NEXT STEPS</b><br>1. Sign this ITP and transfer the ${dep} deposit. This reserves the unit for you.<br>Please transfer to:</p>`
    +ptBankHtml(ptRaw)
    +`<p>2. Drafting of the lease and construction contract. A notary will prepare the contract, detailing all terms, timelines, pricing, and responsibilities.<br>3. Review and sign the contracts digitally. After reviewing the contracts, signing will happen in a meeting with the notary.<br>4. Make the first payment &amp; start your villa journey. Once the contract is signed, complete the first payment as outlined in \u2018Payment Terms\u2019 and the villa is yours!<br>5. You will be added to a WhatsApp group for bi-weekly project updates, and our marketing team will coordinate the preparation for your villa\u2019s Airbnb launch.</p>`
    +`<p><b>VALIDITY</b><br>This ITP will remain valid until ${geldig}.</p>`
    +`<p><b>BUYER</b><br>Name: ${naam}<br>Signature:<br>Date:</p>`
    +`<p><b>ACCEPTED BY SELLER</b><br>${pt}<br>Name: Steven Gijsman<br>Title: Director<br>Signature: \u2713 Digitally signed<br>Date: ${vandaag}</p>`;
}
/* upgrade any legacy plain-text ITP to HTML (bold ALL-CAPS heading lines) */
function itpToHtml(body){
  if(!body)return '';
  if(/<\w+[^>]*>/.test(body))return sanitizeHtml(body);
  return body.split('\n').map(line=>{const t=line.trim();if(t&&t===t.toUpperCase()&&/[A-Z]/.test(t)&&t.length<44)return '<b>'+esc(t)+'</b>';return esc(line);}).join('<br>');
}
function itpMetHandtekening(r){
  let b=itpToHtml(r.itp_body)||'';
  if(!b)return b;
  const uit=new Date(r.sent_at||r.created_at||Date.now()).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  b=b.replace(/(<b>\s*ACCEPTED BY SELLER\s*<\/b>[\s\S]{0,260}?)Signature:\s*(<br\s*\/?>)\s*Date:(?=\s*<)/i,(m,voor,br)=>voor+'Signature: \u2713 Digitally signed'+br+'Date: '+esc(uit));
  if(r.itp_signed_at){
    const d=new Date(r.itp_signed_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const wie=r.itp_signer_name||r.name||'';
    b=b.replace(/(<b>\s*BUYER\s*<\/b>[\s\S]{0,220}?)Signature:\s*(<br\s*\/?>)\s*Date:(?=\s*<)/i,(m,voor,br)=>voor+'Signature: \u2713 Digitally signed by '+esc(wie)+br+'Date: '+esc(d));
  }
  return b;
}
function htmlToPlain(h){return (h||'').replace(/<\/(p|div|h[1-6])>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/\n{3,}/g,'\n\n').trim();}
function isHeadingLine(t){t=(t||'').trim();return !!(t&&t===t.toUpperCase()&&/[A-Z]/.test(t)&&t.length<44);}

  showModal('ITP bewerken · '+esc(r.project||'')+' '+esc(r.unit||''),bodyH,async()=>{

  const paid=(r.status==='deposit_paid'||r.payment_status==='paid');

}

function downloadItpPdf(r){
  if(!window.jspdf){toast('PDF-bibliotheek nog aan het laden, probeer zo nog eens','err');return;}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  const M=56;let y=64;const W=doc.internal.pageSize.getWidth()-M*2;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('UTAMA: Intent to Purchase (ITP)',M,y);y+=26;
  doc.setFontSize(10.5);doc.setTextColor(30);
  const body=htmlToPlain(itpMetHandtekening(r)||itpDraft(r));
  const lines=['Prepared on '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),'',...body.split('\n')];
  if(r.itp_signed_at)lines.push('','SIGNATURES','Buyer: digitally signed by '+(r.itp_signer_name||'')+' on '+fmtDateTime(r.itp_signed_at),'Seller: digitally signed upon issuance of this ITP','Verification hash: '+(r.itp_hash||''));
  lines.forEach(t=>{
    const kop=isHeadingLine(t);
    const m=!kop&&/^([A-Za-z][A-Za-z .]{0,24}:)\s(.+)$/.exec(t);
    if(m){
      doc.setFont('helvetica','bold');
      const lw=doc.getTextWidth(m[1]+' ');
      if(lw+doc.getTextWidth(m[2])<=W){
        if(y>790){doc.addPage();y=64;}
        doc.text(m[1],M,y);doc.setFont('helvetica','normal');doc.text(m[2],M+lw,y);y+=15;return;
      }
    }
    doc.setFont('helvetica',kop?'bold':'normal');
    const w=doc.splitTextToSize(t,W);w.forEach(x=>{if(y>790){doc.addPage();y=64;}doc.text(x,M,y);y+=15;});
  });
  if(r.itp_signed_at){
    const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
    for(let i=1;i<=doc.getNumberOfPages();i++){
      doc.setPage(i);doc.saveGraphicsState();doc.setGState(new doc.GState({opacity:0.08}));
      doc.setFont('helvetica','bold');doc.setFontSize(78);doc.setTextColor(15,107,79);
      doc.text('SIGNED',pw/2,ph/2,{angle:45,align:'center'});
      doc.restoreGraphicsState();
    }
    doc.setTextColor(30);
  }
  doc.save('ITP-'+((r.project||'')+'-'+(r.unit||'')).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf');
  toast('ITP-PDF gedownload','ok');
}
async function sendReservation(r,person,via){
  if(!r)return;person=person||{};
  const link=RESV_SITE+'/reserve.html?token='+r.token;
  const dep='€'+Number(r.deposit_amount||5000).toLocaleString('nl-NL');
  const msg=`Hoi ${r.name||person.name||''},\n\nHier is je intentieverklaring voor ${r.project||''} ${r.unit||''}. Bekijk en teken hem, en rond je reservering af met de aanbetaling van ${dep} via deze link:\n${link}\n\nVragen? Stuur gerust een berichtje.\n\nGroet, UTAMA`;
  let url;
  if(via==='whatsapp'){
    const digits=((r.phone||person.phone||'')+'').replace(/[^0-9]/g,'');
    if(!digits){toast('Geen telefoonnummer bekend voor deze lead','err');return;}
    url='https://wa.me/'+digits+'?text='+encodeURIComponent(msg);
  }else{
    const to=r.email||person.email||'';
    if(!to){toast('Geen e-mailadres bekend voor deze lead','err');return;}
    url='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('Je intentieverklaring — UTAMA '+(r.project||''))+'&body='+encodeURIComponent(msg);
  }
  const w=window.open(url,'_blank');
  await sb.from('reservations').update({sent_at:new Date().toISOString(),sent_via:via}).eq('id',r.id);
  if(w){toast((via==='whatsapp'?'WhatsApp':'E-mail')+' geopend — de ITP-link staat in het bericht. Klik op verzenden in '+(via==='whatsapp'?'WhatsApp':'je mail'),'ok');}
  else{try{navigator.clipboard.writeText(msg+'\n'+link);}catch(e){}toast('Pop-up geblokkeerd — bericht + link zijn gekopieerd, plak ze in '+(via==='whatsapp'?'WhatsApp':'je e-mail'),'err');}
  if(PERSON_RESV[r.id])PERSON_RESV[r.id].sent_at=new Date().toISOString();
}
async function markReservationPaid(id,amount,person){
  if(!confirm('Bevestig dat de aanbetaling is ontvangen? De reservering wordt op "deposit paid" gezet.'))return;

async function pipeLoadEnrichment(){
  PIPE.enrich={};
  const ids=[...new Set(PIPE.cards.map(c=>c.contact_id).filter(Boolean))];
  if(!ids.length)return;
  const [ctR,ldR,chR]=await Promise.all([
    sb.from('contacts').select('id,name,phone,email,first_seen_at,last_activity_at').in('id',ids),
    sb.from('leads').select('contact_id,budget,timeline,project,created_at').in('contact_id',ids).order('created_at',{ascending:false}),
    sb.from('inbox_conversations').select('contact_id,channel,last_message_at').in('contact_id',ids),
  ]);
  (ctR.data||[]).forEach(ct=>{PIPE.enrich[ct.id]={name:ct.name,phone:ct.phone,email:ct.email,first_seen_at:ct.first_seen_at,last_activity_at:ct.last_activity_at};});
  (ldR.data||[]).forEach(l=>{if(!l.contact_id)return;const e=PIPE.enrich[l.contact_id]||(PIPE.enrich[l.contact_id]={});if(!e.budget&&l.budget)e.budget=l.budget;if(!e.timeline&&l.timeline)e.timeline=l.timeline;if(!e.project&&l.project)e.project=l.project;if(l.created_at&&(!e.leadFirst||l.created_at<e.leadFirst))e.leadFirst=l.created_at;});
  // Chat activity per contact: latest message time + which channels are in play.
  (chR.data||[]).forEach(cv=>{if(!cv.contact_id)return;const e=PIPE.enrich[cv.contact_id]||(PIPE.enrich[cv.contact_id]={});const ch=e.chat||(e.chat={at:null,channels:[]});if(cv.channel&&!ch.channels.includes(cv.channel))ch.channels.push(cv.channel);if(cv.last_message_at&&(!ch.at||cv.last_message_at>ch.at))ch.at=cv.last_message_at;});
}
function pipeTeamName(id){const t=PIPE.team.find(x=>x.id===id);return t?(t.full_name||t.email||'—'):'';}
function pipeInitials(id){const n=pipeTeamName(id);if(!n)return '?';return n.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();}
// De kaarttitel wordt gezet op het moment dat de kaart ontstaat, vaak nog voor
// de naam bekend is. Dan blijft er 'Lead', '{{first_name}}' of een kale handle
// staan, ook nadat het contact allang een echte naam heeft. De naam van het
// contact is altijd actueler, dus die wint zodra de titel niets voorstelt.
function pipeTitelIsLeeg(t){
  const v=String(t||'').trim();
  if(!v)return true;
  if(v.includes('{{'))return true;
  return ['lead','social lead','onbekend','(naamloos)','naamloos'].includes(v.toLowerCase());
}
function pipeCardName(c,en){
  en=en||{};
  const titel=String(c.title||'').trim();
  const naam=String(en.name||'').trim();
  if(naam&&pipeTitelIsLeeg(titel))return naam;
  // ook een losse handle vervangen zodra er een volledige naam bekend is
  if(naam&&naam.includes(' ')&&titel&&!titel.includes(' ')&&naam.toLowerCase().replace(/\s/g,'').includes(titel.toLowerCase()))return naam;
  // geen bruikbare naam en geen bruikbare titel: nooit een rauwe merge-tag tonen
  if(pipeTitelIsLeeg(titel))return naam||'(naamloos)';
  return titel;
}
function pipeFilteredCards(){
  const f=PIPE.filters;
  return PIPE.cards.filter(c=>{
    if(f.project&&c.project!==f.project)return false;
    if(f.assignee&&String(c.assignee||'')!==f.assignee)return false;
    if(f.q){
      const q=f.q.trim().toLowerCase();
      const en=(PIPE.enrich&&PIPE.enrich[c.contact_id])||{};
      const hay=[c.title,pipeCardName(c,en),c.project,c.notes,en.name,en.email].filter(Boolean).join(' ').toLowerCase();
      let raak=hay.includes(q);
      // Zoek je op een telefoonnummer, dan mag de schrijfwijze verschillen:
      // 06-28444468, +31 6 28444468 en 31628444468 horen allemaal te matchen.
      if(!raak){
        const qd=q.replace(/\D/g,'');
        if(qd.length>=6){
          const pd=String(en.phone||'').replace(/\D/g,'');
          if(pd&&(pd.endsWith(qd)||qd.endsWith(pd.slice(-9))))raak=true;
        }
      }
      if(!raak)return false;
    }
    return true;
  });
}

  return `<div class="pipe-card" draggable="true" data-id="${esc(c.id)}">${titleRow}${chips.trim()?`<div class="pipe-card-chips">${chips}</div>`:''}${foot}</div>`;

function drawPipeline(){
  const v=$('#view');const edit=canEdit('pipeline');const cur=PIPE.cur;const stages=cur.stages||[];
  const pOpts=PIPE.list.map(p=>`<option value="${p.id}"${p.id===cur.id?' selected':''}>${esc(p.name)}</option>`).join('');

    ${cur.auto_sync?`<span class="muted" style="font-size:12px" title="Kaarten komen automatisch uit de CRM: nieuwe leads, ITP-/reserveringsaanvragen en aankopen verschuiven vanzelf mee.">⚡ Automatisch gevuld vanuit CRM</span>`:(edit?`<button class="btn btn-ghost btn-sm" id="pipe_import">⤵ Leads importeren</button>`:'')}
    <span id="pipe_handoffs" style="display:flex;gap:6px;align-items:center"></span>
  </div>`;
  const cards=pipeFilteredCards();
  // Deze pipeline heeft meer kolommen dan er op het scherm passen. Zoek je iets
  // en zit de treffer in een kolom buiten beeld, dan lijkt het bord leeg. Tijdens
  // een zoekopdracht daarom alleen de kolommen tonen die iets opleveren.
  const zoekt=!!(PIPE.filters.q||'').trim();
  let toonStages=stages;
  if(zoekt){
    const metTreffer=stages.filter(st=>cards.some(c=>c.stage===st.key));
    if(metTreffer.length)toonStages=metTreffer;
    const waar=metTreffer.map(st=>st.label).join(', ');
    h+=`<div class="pipe-zoekhint">${cards.length
      ? `<b>${cards.length}</b> ${cards.length===1?'kaart':'kaarten'} gevonden in: ${esc(waar)}`
      : `Geen kaart gevonden voor <b>${esc(PIPE.filters.q)}</b> in deze pipeline. Probeer een andere pipeline via de keuzelijst linksboven.`}</div>`;
  }
  if(!stages.length){

  }else{
    h+=`<div class="pipe-board" id="pipe_board">`;
    toonStages.forEach(st=>{
      const cs=cards.filter(c=>c.stage===st.key).sort((a,b)=>(a.position||0)-(b.position||0));
      const sum=cs.reduce((a,c)=>a+(Number(c.value)||0),0);
      h+=`<div class="pipe-col" data-stage="${esc(st.key)}">
        <div class="pipe-col-head">${edit?`<span class="pipe-colgrip" draggable="true" data-colkey="${esc(st.key)}" title="Sleep om de kolom te verplaatsen">⠿</span>`:''}<span class="pipe-dot" style="background:${esc(st.color||'#64748b')}"></span><span class="pipe-col-title"${edit?` data-stkey="${esc(st.key)}" title="Klik om te hernoemen" style="cursor:text"`:''}>${esc(st.label)}</span><span class="pipe-col-count">${cs.length}</span></div>
        ${sum>0?`<div class="pipe-col-sum">${anMoney(sum)}</div>`:''}
        <div class="pipe-cards" data-stage="${esc(st.key)}">${cs.map(pipeCardHtml).join('')}</div>
        ${edit?`<button class="pipe-add" data-add="${esc(st.key)}">＋ Kaart</button>`:''}
      </div>`;
    });
    h+=`</div>`;
  }
  v.innerHTML=h;
  wirePipeline();
}
function wirePipeline(){
  const sel=$('#pipe_sel');if(sel)sel.onchange=()=>{PIPE.cur=PIPE.list.find(p=>p.id===sel.value);PIPE.filters={project:'',assignee:'',q:''};loadPipelineData();};

  // Los daarvan afgeschermd, zodat één kapotte widget de rest niet meesleurt.
