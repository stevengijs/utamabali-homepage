function pipeStartRename(titleEl,key){
  if(!canEdit('pipeline'))return;
  const st=(PIPE.cur.stages||[]).find(s=>s.key===key);if(!st)return;
  const inp=document.createElement('input');inp.value=st.label;
  inp.style.cssText='font-weight:700;font-size:13px;border:1px solid var(--brand,#0f6b4f);border-radius:6px;padding:1px 6px;width:140px;font-family:inherit';
  titleEl.replaceWith(inp);inp.focus();inp.select();
  let done=false;
  const commit=async()=>{if(done)return;done=true;const val=(inp.value||'').trim()||st.label;
    if(val!==st.label){st.label=val;const li=PIPE.list.find(p=>p.id===PIPE.cur.id);if(li)li.stages=PIPE.cur.stages;
      const {error}=await sb.from('pipelines').update({stages:PIPE.cur.stages}).eq('id',PIPE.cur.id);
      if(error)toast('Kon niet opslaan: '+error.message,'err');else toast('Kolom hernoemd','ok');}
    drawPipeline();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}else if(e.key==='Escape'){done=true;drawPipeline();}});
  inp.addEventListener('blur',commit);
}
async function pipeDrop(zone,e){
  const id=PIPE.dragId;if(!id)return;
  const card=PIPE.cards.find(c=>c.id===id);if(!card)return;
  const stage=zone.dataset.stage;
  const sibs=PIPE.cards.filter(c=>c.stage===stage&&c.id!==id).sort((a,b)=>(a.position||0)-(b.position||0));
  const els=[...zone.querySelectorAll('.pipe-card')].filter(el=>el.dataset.id!==id);
  let idx=els.length;
  for(let i=0;i<els.length;i++){const r=els[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){idx=i;break;}}
  const prev=idx>0?sibs[idx-1]:null,next=idx<sibs.length?sibs[idx]:null;
  let pos; if(prev&&next)pos=(prev.position+next.position)/2; else if(prev)pos=prev.position+1; else if(next)pos=next.position-1; else pos=0;
  const oldStage=card.stage,oldPos=card.position;
  if(oldStage===stage&&Math.abs((oldPos||0)-pos)<1e-9){PIPE.dragId=null;return;}
  card.stage=stage;card.position=pos;drawPipeline();
  const {error}=await sb.from('pipeline_cards').update({stage,position:pos}).eq('id',id);
  if(error){toast('Kon kaart niet verplaatsen: '+error.message,'err');card.stage=oldStage;card.position=oldPos;drawPipeline();}
  PIPE.dragId=null;
}
async function pipeColDrop(col,e){
  const key=PIPE.colDrag;PIPE.colDrag=null;if(!key)return;
  const targetKey=col.dataset.stage;if(!targetKey||targetKey===key)return;
  const stages=(PIPE.cur.stages||[]).slice();
  const from=stages.findIndex(s=>s.key===key);if(from<0)return;
  const r=col.getBoundingClientRect();const after=e.clientX>r.left+r.width/2;
  const [moved]=stages.splice(from,1);
  let idx=stages.findIndex(s=>s.key===targetKey);if(idx<0){stages.splice(from,0,moved);return;}
  if(after)idx+=1;
  stages.splice(idx,0,moved);
  PIPE.cur.stages=stages;const li=PIPE.list.find(p=>p.id===PIPE.cur.id);if(li)li.stages=stages;
  drawPipeline();
  const {error}=await sb.from('pipelines').update({stages}).eq('id',PIPE.cur.id);
  if(error){toast('Kon kolomvolgorde niet opslaan: '+error.message,'err');loadPipelineData();}
}

      nb.disabled=true;nb.textContent='…';
      const {error}=await sb.rpc('pipe_note_add',{p_card:card.id,p_body:v});
      nb.disabled=false;nb.textContent='Notitie toevoegen';
      if(error){toast('Opslaan mislukt: '+error.message,'err');return;}
      nt.value='';flash();loadNotes();
    };
    if(nb)nb.onclick=addNote;
    if(nt)nt.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')addNote();});
  }
  // ---- Taken & automatiseringen ----
  async function loadTasks(){
    const box=q('#pdr_tasks');if(!box)return;
    const {data,error}=await sb.rpc('pipeline_tasks_for_card',{p_card:card.id});
    if(error){box.innerHTML='<div class="muted" style="font-size:12px">Kon taken niet laden.</div>';return;}
    const tasks=data||[];
    if(!tasks.length){box.innerHTML='<div class="muted" style="font-size:12px">Nog geen taken of automatiseringen.</div>';return;}
    box.innerHTML=tasks.map(t=>{
      const d=new Date(t.due_at).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});
      const st=t.status==='scheduled'?'':(t.status==='done'?' · ✓ uitgevoerd':' · geannuleerd');
      const cls=t.status==='scheduled'?'':'done';
      return `<div class="pdr-task ${cls}"><div style="min-width:0"><b>⏰ Opvolgen op ${esc(d)}</b>${t.note?` — ${esc(t.note)}`:''}<div class="muted" style="font-size:11px">→ verschuift naar Actie vereist${st}</div></div>${(t.status==='scheduled'&&edit)?`<button class="pdr-task-x" data-cancel="${esc(t.id)}" title="Annuleren">×</button>`:''}</div>`;
    }).join('');
    box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('pipeline_task_cancel',{p_id:b.dataset.cancel});if(error){toast('Annuleren mislukt','err');return;}toast('Taak geannuleerd','ok');loadTasks();loadPipelineData();});
  }
  loadTasks();
  if(edit){
    const add=q('#pdr_auto_add');
    if(add)add.onclick=async()=>{
      const dv=q('#pdr_auto_date').value;if(!dv){toast('Kies een datum','err');return;}
      const note=q('#pdr_auto_note').value||'';
      const due=new Date(dv+'T09:00:00').toISOString();
      add.disabled=true;add.textContent='…';
      const {data,error}=await sb.rpc('pipeline_task_add',{p_card:card.id,p_due:due,p_note:note});
      add.disabled=false;add.textContent='Toevoegen';
      if(error||(data&&data.error)){toast('Toevoegen mislukt: '+esc((error&&error.message)||(data&&data.error)),'err');return;}
      toast('Opvolgtaak ingepland — verschuift op '+new Date(due).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})+' naar Actie vereist','ok');
      q('#pdr_auto_note').value='';q('#pdr_auto_date').value='';
      loadTasks();loadPipelineData();
    };
  }
}

async function pipeImportLeads(){
  if(!confirm('Alle CRM-leads die nog geen kaart hebben importeren in de eerste kolom?'))return;
  const [{data:contacts},{data:leads}]=await Promise.all([
    sb.from('contacts').select('id,name,email,last_activity_at').order('last_activity_at',{ascending:false,nullsFirst:false}).limit(1000),
    sb.from('leads').select('contact_id,project,created_at').order('created_at',{ascending:false}),
  ]);
  const projByContact={};(leads||[]).forEach(l=>{if(l.contact_id&&!(l.contact_id in projByContact))projByContact[l.contact_id]=l.project||null;});
  const have=new Set(PIPE.cards.map(c=>c.contact_id).filter(Boolean));
  const firstStage=(PIPE.cur.stages[0]||{}).key||'nieuw';
  const toAdd=(contacts||[]).filter(c=>!have.has(c.id)&&(c.id in projByContact));
  if(!toAdd.length){toast('Geen nieuwe leads om te importeren','ok');return;}
  let pos=Math.max(0,...PIPE.cards.filter(c=>c.stage===firstStage).map(c=>c.position||0));
  const rows=toAdd.map(c=>({pipeline_id:PIPE.cur.id,stage:firstStage,position:++pos,title:c.name||c.email||'Lead',contact_id:c.id,project:projByContact[c.id]||null,source:'lead',created_by:ME.id}));
  const {error}=await sb.from('pipeline_cards').insert(rows);
  if(error){toast('Import mislukt: '+error.message,'err');return;}
  toast(rows.length+' lead'+(rows.length===1?'':'s')+' geïmporteerd','ok');loadPipelineData();
}
function pipeEditColumns(){
  const cur=PIPE.cur;let name=cur.name;let auto=!!cur.auto_sync;let defAss=cur.default_assignee||'';let stages=JSON.parse(JSON.stringify(cur.stages||[]));
  const slug=s=>((s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'kolom');
  function draw(){
    const rows=stages.map((s,i)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input type="color" value="${esc(s.color||'#64748b')}" data-c="${i}" style="width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px">

      <button class="btn btn-ghost btn-sm" data-up="${i}" ${i===0?'disabled':''}>↑</button>
      <button class="btn btn-ghost btn-sm" data-down="${i}" ${i===stages.length-1?'disabled':''}>↓</button>
      <button class="btn btn-ghost btn-sm" data-rm="${i}" style="color:#b91c1c">✕</button>
    </div>`).join('');
    const body=`<div class="pc-form">
      <label>Pipeline-naam<input class="pc-in" id="pe_name" value="${esc(name)}"></label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:500;color:var(--ink,#111);cursor:pointer"><input type="checkbox" id="pe_auto" ${auto?'checked':''} style="width:16px;height:16px"> Automatisch vullen vanuit de CRM (leads, ITP-aanvragen, aankopen schuiven vanzelf mee)</label>
      <label style="margin-top:12px">Standaard-eigenaar voor nieuwe leads<select class="pc-in" id="pe_defass"><option value="">— niemand —</option>${PIPE.team.map(t=>`<option value="${t.id}"${defAss===t.id?' selected':''}>${esc(t.full_name||t.email)}</option>`).join('')}</select></label>
      <div style="margin-top:16px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Kolommen</div>
      <div style="margin-top:8px" id="pe_rows">${rows}</div>
      <button class="btn btn-ghost btn-sm" id="pe_add">＋ Kolom toevoegen</button>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-primary" id="pe_save">Opslaan</button>
        ${PIPE.list.length>1?`<button class="btn btn-ghost" id="pe_delpipe" style="color:#b91c1c">Pipeline verwijderen</button>`:''}
        <button class="btn btn-ghost" id="pe_cancel" style="margin-left:auto">Annuleren</button>
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">Een kolom verwijderen verplaatst de kaarten erin naar de eerste kolom.</div>
    </div>`;
    showDetail('Kolommen & pipeline bewerken',body);
    const g=id=>document.getElementById(id),closeM=()=>{$('#overlay').style.display='none';$('#overlay').innerHTML='';};
    g('pe_name').oninput=e=>{name=e.target.value;};
    g('pe_auto').onchange=e=>{auto=e.target.checked;};
    if(g('pe_defass'))g('pe_defass').onchange=e=>{defAss=e.target.value;};
    g('pe_rows').querySelectorAll('[data-l]').forEach(inp=>inp.oninput=e=>{stages[+inp.dataset.l].label=e.target.value;});
    g('pe_rows').querySelectorAll('[data-c]').forEach(inp=>inp.oninput=e=>{stages[+inp.dataset.c].color=e.target.value;});
    g('pe_rows').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[stages[i-1],stages[i]]=[stages[i],stages[i-1]];draw();});
    g('pe_rows').querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[stages[i+1],stages[i]]=[stages[i],stages[i+1]];draw();});
    g('pe_rows').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(stages.length<=1){toast('Minimaal 1 kolom','err');return;}stages.splice(+b.dataset.rm,1);draw();});
    g('pe_add').onclick=()=>{stages.push({key:'',label:'Nieuwe kolom',color:'#64748b'});draw();};
    g('pe_cancel').onclick=closeM;
    g('pe_save').onclick=async()=>{
      const used=new Set();
      stages.forEach(s=>{if(!(s.label||'').trim())s.label='Kolom';let base=s.key||slug(s.label),k=base,n=2;while(used.has(k)){k=base+'-'+(n++);}s.key=k;used.add(k);});
      const validKeys=new Set(stages.map(s=>s.key)),first=stages[0].key;
      const {error}=await sb.from('pipelines').update({name:(name||'').trim()||'Pipeline',stages,auto_sync:auto,default_assignee:defAss||null}).eq('id',cur.id);
      if(error){toast('Kon niet opslaan: '+error.message,'err');return;}
      const orphans=PIPE.cards.filter(c=>!validKeys.has(c.stage));
      if(orphans.length){await sb.from('pipeline_cards').update({stage:first}).in('id',orphans.map(o=>o.id));}
      cur.stages=stages;cur.name=(name||'').trim()||'Pipeline';cur.auto_sync=auto;cur.default_assignee=defAss||null;const li=PIPE.list.find(p=>p.id===cur.id);if(li){li.stages=stages;li.name=cur.name;li.auto_sync=auto;li.default_assignee=cur.default_assignee;}
      closeM();toast('Opgeslagen','ok');loadPipelineData();
    };
    if(g('pe_delpipe'))g('pe_delpipe').onclick=async()=>{
      if(!confirm('Deze pipeline en al zijn kaarten definitief verwijderen?'))return;
      const {error}=await sb.from('pipelines').delete().eq('id',cur.id);
      if(error){toast('Kon niet verwijderen: '+error.message,'err');return;}
      PIPE.cur=null;closeM();toast('Pipeline verwijderd','ok');renderPipeline();
    };
  }
  draw();
}

  let h='<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Page access</th><th style="text-align:right">Actions</th></tr></thead><tbody>';

      </div></td></tr>`;
  });
  $('#tw_users').innerHTML=h+'</tbody></table>';
  $('#tw_users').querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>openPermForm(profs.find(x=>x.id===b.dataset.perm),byUser[b.dataset.perm]||{}));

    </div>`;

    if(!makeAdmin){
      const rows=PAGES.map(p=>{const view=$(`[data-view="${p.key}"]`).checked;const edit=$(`[data-edit="${p.key}"]`).checked;return {user_id:user.id,page:p.key,can_view:view||edit,can_edit:edit};});
      const {error}=await sb.from('adm_permissions').upsert(rows,{onConflict:'user_id,page'});
      if(error){toast(error.message,'err');return false;}
    }

async function callFn(action,payload){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SUPABASE_URL}/functions/v1/adm-users`,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON},
    body:JSON.stringify({action,...payload})});
  let json={};try{json=await res.json();}catch(e){}
  if(!res.ok||json.error)throw new Error(json.error||('Request failed ('+res.status+')'));
  return json;
}

/* ---- Bericht flows: prestaties (interactief) ----------------------------
   Bron: flow_stats(dagen). Verzonden/reacties komen uit het inbox-grootboek,
   de sequence-tabel geeft de opbouw per stap. Opens en clicks worden nergens
   vastgelegd, die tonen we daarom bewust niet (zie de voetnoot in het paneel). */
const FS = { days:30, data:null, off:{} };
const FS_COL = { email:'#0f6b4f', whatsapp:'#25D366', instagram:'#C13584' };
const FS_LBL = { email:'E-mail', whatsapp:'WhatsApp', instagram:'Instagram' };
function fsPanel(){
  return `<div class="panel" style="padding:0;margin-bottom:14px">
    <div class="fs-head">
      <div><b>Prestaties</b><div class="muted" style="font-size:12px">Wat er uitging en wat het opleverde. Klik op een kanaal om het in of uit de grafiek te zetten.</div></div>
      <div class="seg" id="fs_seg">
        <button data-d="7">7 dagen</button><button data-d="30" class="on">30 dagen</button><button data-d="90">90 dagen</button>
      </div>
    </div>
    <div id="fs_body"><div class="muted" style="padding:18px">Laden…</div></div>
  </div>`;
}
function fsNum(n){ return (n||0).toLocaleString('nl-NL'); }
function fsRender(){
  const d=FS.data, host=document.getElementById('fs_body'); if(!host) return;
  if(!d){ host.innerHTML='<div class="empty" style="padding:20px">Kon de cijfers niet laden.</div>'; return; }
  const em=d.email||{tracked:0,opened:0,clicked:0,bounced:0,has_data:false};
  const chans=(d.channels||[]).filter(c=>FS_LBL[c.channel]||true);
  const active=chans.filter(c=>!FS.off[c.channel]);
  const actSet=new Set(active.map(c=>c.channel));
  const sent=active.reduce((a,c)=>a+ +c.sent,0), rep=active.reduce((a,c)=>a+ +c.replies,0);
  const rate= sent? Math.round(rep*1000/sent)/10 : 0;
  const maxSent=Math.max(1,...chans.map(c=>+c.sent));

  // tijdlijn optellen over de geselecteerde kanalen
  const byDay={};
  (d.timeline||[]).forEach(t=>{ if(!actSet.has(t.channel)) return;
    const k=t.d; byDay[k]=byDay[k]||{s:0,r:0}; byDay[k].s+= +t.sent; byDay[k].r+= +t.replies; });
  const days=Object.keys(byDay).sort();
  const maxDay=Math.max(1,...days.map(k=>byDay[k].s+byDay[k].r));
  const bars=days.map(k=>{
    const v=byDay[k], hs=Math.round(v.s/maxDay*104), hr=Math.round(v.r/maxDay*104);
    const dd=new Date(k+'T00:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    return `<div class="fs-bar" data-tip="${esc(dd)} · ${v.s} verzonden, ${v.r} reacties">
      <div class="r" style="height:${hr}px"></div><div class="s" style="height:${hs}px"></div></div>`;
  }).join('');

  const chRows=chans.map(c=>{
    const off=FS.off[c.channel]?' off':'';
    const w=Math.round(+c.sent/maxSent*100);
    const rw=(+c.sent)? Math.round(+c.replies/ +c.sent*100):0;
    const col=FS_COL[c.channel]||'#0f6b4f';
    return `<div class="fs-ch${off}" data-ch="${esc(c.channel)}">
      <div class="nm"><span class="dot" style="background:${col}"></span>${esc(FS_LBL[c.channel]||c.channel)}</div>
      <div class="track"><span class="fill" style="width:${w}%;background:${col}22"></span></div>
      <div class="num"><span><b>${fsNum(c.sent)}</b> uit · <b>${fsNum(c.replies)}</b> terug</span><span class="rate" title="reactiepercentage">${c.reply_rate}%</span></div>
    </div>`;
  }).join('') || '<div class="muted" style="font-size:13px">Nog geen berichten in deze periode.</div>';

  // sequence-stappen met uitval t.o.v. stap 1
  const bySeq={};
  (d.steps||[]).forEach(st=>{ (bySeq[st.seq]=bySeq[st.seq]||[]).push(st); });
  const stepTables=Object.keys(bySeq).map(name=>{
    const rows=bySeq[name]; const first=Math.max(1, +rows[0].sent||0);
    const kol=em.has_data?'<th style="text-align:right">Geopend</th><th style="text-align:right">Geklikt</th>':'';
    return `<h4>${esc(name)}</h4><table class="fs-steps"><thead><tr><th>Stap</th><th>Onderwerp</th><th style="text-align:right">Verzonden</th>${kol}</tr></thead><tbody>`+
      rows.map(r=>{
        const pct=Math.round(+r.sent/first*100);
        const drop=(+r.sent < first)? `<span class="fs-drop">${pct}%</span>`:'';
        const extra=em.has_data?`<td class="n">${fsNum(r.opened)}</td><td class="n">${fsNum(r.clicked)}</td>`:'';
        return `<tr><td>${r.step}</td><td>${esc(r.subject||'')}</td><td class="n">${fsNum(r.sent)}${drop}</td>${extra}</tr>`;
      }).join('')+`</tbody></table>`;
  }).join('') || '';

  const fail=+(d.totals&&d.totals.failed||0), pend=+(d.totals&&d.totals.pending||0);
  host.innerHTML=`
    <div class="fs-kpis">
      <div class="fs-kpi"><div class="k">Verzonden</div><div class="v">${fsNum(sent)}</div><div class="s">berichten de deur uit</div></div>
      <div class="fs-kpi"><div class="k">Reacties</div><div class="v">${fsNum(rep)}</div><div class="s">leads die terugschreven</div></div>
      <div class="fs-kpi"><div class="k">Reactiepercentage</div><div class="v">${rate}%</div><div class="s">van alles wat uitging</div></div>
      <div class="fs-kpi"><div class="k">Mislukt / wachtrij</div><div class="v">${fsNum(fail)}${pend?` <span style="font-size:14px;color:#8a8f8b">/ ${fsNum(pend)}</span>`:''}</div><div class="s">${fail?'niet afgeleverd':'alles afgeleverd'}</div></div>
      ${em.has_data?`
      <div class="fs-kpi"><div class="k">Geopend</div><div class="v">${fsNum(em.opened)}${em.tracked?` <span style="font-size:14px;color:#8a8f8b">${Math.round(em.opened*100/em.tracked)}%</span>`:''}</div><div class="s">van ${fsNum(em.tracked)} gevolgde mails</div></div>
      <div class="fs-kpi"><div class="k">Geklikt</div><div class="v">${fsNum(em.clicked)}${em.tracked?` <span style="font-size:14px;color:#8a8f8b">${Math.round(em.clicked*100/em.tracked)}%</span>`:''}</div><div class="s">${fsNum(em.bounced)} bounced</div></div>`:''}
    </div>
    <div class="fs-sec">
      <h4>Per kanaal</h4>${chRows}
      <h4>Per dag</h4>
      <div class="fs-chart" id="fs_chart">${bars||'<div class="muted" style="font-size:13px">Geen data.</div>'}<div class="fs-tip" id="fs_tip"></div></div>
      ${stepTables}
      <div class="an-note" style="margin-top:14px">${em.has_data
        ? 'Opens en clicks komen binnen via Resend. Een open telt een keer per mail, ook als iemand hem vaker opent. Let op: sommige mailprogramma\'s blokkeren de open-pixel, het echte aantal ligt dus iets hoger.'
        : 'Opens en clicks worden nog niet ontvangen. Zet in Resend een webhook naar /functions/v1/resend-webhook en sla het signing secret op als resend_webhook_secret. Zodra er events binnenkomen verschijnen ze hier vanzelf.'}</div>
    </div>`;

  host.querySelectorAll('.fs-ch').forEach(r=>r.onclick=()=>{
    const c=r.dataset.ch; FS.off[c]=!FS.off[c]; fsRender();
  });
  const chart=document.getElementById('fs_chart'), tip=document.getElementById('fs_tip');
  if(chart&&tip){
    chart.querySelectorAll('.fs-bar').forEach(b=>{
      b.onmouseenter=()=>{ tip.textContent=b.dataset.tip; tip.classList.add('on');
        const cr=chart.getBoundingClientRect(), br=b.getBoundingClientRect();
        tip.style.left=Math.min(Math.max(0,br.left-cr.left-60),cr.width-150)+'px'; tip.style.top='0px'; };
      b.onmouseleave=()=>tip.classList.remove('on');
    });
  }
}

    ]);
    SEQ.opts={
      budget:['Tot €200K','€200K–€250K','€250K–€400K','€400K+','Onbekend'],
      timeline:[...new Set((tR.data||[]).map(x=>x.timeline).filter(Boolean))],
      projects:(pR.data||[]).map(x=>x.name).filter(Boolean)
    };
  }
  SEQ.cur={id:id||null,seq,steps,enrollments};
  seqEditorView();
}
function seqOptSelect(id,list,cur,allLabel){
  const opts=`<option value="">${esc(allLabel)}</option>`+(list||[]).map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  return `<select id="${id}" class="pc-in">${opts}</select>`;
}
function seqStepCard(st,i){
  const design=st.design==='newsletter'?'newsletter':'plain';
  return `<div class="seq-step" data-step data-design="${design}">
    <div class="seq-step-head">
      <span class="seq-step-n">E-mail ${i+1}</span>
      <label class="seq-daywrap">Dag <input class="seq-day" type="number" min="0" step="1" value="${st.day_offset!=null?st.day_offset:0}"> <span title="Extra uren bovenop de dag. Dag 0 + 2 uur = 2 uur na inschrijving.">+ <input class="seq-hour" type="number" min="0" max="23" step="1" value="${st.hour_offset!=null?st.hour_offset:0}"> uur</span></label>
      <div class="seq-design">
        <button type="button" class="seq-dbtn ${design==='plain'?'on':''}" data-design="plain">✍️ Plat</button>
        <button type="button" class="seq-dbtn ${design==='newsletter'?'on':''}" data-design="newsletter">📰 Nieuwsbrief</button>
      </div>
      <span style="margin-left:auto"></span>
      <button type="button" class="btn btn-ghost btn-sm seq-prev">Preview</button>
      <button type="button" class="seq-del" title="Verwijderen">×</button>
    </div>
    <input class="seq-subj pc-in" placeholder="Onderwerp" value="${esc(st.subject||'')}">
    <div class="seq-rte-tools">
      <button type="button" data-cmd="bold" title="Vet"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Cursief"><i>I</i></button>
      <button type="button" data-cmd="insertUnorderedList" title="Opsomming">• Lijst</button>
      <button type="button" data-cmd="insertOrderedList" title="Genummerd">1. Lijst</button>
      <button type="button" data-cmd="createLink" title="Link invoegen">🔗</button>
      <button type="button" data-cmd="removeFormat" title="Opmaak wissen">✕</button>
    </div>
    <div class="seq-body seq-rte" contenteditable="true" data-ph="E-mailinhoud… gebruik {naam} en {project} voor personalisatie">${seqBodyToEditorHtml(st.body)}</div>
  </div>`;
}
function seqEditorView(){
  const v=$('#view');const edit=canEdit('sequences');const c=SEQ.cur;const s=c.seq;
  const steps=(c.steps&&c.steps.length)?c.steps:[{day_offset:0,hour_offset:0,subject:'',body:'',design:'plain'}];
  const stepsHtml=steps.map(seqStepCard).join('');
  const enr=c.enrollments||[];
  const enrHtml=enr.length?enr.map(e=>{const stlbl={active:'Actief',completed:'Afgerond',stopped:'Gestopt',opted_out:'Afgemeld'}[e.status]||e.status;const nx=e.status==='active'&&e.next_send_at?(' · volgende '+new Date(e.next_send_at).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})):'';return `<div class="seq-enr"><div style="min-width:0"><b>${esc(e.contact_name||e.contact_email||'—')}</b><div class="muted" style="font-size:11px">${esc(e.contact_email||'')} · ${stlbl}${e.stopped_reason?' ('+esc(e.stopped_reason)+')':''}${nx}</div></div>${(edit&&e.status==='active')?`<button class="seq-enr-x" data-unenr="${e.id}" title="Uit sequence halen">×</button>`:''}</div>`;}).join(''):'<div class="muted" style="font-size:12px">Nog geen leads in deze sequence.</div>';
  v.innerHTML=`<div class="panel" style="padding:0">
    <div class="seq-top"><button class="btn btn-ghost btn-sm" id="seq_back">← Terug</button><div style="margin-left:auto;display:flex;gap:8px">${(edit&&c.id)?`<button class="btn btn-ghost btn-sm" id="seq_run">Nu verwerken</button><button class="btn btn-ghost btn-sm" id="seq_del" style="color:#b91c1c">Verwijderen</button>`:''}${edit?`<button class="btn" id="seq_save">Opslaan</button>`:''}</div></div>
    <div class="seq-edit">
      <div class="seq-grid2">
        <div><label class="pdr-label">Naam van de sequence</label><input id="seq_name" class="pc-in" value="${esc(s.name||'')}" placeholder="bijv. Nurture – brochure aangevraagd"></div>
        <div><label class="pdr-label">Instroom</label><select id="seq_trigger" class="pc-in"><option value="manual"${s.trigger==='manual'?' selected':''}>Handmatig toevoegen</option><option value="new_lead"${s.trigger==='new_lead'?' selected':''}>Automatisch bij nieuwe lead</option></select></div>
      </div>
      <div class="seq-flags">
        <button type="button" id="seq_enabled_btn" class="seq-toggle ${s.enabled?'on':'off'}" data-on="${s.enabled?'1':'0'}" title="Klik om aan/uit te zetten"><span class="seq-toggle-dot"></span>${s.enabled?'Actief':'Inactief'}</button>
        <label class="seq-check"><input type="checkbox" id="seq_stop" ${s.stop_on_reply!==false?'checked':''}> Stop zodra de lead reageert</label>
      </div>
      <div id="seq_audience" class="seq-audience" style="${s.trigger==='new_lead'?'':'display:none'}">
        <div class="seq-h" style="margin-bottom:8px">Wie stroomt automatisch in?</div>
        <div class="muted" style="font-size:11.5px;margin-bottom:8px">Laat op “Alle” staan voor élke nieuwe lead, of filter gericht op project, budget of timing. Filters werken samen (én-én).</div>
        <div class="seq-aud-grid">
          <div><label class="pdr-label">Project</label>${seqOptSelect('seq_f_project',SEQ.opts.projects,s.filter_project||'','Alle projecten')}</div>
          <div><label class="pdr-label">Budget</label>${seqOptSelect('seq_f_budget',SEQ.opts.budget,s.filter_budget||'','Alle budgetten')}</div>
          <div><label class="pdr-label">Timing</label>${seqOptSelect('seq_f_timeline',SEQ.opts.timeline,s.filter_timeline||'','Alle timings')}</div>
        </div>
      </div>
      <div class="seq-h">E-mails in de reeks</div>
      <div id="seq_steps">${stepsHtml}</div>
      ${edit?`<button class="btn btn-ghost btn-sm" id="seq_addstep" style="margin-top:8px">＋ E-mail toevoegen</button>`:''}
      <div class="seq-h" style="margin-top:20px">Leads in deze sequence</div>
      ${edit?`<div class="seq-enroll-add"><input id="seq_enr_email" class="pc-in" placeholder="E-mailadres van bestaand contact…" style="flex:1"><button class="btn btn-ghost btn-sm" id="seq_enr_btn">Toevoegen</button></div>`:''}
      <div id="seq_enr_list" class="seq-enr-list">${enrHtml}</div>
    </div>
  </div>`;
  $('#seq_back').onclick=()=>renderSequences();
  if(edit){
    const tg=$('#seq_trigger');if(tg)tg.onchange=()=>{const a=$('#seq_audience');if(a)a.style.display=(tg.value==='new_lead')?'':'none';};
    const enb=$('#seq_enabled_btn');if(enb)enb.onclick=()=>{const on=enb.dataset.on!=='1';enb.dataset.on=on?'1':'0';enb.classList.toggle('on',on);enb.classList.toggle('off',!on);enb.innerHTML='<span class="seq-toggle-dot"></span>'+(on?'Actief':'Inactief');};
    $('#seq_addstep').onclick=()=>{const wrap=$('#seq_steps');const div=document.createElement('div');div.innerHTML=seqStepCard({day_offset:seqNextDay(),hour_offset:0,subject:'',body:'',design:'plain'},wrap.children.length);const node=div.firstElementChild;wrap.appendChild(node);seqWireStep(node);};
    $('#seq_save').onclick=seqSaveCurrent;
    const rn=$('#seq_run');if(rn)rn.onclick=seqRunNow;
    const dl=$('#seq_del');if(dl)dl.onclick=seqDeleteCurrent;
    const eb=$('#seq_enr_btn');if(eb)eb.onclick=seqEnrollByEmail;
    $('#seq_steps').querySelectorAll('.seq-step').forEach(seqWireStep);
    $('#seq_enr_list').querySelectorAll('[data-unenr]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('seq_unenroll',{p_enrollment:b.dataset.unenr});if(error){toast('Mislukt','err');return;}toast('Uit sequence gehaald','ok');seqOpen(c.id);});
  }
}
function seqNextDay(){const days=[...document.querySelectorAll('#seq_steps .seq-day')].map(i=>Number(i.value)||0);return days.length?Math.max(...days)+2:0;}
function seqWireStep(node){
  node.querySelector('.seq-del').onclick=()=>{node.remove();};
  node.querySelectorAll('.seq-dbtn').forEach(b=>b.onclick=()=>{node.dataset.design=b.dataset.design;node.querySelectorAll('.seq-dbtn').forEach(x=>x.classList.toggle('on',x.dataset.design===b.dataset.design));});
  const rte=node.querySelector('.seq-rte');
  node.querySelectorAll('.seq-rte-tools button').forEach(btn=>{
    btn.addEventListener('mousedown',e=>e.preventDefault()); // keep the text selection
    btn.onclick=()=>{const cmd=btn.dataset.cmd;rte.focus();
      if(cmd==='createLink'){const url=prompt('Link-URL:','https://');if(url)document.execCommand('createLink',false,url);}
      else{document.execCommand(cmd,false,null);}};
  });
  node.querySelector('.seq-prev').onclick=()=>{const subj=node.querySelector('.seq-subj').value;const body=rte.innerHTML;const design=node.dataset.design;seqPreview(subj,body,design);};
}
function seqCollectSteps(){
  return [...document.querySelectorAll('#seq_steps .seq-step')].map(node=>{
    const rte=node.querySelector('.seq-rte');
    let html=(rte?rte.innerHTML:'').trim();
    if(html==='<br>'||html==='<div><br></div>'||html==='<p><br></p>')html='';
    return {
      day_offset:String(Number(node.querySelector('.seq-day').value)||0),
      hour_offset:String(Math.max(0,Math.min(23,Number(node.querySelector('.seq-hour').value)||0))),
      subject:node.querySelector('.seq-subj').value,
      body:html,
      design:node.dataset.design==='newsletter'?'newsletter':'plain'
    };
  });
}
async function seqSaveCurrent(){
  const c=SEQ.cur;const btn=$('#seq_save');if(btn){btn.disabled=true;btn.textContent='Opslaan…';}
  const payload={p_id:c.id,p_name:$('#seq_name').value.trim(),p_trigger:$('#seq_trigger').value,p_enabled:($('#seq_enabled_btn')&&$('#seq_enabled_btn').dataset.on==='1'),p_stop_on_reply:$('#seq_stop').checked,p_from_name:'UTAMA Bali',p_from_email:'info@utamabali.com',p_steps:seqCollectSteps(),
    p_filter_project:($('#seq_f_project')&&$('#seq_f_project').value)||'',p_filter_budget:($('#seq_f_budget')&&$('#seq_f_budget').value)||'',p_filter_timeline:($('#seq_f_timeline')&&$('#seq_f_timeline').value)||''};
  const {data,error}=await sb.rpc('seq_save',payload);
  if(btn){btn.disabled=false;btn.textContent='Opslaan';}
  if(error||(data&&data.error)){toast('Opslaan mislukt: '+esc((error&&error.message)||data.error),'err');return;}
  toast('Sequence opgeslagen','ok');
  SEQ.cur.id=data.id;seqOpen(data.id);
}
async function seqDeleteCurrent(){const c=SEQ.cur;if(!c.id)return;if(!confirm('Deze sequence verwijderen? Actieve leads stoppen.'))return;const {error}=await sb.rpc('seq_delete',{p_id:c.id});if(error){toast('Verwijderen mislukt','err');return;}toast('Verwijderd','ok');renderSequences();}
async function seqRunNow(){const btn=$('#seq_run');if(btn){btn.disabled=true;btn.textContent='Bezig…';}try{const {data,error}=await sb.functions.invoke('sequence-run',{body:{}});if(error){toast('Verwerken mislukt','err');}else toast(`Verwerkt: ${(data&&data.sent)||0} verzonden`,'ok');}catch(e){toast('Verwerken mislukt','err');}finally{const b=$('#seq_run');if(b){b.disabled=false;b.textContent='Nu verwerken';}seqOpen(SEQ.cur.id);}}
async function seqEnrollByEmail(){
  const c=SEQ.cur;if(!c.id){toast('Sla de sequence eerst op','err');return;}
  const email=($('#seq_enr_email').value||'').trim().toLowerCase();if(!email){return;}
  const {data:ct}=await sb.from('contacts').select('id,name').ilike('email',email).limit(1).maybeSingle();
  if(!ct){toast('Geen contact met dat e-mailadres gevonden','err');return;}
  const {error}=await sb.rpc('seq_enroll',{p_sequence:c.id,p_contact:ct.id});
  if(error){toast('Toevoegen mislukt: '+esc(error.message),'err');return;}
  toast('Lead toegevoegd aan sequence','ok');$('#seq_enr_email').value='';seqOpen(c.id);
}
function seqPreview(subject,body,design){
  const vars={naam:'Steven',project:'The Maison'};
  const rb=String(body||'').replace(/\{naam\}/g,vars.naam).replace(/\{voornaam\}/g,vars.naam).replace(/\{project\}/g,vars.project);
  const rs=String(subject||'').replace(/\{naam\}/g,vars.naam).replace(/\{project\}/g,vars.project);
  const inner=sanitizeHtml(seqBodyInner(rb));
  const html=design==='newsletter'?seqNewsletterHtml(rs,inner):seqPlainHtml(inner);
  const root=document.createElement('div');root.id='seqprev_root';
  // Preview in een sandboxed iframe zonder allow-scripts: e-mail-HTML mag geen
  // JS draaien, dus ook een ongesaneerd restje kan niets in de CRM-sessie doen.
  root.innerHTML=`<div class="chatpop-back open"></div><div class="chatpop open" style="width:min(680px,94vw);height:min(720px,88vh)"><div class="chatpop-head"><div class="chatpop-title">Preview · Onderwerp: ${esc(rs||'(leeg)')}</div><button id="seqprev_x" style="font-size:22px;background:none;border:none;cursor:pointer;color:var(--muted)">×</button></div><iframe sandbox="" style="flex:1;width:100%;border:0;background:#f4f6f5"></iframe></div>`;
  document.body.appendChild(root);
  {const ifr=root.querySelector('iframe');if(ifr)ifr.srcdoc=`<!doctype html><meta charset="utf-8"><body style="margin:0;font-family:Arial,sans-serif">${html}</body>`;}
  const close=()=>root.remove();
  root.querySelector('.chatpop-back').onclick=close;root.querySelector('#seqprev_x').onclick=close;
}

/* ================= START ================= */
boot();
</script>
</body>
</html>
