  try{await sb.rpc('pipeline_sync_all');}catch(e){/* best-effort CRM sync */}
  const [plR,tmR,prR]=await Promise.all([
    sb.from('pipelines').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
    sb.from('adm_profiles').select('id,full_name,email').order('created_at',{ascending:true}),
    sb.from('projects').select('name,sort_order').order('sort_order',{ascending:true}),
  ]);
  if(plR.error){v.innerHTML=`<div class="panel"><div class="empty" style="padding:20px">Pipeline niet beschikbaar: ${esc(plR.error.message)}</div></div>`;return;}
  PIPE.list=plR.data||[];PIPE.team=tmR.data||[];PIPE.projects=(prR.data||[]).map(x=>x.name).filter(Boolean);
  if(!PIPE.list.length){
    if(canEdit('pipeline')){await sb.from('pipelines').insert({name:'Sales pipeline',created_by:ME.id});return renderPipeline();}
    v.innerHTML='<div class="panel"><div class="lock-note">Nog geen pipeline. Vraag een admin om er een aan te maken.</div></div>';return;
  }
  PIPE.cur=(PIPE.cur&&PIPE.list.find(p=>p.id===PIPE.cur.id))||PIPE.list[0];
  await loadPipelineData();
}
async function loadPipelineData(){
  const [cR,vR]=await Promise.all([
    sb.from('pipeline_cards').select('*').eq('pipeline_id',PIPE.cur.id).order('position',{ascending:true}),
    sb.from('pipeline_views').select('*').eq('pipeline_id',PIPE.cur.id).order('created_at',{ascending:true}),
  ]);
  PIPE.cards=cR.data||[];PIPE.views=vR.data||[];
  await pipeLoadEnrichment();
  await warmthLoad(PIPE.cards.map(c=>c.contact_id));
  drawPipeline();
}
async function pipeLoadEnrichment(){
  PIPE.enrich={};
  const ids=[...new Set(PIPE.cards.map(c=>c.contact_id).filter(Boolean))];
  if(!ids.length)return;
  const [ctR,ldR]=await Promise.all([
    sb.from('contacts').select('id,name,phone,email').in('id',ids),
    sb.from('leads').select('contact_id,budget,timeline,project,created_at').in('contact_id',ids).order('created_at',{ascending:false}),
  ]);
  (ctR.data||[]).forEach(ct=>{PIPE.enrich[ct.id]={name:ct.name,phone:ct.phone,email:ct.email};});
  (ldR.data||[]).forEach(l=>{if(!l.contact_id)return;const e=PIPE.enrich[l.contact_id]||(PIPE.enrich[l.contact_id]={});if(!e.budget&&l.budget)e.budget=l.budget;if(!e.timeline&&l.timeline)e.timeline=l.timeline;if(!e.project&&l.project)e.project=l.project;});
}
function pipeTeamName(id){const t=PIPE.team.find(x=>x.id===id);return t?(t.full_name||t.email||'—'):'';}
function pipeInitials(id){const n=pipeTeamName(id);if(!n)return '?';return n.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();}
function pipeFilteredCards(){
  const f=PIPE.filters;
  return PIPE.cards.filter(c=>{
    if(f.project&&c.project!==f.project)return false;
    if(f.assignee&&String(c.assignee||'')!==f.assignee)return false;
    if(f.q){const q=f.q.toLowerCase();const hay=((c.title||'')+' '+(c.project||'')+' '+(c.notes||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function pipeCardHtml(c){
  const en=(PIPE.enrich&&PIPE.enrich[c.contact_id])||{};
  const proj=(c.project||en.project)?`<span class="pipe-chip proj">${esc(c.project||en.project)}</span>`:'';
  const budget=en.budget?`<span class="pipe-chip budget" title="Budget">${esc(en.budget)}</span>`:'';
  const tl=en.timeline?`<span class="pipe-chip tl" title="Wanneer investeren">⏱ ${esc(en.timeline)}</span>`:'';
  const val=(c.value!=null&&c.value!=='')?`<span class="pipe-chip val">${anMoney(c.value)}</span>`:'';
  const crm=c.contact_id?`<span class="pipe-chip crm" data-crm="${esc(c.contact_id)}" title="Open in CRM">CRM ↗</span>`:'';
  const wa=_waDigits(en.phone)?`<a class="pipe-wa" data-wa="${esc(c.id)}" title="Stuur WhatsApp-bericht">${WA_SVG}</a>`:'';
  const who=c.assignee?`<span class="pipe-av" title="Eigenaar: ${esc(pipeTeamName(c.assignee))}">${esc(pipeInitials(c.assignee))}</span>`:'';
  const warm=c.contact_id?warmthBadge(WARMTH[c.contact_id]):'';
  const titleRow=`<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:6px"><div class="pipe-card-title" style="margin:0;flex:1">${esc(c.title||'(naamloos)')}</div>${warm}</div>`;
  const chips=`${proj}${budget}${tl}`;
  const foot=(crm||wa||who||val)?`<div class="pipe-card-foot"><span style="display:inline-flex;gap:5px;align-items:center">${val}${crm}</span><span class="pipe-foot-right">${wa}${who}</span></div>`:'';
  return `<div class="pipe-card" draggable="true" data-id="${esc(c.id)}">${titleRow}${chips.trim()?`<div class="pipe-card-chips">${chips}</div>`:''}${foot}</div>`;
}
function drawPipeline(){
  const v=$('#view');const edit=canEdit('pipeline');const cur=PIPE.cur;const stages=cur.stages||[];
  const pOpts=PIPE.list.map(p=>`<option value="${p.id}"${p.id===cur.id?' selected':''}>${esc(p.name)}</option>`).join('');
  const projList=[...new Set([...PIPE.projects,...PIPE.cards.map(c=>c.project).filter(Boolean)])];
  const projOpts=`<option value="">Alle projecten</option>`+projList.map(n=>`<option value="${esc(n)}"${PIPE.filters.project===n?' selected':''}>${esc(n)}</option>`).join('');
  const teamOpts=`<option value="">Iedereen</option>`+PIPE.team.map(t=>`<option value="${t.id}"${PIPE.filters.assignee===t.id?' selected':''}>${esc(t.full_name||t.email)}</option>`).join('');
  const viewOpts=`<option value="">Geen weergave</option>`+PIPE.views.map(vw=>`<option value="${vw.id}">${esc(vw.name)}</option>`).join('');
  let h=`<div class="pipe-toolbar">
    <select id="pipe_sel" title="Kies pipeline">${pOpts}</select>
    ${edit?`<button class="btn btn-ghost btn-sm" id="pipe_new">＋ Pipeline</button><button class="btn btn-ghost btn-sm" id="pipe_editcols">Kolommen bewerken</button>`:''}
    <span style="width:1px;height:24px;background:var(--line)"></span>
    <input id="pipe_q" placeholder="Zoeken…" value="${esc(PIPE.filters.q)}" style="width:150px">
    <select id="pipe_fproj">${projOpts}</select>
    <select id="pipe_fass">${teamOpts}</select>
    <select id="pipe_view" title="Opgeslagen weergave">${viewOpts}</select>
    ${edit?`<button class="btn btn-ghost btn-sm" id="pipe_saveview">Weergave opslaan</button>`:''}
    <span style="margin-left:auto"></span>
    ${cur.auto_sync?`<span class="muted" style="font-size:12px" title="Kaarten komen automatisch uit de CRM: nieuwe leads, ITP-/reserveringsaanvragen en aankopen verschuiven vanzelf mee.">⚡ Automatisch gevuld vanuit CRM</span>`:(edit?`<button class="btn btn-ghost btn-sm" id="pipe_import">⤵ Leads importeren</button>`:'')}
  </div>`;
  const cards=pipeFilteredCards();
  if(!stages.length){
    h+='<div class="panel"><div class="empty" style="padding:22px">Deze pipeline heeft nog geen kolommen. Klik op “Kolommen bewerken”.</div></div>';
  }else{
    h+=`<div class="pipe-board" id="pipe_board">`;
    stages.forEach(st=>{
      const cs=cards.filter(c=>c.stage===st.key).sort((a,b)=>(a.position||0)-(b.position||0));
      const sum=cs.reduce((a,c)=>a+(Number(c.value)||0),0);
      h+=`<div class="pipe-col" data-stage="${esc(st.key)}">
        <div class="pipe-col-head">${edit?`<span class="pipe-colgrip" draggable="true" data-colkey="${esc(st.key)}" title="Sleep om de kolom te verplaatsen">⠿</span>`:''}<span class="pipe-dot" style="background:${esc(st.color||'#64748b')}"></span><span class="pipe-col-title"${edit?` data-stkey="${esc(st.key)}" title="Klik om te hernoemen" style="cursor:text"`:''}>${esc(st.label)}</span><span class="pipe-col-count">${cs.length}</span></div>
        ${sum>0?`<div class="pipe-col-sum">${anMoney(sum)}</div>`:''}
        <div class="pipe-cards" data-stage="${esc(st.key)}">${cs.map(pipeCardHtml).join('')}</div>
        ${edit?`<button class="pipe-add" data-add="${esc(st.key)}">＋ Kaart</button>`:''}
      </div>`;
    });
    h+=`</div>`;
  }
  v.innerHTML=h;
  wirePipeline();
}
function wirePipeline(){
  const sel=$('#pipe_sel');if(sel)sel.onchange=()=>{PIPE.cur=PIPE.list.find(p=>p.id===sel.value);PIPE.filters={project:'',assignee:'',q:''};loadPipelineData();};
  const nw=$('#pipe_new');if(nw)nw.onclick=pipeNewPipeline;
  const ec=$('#pipe_editcols');if(ec)ec.onclick=pipeEditColumns;
  const imp=$('#pipe_import');if(imp)imp.onclick=pipeImportLeads;
  const sv=$('#pipe_saveview');if(sv)sv.onclick=pipeSaveView;
  const q=$('#pipe_q');if(q)q.oninput=()=>{PIPE.filters.q=q.value;drawPipeline();const nq=$('#pipe_q');if(nq){nq.focus();try{nq.setSelectionRange(nq.value.length,nq.value.length);}catch(e){}}};
  const fp=$('#pipe_fproj');if(fp)fp.onchange=()=>{PIPE.filters.project=fp.value;drawPipeline();};
  const fa=$('#pipe_fass');if(fa)fa.onchange=()=>{PIPE.filters.assignee=fa.value;drawPipeline();};
  const vw=$('#pipe_view');if(vw)vw.onchange=()=>{const found=PIPE.views.find(x=>x.id===vw.value);PIPE.filters=found?Object.assign({project:'',assignee:'',q:''},found.filters||{}):{project:'',assignee:'',q:''};drawPipeline();};
  const board=$('#pipe_board');if(!board)return;
  board.querySelectorAll('.pipe-card').forEach(cardEl=>{
    cardEl.addEventListener('dragstart',e=>{PIPE.dragId=cardEl.dataset.id;cardEl.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',cardEl.dataset.id);}catch(x){}});
    cardEl.addEventListener('dragend',()=>{cardEl.classList.remove('dragging');board.querySelectorAll('.pipe-cards').forEach(z=>z.classList.remove('drag-over'));});
    cardEl.addEventListener('click',e=>{if(e.target.closest('[data-crm]'))return;pipeOpenCard(cardEl.dataset.id);});
  });
  board.querySelectorAll('.pipe-chip.crm[data-crm]').forEach(ch=>ch.addEventListener('click',e=>{e.stopPropagation();openContactById(ch.dataset.crm);}));
  board.querySelectorAll('.pipe-wa[data-wa]').forEach(a=>{a.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();pipeWhatsapp(a.dataset.wa);});a.setAttribute('draggable','false');});
  board.querySelectorAll('.pipe-cards').forEach(zone=>{
    zone.addEventListener('dragover',e=>{if(PIPE.colDrag)return;e.preventDefault();zone.classList.add('drag-over');try{e.dataTransfer.dropEffect='move';}catch(x){}});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=>{if(PIPE.colDrag)return;e.preventDefault();zone.classList.remove('drag-over');pipeDrop(zone,e);});
  });
  board.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>pipeAddCard(b.dataset.add));
  // ---- whole-column drag to reorder ----
  if(canEdit('pipeline')){
    board.querySelectorAll('.pipe-colgrip[data-colkey]').forEach(g=>{
      g.addEventListener('dragstart',e=>{PIPE.colDrag=g.dataset.colkey;const col=g.closest('.pipe-col');if(col){try{e.dataTransfer.setDragImage(col,24,20);}catch(x){}setTimeout(()=>col.classList.add('col-dragging'),0);}try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','col:'+g.dataset.colkey);}catch(x){}});
      g.addEventListener('dragend',()=>{PIPE.colDrag=null;board.querySelectorAll('.pipe-col').forEach(c=>{c.classList.remove('col-drop');c.classList.remove('col-dragging');});});
    });
    board.querySelectorAll('.pipe-col').forEach(col=>{
      col.addEventListener('dragover',e=>{if(!PIPE.colDrag)return;e.preventDefault();col.classList.add('col-drop');});
      col.addEventListener('dragleave',()=>col.classList.remove('col-drop'));
      col.addEventListener('drop',e=>{if(!PIPE.colDrag)return;e.preventDefault();col.classList.remove('col-drop');pipeColDrop(col,e);});
    });
  }
  board.querySelectorAll('.pipe-col-title[data-stkey]').forEach(t=>t.addEventListener('click',()=>pipeStartRename(t,t.dataset.stkey)));
}
function pipeStartRename(titleEl,key){
  if(!canEdit('pipeline'))return;
  const st=(PIPE.cur.stages||[]).find(s=>s.key===key);if(!st)return;
  const inp=document.createElement('input');inp.value=st.label;
  inp.style.cssText='font-weight:700;font-size:13px;border:1px solid var(--brand,#0f6b4f);border-radius:6px;padding:1px 6px;width:140px;font-family:inherit';
  titleEl.replaceWith(inp);inp.focus();inp.select();
  let done=false;
  const commit=async()=>{if(done)return;done=true;const val=(inp.value||'').trim()||st.label;
    if(val!==st.label){st.label=val;const li=PIPE.list.find(p=>p.id===PIPE.cur.id);if(li)li.stages=PIPE.cur.stages;
      const {error}=await sb.from('pipelines').update({stages:PIPE.cur.stages}).eq('id',PIPE.cur.id);
      if(error)toast('Kon niet opslaan: '+error.message,'err');else toast('Kolom hernoemd','ok');}
    drawPipeline();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}else if(e.key==='Escape'){done=true;drawPipeline();}});
  inp.addEventListener('blur',commit);
}
async function pipeDrop(zone,e){
  const id=PIPE.dragId;if(!id)return;
  const card=PIPE.cards.find(c=>c.id===id);if(!card)return;
  const stage=zone.dataset.stage;
  const sibs=PIPE.cards.filter(c=>c.stage===stage&&c.id!==id).sort((a,b)=>(a.position||0)-(b.position||0));
  const els=[...zone.querySelectorAll('.pipe-card')].filter(el=>el.dataset.id!==id);
  let idx=els.length;
  for(let i=0;i<els.length;i++){const r=els[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){idx=i;break;}}
  const prev=idx>0?sibs[idx-1]:null,next=idx<sibs.length?sibs[idx]:null;
  let pos; if(prev&&next)pos=(prev.position+next.position)/2; else if(prev)pos=prev.position+1; else if(next)pos=next.position-1; else pos=0;
  const oldStage=card.stage,oldPos=card.position;
  if(oldStage===stage&&Math.abs((oldPos||0)-pos)<1e-9){PIPE.dragId=null;return;}
  card.stage=stage;card.position=pos;drawPipeline();
  const {error}=await sb.from('pipeline_cards').update({stage,position:pos}).eq('id',id);
  if(error){toast('Kon kaart niet verplaatsen: '+error.message,'err');card.stage=oldStage;card.position=oldPos;drawPipeline();}
  PIPE.dragId=null;
}
async function pipeColDrop(col,e){
  const key=PIPE.colDrag;PIPE.colDrag=null;if(!key)return;
  const targetKey=col.dataset.stage;if(!targetKey||targetKey===key)return;
  const stages=(PIPE.cur.stages||[]).slice();
  const from=stages.findIndex(s=>s.key===key);if(from<0)return;
  const r=col.getBoundingClientRect();const after=e.clientX>r.left+r.width/2;
  const [moved]=stages.splice(from,1);
  let idx=stages.findIndex(s=>s.key===targetKey);if(idx<0){stages.splice(from,0,moved);return;}
  if(after)idx+=1;
  stages.splice(idx,0,moved);
  PIPE.cur.stages=stages;const li=PIPE.list.find(p=>p.id===PIPE.cur.id);if(li)li.stages=stages;
  drawPipeline();
  const {error}=await sb.from('pipelines').update({stages}).eq('id',PIPE.cur.id);
  if(error){toast('Kon kolomvolgorde niet opslaan: '+error.message,'err');loadPipelineData();}
}
async function openContactById(id){try{const {data}=await sb.from('contacts').select('*').eq('id',id).single();if(data)openPerson(data);else toast('Contact niet gevonden','err');}catch(e){toast('Kon contact niet openen','err');}}
function pipeWhatsapp(id){const c=PIPE.cards.find(x=>x.id===id);if(!c)return;const en=(PIPE.enrich&&PIPE.enrich[c.contact_id])||{};const url=_helloWaUrl(en.phone,en.name||c.title,c.project||en.project||'');if(!url){toast('Geen geldig telefoonnummer voor deze lead','err');return;}window.open(url,'_blank','noopener');}
function pipeOpenCard(id){const c=PIPE.cards.find(x=>x.id===id);if(c)pipeCardDrawer(c);}

      <div class="pdr-field" style="margin-top:12px"><div class="pdr-label">Fase / kolom wijzigen</div><select id="pdr_stage" ${edit?'':'disabled'}>${stageOpts}</select></div>

    <div class="pdrawer-body">
      ${acts.length?`<div class="pdr-actions">${acts.join('')}</div>`:''}

      <div class="pdr-grid2">
        <div class="pdr-field"><div class="pdr-label">Project</div><select id="pdr_proj" ${edit?'':'disabled'}>${projOpts}</select></div>
        <div class="pdr-field"><div class="pdr-label">Eigenaar</div><select id="pdr_ass" ${edit?'':'disabled'}>${teamOpts}</select></div>
      </div>

      <div class="pdr-field"><div class="pdr-label">Notities</div><textarea id="pdr_notes" rows="5" ${edit?'':'readonly'} placeholder="Interne notities voor het team…">${esc(card.notes||'')}</textarea></div>
      <div class="muted" style="font-size:11.5px">${card.source==='lead'?'Automatisch aangemaakt vanuit de CRM.':'Handmatig aangemaakte kaart.'} Wijzigingen worden direct opgeslagen.</div>
    </div>
    <div class="pdrawer-foot">
      ${edit?`<button class="btn btn-ghost" id="pdr_del" style="color:#b91c1c">Verwijderen</button>`:''}
      <span style="margin-left:auto"></span>

async function pipeImportLeads(){
  if(!confirm('Alle CRM-leads die nog geen kaart hebben importeren in de eerste kolom?'))return;
  const [{data:contacts},{data:leads}]=await Promise.all([
    sb.from('contacts').select('id,name,email,last_activity_at').order('last_activity_at',{ascending:false,nullsFirst:false}).limit(1000),
    sb.from('leads').select('contact_id,project,created_at').order('created_at',{ascending:false}),
  ]);
  const projByContact={};(leads||[]).forEach(l=>{if(l.contact_id&&!(l.contact_id in projByContact))projByContact[l.contact_id]=l.project||null;});
  const have=new Set(PIPE.cards.map(c=>c.contact_id).filter(Boolean));
  const firstStage=(PIPE.cur.stages[0]||{}).key||'nieuw';
  const toAdd=(contacts||[]).filter(c=>!have.has(c.id)&&(c.id in projByContact));
  if(!toAdd.length){toast('Geen nieuwe leads om te importeren','ok');return;}
  let pos=Math.max(0,...PIPE.cards.filter(c=>c.stage===firstStage).map(c=>c.position||0));
  const rows=toAdd.map(c=>({pipeline_id:PIPE.cur.id,stage:firstStage,position:++pos,title:c.name||c.email||'Lead',contact_id:c.id,project:projByContact[c.id]||null,source:'lead',created_by:ME.id}));
  const {error}=await sb.from('pipeline_cards').insert(rows);
  if(error){toast('Import mislukt: '+error.message,'err');return;}
  toast(rows.length+' lead'+(rows.length===1?'':'s')+' geïmporteerd','ok');loadPipelineData();
}
function pipeEditColumns(){
  const cur=PIPE.cur;let name=cur.name;let auto=!!cur.auto_sync;let defAss=cur.default_assignee||'';let stages=JSON.parse(JSON.stringify(cur.stages||[]));
  const slug=s=>((s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'kolom');
  function draw(){
    const rows=stages.map((s,i)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input type="color" value="${esc(s.color||'#64748b')}" data-c="${i}" style="width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px">
      <input class="pc-in" style="flex:1;margin:0" value="${esc(s.label)}" data-l="${i}">
      <button class="btn btn-ghost btn-sm" data-up="${i}" ${i===0?'disabled':''}>↑</button>
      <button class="btn btn-ghost btn-sm" data-down="${i}" ${i===stages.length-1?'disabled':''}>↓</button>
      <button class="btn btn-ghost btn-sm" data-rm="${i}" style="color:#b91c1c">✕</button>
    </div>`).join('');
    const body=`<div class="pc-form">
      <label>Pipeline-naam<input class="pc-in" id="pe_name" value="${esc(name)}"></label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:500;color:var(--ink,#111);cursor:pointer"><input type="checkbox" id="pe_auto" ${auto?'checked':''} style="width:16px;height:16px"> Automatisch vullen vanuit de CRM (leads, ITP-aanvragen, aankopen schuiven vanzelf mee)</label>
      <label style="margin-top:12px">Standaard-eigenaar voor nieuwe leads<select class="pc-in" id="pe_defass"><option value="">— niemand —</option>${PIPE.team.map(t=>`<option value="${t.id}"${defAss===t.id?' selected':''}>${esc(t.full_name||t.email)}</option>`).join('')}</select></label>
      <div style="margin-top:16px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Kolommen</div>
      <div style="margin-top:8px" id="pe_rows">${rows}</div>
      <button class="btn btn-ghost btn-sm" id="pe_add">＋ Kolom toevoegen</button>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-primary" id="pe_save">Opslaan</button>
        ${PIPE.list.length>1?`<button class="btn btn-ghost" id="pe_delpipe" style="color:#b91c1c">Pipeline verwijderen</button>`:''}
        <button class="btn btn-ghost" id="pe_cancel" style="margin-left:auto">Annuleren</button>
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">Een kolom verwijderen verplaatst de kaarten erin naar de eerste kolom.</div>
    </div>`;
    showDetail('Kolommen & pipeline bewerken',body);
    const g=id=>document.getElementById(id),closeM=()=>{$('#overlay').style.display='none';$('#overlay').innerHTML='';};
    g('pe_name').oninput=e=>{name=e.target.value;};
    g('pe_auto').onchange=e=>{auto=e.target.checked;};
    if(g('pe_defass'))g('pe_defass').onchange=e=>{defAss=e.target.value;};
    g('pe_rows').querySelectorAll('[data-l]').forEach(inp=>inp.oninput=e=>{stages[+inp.dataset.l].label=e.target.value;});
    g('pe_rows').querySelectorAll('[data-c]').forEach(inp=>inp.oninput=e=>{stages[+inp.dataset.c].color=e.target.value;});
    g('pe_rows').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[stages[i-1],stages[i]]=[stages[i],stages[i-1]];draw();});
    g('pe_rows').querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[stages[i+1],stages[i]]=[stages[i],stages[i+1]];draw();});
    g('pe_rows').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(stages.length<=1){toast('Minimaal 1 kolom','err');return;}stages.splice(+b.dataset.rm,1);draw();});
    g('pe_add').onclick=()=>{stages.push({key:'',label:'Nieuwe kolom',color:'#64748b'});draw();};
    g('pe_cancel').onclick=closeM;
    g('pe_save').onclick=async()=>{
      const used=new Set();
      stages.forEach(s=>{if(!(s.label||'').trim())s.label='Kolom';let base=s.key||slug(s.label),k=base,n=2;while(used.has(k)){k=base+'-'+(n++);}s.key=k;used.add(k);});
      const validKeys=new Set(stages.map(s=>s.key)),first=stages[0].key;
      const {error}=await sb.from('pipelines').update({name:(name||'').trim()||'Pipeline',stages,auto_sync:auto,default_assignee:defAss||null}).eq('id',cur.id);
      if(error){toast('Kon niet opslaan: '+error.message,'err');return;}
      const orphans=PIPE.cards.filter(c=>!validKeys.has(c.stage));
      if(orphans.length){await sb.from('pipeline_cards').update({stage:first}).in('id',orphans.map(o=>o.id));}
      cur.stages=stages;cur.name=(name||'').trim()||'Pipeline';cur.auto_sync=auto;cur.default_assignee=defAss||null;const li=PIPE.list.find(p=>p.id===cur.id);if(li){li.stages=stages;li.name=cur.name;li.auto_sync=auto;li.default_assignee=cur.default_assignee;}
      closeM();toast('Opgeslagen','ok');loadPipelineData();
    };
    if(g('pe_delpipe'))g('pe_delpipe').onclick=async()=>{
      if(!confirm('Deze pipeline en al zijn kaarten definitief verwijderen?'))return;
      const {error}=await sb.from('pipelines').delete().eq('id',cur.id);
      if(error){toast('Kon niet verwijderen: '+error.message,'err');return;}
      PIPE.cur=null;closeM();toast('Pipeline verwijderd','ok');renderPipeline();
    };
  }
  draw();
}

      </div></td></tr>`;
  });
  $('#tw_users').innerHTML=h+'</tbody></table>';
  $('#tw_users').querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>openPermForm(profs.find(x=>x.id===b.dataset.perm),byUser[b.dataset.perm]||{}));
  $('#tw_users').querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.deluser));

    </div>`;
  showModal('Permissions · '+esc(user.full_name||user.email),body,async()=>{
    const makeAdmin=$('#p_admin').checked;
    if(makeAdmin!==admin && user.id!==ME.id){await sb.from('adm_profiles').update({is_admin:makeAdmin}).eq('id',user.id);}
    if(!makeAdmin){
      const rows=PAGES.map(p=>{const view=$(`[data-view="${p.key}"]`).checked;const edit=$(`[data-edit="${p.key}"]`).checked;return {user_id:user.id,page:p.key,can_view:view||edit,can_edit:edit};});
      const {error}=await sb.from('adm_permissions').upsert(rows,{onConflict:'user_id,page'});
      if(error){toast(error.message,'err');return false;}
    }
    toast('Permissions saved','ok');await loadUsers();return true;
  });
  setTimeout(()=>{
    const ac=$('#p_admin');if(ac)ac.onchange=()=>{$('#permBox').innerHTML=permGridHTML(existing,ac.checked);};
    const rb=$('#p_reset');if(rb)rb.onclick=async()=>{const pw=$('#p_newpw').value;if(!pw){toast('Enter a new password','err');return;}try{await callFn('set_password',{user_id:user.id,password:pw});toast('Password updated','ok');$('#p_newpw').value='';}catch(err){toast(err.message,'err');}};
  },0);

async function deleteUser(id){
  if(!confirm('Delete this user’s account and access? This cannot be undone.'))return;
  try{await callFn('delete',{user_id:id});toast('User deleted','ok');await loadUsers();}catch(err){toast(err.message,'err');}
}
async function callFn(action,payload){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SUPABASE_URL}/functions/v1/adm-users`,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON},
    body:JSON.stringify({action,...payload})});
  let json={};try{json=await res.json();}catch(e){}
  if(!res.ok||json.error)throw new Error(json.error||('Request failed ('+res.status+')'));
  return json;
}
