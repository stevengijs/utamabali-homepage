  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--brand)}

  #login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% -10%,#12332a,#0c1a15)}
  .login-card{background:var(--panel);width:360px;max-width:92vw;padding:32px;border-radius:16px;box-shadow:var(--shadow)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .login-card h1{font-size:19px;margin:14px 0 2px}
  .login-card p.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.15)}
  .field input:disabled{background:#f4f6f5;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:14px}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#0b573f}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{background:#f2f4f2}
  .btn-danger{background:#fff;border-color:#eccfcb;color:var(--danger)}
  .btn-danger:hover{background:#fbeeec}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn-block{width:100%}
  .login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:4px}

  #app{display:none;height:100%}
  .shell{display:grid;grid-template-columns:240px 1fr;height:100vh}
  aside{background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;padding:16px 12px}
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .side-brand b{color:#fff;font-size:15px;letter-spacing:.3px}
  .side-brand small{display:block;color:#6f8c81;font-size:11px;font-weight:600}
  nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--sidebar-ink);text-decoration:none;font-weight:500;border:none;background:none;width:100%;text-align:left;font-size:14px}
  .nav-item:hover{background:#12271f}
  .nav-item.active{background:var(--sidebar-active);color:#fff}
  .nav-item .ic{width:18px;text-align:center;opacity:.9}
  .side-foot{border-top:1px solid #17352b;padding-top:12px;margin-top:8px}
  .side-user{font-size:12px;color:#8fa89e;padding:0 8px 8px;word-break:break-all}
  .side-user b{color:#e8efeb;display:block;font-size:13px}

  main{overflow:auto}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(245,246,245,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
  .topbar h2{margin:0;font-size:18px}
  .topbar .crumb{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .content{padding:24px 28px 60px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  /* Bericht flows, prestatiepaneel */
  .fs-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
  .fs-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px 18px}
  .fs-kpi{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
  .fs-kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .fs-kpi .v{font-size:24px;font-weight:800;margin-top:3px;line-height:1.1}
  .fs-kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .fs-sec{padding:4px 18px 16px}
  .fs-sec h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 10px}
  .fs-ch{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;user-select:none}
  .fs-ch.off{opacity:.38}
  .fs-ch .nm{width:96px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
  .fs-ch .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .fs-ch .track{flex:1;height:9px;border-radius:999px;background:#eef0ee;overflow:hidden;display:flex}
  .fs-ch .fill{height:100%}
  .fs-ch .num{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .fs-ch .num b{color:#12211c}
  .fs-ch .rate{min-width:56px;text-align:right;font-weight:800;font-size:14px;color:#12211c;font-variant-numeric:tabular-nums}
  @media(max-width:720px){
    .fs-ch{flex-wrap:wrap}
    .fs-ch .nm{width:auto;flex:1}
    .fs-ch .track{order:3;flex-basis:100%}
  }
  .fs-chart{position:relative;height:132px;display:flex;align-items:flex-end;gap:2px;padding-top:6px}
  .fs-bar{flex:1;min-width:3px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;cursor:default}
  .fs-bar .s{background:#cfe0d8;border-radius:2px 2px 0 0}
  .fs-bar .r{background:#0f6b4f;border-radius:2px 2px 0 0}
  .fs-bar:hover .s{background:#b6d2c6}
  .fs-tip{position:absolute;background:#12211c;color:#fff;font-size:11.5px;padding:6px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
  .fs-tip.on{opacity:1}
  .fs-steps{width:100%;border-collapse:collapse;font-size:13px}
  .fs-steps th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
  .fs-steps td{padding:7px 8px;border-bottom:1px solid var(--line)}
  .fs-steps td.n{text-align:right;font-weight:700;white-space:nowrap}
  .fs-drop{font-size:11.5px;color:#b5462b;margin-left:6px}
  .stat .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:28px;font-weight:750;margin-top:6px}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px}
  .stat[data-go]{transition:border-color .15s,box-shadow .15s,transform .1s}
  .stat[data-go]:hover{border-color:var(--brand-2);box-shadow:0 6px 18px rgba(20,179,125,.18)}
  .stat[data-go]:active{transform:translateY(1px)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
  .panel-head h3{margin:0;font-size:15px}
  .panel-head .desc{color:var(--muted);font-size:12px;margin-top:2px}
  .toolbar{display:flex;gap:8px;align-items:center}
  .search{padding:8px 11px;border:1px solid var(--line);border-radius:8px;min-width:180px;outline:none}
  .search:focus{border-color:var(--brand-2)}
  .count-pill{font-size:11px;font-weight:700;color:var(--muted);background:#eef0ef;border:1px solid var(--line);padding:3px 8px;border-radius:999px}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fafbfa}
  tbody tr:hover{background:#fafbfa}
  td .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .table-wrap{overflow:auto;max-height:70vh}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}

  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#f2f4f2;color:#41514a;white-space:nowrap}
  .badge.green{background:#e7f6ef;color:#0f6b4f;border-color:#c6ead9}
  .badge.blue{background:#e8f0fb;color:#1d4ed8;border-color:#cfe0f7}
  .badge.amber{background:#fdf3e2;color:#9a6410;border-color:#f4e2c1}
  .badge.red{background:#fbeeec;color:#b0362a;border-color:#f0d3ce}
  .badge.grey{background:#eef0ef;color:#5f6f68}

  .chip{display:inline-block;padding:2px 8px;border-radius:7px;background:#eef4f1;color:#2c5a4a;font-size:11px;margin:1px 3px 1px 0}

  .overlay{position:fixed;inset:0;background:rgba(12,26,21,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal{background:#fff;border-radius:14px;width:600px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .modal-head h3{margin:0;font-size:16px}
  .modal-body{padding:20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}

  .perm-table{width:100%;border-collapse:collapse;margin-top:4px}
  .perm-table th,.perm-table td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .perm-table td.center,.perm-table th.center{text-align:center}
  .perm-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}

  .toast-wrap{position:fixed;bottom:22px;right:22px;z-index:90;display:flex;flex-direction:column;gap:10px}
  .toast{background:#12211c;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;max-width:340px}
  .toast.err{background:#7a271a}
  .toast.ok{background:#0f6b4f}

  /* rich text ITP editor */
  .rte-tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .rte-tb button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;min-width:32px}
  .rte-tb button:hover{background:#f2f4f2}
  .rte{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:280px;max-height:50vh;overflow:auto;font-size:13px;line-height:1.55;outline:none}
  .rte:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.12)}
  .rte p{margin:0 0 16px}
  .itp-view p{margin:0 0 16px}
  /* notifications */
  .notif-bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .notif-bell:hover{background:#f2f4f2}
  .notif-count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center}
  .nrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 2px;border-bottom:1px solid var(--line)}
  .nrow .row-actions{flex-wrap:wrap;justify-content:flex-end}
  .ntab{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
  .ntab button{border:none;background:#fff;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
  .ntab button.on{background:var(--brand);color:#fff}
  /* analytics */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:none;background:#fff;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.an-grid{grid-template-columns:1fr}}
  .anbars{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
  .anbar{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;font-size:13px}
  .anbar-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .anbar-t{background:#eef0ef;border-radius:6px;height:10px;overflow:hidden}
  .anbar-f{height:100%;border-radius:6px;transition:width .3s}
  .anbar-v{font-weight:700;white-space:nowrap}
  .funnel{display:flex;flex-direction:column;gap:12px;padding:20px}
  .fstep{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .fbar-wrap{display:flex;align-items:center;gap:12px}
  .fbar{height:46px;border-radius:9px;display:flex;align-items:center;padding:0 16px;color:#fff;font-weight:750;min-width:92px;font-size:15px;transition:width .3s}
  .fstep .fmeta{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
  .an-note{margin-bottom:16px;padding:12px 16px;background:#e8f0fb;border:1px solid #cfe0f7;border-radius:10px;color:#1d4ed8;font-size:13px}
  .rev-row{display:flex;gap:26px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line)}
  .rev-row .rk{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .rev-row .rv{font-size:22px;font-weight:750}
  .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 0 rgba(22,163,74,.55);animation:livePulse 1.8s infinite}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  .live-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:2px 0}
  .live-count{font-size:30px;font-weight:800;color:var(--brand-ink);line-height:1}
  .live-sub{font-size:12.5px;color:var(--muted)}
  .live-tbl{width:100%;border-collapse:collapse;font-size:13px}
  .live-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:8px 18px;border-bottom:1px solid var(--line)}
  .live-tbl td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:top}
  .live-tbl tr:last-child td{border-bottom:none}
  .live-path{font-weight:650;color:var(--ink);word-break:break-all}
  .live-ttl{font-size:11.5px;color:var(--muted);word-break:break-all}
  .live-tbl td:nth-child(2){max-width:340px}
  .src-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
  .src-badge.paid{background:#fef2f2;color:#b91c1c}.src-badge.organic{background:#ecfdf5;color:#047857}.src-badge.social{background:#eff6ff;color:#1d4ed8}.src-badge.direct{background:#f1f5f9;color:#475569}.src-badge.referral{background:#faf5ff;color:#7c3aed}.src-badge.campaign{background:#fffbeb;color:#b45309}.src-badge.email{background:#fdf4ff;color:#a21caf}
  .live-meta{font-size:12px;color:var(--muted)}
  .live-ago{white-space:nowrap;font-weight:650;color:#16a34a}
  .live-name{font-weight:750;color:var(--brand);margin-bottom:3px}
  .live-tbl tr.live-known{cursor:pointer;transition:background .12s}
  .live-tbl tr.live-known:hover{background:#f0faf6}
  .lock-note{padding:40px;text-align:center;color:var(--muted)}

  /* ===== Inbox ===== */
  .ibx-wrap{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:16px;height:calc(100vh - 150px);min-height:460px}
  .ibx-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .ibx-filters{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
  .ibx-search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;outline:none;font-size:13px}
  .ibx-search:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.15)}
  .ibx-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;align-items:center}
  .ibx-chip{padding:4px 9px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .ibx-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .ibx-chip.ibx-vw{color:#b45309;border-color:#fcd34d;background:#fffbeb}
  .ibx-chip.ibx-vw.on{background:#f59e0b;border-color:#f59e0b;color:#fff}
  /* Onbeantwoord is dringender dan ongelezen, dus roder. Iemand wacht hier echt. */
  .ibx-chip.ibx-wacht{color:#b91c1c;border-color:#fca5a5;background:#fef2f2}
  .ibx-chip.ibx-wacht.on{background:#dc2626;border-color:#dc2626;color:#fff}
  .ibx-chip-n{display:inline-block;margin-left:5px;min-width:15px;padding:0 4px;border-radius:999px;
    background:#dc2626;color:#fff;font-size:10px;line-height:15px;text-align:center}
  .ibx-chip.ibx-wacht.on .ibx-chip-n{background:rgba(255,255,255,.28)}
  .ibx-chsep{width:1px;height:16px;background:var(--line);margin:0 2px}
  .ibx-autobar{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#f8fafc;color:#64748b;font-size:11.5px;padding:8px 14px;cursor:pointer}
  .ibx-autobar:hover{background:#f1f5f9;color:#475569}
  .ibx-autobar.on{background:#eff6ff;color:#1d4ed8;border-bottom-color:#bfdbfe}
  .ibx-convs{overflow-y:auto;flex:1}
  .ibx-row{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .ibx-row:hover{background:#f6f8f7}
  .ibx-row.sel{background:#eef5f2}
  .ibx-row.unread .ibx-rname{font-weight:800}
  .ibx-row.unread .ibx-rprev{color:var(--ink);font-weight:500}
  .ibx-av{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .ibx-av.lg{width:46px;height:46px;font-size:15px}
  .ibx-avch{position:absolute;right:-3px;bottom:-3px;font-size:11px;background:#fff;border-radius:50%;line-height:1;padding:1px;z-index:2}
  .ibx-avimg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;z-index:1}
  .ibx-rmain{flex:1;min-width:0}
  .ibx-rtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ibx-rname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibx-rtime{flex:none;font-size:11px;color:var(--muted)}
  .ibx-rprev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 5px}
  .ibx-you{color:var(--brand);font-weight:600}
  .ibx-rmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ibx-pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
  .ibx-unread{margin-left:auto;background:var(--brand-2);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .ibx-thread{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .ibx-empty{margin:auto;color:var(--muted);padding:40px;text-align:center}
  .ibx-thead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .ibx-thead-l{display:flex;gap:11px;align-items:center;min-width:0}
  .ibx-tname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  a.ibx-proflink{color:inherit;text-decoration:none}
  a.ibx-proflink:hover{text-decoration:underline}
  .ibx-ext{opacity:.45;font-size:.8em;font-weight:600}
  a.ibx-proflink:hover .ibx-ext{opacity:.8}
  .ibx-tsub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .ibx-chtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
  .ibx-thead-r{display:flex;align-items:center;gap:8px;flex:none}
  .ibx-facts{display:flex;gap:8px;flex-wrap:wrap;padding:9px 16px;background:#f8faf9;border-bottom:1px solid var(--line)}
  .ibx-fact{font-size:12px;color:var(--muted)}.ibx-fact b{color:var(--ink)}
  .ibx-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fbfcfb}
  .ibx-msgs>*{flex:0 0 auto}   /* niet laten krimpen: lange uitgeklapte mails moeten volledig hoog worden */
  .ibx-mrow{display:flex;flex-direction:column;gap:2px}
  .ibx-mrow.out{align-items:flex-end}
  .ibx-mrow.in{align-items:flex-start}
  .ibx-mline{display:flex;align-items:flex-end;gap:7px;max-width:78%}
  .ibx-daysep{display:flex;align-items:center;justify-content:center;margin:12px 0 6px}
  .ibx-daysep span{font-size:11px;font-weight:700;color:var(--muted);background:#eef2f0;border:1px solid var(--line);padding:3px 12px;border-radius:999px}
  .ibx-msgav{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:#eef2f0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#334155;overflow:hidden;margin-bottom:2px;cursor:default}
  .ibx-msgav.ph{visibility:hidden}
  .ibx-bub{max-width:100%;padding:9px 12px;border-radius:14px;position:relative;font-size:13.5px;line-height:1.5}
  .ibx-bub.lead{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .ibx-bub.ai{background:#eaf4ef;border:1px solid #cfe8dd;border-bottom-right-radius:4px}
  .ibx-bub.human{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .ibx-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px;opacity:.85}
  .ibx-tag.ai{color:#0f6b4f}.ibx-tag.hum{color:#eafff4}
  .ibx-bizacct{text-transform:none;font-weight:600;letter-spacing:0;opacity:.9}
  /* Afzenderkop: twee losse feiten onder elkaar. Bovenaan WIE er stuurde (bot of
     teamlid, met erachter of dat automatisch of handmatig ging), daaronder VANAF
     WELK zakelijk account het verstuurd is. Het nummer is van UTAMA, niet privé. */
  .ibx-bhead{margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid;border-color:rgba(15,107,79,.18);color:#0f6b4f}
  .ibx-who{font-size:11px;font-weight:800;letter-spacing:.03em}
  .ibx-how{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid;border-radius:999px;padding:1px 6px;margin-left:6px;opacity:.7;vertical-align:1px}
  .ibx-acct{display:block;font-size:10.5px;font-weight:600;opacity:.7;margin-top:3px}
  .ibx-bub.human .ibx-bhead{color:#eafff4;border-color:rgba(255,255,255,.22)}
  .ibx-bub.ch-instagram.ai .ibx-bhead{color:#dbe0ff;border-color:rgba(255,255,255,.22)}
  .ibx-bub.ch-instagram.human .ibx-bhead{color:#dbe0ff;border-color:rgba(255,255,255,.22)}
  .ibx-btext{white-space:pre-wrap;word-wrap:break-word}
  /* Gedeelde foto's. Kwamen eerder binnen als kale CDN-link en vulden dan een
     half scherm met tekst; nu als miniatuur, klikbaar naar het origineel. */
  .ibx-img{display:block;max-width:260px;max-height:320px;width:auto;border-radius:10px;margin:2px 0;cursor:zoom-in;background:#e9edeb}
  .ibx-img-wrap{display:flex;flex-direction:column;gap:5px}
  .ibx-img-fail{font-size:11.5px;opacity:.75}
  .ibx-lightbox{position:fixed;inset:0;background:rgba(8,20,16,.88);display:grid;place-items:center;z-index:9999;cursor:zoom-out;padding:24px}
  .ibx-lightbox img{max-width:96vw;max-height:92vh;border-radius:12px}
  .ibx-btime{font-size:10.5px;opacity:.55;padding:0 2px}
  .ibx-mrow.in .ibx-btime{padding-left:33px}
  .ibx-mrow.out .ibx-btime{padding-right:2px}
  .ibx-undel{font-size:10.5px;margin-top:4px;color:#b45309;font-weight:700}
  .ibx-bub.human .ibx-undel{color:#ffe0b2}
  /* Kanaalkleur per wolkje (naast het icoontje): Instagram roze, WhatsApp groen,
     e-mail grijsblauw. Lead licht, AI iets voller, mens verzadigd met wit. */
  /* Instagram: exact de look van de echte DM-interface (grijs = lead, IG-blauw = wij) */
  .ibx-bub.ch-instagram.lead{background:#efeff1;border-color:#e7e7ea}
  .ibx-bub.ch-instagram.ai{background:#4e5af5;border-color:#4e5af5;color:#fff}
  .ibx-bub.ch-instagram.ai .ibx-tag.ai{color:#dbe0ff}
  .ibx-bub.ch-instagram.ai .ibx-undel{color:#ffe0b2}
  .ibx-bub.ch-instagram.human{background:#4e5af5}
  .ibx-bub.ch-whatsapp.lead{background:#f0fdf4;border-color:#cdeed9}
  .ibx-bub.ch-whatsapp.ai{background:#dcfce7;border-color:#b5e5c8}
  .ibx-bub.ch-whatsapp.human{background:#128c7e}
  .ibx-bub.ch-email.lead{background:#f8fafc;border-color:#e2e8f0}
  .ibx-bub.ch-email.ai{background:#eef2f6;border-color:#d9e2ec}
  .ibx-bub.ch-email.human{background:#475569}
  .ibx-compose{border-top:1px solid var(--line);padding:10px 12px;background:#fff}
  .ibx-aihint{font-size:11.5px;color:var(--muted);background:#f1f7f4;border:1px solid #d9ebe3;border-radius:8px;padding:7px 10px;margin-bottom:8px}
  .ibx-crow{display:flex;gap:8px;align-items:flex-end}
  .ibx-input{flex:1;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none;font-size:13.5px;max-height:120px}
  .ibx-input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.15)}
  .ibx-sendbtn{background:var(--brand);color:#fff;flex:none}
  .ibx-sendbtn:disabled{opacity:.6}
  /* Right-hand customer/lead panel */
  .ibx-info{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .ibx-ip-head{display:flex;align-items:center;gap:11px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .ibx-ip-id{flex:1;min-width:0}
  .ibx-ip-name{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibx-ip-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibx-ip-actions{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
  .ibx-ip-actions .btn{padding:6px 11px;font-size:12.5px}

  /* Broadcast: campagnes naar de losse adressenlijst */
  .bc-let{margin:0 16px 14px;padding:12px 14px;border-radius:10px;background:#fffbeb;
          border:1px solid #fde68a;color:#78350f;font-size:13px;line-height:1.55}
  .bc-vak{padding:14px 18px 0}
  .bc-lab{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
          color:var(--muted);margin:0 0 6px}
  .bc-rij{display:flex;flex-wrap:wrap;gap:6px}
  .bc-chip{padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;
           font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .bc-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .bc-n{margin-left:6px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.07);font-size:10.5px}
  .bc-chip.on .bc-n{background:rgba(255,255,255,.25)}
  .bc-check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .bc-telling{margin:14px 18px 0;padding:10px 12px;border-radius:8px;background:#f1f5f9;font-size:13.5px}
  .bc-acties{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px}
  /* De tabel is met negen kolommen breder dan het paneel. Zonder eigen
     schuifbalk vallen de rechterkolommen (eerder vastgoed, de antwoorden)
     op een laptopscherm buiten beeld zonder dat je erbij kunt. */
  #bc_tabel{padding:0 18px 18px;overflow-x:auto}
  #bc_tabel table{min-width:1080px}
  .bc-bereik{margin-left:4px;padding:0 5px;border-radius:999px;background:#0f6b4f;color:#fff;font-size:10.5px}
  .bc-chip.on .bc-bereik{background:rgba(255,255,255,.3)}

  /* Filters als uitklapmenu's. Ze stonden eerst allemaal uitgeklapt als chips:
     zeven rijen knoppen, waardoor de lijst zelf pas ver onder de vouw begon.
     Een dropdown toont alleen wat je gekozen hebt en klapt de rest weg. */
  .bc-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px 0}
  .bc-dd{position:relative}
  .bc-ddknop{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;cursor:pointer;
             border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;color:var(--ink)}
  .bc-ddknop:hover{border-color:#c8d2cc}
  .bc-ddknop.actief{border-color:var(--brand);background:#f2f8f5}
  .bc-dd.open .bc-ddknop{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,107,79,.12)}
  .bc-ddlab{color:var(--muted);font-weight:600}
  .bc-ddwaarde{font-weight:700;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bc-ddknop.actief .bc-ddwaarde{color:var(--brand)}
  .bc-ddcar{color:var(--muted);font-size:9px;margin-left:1px}
  .bc-ddmenu{display:none;position:absolute;z-index:70;top:calc(100% + 6px);left:0;
             min-width:270px;max-width:380px;max-height:330px;overflow:auto;padding:6px;
             background:#fff;border:1px solid var(--line);border-radius:11px;
             box-shadow:0 14px 34px rgba(16,32,26,.16)}
  .bc-dd.open .bc-ddmenu{display:block}
  .bc-ddopt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
            font-size:13px;cursor:pointer;white-space:normal}
  .bc-ddopt:hover{background:#f4f7f5}
  .bc-ddopt input{margin:0;flex:none}
  .bc-ddtxt{flex:1;min-width:0}
  .bc-ddn{flex:none;padding:1px 6px;border-radius:999px;background:#eef0ef;
          color:var(--muted);font-size:10.5px;font-weight:700}
  .bc-ddb{flex:none;padding:1px 6px;border-radius:999px;background:var(--brand);color:#fff;
          font-size:10.5px;font-weight:700}
  .bc-ddvoet{border-top:1px solid var(--line);margin-top:5px;padding:7px 9px 3px}
  .bc-ddlink,.bc-wisalles{background:none;border:0;padding:0;cursor:pointer;
                          color:var(--brand);font-size:12.5px;font-weight:700}
  .bc-wisalles{margin-left:4px}
  /* Antwoordregel onder een contact: alles wat iemand destijds in de funnel
     invulde, zodat je niet de database in hoeft om dat te zien. */
  .bc-meer{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;
           padding:3px 8px;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .bc-meer:hover{border-color:var(--brand);color:var(--brand)}
  .bc-ja{display:inline-block;padding:2px 8px;border-radius:999px;background:#e8f3ee;
         color:var(--brand);font-size:11.5px;font-weight:700}
  /* WhatsApp-kanaal in het opstelscherm */
  .bc-kn{margin-left:6px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.08);font-size:11px}
  .seq-dbtn.on .bc-kn{background:rgba(255,255,255,.25)}
  .bc-wastatus{font-size:13px;line-height:1.5;padding:9px 12px;border:1px solid var(--line);
               border-radius:9px;background:#fff}
  .bc-wavar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .bc-wanr{flex:none;padding:4px 9px;border-radius:7px;background:#eef0ef;color:var(--muted);
           font-size:12px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .bc-wavar select{flex:0 0 210px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
                   font:inherit;font-size:13px;background:#fff;color:var(--ink)}
  .wa-leeg{background:#fee2e2;color:#991b1b;border-radius:3px;padding:0 3px;font-weight:600}
  .bc-wavar input{flex:1 1 240px;min-width:0;padding:8px 10px;border:1px solid var(--line);
                  border-radius:8px;font:inherit;font-size:13px}
  /* Een bericht zoals het op een telefoon staat, inclusief het staartje. */
  .wa-bubbel{position:relative;max-width:420px;padding:11px 14px;border-radius:10px 10px 10px 2px;
             background:#e8f6ea;border:1px solid #cfe8d4;font-size:14px;line-height:1.5;
             color:#12211c;white-space:pre-wrap;word-break:break-word}
  /* Content-studio */
  .ct-media{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .ct-tegel{position:relative;width:110px;height:138px;border-radius:9px;overflow:hidden;
            border:1px solid var(--line);background:#000}
  .ct-tegel img,.ct-tegel video{width:100%;height:100%;object-fit:cover;display:block}
  .ct-tegel .weg{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
                 border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:13px;line-height:1}
  .ct-tegel .nr{position:absolute;bottom:5px;left:5px;padding:1px 7px;border-radius:999px;
                background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700}
  .ct-tegel .schuif{position:absolute;bottom:5px;right:5px;display:flex;gap:3px}
  .ct-tegel .schuif button{width:22px;height:22px;border-radius:6px;border:none;cursor:pointer;
                           background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1}
  .ct-tegel .schuif button:disabled{opacity:.3;cursor:default}
  .ct-upload{display:flex;align-items:center;justify-content:center;width:110px;height:138px;
             border:2px dashed var(--line);border-radius:9px;background:none;cursor:pointer;
             color:var(--muted);font-size:26px}
  .ct-upload:hover{border-color:var(--brand);color:var(--brand)}
  .ct-vak{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
          display:flex;flex-direction:column;gap:6px}
  .ct-vak .kopje{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
                 color:var(--muted);display:flex;align-items:center;gap:8px}
  .ct-vak .kopje .bc-zoekactie{margin-left:auto;text-transform:none;letter-spacing:0}
  .ct-caption{width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);
              border-radius:8px;font:inherit;font-size:13.5px;line-height:1.55;resize:vertical}
  .ct-hook{display:block;width:100%;text-align:left;padding:9px 12px;margin-top:6px;cursor:pointer;
           border:1px solid var(--line);border-radius:8px;background:var(--ground);font:inherit;font-size:13.5px}
  .ct-hook.on{border-color:var(--brand);background:var(--olive-soft, #e8f3ee);font-weight:600}
  .ct-regel{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft,#f0ece2);font-size:13.5px}
  .ct-regel:last-child{border-bottom:none}
  .ct-regel .t{flex:none;width:52px;font-weight:700;color:var(--terra,#8B5A3C);
               font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
  .ct-magneet{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--brand);
              color:#fff;font-weight:800;letter-spacing:.06em}
  .ct-lijst{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .ct-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;
           border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;cursor:pointer}
  .ct-item:hover{border-color:var(--brand)}
  .ct-item .soort{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;
                  border-radius:999px;background:#eef0ef;color:var(--muted);text-transform:uppercase}
  .ct-item .st-gepost{color:var(--ok);font-weight:700}
  .ct-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.ct-grid2{grid-template-columns:1fr}}

  /* Instagram-preview in de content-studio. Bewust de echte IG-waarden:
     systeemfont van het platform, #262626 voor tekst, #8e8e8e voor grijs,
     #dbdbdb voor randen, wit als ondergrond. De preview moet aanvoelen als een
     screenshot uit de app, anders beoordeel je de caption niet zoals een
     volger hem straks ziet. */
  .ig-rij{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px}
  .ig-kaart{flex:none;width:228px;cursor:pointer;border-radius:12px;padding:6px;
            border:2px solid transparent;transition:border-color .15s}
  .ig-kaart.on{border-color:var(--brand)}
  .ig-kaart .keuze{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
                   color:var(--muted);padding:0 2px 6px;display:flex;justify-content:space-between}
  .ig-kaart.on .keuze{color:var(--brand)}
  .ig-frame{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            background:#fff;border:1px solid #dbdbdb;border-radius:8px;overflow:hidden;color:#262626}
  .ig-kop{display:flex;align-items:center;gap:8px;padding:8px 10px}
  .ig-avatar{width:28px;height:28px;border-radius:50%;flex:none;
             background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);
             padding:2px}
  .ig-avatar i{display:block;width:100%;height:100%;border-radius:50%;background:#1d5c43;color:#fff;
               font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ig-kop b{font-size:12.5px;font-weight:600;color:#262626}
  .ig-kop .ig-meer{margin-left:auto;color:#262626;font-weight:700;letter-spacing:1px}
  .ig-media{position:relative;background:#000}
  .ig-media img,.ig-media video{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .ig-teller{position:absolute;top:10px;right:10px;background:rgba(38,38,38,.8);color:#fff;
             padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
  .ig-dots{display:flex;justify-content:center;gap:4px;padding:8px 0 0}
  .ig-dots i{width:6px;height:6px;border-radius:50%;background:#dbdbdb}
  .ig-dots i.on{background:#0095f6}
  .ig-acties{display:flex;align-items:center;gap:14px;padding:8px 10px 4px}
  .ig-acties svg{width:22px;height:22px;stroke:#262626;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ig-acties .rechts{margin-left:auto}
  .ig-likes{padding:0 10px;font-size:12.5px;font-weight:600}
  .ig-caption{padding:3px 10px 2px;font-size:12.5px;line-height:1.45;color:#262626;
              white-space:pre-wrap;word-break:break-word}
  .ig-caption b{margin-right:5px;font-weight:600}
  .ig-caption .meer{color:#8e8e8e}
  .ig-reacties{padding:0 10px;font-size:12.5px;color:#8e8e8e}
  .ig-tijd{padding:3px 10px 10px;font-size:10px;color:#8e8e8e;letter-spacing:.2px;text-transform:uppercase}
  /* Reel: donkere weergave met de actiekolom rechts, zoals in de app */
  .ig-frame.reel{background:#000;border-color:#262626}
  .ig-frame.reel .ig-media img,.ig-frame.reel .ig-media video{aspect-ratio:9/16;object-fit:cover}
  .ig-reelhud{position:absolute;inset:0;display:flex;pointer-events:none}
  .ig-reelhud .meer{pointer-events:auto}
  .ig-reelhud .onder{margin-top:auto;padding:10px 54px 12px 10px;color:#fff;width:100%;
                     background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .ig-reelhud .onder .wie{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .ig-reelhud .onder .wie .ig-avatar{width:24px;height:24px}
  .ig-reelhud .onder .volg{border:1px solid rgba(255,255,255,.9);border-radius:6px;padding:1px 7px;
                           font-size:11px;font-weight:600}

            color:#92400e;font-size:11.5px;font-weight:700;margin-right:4px}

  @media(max-width:1120px){.ibx-wrap{grid-template-columns:1fr;height:auto}.ibx-list{max-height:40vh}.ibx-thread{min-height:52vh}.ibx-info{max-height:none}}
  /* Chat history inside the CRM contact detail */

  .pdr-fact .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b}
  .pdr-fact .v{font-size:14px;font-weight:700;margin-top:3px;color:#0f172a;word-break:break-word}
  .pdr-title{font-size:19px;font-weight:800;border:none;padding:2px 0;width:100%;outline:none;font-family:inherit}
  .pdr-dates{flex:none;text-align:right;font-size:10.5px;line-height:1.45;color:var(--ink);white-space:nowrap;padding-top:3px}
  .pdr-dates span{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .pdr-title:focus{border-bottom:2px solid var(--brand,#0f6b4f)}
  .pipe-av{width:24px;height:24px;border-radius:50%;background:var(--brand,#0f6b4f);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pipe-card-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .pipe-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid #eef1f0}
  .pipe-foot-right{display:inline-flex;align-items:center;gap:7px;margin-left:auto}
  .pipe-chat{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef4ff;color:#1e40af;border:1px solid #cfe0ff;cursor:pointer}
  .pipe-chat:hover{background:#e0ebff}
  .pipe-chip.task{background:#fff7e6;color:#92600a;border:1px solid #f6d98a}
  .pdr-tasks{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .pdr-notes{display:flex;flex-direction:column;gap:7px;margin-bottom:9px;max-height:290px;overflow-y:auto}
  .pdr-note{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fbfcfb}
  .pdr-note-h{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}
  .pdr-note-h b{color:var(--ink);font-weight:700}
  .pdr-note-x{margin-left:auto;background:none;border:0;color:#b91c1c;font-size:11px;cursor:pointer;padding:0}
  .pdr-note-b{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
  .pdr-notenew{display:flex;flex-direction:column;gap:6px}
  .pdr-notenew textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;resize:vertical}
  .pdr-notenew .row{display:flex;align-items:center;gap:8px}
  .pdr-notenew .row .muted{font-size:11.5px}
  .pdr-task{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:#fbfcfb;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px}
  .pdr-task.done{opacity:.6}
  .pdr-task-x{flex:none;background:none;border:none;font-size:18px;line-height:1;color:var(--muted);cursor:pointer}
  .pdr-auto{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pdr-auto-in{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit}
  .pdr-auto #pdr_auto_note{flex:1;min-width:120px}
  .pdr-auto .btn{background:var(--brand);color:#fff}
  /* Chat popup (from a pipeline card) */
  .chatpop-back{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;transition:opacity .18s;z-index:60}
  .chatpop-back.open{opacity:1}
  .chatpop{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-46%);width:min(520px,94vw);height:min(640px,86vh);background:var(--panel,#fff);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity .18s,transform .18s}
  .chatpop.open{opacity:1;transform:translate(-50%,-50%)}
  .chatpop-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .chatpop-title{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* E-mail sequences */
  .seq-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .seq-list{display:flex;flex-direction:column}
  .seq-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .seq-row:hover{background:#f6f8f7}
  .seq-row-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .seq-row-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .seq-badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .seq-badge.on{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
  .seq-edit{padding:16px}
  .seq-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seq-flags{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
  .seq-check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
  .seq-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .seq-toggle-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .seq-toggle.on{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
  .seq-toggle.on .seq-toggle-dot{background:#10b981}
  .seq-toggle.off{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  .seq-toggle.off .seq-toggle-dot{background:#ef4444}
  .pm-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .pm-tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .pm-imgwrap{aspect-ratio:4/3;background:#f1f5f9;overflow:hidden}
  .pm-imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
  .pm-imgwrap[draggable="true"]{cursor:grab}
  .pm-imgwrap[draggable="true"]:active{cursor:grabbing}
  .pm-tile.pm-dragging{opacity:.45}
  .pm-tile.pm-drop{outline:2px dashed #0f6b4f;outline-offset:2px}
  .pm-tools{display:flex;align-items:center;gap:6px;padding:7px 8px;border-top:1px solid var(--line)}
  .pm-tools button{border:1px solid var(--line);background:#fff;border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:12px;line-height:1}
  .pm-tools button:disabled{opacity:.35;cursor:default}
  .pm-del{color:#b91c1c}
  .pm-hero{color:#b45309}
  .pm-hero.on{background:#fffbeb;border-color:#fcd34d;color:#b45309}
  .pm-herobadge{position:absolute;top:8px;left:8px;background:rgba(180,83,9,.92);color:#fff;font-size:10px;font-weight:800;letter-spacing:.02em;padding:3px 8px;border-radius:999px}
  .pm-tile.pm-is-hero{border-color:#fcd34d;box-shadow:0 0 0 1px #fcd34d}
  .pm-imgwrap{position:relative}
  .pm-ord{font-size:11px;font-weight:700;color:var(--muted);min-width:16px;text-align:center}
  .pm-cap{width:100%;border:0;border-top:1px solid var(--line);padding:7px 9px;font-size:12px;outline:none}
  .pm-cap-ro{padding:7px 9px;font-size:12px;color:var(--ink)}
  .pm-meta{padding:5px 9px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line)}
  .seq-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .seq-step{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfb}
  .seq-step-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .seq-step-n{font-weight:800;font-size:12px;color:#0f6b4f}
  .seq-daywrap{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .seq-day{width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px}
  .seq-hour{width:48px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px}
  /* Directe lead-mails: leesbare maat i.p.v. volle schermbreedte */
  /* .panel heeft zelf geen padding (andere panelen doen dat via .panel-head),
     dus die hier expliciet zetten, anders plakt alles tegen de rand. */
  .otpl-card{margin-top:12px;max-width:1240px;padding:20px 22px}
  .otpl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin:0 -22px 16px;padding-left:22px;padding-right:22px}
  .otpl-head code{background:#f1f4f2;border-radius:4px;padding:1px 5px;font-size:11px}
  /* Geen chip meer: de vertraging staat nu per blok, dit is enkel een toelichting. */
  .otpl-delay{align-self:center;max-width:34ch;font-size:11.5px;line-height:1.45;color:var(--muted);text-align:right}
  /* E-mail links, de twee WhatsApp-varianten onder elkaar rechts, met een
     scheidslijn ertussen. Die lijn is een eigen kolom en geen rand op de
     rechterkolom, anders loopt hij mee met de hoogte van alleen die kolom.
     Onder 1040px valt alles terug op een kolom en verdwijnt de lijn. */
  /* De samenvatting staat bovenaan omdat het de eerste vraag beantwoordt: wie is dit. */
  /* Globale leadzoeker. Met drie pipelines is zoeken binnen één bord onwerkbaar:
     dit vindt de persoon ongeacht waar die staat en toont meteen waar dat is. */
  .gz-wrap{position:relative;display:flex;align-items:center}
  .gz-in{width:290px;padding:8px 34px 8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fff}
  .gz-in:focus{outline:none;border-color:#0f6b4f;box-shadow:0 0 0 3px rgba(15,107,79,.12);width:340px}
  .gz-in::-webkit-search-cancel-button{-webkit-appearance:none}
  .gz-kbd{position:absolute;right:9px;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;pointer-events:none;background:#fafbfb}
  .gz-in:focus+.gz-kbd{display:none}
  .gz-res{position:absolute;top:calc(100% + 6px);right:0;width:430px;max-height:60vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,30,22,.16);z-index:80;padding:6px}
  .gz-item{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;padding:9px 11px;border-radius:9px;cursor:pointer}
  .gz-item:hover,.gz-item.sel{background:#f2f9f6}
  .gz-naam{font-size:13.5px;font-weight:700}
  .gz-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .gz-pipe{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:#eef2f1;border-radius:999px;padding:2px 8px;margin:3px 5px 0 0}
  .gz-leeg{padding:14px 12px;font-size:12.5px;color:var(--muted)}
  /* Agenda: rijen per dag, status als kleurbadge, verlopen zonder uitkomst rood. */
  #afOverlay{position:fixed;inset:0;background:rgba(10,25,18,.45);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
  #afOverlay .af-modal{background:#fff;border-radius:14px;padding:22px 24px;width:min(560px,94vw);max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px rgba(10,30,20,.3)}
  .ag-views{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .ag-vbtn{background:#fff;border:0;font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;color:var(--muted)}
  .ag-vbtn+.ag-vbtn{border-left:1px solid var(--line)}
  .ag-vbtn.on{background:var(--brand);color:#fff}
  .ag-nav{display:inline-flex;align-items:center;gap:4px}
  .ag-chip{display:block;width:100%;text-align:left;background:#f8faf9;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:11px;font-weight:600;padding:4px 6px;margin-top:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ag-chip:hover{background:#eef5f2}
  .ag-chip.af{opacity:.5;text-decoration:line-through}
  .ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .ag-wkol{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;min-height:130px}
  .ag-wkol.nu{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .ag-wkop{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
  .ag-wkop b{color:var(--ink);font-size:13px}
  .ag-maand{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
  .ag-mkoppen{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .ag-mkoppen span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:2px 6px}
  .ag-mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .ag-mcel{border:1px solid var(--line);border-radius:8px;min-height:84px;padding:4px}
  .ag-mcel.buiten{opacity:.4}
  .ag-mcel.nu{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .ag-mdag{background:none;border:0;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;padding:1px 4px;border-radius:5px}
  .ag-mdag:hover{background:#eef5f2}
  .ag-meer{display:block;background:none;border:0;font:inherit;font-size:10.5px;color:var(--muted);cursor:pointer;padding:2px 4px}
  .bel-tijd.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .ag-stsel{flex:none;align-self:center;border:0;border-radius:999px;font:inherit;font-size:10.5px;font-weight:800;padding:3px 9px;cursor:pointer;-webkit-appearance:none;appearance:none}
  /* .panel heeft zelf geen padding; deze wrapper geeft de agendalijst lucht
     zodat de dagkop en de rijen niet tegen de randen plakken. */
  .ag-panel{padding:16px 22px 10px}
  .ag-dag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
  .ag-rij{display:flex;align-items:flex-start;gap:14px;padding:14px 2px;border-top:1px solid var(--line)}
  .ag-rij:first-of-type{border-top:none}
  .ag-rij.af{opacity:.55}
  .ag-tijd{flex:none;width:96px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .ag-tijd .muted{font-weight:500;font-size:11.5px}
  .ag-mid{flex:1;min-width:0}
  .ag-lead{background:none;border:0;padding:0;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink)}
  .ag-lead:hover{text-decoration:underline}
  .ag-badge{flex:none;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;align-self:center}
  .ag-acts{flex:none;display:flex;gap:4px;align-self:center}
  .pdr-sum-top{background:#f7faf9;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:14px}
  .pipe-zoekhint{margin:0 0 10px;padding:8px 12px;background:#f2f9f6;border:1px solid #cfe8dd;border-radius:9px;font-size:12.5px;color:#0f6b4f}
  .otpl-grid{display:grid;grid-template-columns:minmax(0,1.12fr) 1px minmax(0,1fr);column-gap:30px;row-gap:18px;align-items:start}
  .otpl-scheid{align-self:stretch;background:var(--line);border-radius:1px}
  .otpl-side{display:grid;gap:18px;align-content:start}
  @media(max-width:1040px){
    .otpl-grid{grid-template-columns:1fr;column-gap:0}
    .otpl-scheid{display:none}
  }
  .otpl-field .pdr-label{margin-bottom:4px}
  /* Drie losse functies in een kaart: e-mail, WhatsApp na formulier en WhatsApp
     vanuit de Instagram-chat. Elk een eigen omkaderd blok met een gekleurde
     kopstrook, zodat in een oogopslag duidelijk is wat wanneer verstuurd wordt. */
  .otpl-sec{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .otpl-sec-h{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfc}
  .otpl-sec-h>div:first-of-type{flex:1;min-width:0}
  /* Vertraging per medium, in de kopstrook van het blok zelf. Zonder dit gingen
     e-mail en WhatsApp op exact dezelfde seconde de deur uit, wat machinaal leest. */
  .otpl-wait{flex:none;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 9px;white-space:nowrap;line-height:1.3}
  .otpl-wait input{width:54px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;text-align:center;font-family:inherit}
  .otpl-wait input:disabled{background:#f6f8f7;color:var(--muted)}
  .otpl-wait b{font-weight:700;color:var(--ink)}
  .otpl-sec-ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:#eef2f1}
  .otpl-sec-h h4{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
  .otpl-sec-h p{margin:2px 0 0;font-size:11.5px;line-height:1.45;color:var(--muted)}
  .otpl-sec-b{padding:14px}
  .otpl-sec-b .pdr-label{margin-bottom:4px}
  .otpl-sec.sec-email{border-color:#cfe8dd}
  .otpl-sec.sec-email .otpl-sec-h{background:#f2f9f6;border-bottom-color:#cfe8dd}
  .otpl-sec.sec-email .otpl-sec-ic{background:#dcefe7}
  .otpl-sec.sec-wa{border-color:#b5e5c8}
  .otpl-sec.sec-wa .otpl-sec-h{background:#f0fdf4;border-bottom-color:#b5e5c8}
  .otpl-sec.sec-wa .otpl-sec-ic{background:#d6f5e2}
  .otpl-sec.sec-ig{border-color:#d8dbfb}
  .otpl-sec.sec-ig .otpl-sec-h{background:#f4f5ff;border-bottom-color:#d8dbfb}
  .otpl-sec.sec-ig .otpl-sec-ic{background:#e3e5fd}
  .otpl-sec-b textarea.pc-in{min-height:132px}
  .otpl-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;white-space:pre;overflow-x:auto;background:#fbfcfb}
  .otpl-rte{min-height:150px;max-height:420px;overflow-y:auto}
  .otpl-field [hidden]{display:none}   /* .pc-in zet display:block en won anders van het hidden-attribuut */
  .otpl-rte a{color:inherit}
  .otpl-field .seq-rte-tools{align-items:center}
  .otpl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px -22px 0;padding:14px 22px 0;border-top:1px solid var(--line)}
  .seq-design{display:flex;gap:4px}
  .seq-dbtn{font-size:11.5px;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);cursor:pointer}
  .seq-dbtn.on{background:#0f6b4f;color:#fff;border-color:#0f6b4f}
  .seq-del{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
  .seq-subj{margin-bottom:8px;font-weight:600}
  .seq-enroll-add{display:flex;gap:8px;margin-bottom:8px}
  .seq-enr-list{display:flex;flex-direction:column;gap:6px}
  .seq-enr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbfcfb;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
  .seq-enr-x{background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer}
  .seq-audience{background:#f8faf9;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 4px}
  .seq-aud-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .seq-rte-tools{display:flex;gap:4px;margin-bottom:0;background:#f4f6f5;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:5px}
  .seq-rte-tools button{min-width:30px;height:28px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink)}
  .seq-rte-tools button:hover{background:#e6ece9;border-color:var(--line)}
  .seq-rte{border:1px solid var(--line);border-radius:0 0 8px 8px;padding:10px 12px;min-height:120px;font-size:14px;line-height:1.55;outline:none;background:#fff}
  .seq-rte:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,179,125,.12)}

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function toast(msg,type){const t=el('div','toast '+(type||''),msg);$('#toasts').append(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},3600);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Allowlist-sanitizer voor rijke HTML die van een gebruiker/lead komt (ITP-body,
// sequence-mails). Deny-by-default: onbekende tags worden uitgepakt (inhoud
// blijft als tekst), gevaarlijke tags (script/style/iframe/…) verdwijnen, alle
// attributen worden gestript behalve een veilige href (alleen http/https/mailto).
// Zo kan geen on*-handler, javascript:-URL of <img onerror> meer uitvoeren.
function sanitizeHtml(dirty){
  if(dirty==null)return '';
  const allowed={A:1,B:1,STRONG:1,I:1,EM:1,U:1,P:1,BR:1,UL:1,OL:1,LI:1,SPAN:1,DIV:1,H1:1,H2:1,H3:1,H4:1,BLOCKQUOTE:1,HR:1};
  const drop={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,SVG:1,MATH:1,IMG:1,VIDEO:1,AUDIO:1,SOURCE:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,BASE:1};
  const doc=new DOMParser().parseFromString('<div id="__sz">'+String(dirty)+'</div>','text/html');
  const root=doc.getElementById('__sz');
  const walk=node=>{
    [...node.childNodes].forEach(ch=>{
      if(ch.nodeType===8){ch.remove();return;}          // comments weg
      if(ch.nodeType!==1)return;                          // tekst behouden
      const tag=ch.tagName;
      if(drop[tag]){ch.remove();return;}                  // gevaarlijk: helemaal weg
      if(!allowed[tag]){                                   // onbekend: uitpakken
        walk(ch);
        while(ch.firstChild)node.insertBefore(ch.firstChild,ch);
        node.removeChild(ch);return;
      }
      [...ch.attributes].forEach(a=>{
        if(tag==='A'&&a.name.toLowerCase()==='href'){
          const v=(a.value||'').trim();
          if(/^(https?:|mailto:)/i.test(v)){ch.setAttribute('href',v);ch.setAttribute('rel','noopener noreferrer');ch.setAttribute('target','_blank');}
          else ch.removeAttribute('href');
        } else ch.removeAttribute(a.name);                // on*, style, src, alles weg
      });
      walk(ch);
    });
  };
  walk(root);
  return root.innerHTML;
}

   al het andere wordt 'other' (stored-XSS-preventie, security-review 2026-08-05). */
// Een gedeelde foto komt binnen als kale link (Instagram-CDN of WhatsApp-media),
// of, na het cachen door inbox-ingest, als bijlage. Beide tonen we als miniatuur.
function isImgUrl(u){
  u=String(u||'').trim();
  if(!/^https?:\/\/\S+$/i.test(u))return false;
  return /lookaside\.fbsbx\.com|ig_messaging_cdn|\/inbox-media\/|\.(jpe?g|png|webp|gif)(\?|$)/i.test(u);
}
function msgMedia(m){
  const uit=[];
  const att=m.attachments;
  if(Array.isArray(att))att.forEach(a=>{const u=(a&&(a.url||a.href))||(typeof a==='string'?a:'');if(isImgUrl(u))uit.push(u);});
  const b=String(m.body||'').trim();
  if(isImgUrl(b)&&!uit.length)uit.push(b);
  return uit;
}
function imgHtml(urls){
  return `<div class="ibx-img-wrap">${urls.map(u=>
    `<img class="ibx-img" src="${esc(u)}" alt="Gedeelde foto" loading="lazy" referrerpolicy="no-referrer" data-zoom="${esc(u)}" onerror="this.outerHTML='<div class=\'ibx-img-fail\'>\u{1F4F7} Foto niet meer beschikbaar</div>'">`
  ).join('')}</div>`;
}
function chanClass(c){c=String(c||'').toLowerCase();return ['direct','organic','social','paid','referral','campaign','email','internal'].includes(c)?c:'other';}
function money(v){if(v==null||v==='')return '—';return '€'+Number(v).toLocaleString('nl-NL');}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return d.toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(v){if(!v)return '—';const d=new Date(v);return d.toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function toLocalInput(v){if(!v)return '';const d=new Date(v);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function isAdmin(){return ME && ME.is_admin;}
function canView(p){return isAdmin() || (PERMS[p] && PERMS[p].can_view);}
function canEdit(p){return isAdmin() || (PERMS[p] && PERMS[p].can_edit);}
function shortId(v){return v?String(v).slice(0,8)+'…':'—';}

  reservation:'amber',dataroom_request:'blue',
  reserved:'amber',contracted:'blue',completed:'green',cancelled:'red',

  due_diligence:'blue',contract_voorbeeld:'amber',overig:'grey',

function statusBadge(v){if(v==null||v==='')return '<span class="badge grey">—</span>';const c=STATUS_COLOR[v]||'grey';return `<span class="badge ${c}">${esc(v)}</span>`;}
function boolBadge(v){return v?'<span class="badge green">Yes</span>':'<span class="badge grey">No</span>';}

function cell(resKey,f,row){
  const v=row[f];
  const def=(RES[resKey].fields.find(x=>x.k===f))||{};
  if(f==='status'||f==='type'||f==='category'||f==='agreement')return statusBadge(v);
  if(def.type==='bool')return boolBadge(v);
  if(def.money)return money(v);
  if(def.type==='tags'){const a=v||[];return a.length?a.map(t=>`<span class="chip">${esc(t)}</span>`).join(''):'<span class="muted">—</span>';}
  if(def.type==='datetime')return fmtDateTime(v);
  if(def.type==='date')return fmtDate(v);
  if(f.endsWith('_id'))return `<span class="muted" title="${esc(v)}">${shortId(v)}</span>`;
  if(f==='url'||f.endsWith('_url')){if(!v)return '<span class="muted">—</span>';const safe=/^https?:\/\//i.test(String(v).trim());return safe?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">link ↗</a>`:esc(v);}
  if(v==null||v==='')return '<span class="muted">—</span>';
  return esc(v);
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();SESSION=session;
  if(!session){$('#login').style.display='flex';$('#app').style.display='none';return;}
  const {data:prof,error:pe}=await sb.from('adm_profiles').select('*').eq('id',session.user.id).single();

  ME=prof;
  const {data:perms}=await sb.from('adm_permissions').select('*').eq('user_id',session.user.id);
  PERMS={};(perms||[]).forEach(p=>{PERMS[p.page]={can_view:p.can_view,can_edit:p.can_edit};});
  $('#login').style.display='none';$('#app').style.display='block';
  $('#meName').textContent=ME.full_name||ME.email;

}

function copyLink(url){
  const done=()=>toast('Link gekopieerd — plak in WhatsApp of mail voor je team','ok');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>fallback());return;} }catch(e){}
  fallback();

/* ================= GLOBALE LEADZOEKER =================
   Eén veld dat een lead vindt ongeacht in welke pipeline die staat. Met drie
   pipelines was zoeken binnen één bord onwerkbaar: zat je in Sales, dan vond je
   een Discovery-lead niet. Klik op een resultaat opent de contactkaart, waar de
   pipelinesectie precies laat zien waar de persoon staat. */
let GZ={t:null,items:[],sel:-1,laatste:''};
function gzSluit(){const r=$('#gz_res');if(r){r.hidden=true;r.innerHTML='';}GZ.items=[];GZ.sel=-1;}
function gzTeken(items,q){
  const r=$('#gz_res');if(!r)return;
  GZ.items=items;GZ.sel=items.length?0:-1;
  if(!items.length){
    r.innerHTML=`<div class="gz-leeg">Geen lead gevonden voor <b>${esc(q)}</b>. Probeer een deel van de naam, het 06-nummer of het e-mailadres.</div>`;
    r.hidden=false;return;
  }
  r.innerHTML=items.map((it,i)=>{
    const pipes=(it.pipelines||[]).map(p=>`<span class="gz-pipe">${esc(p.pipeline)} · ${esc(p.fase)}</span>`).join('');
    const kan=(it.kanalen||[]).filter(Boolean).map(x=>(INBOX_CH[x]||{}).label||x).join(', ');
    const sub=[it.telefoon,it.email,kan].filter(Boolean).join(' · ');
    return `<button class="gz-item${i===0?' sel':''}" data-gz="${esc(it.contact_id)}" data-i="${i}">
      <div class="gz-naam">${esc(it.naam)}</div>
      ${sub?`<div class="gz-sub">${esc(sub)}</div>`:''}
      ${pipes||'<span class="gz-pipe">Nog in geen pipeline</span>'}
    </button>`;
  }).join('');
  r.hidden=false;
  r.querySelectorAll('[data-gz]').forEach(b=>b.onclick=()=>gzOpen(b.dataset.gz));
}
async function gzOpen(id){
  gzSluit();const inp=$('#gz_q');if(inp)inp.value='';
  const {data}=await sb.from('contacts').select('*').eq('id',id).single();
  if(data)openPerson(data);else toast('Contact niet gevonden','err');
}
async function gzZoek(q){
  q=(q||'').trim();
  if(q.length<2){gzSluit();return;}
  const {data,error}=await sb.rpc('lead_zoek',{p_q:q,p_limit:12});
  if(GZ.laatste!==q)return;               // trager antwoord van een oudere toets negeren
  if(error){gzSluit();return;}
  gzTeken(data||[],q);
}
function gzInit(){
  const inp=$('#gz_q');if(!inp||inp.dataset.wired)return;
  inp.dataset.wired='1';
  inp.oninput=()=>{
    const q=inp.value;GZ.laatste=q.trim();
    clearTimeout(GZ.t);GZ.t=setTimeout(()=>gzZoek(q),180);
  };
  inp.onkeydown=e=>{
    if(e.key==='Escape'){gzSluit();inp.blur();return;}
    if(!GZ.items.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      GZ.sel=(GZ.sel+(e.key==='ArrowDown'?1:-1)+GZ.items.length)%GZ.items.length;
      const r=$('#gz_res');if(r)r.querySelectorAll('.gz-item').forEach((b,i)=>b.classList.toggle('sel',i===GZ.sel));
    }
    if(e.key==='Enter'&&GZ.sel>=0){e.preventDefault();gzOpen(GZ.items[GZ.sel].contact_id);}
  };
  document.addEventListener('click',e=>{const w=e.target.closest('.gz-wrap');if(!w)gzSluit();});
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();inp.focus();inp.select();}
  });
}
