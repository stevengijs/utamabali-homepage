const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function toast(msg,type){const t=el('div','toast '+(type||''),msg);$('#toasts').append(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},3600);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){if(v==null||v==='')return '—';return '€'+Number(v).toLocaleString('nl-NL');}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return d.toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(v){if(!v)return '—';const d=new Date(v);return d.toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function toLocalInput(v){if(!v)return '';const d=new Date(v);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function isAdmin(){return ME && ME.is_admin;}
function canView(p){return isAdmin() || (PERMS[p] && PERMS[p].can_view);}
function canEdit(p){return isAdmin() || (PERMS[p] && PERMS[p].can_edit);}

  new:'blue',inquiry:'blue',contacted:'amber',qualified:'green',won:'green',lost:'red',
  reservation:'amber',dataroom_request:'blue',

function statusBadge(v){if(v==null||v==='')return '<span class="badge grey">—</span>';const c=STATUS_COLOR[v]||'grey';return `<span class="badge ${c}">${esc(v)}</span>`;}
function boolBadge(v){return v?'<span class="badge green">Yes</span>':'<span class="badge grey">No</span>';}

function cell(resKey,f,row){
  const v=row[f];
  const def=(RES[resKey].fields.find(x=>x.k===f))||{};
  if(f==='status'||f==='type'||f==='category'||f==='agreement')return statusBadge(v);
  if(def.type==='bool')return boolBadge(v);
  if(def.money)return money(v);
  if(def.type==='tags'){const a=v||[];return a.length?a.map(t=>`<span class="chip">${esc(t)}</span>`).join(''):'<span class="muted">—</span>';}
  if(def.type==='datetime')return fmtDateTime(v);
  if(def.type==='date')return fmtDate(v);
  if(f.endsWith('_id'))return `<span class="muted" title="${esc(v)}">${shortId(v)}</span>`;
  if(f==='url'||f.endsWith('_url'))return v?`<a href="${esc(v)}" target="_blank" rel="noopener">link ↗</a>`:'<span class="muted">—</span>';
  if(v==null||v==='')return '<span class="muted">—</span>';
  return esc(v);
}

/* ================= ANALYTICS ================= */
let ANALYTICS_RANGE='30d';
let ANALYTICS_CUSTOM={from:null,to:null};
function anRangeCalc(){
  const startOfDay=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);return x;};
  const today0=startOfDay(new Date());const r=ANALYTICS_RANGE;
  let since,until,label;
  if(r==='today'){since=today0;until=new Date();label='Today';}
  else if(r==='yesterday'){until=today0;since=new Date(today0.getTime()-864e5);label='Yesterday';}
  else if(r==='custom'&&ANALYTICS_CUSTOM.from&&ANALYTICS_CUSTOM.to){since=startOfDay(ANALYTICS_CUSTOM.from);until=new Date(startOfDay(ANALYTICS_CUSTOM.to).getTime()+864e5-1);label=ANALYTICS_CUSTOM.from+' → '+ANALYTICS_CUSTOM.to;}
  else{const n=parseInt(r)||30;since=new Date(Date.now()-n*864e5);until=new Date();label='Last '+n+' days';}
  return {since,until,label};
}
function anInt(n){return (n||0).toLocaleString('en-US');}
function anPct(x){if(!isFinite(x))return '—';const p=x*100;return (p>=10||p===0?p.toFixed(0):p.toFixed(1))+'%';}
function anDur(ms){if(!ms||ms<=0)return '—';const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);return m+'m '+(s%60)+'s';}
function anMoney(n){n=Number(n)||0;return '€'+Math.round(n).toLocaleString('nl-NL');}
function anBars(rows,color){
  if(!rows.length)return '<div class="empty" style="padding:22px">No data in this period yet.</div>';
  const max=Math.max.apply(null,rows.map(r=>r.value))||1;
  return '<div class="anbars">'+rows.map(r=>`<div class="anbar"><div class="anbar-l" title="${esc(r.label)}">${esc(r.label)}</div><div class="anbar-t"><div class="anbar-f" style="width:${Math.max(2,r.value/max*100).toFixed(1)}%;background:${color||'var(--brand-2)'}"></div></div><div class="anbar-v">${r.display!=null?r.display:anInt(r.value)}${r.sub?` <span class="muted" style="font-weight:500">${esc(r.sub)}</span>`:''}</div></div>`).join('')+'</div>';
}
function anLine(series){
  const w=760,h=210,pad=26,n=series.length;
  if(!n)return '<div class="empty" style="padding:30px">No traffic recorded yet.</div>';
  const maxPv=Math.max(1,...series.map(s=>s.pv));
  const X=i=>pad+(w-2*pad)*(n<=1?0.5:i/(n-1));
  const Y=v=>(h-pad)-(h-2*pad)*(v/maxPv);
  const path=k=>series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(s[k]).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${(h-pad)} ${series.map((s,i)=>`L${X(i).toFixed(1)},${Y(s.pv).toFixed(1)}`).join(' ')} L${X(n-1).toFixed(1)},${(h-pad)} Z`;
  const dfmt=d=>{const p=d.split('-');return p[2]+'/'+p[1];};
  const ticks=[0,Math.floor((n-1)/2),n-1].filter((x,i,a)=>a.indexOf(x)===i);
  return `<div style="padding:8px 14px 4px">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="220" preserveAspectRatio="none" style="display:block">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e3e7e4"/>
      <path d="${area}" fill="rgba(20,179,125,.10)"/>
      <path d="${path('pv')}" fill="none" stroke="#14b37d" stroke-width="2.2"/>
      <path d="${path('vis')}" fill="none" stroke="#0f6b4f" stroke-width="2.2" stroke-dasharray="4 3"/>
      ${series.map((s,i)=>s.pv>0?`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.pv).toFixed(1)}" r="3.2" fill="#14b37d"/>`:'').join('')}
      <text x="${pad}" y="16" font-size="11" fill="#5f6f68">max ${maxPv}</text>
      ${ticks.map(i=>`<text x="${X(i).toFixed(1)}" y="${h-8}" font-size="10" fill="#5f6f68" text-anchor="middle">${dfmt(series[i].date)}</text>`).join('')}
    </svg>
    <div style="display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--muted);padding:2px 0 8px">
      <span><span style="display:inline-block;width:14px;height:3px;background:#14b37d;vertical-align:middle;margin-right:5px"></span>Page views</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:3px dashed #0f6b4f;vertical-align:middle;margin-right:5px"></span>Unique visitors</span>
    </div></div>`;
}
function anMatchProj(val,name,slug){
  if(!val)return false;const v=String(val).toLowerCase().trim();
  const nm=(name||'').toLowerCase().trim(),sl=(slug||'').toLowerCase().trim();
  if(nm&&(v===nm||v.includes(nm)||nm.includes(v)))return true;
  if(sl&&(v===sl||v.includes(sl)))return true;
  return false;
}

  v.innerHTML='<div class="muted" style="padding:8px">Loading analytics…</div>';
  const {since:sinceD,until:untilD,label:rangeLabel}=anRangeCalc();
  const since=sinceD.toISOString(),until=untilD.toISOString();

  const [evR,leadsR,purchR,webR,projR]=await Promise.all([

  const pageviews=ev.length;
  const visitors=new Set(ev.map(e=>e.visitor_hash).filter(Boolean)).size;
  const sessCounts={};ev.forEach(e=>{if(e.session_id)sessCounts[e.session_id]=(sessCounts[e.session_id]||0)+1;});
  const sessions=Object.keys(sessCounts).length;
  const bounces=Object.values(sessCounts).filter(c=>c===1).length;
  const durs=ev.map(e=>e.duration_ms).filter(d=>d>0);
  const avgDur=durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:0;

  // daily series across the selected range — keys in UTC to match event created_at (UTC)
  const byDay={};
  const dayKeys=[];
  let cur=new Date(sinceD.toISOString().slice(0,10)+'T00:00:00Z');
  const endD=new Date(untilD.toISOString().slice(0,10)+'T00:00:00Z');
  while(cur<=endD&&dayKeys.length<200){const d=cur.toISOString().slice(0,10);dayKeys.push(d);byDay[d]={date:d,pv:0,vis:new Set()};cur=new Date(cur.getTime()+864e5);}
  ev.forEach(e=>{const d=(e.created_at||'').slice(0,10);if(byDay[d]){byDay[d].pv++;if(e.visitor_hash)byDay[d].vis.add(e.visitor_hash);}});
  const series=dayKeys.map(d=>({date:d,pv:byDay[d].pv,vis:byDay[d].vis.size}));

  // top pages
  const pageMap={};
  ev.forEach(e=>{const p=e.path||'/';(pageMap[p]=pageMap[p]||{pv:0,vis:new Set(),dur:[],title:e.page_title});pageMap[p].pv++;if(e.visitor_hash)pageMap[p].vis.add(e.visitor_hash);if(e.duration_ms>0)pageMap[p].dur.push(e.duration_ms);});
  const pages=Object.entries(pageMap).map(([p,x])=>({path:p,pv:x.pv,vis:x.vis.size,avg:x.dur.length?x.dur.reduce((a,b)=>a+b,0)/x.dur.length:0})).sort((a,b)=>b.pv-a.pv).slice(0,12);

  // channels / referrers / campaigns / geo / devices
  const grp=(key,uniqKey)=>{const m={};ev.forEach(e=>{const k=e[key];if(!k)return;(m[k]=m[k]||new Set()).add(e[uniqKey]||Math.random());});return Object.entries(m).map(([k,s])=>({k,n:s.size})).sort((a,b)=>b.n-a.n);};
  const channels=grp('channel','session_id');
  const referrers=grp('referrer_host','session_id').slice(0,8);
  const campaigns=grp('utm_campaign','session_id').slice(0,8);
  const countries=grp('country','visitor_hash').slice(0,8);
  const devices=grp('device','session_id');
  const leadSrc=(()=>{const m={};leads.forEach(l=>{const k=l.source_page||'(unknown)';m[k]=(m[k]||0)+1;});return Object.entries(m).map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n).slice(0,8);})();

  // brochure sign-ups (leads via a /brochure page or brochure-type request)
  const brochure=leads.filter(l=>/brochure/i.test((l.source_page||'')+' '+(l.type||'')));
  const brByProj=(()=>{const m={};brochure.forEach(l=>{const k=l.project||'(onbekend)';m[k]=(m[k]||0)+1;});return Object.entries(m).map(([k,n])=>({label:k,value:n,display:anInt(n)})).sort((a,b)=>b.value-a.value);})();

  // funnel + revenue
  const nLeads=leads.length, nCalls=webs.filter(w=>w.call_booked).length, nPurch=purch.length;
  const revenue=purch.reduce((a,x)=>a+(Number(x.price)||0),0);
  const deposits=purch.reduce((a,x)=>a+(Number(x.deposit_amount)||0),0);
  const fmax=Math.max(1,visitors,nLeads,nCalls,nPurch);
  const fsteps=[{l:'Visitors',n:visitors,c:'#14b37d'},{l:'Leads / inquiries',n:nLeads,c:'#0f9d74'},{l:'Calls booked',n:nCalls,c:'#0c7a5b'},{l:'Purchases',n:nPurch,c:'#0c1a15'}];

  // per project
  const projRows=projs.map(pr=>{
    const slug=(pr.slug||'').toLowerCase(),name=pr.name||'';
    const pvs=slug?ev.filter(e=>(e.path||'').toLowerCase().includes('/'+slug)):[];
    const dd=pvs.map(e=>e.duration_ms).filter(d=>d>0);
    const buys=purch.filter(p=>anMatchProj(p.project,name,slug));
    return {name,status:pr.status,views:pvs.length,uv:new Set(pvs.map(e=>e.visitor_hash).filter(Boolean)).size,
      avg:dd.length?dd.reduce((a,b)=>a+b,0)/dd.length:0,
      inq:leads.filter(l=>anMatchProj(l.project,name,slug)).length,
      buys:buys.length,rev:buys.reduce((a,x)=>a+(Number(x.price)||0),0)};
  }).sort((a,b)=>b.views-a.views);

  // ---- render ----
  const kpis=[
    ['Unique visitors',anInt(visitors),rangeLabel.toLowerCase()],
    ['Page views',anInt(pageviews),sessions?anInt((pageviews/sessions).toFixed(1))+' per session':'—'],
    ['Sessions',anInt(sessions),'visits'],
    ['Avg. time on page',anDur(avgDur),'engaged'],
    ['Bounce rate',sessions?anPct(bounces/sessions):'—','single-page visits'],
    ['Visitor→lead',visitors?anPct(Math.min(1,nLeads/visitors)):'—',anInt(nLeads)+' leads'],
    ['Brochure sign-ups',anInt(brochure.length),'brochure-aanvragen'],
  ];
  let html='';
  if(pageviews===0)html+=`<div class="an-note">📡 Tracking is live. No visits recorded for <b>${esc(rangeLabel.toLowerCase())}</b> yet — this fills in automatically as people visit the site. The funnel below still reflects your leads, calls & sales.</div>`;
  html+='<div class="cards">'+kpis.map(k=>`<div class="stat"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')+'</div>';

  html+=`<div class="panel"><div class="panel-head"><div><h3>Traffic over time</h3><div class="desc">Page views and unique visitors per day.</div></div></div>${anLine(series)}</div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Conversion funnel to revenue</h3><div class="desc">From anonymous visitor to paying investor · ${esc(rangeLabel.toLowerCase())}.</div></div></div>
    <div class="funnel">${fsteps.map((s,i)=>{const prev=i?fsteps[i-1].n:0;const conv=i&&prev?` · ${anPct(Math.min(1,s.n/prev))} of previous`:'';return `<div class="fstep"><div class="fbar-wrap"><div class="fbar" style="width:${Math.max(8,s.n/fmax*100)}%;background:${s.c}">${anInt(s.n)}</div><div style="font-weight:650">${s.l}</div></div><div class="fmeta">${i===0?(visitors?'top of funnel':'—'):conv.replace(' · ','')}</div></div>`;}).join('')}</div>
    <div class="rev-row"><div><div class="rk">Contracted / sold value</div><div class="rv">${anMoney(revenue)}</div></div><div><div class="rk">Deposits received</div><div class="rv">${anMoney(deposits)}</div></div><div><div class="rk">Overall visitor→sale</div><div class="rv">${visitors?anPct(Math.min(1,nPurch/visitors)):'—'}</div></div></div></div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Top pages</h3><div class="desc">Most-viewed pages & how long people stay.</div></div></div>${anBars(pages.map(p=>({label:p.path,value:p.pv,display:anInt(p.pv),sub:'· '+p.vis+' uv · '+anDur(p.avg)})),'#14b37d')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Channels</h3><div class="desc">Where your sessions come from.</div></div></div>${anBars(channels.map(c=>({label:c.k,value:c.n,display:anInt(c.n),sub:'sessions'})),'#1d4ed8')}</div>
  </div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Referrers</h3><div class="desc">External sites sending traffic.</div></div></div>${anBars(referrers.map(c=>({label:c.k,value:c.n,display:anInt(c.n),sub:'sessions'})),'#7c3aed')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Campaigns (UTM)</h3><div class="desc">Tagged marketing campaigns.</div></div></div>${anBars(campaigns.map(c=>({label:c.k,value:c.n,display:anInt(c.n),sub:'sessions'})),'#0f6b4f')}</div>
  </div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Where visitors are</h3><div class="desc">Approx. location (by timezone).</div></div></div>${anBars(countries.map(c=>({label:c.k,value:c.n,display:anInt(c.n),sub:'visitors'})),'#0891b2')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Brochure sign-ups per project</h3><div class="desc">Aanvragen van de digitale brochure — ${anInt(brochure.length)} totaal.</div></div></div>${anBars(brByProj,'#b7791f')}</div>
  </div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Leads by landing page</h3><div class="desc">Which pages turn into inquiries.</div></div></div>${anBars(leadSrc.map(c=>({label:c.k,value:c.n,display:anInt(c.n),sub:'leads'})),'#0f6b4f')}</div>`;

  html+=`<div class="panel"><div class="panel-head"><div><h3>Interest & revenue per project</h3><div class="desc">Which projects attract attention — and convert to sales.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Project</th><th>Views</th><th>Unique</th><th>Avg. time</th><th>Inquiries</th><th>View→inquiry</th><th>Sales</th><th>Revenue</th></tr></thead><tbody>
    ${projRows.length?projRows.map(p=>`<tr><td><b>${esc(p.name)}</b> ${p.status?`<span class="badge grey">${esc(p.status)}</span>`:''}</td><td>${anInt(p.views)}</td><td>${anInt(p.uv)}</td><td>${anDur(p.avg)}</td><td>${anInt(p.inq)}</td><td>${p.views?anPct(p.inq/p.views):'—'}</td><td>${anInt(p.buys)}</td><td>${p.rev?anMoney(p.rev):'—'}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No projects yet.</td></tr>'}
    </tbody></table></div>
    <div class="rev-row"><span class="muted" style="font-size:12px">Devices: ${devices.map(d=>`${esc(d.k)} ${anInt(d.n)}`).join(' · ')||'—'}</span></div></div>`;

  v.innerHTML=html;
}

/* ================= REVENUE ================= */
const REV_BOOKED=['contracted','signed','completed','delivered','sold','paid','closed','won'];
const REV_PIPELINE=['reserved','reservation','option','pending','deposit','offer','negotiation','intent'];
const REV_LOST=['cancelled','canceled','refunded','lost','withdrawn','declined'];
function revClass(s){s=(s||'').toLowerCase().trim();if(REV_BOOKED.includes(s))return 'booked';if(REV_PIPELINE.includes(s))return 'pipeline';if(REV_LOST.includes(s))return 'lost';return 'other';}
function revBadgeClass(c){return c==='booked'?'green':c==='pipeline'?'blue':c==='lost'?'red':'grey';}
async function renderRevenue(){
  const v=$('#view');v.innerHTML='<div class="muted" style="padding:8px">Loading revenue…</div>';
  const [projR,purR]=await Promise.all([
    sb.from('projects').select('name,slug,status,units_total,units_available,price_start,price_current,reservation_amount,sort_order').order('sort_order',{ascending:true}),
    sb.from('purchases').select('project,unit,buyer_name,status,price,deposit_amount,contract_signed_at,created_at').order('contract_signed_at',{ascending:false,nullsFirst:false}),
  ]);
  if(purR.error){v.innerHTML=`<div class="panel"><div class="empty">Couldn’t load revenue: ${esc(purR.error.message)}</div></div>`;return;}
  const projs=projR.data||[],P=purR.data||[];
  P.forEach(x=>{x._c=revClass(x.status);x._p=Number(x.price)||0;x._d=Number(x.deposit_amount)||0;});
  const sales=P.filter(x=>x._c!=='lost'&&x._c!=='pipeline');

  // per project: sold units & revenue come from actual deals (real per-unit prices); remaining from project inventory
  const rows=projs.map(pr=>{
    const deals=sales.filter(x=>anMatchProj(x.project,pr.name,pr.slug));
    const sold=deals.length, soldRev=deals.reduce((a,x)=>a+x._p,0);
    const askPrice=Number(pr.price_current||pr.price_start)||0;
    const avail=(pr.units_available==null)?Math.max(0,(Number(pr.units_total)||sold)-sold):Number(pr.units_available);
    return {name:pr.name,status:pr.status,sold,soldRev,askPrice,avail,
      remaining:avail*askPrice, total:sold+avail, avg:sold?soldRev/sold:0};
  });
  // deals whose project isn't in the projects table
  const known=new Set(projs.map(p=>(p.name||'').toLowerCase()));
  const orphan=sales.filter(x=>!projs.some(pr=>anMatchProj(x.project,pr.name,pr.slug)));
  if(orphan.length)rows.push({name:'Other',status:'',sold:orphan.length,soldRev:orphan.reduce((a,x)=>a+x._p,0),askPrice:0,avail:0,remaining:0,total:orphan.length,avg:orphan.reduce((a,x)=>a+x._p,0)/orphan.length});

  const totalRevenue=sales.reduce((a,x)=>a+x._p,0);
  const totalSold=sales.length;
  const remainingValue=rows.reduce((a,r)=>a+r.remaining,0);
  const totalAvail=rows.reduce((a,r)=>a+r.avail,0);
  const portfolioValue=totalRevenue+remainingValue;
  const avgPrice=totalSold?totalRevenue/totalSold:0;
  const sellThrough=(totalSold+totalAvail)?totalSold/(totalSold+totalAvail):0;
  const deposits=sales.reduce((a,x)=>a+x._d,0);

  const kpis=[
    ['Revenue to date',anMoney(totalRevenue),totalSold+' unit'+(totalSold===1?'':'s')+' sold'],
    ['Avg. sale price',totalSold?anMoney(avgPrice):'—','per sold unit'],
    ['Remaining inventory',anMoney(remainingValue),totalAvail+' units for sale'],
    ['Sell-through rate',anPct(sellThrough),totalSold+' of '+(totalSold+totalAvail)+' units'],
    ['Total portfolio value',anMoney(portfolioValue),'sold + remaining'],
    ['Deposits received',anMoney(deposits),'on logged deals'],
  ];

  let html='';
  html+=`<div class="an-note">💰 Revenue to date = som van de werkelijke verkoopprijzen per unit (uit Deals). Remaining inventory = nog beschikbare units × huidige vraagprijs. Voeg een deal toe of pas een prijs aan, dan verandert dit mee.</div>`;
  html+='<div class="cards">'+kpis.map(k=>`<div class="stat"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')+'</div>';

  html+=`<div class="panel"><div class="panel-head"><div><h3>Revenue by project</h3><div class="desc">Gerealiseerde omzet uit verkochte units, plus resterende voorraadwaarde.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Project</th><th>Status</th><th>Units sold</th><th>Sell-through</th><th>Avg. sale price</th><th>Revenue to date</th><th>Remaining value</th></tr></thead><tbody>
    ${rows.length?rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.status?`<span class="badge grey">${esc(p.status)}</span>`:'—'}</td><td>${anInt(p.sold)} / ${anInt(p.total)}</td><td>${p.total?anPct(p.sold/p.total):'—'}</td><td>${p.sold?anMoney(p.avg):'—'}</td><td><b>${p.soldRev?anMoney(p.soldRev):'—'}</b></td><td>${p.remaining?anMoney(p.remaining):'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No projects yet.</td></tr>'}
    </tbody><tfoot><tr style="font-weight:750;background:#fafbfa"><td>Total</td><td></td><td>${anInt(totalSold)} / ${anInt(totalSold+totalAvail)}</td><td>${anPct(sellThrough)}</td><td>${totalSold?anMoney(avgPrice):'—'}</td><td>${anMoney(totalRevenue)}</td><td>${anMoney(remainingValue)}</td></tr></tfoot></table></div></div>`;

  html+=`<div class="an-grid" style="margin-top:20px">
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Revenue to date by project</h3><div class="desc">Gerealiseerde omzet uit verkochte units.</div></div></div>${anBars(rows.filter(r=>r.soldRev>0).map(r=>({label:r.name,value:r.soldRev,display:anMoney(r.soldRev),sub:'· '+r.sold+' sold'})),'#14b37d')}</div>
    <div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>Remaining inventory value</h3><div class="desc">Nog te verkopen voorraad × vraagprijs.</div></div></div>${anBars(rows.filter(r=>r.remaining>0).map(r=>({label:r.name,value:r.remaining,display:anMoney(r.remaining),sub:'· '+r.avail+' left'})),'#b7791f')}</div>
  </div>`;

  const recent=P.slice(0,40);
  html+=`<div class="panel"><div class="panel-head"><div><h3>Deals (${P.length})</h3><div class="desc">Verkochte units — wie kocht welke villa, voor welke prijs en wanneer.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Buyer</th><th>Project</th><th>Unit</th><th>Status</th><th>Price</th><th>Contract date</th></tr></thead><tbody>
    ${recent.length?recent.map(x=>`<tr><td><b>${esc(x.buyer_name||'—')}</b></td><td>${esc(x.project||'—')}</td><td>${esc(x.unit||'—')}</td><td><span class="badge ${revBadgeClass(x._c)}">${esc(x.status||'—')}</span></td><td><b>${x._p?anMoney(x._p):'—'}</b></td><td>${x.contract_signed_at?fmtDate(x.contract_signed_at):'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No deals yet.</td></tr>'}
    </tbody></table></div></div>`;

  v.innerHTML=html;
}

/* ================= GENERIC RESOURCE ================= */
async function renderResource(resKey,mount){
  const R=RES[resKey];const editable=canEdit(R.page)&&!R.readOnly;const canCreate=editable&&!R.noCreate;
  mount.innerHTML=`<div class="panel"><div class="panel-head"><div><h3>${R.title} <span class="count-pill" id="cnt_${resKey}">…</span></h3><div class="desc">${R.desc||''}</div></div>
    <div class="toolbar"><input class="search" id="search_${resKey}" placeholder="Search…">${canCreate?`<button class="btn btn-primary btn-sm" id="add_${resKey}">+ New ${R.single}</button>`:(editable?'':'<span class="readonly-tag">Read only</span>')}</div></div>
    <div class="table-wrap" id="tw_${resKey}"><div class="empty">Loading…</div></div></div>`;
  const ob=R.orderBy||'created_at';
  const {data,error}=await sb.from(R.table).select('*').order(ob,{ascending:!!R.asc,nullsFirst:false});
  if(error){$('#tw_'+resKey).innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`;const c=$('#cnt_'+resKey);if(c)c.textContent='!';return;}
  _cache[resKey]=data||[];
  $('#cnt_'+resKey).textContent=_cache[resKey].length;
  drawTable(resKey);
  if(canCreate)$('#add_'+resKey).onclick=()=>openForm(resKey,null);
  $('#search_'+resKey).addEventListener('input',()=>drawTable(resKey));
}
function drawTable(resKey){
  const R=RES[resKey];const editable=canEdit(R.page)&&!R.readOnly;
  const q=($('#search_'+resKey)?.value||'').toLowerCase();
  let rows=_cache[resKey]||[];
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  const tw=$('#tw_'+resKey);if(!tw)return;
  if(!rows.length){tw.innerHTML='<div class="empty">No records'+(q?' match your search.':' yet.')+'</div>';return;}
  let h='<table><thead><tr>';
  R.cols.forEach(c=>{const def=R.fields.find(f=>f.k===c);h+=`<th>${esc(def?def.label:c)}</th>`;});
  h+='<th style="text-align:right">'+(editable?'Actions':'')+'</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+=`<tr data-row="${r.id}" style="cursor:pointer">`;R.cols.forEach(c=>{h+=`<td>${cell(resKey,c,r)}</td>`;});
    h+='<td><div class="row-actions">';
    if(editable){h+=`<button class="btn btn-ghost btn-sm" data-edit="${r.id}">Open</button><button class="btn btn-danger btn-sm" data-del="${r.id}">Delete</button>`;}
    h+='</div></td></tr>';
  });
  h+='</tbody></table>';tw.innerHTML=h;
  tw.querySelectorAll('tr[data-row]').forEach(tr=>tr.onclick=(e)=>{if(e.target.closest('.row-actions'))return;openForm(resKey,rows.find(x=>String(x.id)===tr.dataset.row));});
  tw.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(resKey,rows.find(x=>String(x.id)===b.dataset.edit)));
  tw.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRecord(resKey,b.dataset.del));
}
async function delRecord(resKey,id){
  const R=RES[resKey];
  if(!confirm('Delete this '+R.single.toLowerCase()+'? This changes your live data and cannot be undone.'))return;
  const {error}=await sb.from(R.table).delete().eq('id',id);
  if(error)return toast(error.message,'err');
  toast(R.single+' deleted','ok');
  _cache[resKey]=(_cache[resKey]||[]).filter(x=>String(x.id)!==String(id));
  const _ce=$('#cnt_'+resKey);if(_ce)_ce.textContent=_cache[resKey].length;drawTable(resKey);
}

function openForm(resKey,row){
  const R=RES[resKey];const ro=!!R.readOnly;const isEdit=!!row;row=row||{};
  const editFields=R.fields.filter(f=>!f.ro||isEdit);
  let body='';
  if(ro)body+=`<div class="lock-note" style="margin-bottom:16px">🔒 View only. Project data is changed via Claude so it stays in sync everywhere (utamabali.com, invest. and the brochures).</div>`;
  body+='<div class="grid2">';
  editFields.forEach(f=>{
    const full=(f.type==='textarea'||f.type==='tags')?' style="grid-column:1/-1"':'';
    const val=row[f.k];const dis=(f.ro||ro)?' disabled':'';
    let input='';
    if(f.type==='textarea')input=`<textarea id="f_${f.k}" rows="3"${dis}>${esc(val||'')}</textarea>`;
    else if(f.type==='select')input=`<select id="f_${f.k}"${dis}><option value="">—</option>`+f.opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')+`</select>`;
    else if(f.type==='bool')input=`<select id="f_${f.k}"${dis}><option value="false" ${!val?'selected':''}>No</option><option value="true" ${val?'selected':''}>Yes</option></select>`;
    else if(f.type==='tags')input=`<input id="f_${f.k}" value="${esc((val||[]).join(', '))}"${dis}>`;
    else if(f.type==='number')input=`<input id="f_${f.k}" type="number" step="any" value="${val==null?'':esc(val)}"${dis}>`;
    else if(f.type==='date')input=`<input id="f_${f.k}" type="date" value="${val?String(val).slice(0,10):''}"${dis}>`;
    else if(f.type==='datetime')input=`<input id="f_${f.k}" type="datetime-local" value="${toLocalInput(val)}"${dis}>`;
    else input=`<input id="f_${f.k}" value="${esc(val==null?'':val)}"${dis}>`;
    body+=`<div class="field"${full}><label>${esc(f.label)}${f.req?' *':''}</label>${input}</div>`;
  });
  body+='</div>';
  if(ro){showDetail(`${esc(R.single)}${row[R.fields[0].k]?' · '+esc(row[R.fields[0].k]):''}`,body);return;}
  showModal(`${isEdit?'Edit':'New'} ${R.single}`,body,async()=>{
    const payload={};let ok=true;
    R.fields.filter(f=>!f.ro).forEach(f=>{
      const e=$('#f_'+f.k);if(!e)return;let v=e.value;
      if(f.type==='tags')v=v.split(',').map(s=>s.trim()).filter(Boolean);
      else if(f.type==='bool')v=(v==='true');
      else if(f.type==='number')v=v===''?null:Number(v);
      else if(f.type==='datetime')v=v?new Date(v).toISOString():null;
      else if(f.type==='date')v=v||null;
      else v=v===''?null:v;
      if(f.req&&(v==null||v===''))ok=false;
      payload[f.k]=v;
    });
    if(!ok){toast('Please fill in required fields','err');return false;}
    let res;
    if(isEdit)res=await sb.from(R.table).update(payload).eq('id',row.id).select().single();
    else res=await sb.from(R.table).insert(payload).select().single();
    if(res.error){toast(res.error.message,'err');return false;}
    toast(R.single+(isEdit?' updated':' created'),'ok');
    if(isEdit)_cache[resKey]=(_cache[resKey]||[]).map(x=>String(x.id)===String(row.id)?res.data:x);
    else _cache[resKey]=[res.data,...(_cache[resKey]||[])];
    const _ce=$('#cnt_'+resKey);if(_ce)_ce.textContent=_cache[resKey].length;drawTable(resKey);
    if(CURRENT==='leads'&&(resKey==='contacts'||resKey==='leads'))renderPeople();
    return true;
  });
}

/* ================= PEOPLE / 360 CRM ================= */
let PEOPLE=[];
async function renderPeople(){
  const v=$('#view');
  v.innerHTML=`<div id="people_banner"></div><div class="panel"><div class="panel-head"><div><h3>People <span class="count-pill" id="cnt_people">…</span></h3><div class="desc">One record per email — click a person for all their data, activity & history.</div></div><div class="toolbar"><input class="search" id="search_people" placeholder="Search people…"></div></div><div class="table-wrap" id="tw_people"><div class="empty">Loading…</div></div></div>`;
  const [cr,lr,dr,rv]=await Promise.all([
    sb.from('contacts').select('*').order('last_activity_at',{ascending:false,nullsFirst:false}),
    sb.from('leads').select('id,contact_id,type,project,unit,created_at,handled_at'),
    sb.from('dataroom_access').select('contact_id,contact_email,project,granted_at'),
    sb.from('reservations').select('id,contact_id,email,project,unit,deposit_amount,status,itp_signed_at,itp_signer_name,payment_status'),
  ]);
  if(cr.error){$('#tw_people').innerHTML='<div class="empty">'+esc(cr.error.message)+'</div>';return;}
  const byC={};(lr.data||[]).forEach(l=>{(byC[l.contact_id]=byC[l.contact_id]||[]).push(l);});
  const drById={},drByEmail={};(dr.data||[]).forEach(x=>{if(x.contact_id)(drById[x.contact_id]=drById[x.contact_id]||[]).push(x);const e=(x.contact_email||'').toLowerCase();if(e)(drByEmail[e]=drByEmail[e]||[]).push(x);});
  const rvById={},rvByEmail={};(rv.data||[]).forEach(x=>{if(x.contact_id)(rvById[x.contact_id]=rvById[x.contact_id]||[]).push(x);const e=(x.email||'').toLowerCase();if(e)(rvByEmail[e]=rvByEmail[e]||[]).push(x);});
  const now=Date.now(),WK=7*864e5;
  PEOPLE=(cr.data||[]).map(c=>{
    const leads=byC[c.id]||[];
    const dra=[...(drById[c.id]||[]),...(drByEmail[(c.email||'').toLowerCase()]||[])];
    const grantedProj=new Set(dra.filter(x=>x.granted_at).map(x=>(x.project||'').toLowerCase()));
    // OPEN action items — persist until handled_at is set (dataroom also closes when access granted)
    const items=[];
    leads.filter(l=>!l.handled_at).forEach(l=>{
      if(l.type==='dataroom_request'&&!grantedProj.has((l.project||'').toLowerCase()))
        items.push({kind:'dataroom',leadId:l.id,project:l.project||'',unit:l.unit||'',at:l.created_at});
      else if(l.type==='reservation')
        items.push({kind:'reservation',leadId:l.id,project:l.project||'',unit:l.unit||'',at:l.created_at});
    });
    const myRes=[...(rvById[c.id]||[]),...(rvByEmail[(c.email||'').toLowerCase()]||[])];
    const seenRv=new Set();
    myRes.forEach(rvw=>{
      if(seenRv.has(rvw.id))return;seenRv.add(rvw.id);
      const paid=(rvw.status==='deposit_paid'||rvw.payment_status==='paid');
      if(paid)return;
      if(rvw.payment_status==='transfer_reported')
        items.push({kind:'deposit',resId:rvw.id,project:rvw.project||'',unit:rvw.unit||'',amount:rvw.deposit_amount,at:rvw.itp_signed_at});
      else if(rvw.itp_signed_at)
        items.push({kind:'itp',resId:rvw.id,project:rvw.project||'',unit:rvw.unit||'',amount:rvw.deposit_amount,at:rvw.itp_signed_at});
    });
    const newestLead=leads.reduce((m,l)=>Math.max(m,l.created_at?new Date(l.created_at).getTime():0),0);
    const lastAct=c.last_activity_at?new Date(c.last_activity_at).getTime():0;
    return {...c,_leads:leads,_items:items,
      _pending:items.filter(i=>i.kind==='dataroom').map(i=>i.project),
      _resv:items.filter(i=>i.kind==='reservation'),
      _itp:items.filter(i=>i.kind==='itp').length,
      _deposit:items.filter(i=>i.kind==='deposit').length,
      _isNew:(now-Math.max(lastAct,newestLead))<WK,_activeDr:grantedProj.size};
  });
  const cel=$('#cnt_people');if(cel)cel.textContent=PEOPLE.length;
  drawPeopleBanner();
  drawPeople();
  $('#search_people').addEventListener('input',drawPeople);
}
function drawPeopleBanner(){

  const canAct=canEdit('leads')||canEdit('portal');
  // flatten open items, newest first
  const items=[];
  PEOPLE.forEach(p=>p._items.forEach(i=>items.push({...i,p})));
  items.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  const cnt=k=>items.filter(i=>i.kind===k).length;
  const nDr=cnt('dataroom'),nRes=cnt('reservation'),nItp=cnt('itp'),nDep=cnt('deposit');
  if(!items.length){el.innerHTML='';return;}
  const parts=[];
  if(nDep)parts.push(`${nDep} aanbetaling${nDep===1?'':'en'} gemeld`);
  if(nItp)parts.push(`${nItp} ITP getekend`);
  if(nDr)parts.push(`${nDr} dataroom`);
  if(nRes)parts.push(`${nRes} reservering${nRes===1?'':'en'}`);
  let h=`<div style="background:#fdf3e2;border:1px solid #f4e2c1;border-radius:12px;padding:14px 18px;margin-bottom:18px">
    <div style="font-weight:750;color:#8a6410;margin-bottom:10px">🔔 Open acties — ${parts.join(' · ')} <span style="font-weight:500">(blijven staan tot ze afgehandeld zijn)</span></div>
    <div style="display:flex;flex-direction:column;gap:8px">`;
  // priority: deposit reported, then itp signed, then dataroom, then reservation
  const rank={deposit:0,itp:1,dataroom:2,reservation:3};
  items.sort((a,b)=>(rank[a.kind]-rank[b.kind])||(new Date(b.at||0)-new Date(a.at||0)));
  items.slice(0,12).forEach(i=>{
    const who=esc(i.p.name||i.p.email);
    const unit=i.unit?' · '+esc(i.unit):'';
    let label,btns=`<button class="btn btn-ghost btn-sm" data-openp="${i.p.id}">Open</button>`;
    if(i.kind==='deposit'){
      label=`<span class="badge green">💶 Aanbetaling gemeld</span> <b>${who}</b> <span class="muted">meldde de aanbetaling voor</span> <b>${esc(i.project||'')}${unit}</b>`;
      if(canAct)btns=`<button class="btn btn-primary btn-sm" data-confirm="${i.resId}" data-amt="${i.amount||''}">Confirm paid</button>`+btns;
    }else if(i.kind==='itp'){
      label=`<span class="badge blue">📝 ITP getekend</span> <b>${who}</b> <span class="muted">tekende de ITP voor</span> <b>${esc(i.project||'')}${unit}</b> <span class="muted">— wacht op aanbetaling</span>`;
      if(canAct)btns=`<button class="btn btn-primary btn-sm" data-confirm="${i.resId}" data-amt="${i.amount||''}">Confirm paid</button>`+btns;
    }else if(i.kind==='dataroom'){
      label=`<span class="badge amber">🔓 Dataroom</span> <b>${who}</b> <span class="muted">wil toegang tot</span> <b>${esc(i.project||'algemeen')}</b>`;
      if(canAct){btns=`<button class="btn btn-primary btn-sm" data-grant="${i.p.id}" data-project="${esc(i.project)}" data-lead="${i.leadId}">Grant access</button>`+btns+`<button class="btn btn-ghost btn-sm" data-done="${i.leadId}">Mark done</button>`;}
    }else{
      label=`<span class="badge blue">📌 Reservering</span> <b>${who}</b> <span class="muted">reserveerde</span> <b>${esc(i.project||'')}${unit}</b>`;
      if(canAct)btns+=`<button class="btn btn-ghost btn-sm" data-done="${i.leadId}">Mark done</button>`;
    }
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid #f4e2c1;padding-top:8px"><div style="font-size:13px">${label} <span class="muted" style="font-size:11px">· ${fmtDate(i.at)}</span></div><div class="row-actions">${btns}</div></div>`;
  });
  if(items.length>12)h+=`<div class="muted" style="font-size:12px">+ ${items.length-12} more…</div>`;
  h+='</div></div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-openp]').forEach(b=>b.onclick=()=>openPerson(PEOPLE.find(x=>x.id===b.dataset.openp)));
  el.querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>bannerGrantDataroom(b.dataset.grant,b.dataset.project,b.dataset.lead));
  el.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>bannerMarkDone(b.dataset.done));
  el.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>bannerConfirmPaid(b.dataset.confirm,Number(b.dataset.amt)||null));
}

  if(error){toast(error.message,'err');return false;}

async function bannerGrantDataroom(personId,project,leadId){

/* ============ NOTIFICATIONS INBOX ============ */
async function loadActionItems(){
  const [lr,rr,dr]=await Promise.all([
    sb.from('leads').select('id,contact_id,type,project,unit,created_at,handled_at,name,email,phone').in('type',['dataroom_request','reservation']).order('created_at',{ascending:false}),
    sb.from('reservations').select('id,contact_id,email,name,project,unit,deposit_amount,status,itp_signed_at,payment_status,paid_at,cleared_at,updated_at').order('updated_at',{ascending:false}),
    sb.from('dataroom_access').select('contact_id,contact_email,project,granted_at'),
  ]);
  const granted=new Set();(dr.data||[]).forEach(x=>{if(!x.granted_at)return;const p=(x.project||'').toLowerCase();if(x.contact_id)granted.add(x.contact_id+'|'+p);if(x.contact_email)granted.add((x.contact_email||'').toLowerCase()+'|'+p);});
  const open=[],done=[];
  (lr.data||[]).forEach(l=>{
    const base={src:'lead',id:l.id,contact_id:l.contact_id,who:l.name||l.email||'—',email:l.email,project:l.project||'',unit:l.unit||'',at:l.created_at};
    if(l.type==='dataroom_request'){
      const g=granted.has(l.contact_id+'|'+(l.project||'').toLowerCase())||granted.has((l.email||'').toLowerCase()+'|'+(l.project||'').toLowerCase());
      if(l.handled_at||g)done.push({...base,kind:'dataroom',doneAt:l.handled_at});else open.push({...base,kind:'dataroom'});
    }else{
      if(l.handled_at)done.push({...base,kind:'reservation',doneAt:l.handled_at});else open.push({...base,kind:'reservation'});
    }
  });
  (rr.data||[]).forEach(r=>{
    const paid=(r.status==='deposit_paid'||r.payment_status==='paid');
    const base={src:'resv',id:r.id,contact_id:r.contact_id,who:r.name||r.email||'—',email:r.email,project:r.project||'',unit:r.unit||'',amount:r.deposit_amount,at:r.itp_signed_at||r.updated_at};
    if(!paid&&!r.cleared_at&&r.payment_status==='transfer_reported')open.push({...base,kind:'deposit'});
    else if(!paid&&!r.cleared_at&&r.itp_signed_at)open.push({...base,kind:'itp'});
    else if((paid||r.cleared_at)&&(r.itp_signed_at||r.payment_status))done.push({...base,kind:paid?'deposit_paid':'itp',doneAt:r.paid_at||r.cleared_at});
  });
  open.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  done.sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  return {open,done};
}
async function refreshNotifBadge(){

}
function notifLabel(i){
  const unit=i.unit?' · '+esc(i.unit):'';
  if(i.kind==='dataroom')return `<span class="badge amber">🔓 Dataroom</span> <b>${esc(i.who)}</b> <span class="muted">wil toegang tot</span> <b>${esc(i.project||'algemeen')}</b>`;
  if(i.kind==='reservation')return `<span class="badge blue">📌 Reserveringsaanvraag</span> <b>${esc(i.who)}</b> <span class="muted">voor</span> <b>${esc(i.project||'')}${unit}</b>`;
  if(i.kind==='itp')return `<span class="badge blue">📝 ITP getekend</span> <b>${esc(i.who)}</b> <span class="muted">— ${esc(i.project||'')}${unit}, wacht op aanbetaling</span>`;
  if(i.kind==='deposit')return `<span class="badge green">💶 Aanbetaling gemeld</span> <b>${esc(i.who)}</b> <span class="muted">— ${esc(i.project||'')}${unit}</span>`;
  if(i.kind==='deposit_paid')return `<span class="badge green">✓ Aanbetaling ontvangen</span> <b>${esc(i.who)}</b> <span class="muted">— ${esc(i.project||'')}${unit}</span>`;

let NOTIF_TAB='open';
async function openNotifications(){
  showDetail('Notificaties','<div class="muted" style="padding:10px">Laden…</div>');
  const {open,done}=await loadActionItems();
  const canAct=canEdit('leads')||canEdit('portal');
  const render=()=>{
    let h=`<div class="ntab"><button data-tab="open" class="${NOTIF_TAB==='open'?'on':''}">Open (${open.length})</button><button data-tab="done" class="${NOTIF_TAB==='done'?'on':''}">Afgehandeld</button></div>`;
    const list=NOTIF_TAB==='open'?open:done.slice(0,40);
    if(!list.length)h+=`<div class="muted" style="padding:14px 2px">${NOTIF_TAB==='open'?'Geen open acties. 🎉':'Nog niets afgehandeld.'}</div>`;
    list.forEach(i=>{
      let btns=(i.src==='resv')?`<button class="btn btn-ghost btn-sm" data-openr="${i.id}">Open</button>`:`<button class="btn btn-ghost btn-sm" data-open="${i.contact_id||''}">Open</button>`;
      if(NOTIF_TAB==='open'&&canAct){
        if(i.kind==='dataroom')btns=`<button class="btn btn-primary btn-sm" data-grant="${i.contact_id}" data-project="${esc(i.project)}" data-lead="${i.id}">Grant access</button>`+btns;
        if(i.kind==='reservation')btns=`<button class="btn btn-primary btn-sm" data-makeitp="${i.id}">Maak ITP</button>`+btns;
        if(i.kind==='itp'||i.kind==='deposit')btns=`<button class="btn btn-primary btn-sm" data-confirm="${i.id}" data-amt="${i.amount||''}">Confirm paid</button>`+btns;
        btns+=`<button class="btn btn-ghost btn-sm" data-complete="${i.id}:${(i.src==='lead')?'lead':'resv'}">✓ Afronden</button>`;
      }
      const when=NOTIF_TAB==='open'?fmtDateTime(i.at):('✓ '+fmtDate(i.doneAt));
      h+=`<div class="nrow"><div style="font-size:13px">${notifLabel(i)} <span class="muted" style="font-size:11px">· ${when}</span></div>${NOTIF_TAB==='open'?`<div class="row-actions">${btns}</div>`:''}</div>`;
    });
    const mb=document.querySelector('#overlay .modal-body');if(!mb)return;
    mb.innerHTML=h;
    mb.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{NOTIF_TAB=b.dataset.tab;render();});
    mb.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open){closeOverlay();openContactById(b.dataset.open);}else{toast('Geen contact gekoppeld','err');}});
    mb.querySelectorAll('[data-openr]').forEach(b=>b.onclick=()=>{closeOverlay();openReservation(b.dataset.openr);});
    mb.querySelectorAll('[data-grant]').forEach(b=>b.onclick=async()=>{await bannerGrantDataroom(b.dataset.grant,b.dataset.project,b.dataset.lead);afterNotifAction();});
    mb.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=async()=>{await bannerConfirmPaid(b.dataset.confirm,Number(b.dataset.amt)||null);afterNotifAction();});
    mb.querySelectorAll('[data-makeitp]').forEach(b=>b.onclick=()=>{closeOverlay();makeItpFromReservationLead(b.dataset.makeitp);});
    mb.querySelectorAll('[data-complete]').forEach(b=>b.onclick=async()=>{const parts=b.dataset.complete.split(':');await notifComplete(parts[0],parts[1]);openNotifications();});
  };
  render();
}

function downloadItpPdf(r){
  if(!window.jspdf){toast('PDF-bibliotheek nog aan het laden, probeer zo nog eens','err');return;}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  const M=56;let y=64;const W=doc.internal.pageSize.getWidth()-M*2;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('UTAMA — Intentieverklaring tot aankoop',M,y);y+=26;
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(30);
  const body=r.itp_body||itpDraft(r);
  const lines=['Opgesteld op '+new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}),'',...body.split('\n')];
  if(r.itp_signed_at)lines.push('','ONDERTEKENING','Digitaal ondertekend door: '+(r.itp_signer_name||''),'Datum: '+fmtDateTime(r.itp_signed_at),'Verificatie-hash: '+(r.itp_hash||''));
  lines.forEach(t=>{const w=doc.splitTextToSize(t,W);w.forEach(x=>{if(y>790){doc.addPage();y=64;}doc.text(x,M,y);y+=15;});});
  doc.save('ITP-'+((r.project||'')+'-'+(r.unit||'')).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf');
  toast('ITP-PDF gedownload','ok');
}

    const to=r.email||person.email||'';
    if(!to){toast('Geen e-mailadres bekend voor deze lead','err');return;}
    url='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('Je intentieverklaring — UTAMA '+(r.project||''))+'&body='+encodeURIComponent(msg);
  }
  const w=window.open(url,'_blank');
  await sb.from('reservations').update({sent_at:new Date().toISOString(),sent_via:via}).eq('id',r.id);
  if(w){toast((via==='whatsapp'?'WhatsApp':'E-mail')+' geopend — de ITP-link staat in het bericht. Klik op verzenden in '+(via==='whatsapp'?'WhatsApp':'je mail'),'ok');}
  else{try{navigator.clipboard.writeText(msg+'\n'+link);}catch(e){}toast('Pop-up geblokkeerd — bericht + link zijn gekopieerd, plak ze in '+(via==='whatsapp'?'WhatsApp':'je e-mail'),'err');}
  if(PERSON_RESV[r.id])PERSON_RESV[r.id].sent_at=new Date().toISOString();
}
async function markReservationPaid(id,amount,person){
  if(!confirm('Bevestig dat de aanbetaling is ontvangen? De reservering wordt op "deposit paid" gezet.'))return;
  const {error}=await sb.from('reservations').update({status:'deposit_paid',payment_status:'paid',paid_at:new Date().toISOString(),paid_amount:amount,paid_method:'bank_transfer'}).eq('id',id);
  if(error){toast(error.message,'err');return;}
  toast('Aanbetaling bevestigd','ok');openPerson(person);
}
const RESV_SITE='https://utamabali.com';
function openReservationForm(p,projList,prefill){
  prefill=prefill||{};
  const opts=(projList||[]).map(pr=>`<option value="${esc(pr.name)}" data-price="${pr.price_current||''}" ${prefill.project&&(prefill.project||'').toLowerCase()===(pr.name||'').toLowerCase()?'selected':''}>${esc(pr.name)}</option>`).join('');
  const bodyH=`<div class="grid2">
    <div class="field"><label>Project</label><select id="rv_project">${opts}</select></div>
    <div class="field"><label>Unit</label><input id="rv_unit" placeholder="bv. 2BR #3" value="${esc(prefill.unit||'')}"></div>
    <div class="field"><label>Indicatieve koopsom (€)</label><input id="rv_price" type="number" step="any"></div>
    <div class="field"><label>Aanbetaling (€)</label><input id="rv_dep" type="number" step="any" value="5000"></div>
  </div><div class="hint">De ITP wordt automatisch opgemaakt (bewerkbaar) met een deelbare link. Daarna open je meteen de ITP-editor om te versturen via WhatsApp of e-mail.</div>`;
  showModal('ITP opstellen / reservering',bodyH,async()=>{
    const project=$('#rv_project').value;const unit=$('#rv_unit').value.trim();
    const unit_price=$('#rv_price').value?Number($('#rv_price').value):null;
    const deposit=$('#rv_dep').value?Number($('#rv_dep').value):5000;
    const token=((crypto&&crypto.randomUUID)?crypto.randomUUID():('t'+Date.now())).replace(/-/g,'')+Math.random().toString(36).slice(2,8);
    const itp_body=itpDraft({name:p.name,email:p.email,project,unit,unit_price,deposit_amount:deposit});
    const {data:row,error}=await sb.from('reservations').insert({token,contact_id:p.id,name:p.name,email:p.email,phone:p.phone,project,unit,unit_price,deposit_amount:deposit,itp_body,source:'admin',created_by:(ME.full_name||ME.email)}).select().single();
    if(error){toast(error.message,'err');return false;}
    if(prefill.leadId)await markLeadHandled(prefill.leadId);
    toast('ITP aangemaakt — bewerk en verstuur','ok');
    setTimeout(()=>{if(row)openItpEditor(row,p);else openPerson(p);refreshNotifBadge();},60);
    return true;
  });
  setTimeout(()=>{const ps=$('#rv_project'),pr=$('#rv_price');if(ps&&pr){const sync=()=>{const o=ps.selectedOptions[0];if(o&&o.dataset.price&&!pr.value)pr.value=o.dataset.price;};ps.onchange=sync;sync();}},0);
}
async function setDataroom(person,project,enable,rowId){
  try{
    if(!enable){
      if(rowId){const {error}=await sb.from('dataroom_access').delete().eq('id',rowId);if(error)throw error;}
    }else if(rowId){
      const {error}=await sb.from('dataroom_access').update({granted_at:new Date().toISOString()}).eq('id',rowId);
      if(error)throw error;
    }else{
      const {error}=await sb.from('dataroom_access').insert({contact_id:person.id,contact_email:person.email,contact_name:person.name,project:project||null,granted_at:new Date().toISOString()});
      if(error)throw error;
    }
    if(enable&&project){await sb.from('leads').update({handled_at:new Date().toISOString(),handled_by:(ME.full_name||ME.email)}).eq('contact_id',person.id).eq('type','dataroom_request').eq('project',project).is('handled_at',null);}
    toast('Dataroom '+(enable?'enabled':'disabled')+(project?' · '+project:''),'ok');
    openPerson(person);
  }catch(err){toast(err.message||'Failed','err');}
}
function showDetail(title,bodyHTML){
  const ov=$('#overlay');
  ov.innerHTML=`<div class="modal" style="width:760px"><div class="modal-head"><h3>${title}</h3><button class="x" id="mx">×</button></div><div class="modal-body">${bodyHTML}</div><div class="modal-foot"><button class="btn btn-ghost" id="mcancel">Close</button></div></div>`;
  ov.style.display='flex';
  const close=()=>{ov.style.display='none';ov.innerHTML='';};
  $('#mx').onclick=close;$('#mcancel').onclick=close;
  ov.onclick=e=>{if(e.target===ov)close();};
}

/* ================= USERS / TEAM ================= */
async function renderUsers(){
  const v=$('#view');
  if(!isAdmin()){
    v.innerHTML='<div class="panel"><div class="panel-head"><h3>Team</h3><span class="readonly-tag">Read only</span></div><div class="table-wrap" id="tw_users"><div class="empty">Loading…</div></div></div>';
    const {data}=await sb.from('adm_profiles').select('*').order('created_at');
    let h='<table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>';
    (data||[]).forEach(u=>{h+=`<tr><td>${esc(u.full_name||'—')}</td><td>${esc(u.email)}</td><td>${u.is_admin?'<span class="badge green">Admin</span>':'<span class="badge grey">Member</span>'}</td></tr>`;});
    $('#tw_users').innerHTML=h+'</tbody></table>';return;
  }
  v.innerHTML=`<div class="panel"><div class="panel-head"><div><h3>Team & Users</h3><div class="desc">Add people and choose exactly which pages they can view or edit.</div></div>
     <button class="btn btn-primary btn-sm" id="addUser">+ Add user</button></div>
     <div class="table-wrap" id="tw_users"><div class="empty">Loading…</div></div></div>`;
  $('#addUser').onclick=()=>openUserForm();
  await loadUsers();
}
async function loadUsers(){
  const {data:profs,error}=await sb.from('adm_profiles').select('*').order('created_at');
  if(error){$('#tw_users').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return;}
  const {data:perms}=await sb.from('adm_permissions').select('*');
  const byUser={};(perms||[]).forEach(p=>{(byUser[p.user_id]=byUser[p.user_id]||{})[p.page]=p;});
  let h='<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Page access</th><th style="text-align:right">Actions</th></tr></thead><tbody>';
  profs.forEach(u=>{
    let access;
    if(u.is_admin)access='<span class="badge green">Full access (admin)</span>';
    else{const parts=PAGES.map(p=>{const pp=byUser[u.id]&&byUser[u.id][p.key];if(!pp||(!pp.can_view&&!pp.can_edit))return null;return `<span class="badge ${pp.can_edit?'green':'blue'}">${p.label.split(' ')[0]}: ${pp.can_edit?'edit':'view'}</span>`;}).filter(Boolean);access=parts.length?parts.join(' '):'<span class="muted">none</span>';}
    h+=`<tr><td><b>${esc(u.full_name||'—')}</b></td><td>${esc(u.email)}</td>
      <td>${u.is_admin?'<span class="badge green">Admin</span>':'<span class="badge grey">Member</span>'}</td>
      <td style="white-space:normal">${access}</td>
      <td><div class="row-actions">
        <button class="btn btn-ghost btn-sm" data-perm="${u.id}">Permissions</button>
        <button class="btn btn-danger btn-sm" data-deluser="${u.id}" ${u.id===ME.id?'disabled title="You can’t delete yourself"':''}>Delete</button>
      </div></td></tr>`;
  });
  $('#tw_users').innerHTML=h+'</tbody></table>';
  $('#tw_users').querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>openPermForm(profs.find(x=>x.id===b.dataset.perm),byUser[b.dataset.perm]||{}));
  $('#tw_users').querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.deluser));
}
function permGridHTML(existing,disabled){
  let h=`<table class="perm-table"><thead><tr><th>Page</th><th class="center">View</th><th class="center">Edit</th></tr></thead><tbody>`;
  PAGES.forEach(p=>{const e=existing&&existing[p.key];
    h+=`<tr><td>${p.icon} ${p.label}</td>
      <td class="center"><input type="checkbox" data-view="${p.key}" ${e&&e.can_view?'checked':''} ${disabled?'disabled':''}></td>
      <td class="center"><input type="checkbox" data-edit="${p.key}" ${e&&e.can_edit?'checked':''} ${disabled?'disabled':''}></td></tr>`;});
  return h+'</tbody></table><div class="hint">Ticking “Edit” automatically allows viewing too. Admins always have full access to every page.</div>';
}
function openUserForm(){
  const body=`
    <div class="grid2">
      <div class="field"><label>Full name</label><input id="u_name"></div>
      <div class="field"><label>Email *</label><input id="u_email" type="email"></div>
      <div class="field" style="grid-column:1/-1"><label>Temporary password *</label><input id="u_pass" value="${randPw()}"><div class="hint">Share this with the user; they change it after signing in.</div></div>
    </div>
    <div class="field"><label style="margin-bottom:8px">Make this user an admin?</label>
      <label style="font-weight:500"><input type="checkbox" id="u_admin"> Full access to everything (admin)</label></div>
    <div class="field"><label>Page permissions</label>${permGridHTML(null,false)}</div>`;
  showModal('Add user',body,async()=>{
    const email=$('#u_email').value.trim();const password=$('#u_pass').value;const full_name=$('#u_name').value.trim();
    if(!email||!password){toast('Email and password are required','err');return false;}
    const permissions=PAGES.map(p=>{const view=$(`[data-view="${p.key}"]`).checked;const edit=$(`[data-edit="${p.key}"]`).checked;return {page:p.key,can_view:view||edit,can_edit:edit};});
    const makeAdmin=$('#u_admin').checked;
    try{const r=await callFn('create',{email,password,full_name,permissions});
      if(makeAdmin){await sb.from('adm_profiles').update({is_admin:true}).eq('id',r.id);}
      toast('User created','ok');await loadUsers();return true;
    }catch(err){toast(err.message,'err');return false;}
  });
}
function openPermForm(user,existing){
  const admin=user.is_admin;
  const body=`
    <div class="field"><label>User</label><div><b>${esc(user.full_name||user.email)}</b> <span class="muted">${esc(user.email)}</span></div></div>
    <div class="field"><label style="margin-bottom:8px">Role</label>
      <label style="font-weight:500"><input type="checkbox" id="p_admin" ${admin?'checked':''} ${user.id===ME.id?'disabled title="You can’t change your own admin role"':''}> Admin (full access to everything)</label></div>
    <div class="field"><label>Page permissions</label><div id="permBox">${permGridHTML(existing,admin)}</div></div>
    <div class="field" style="border-top:1px solid var(--line);padding-top:14px">
      <label>Reset password</label>
      <div style="display:flex;gap:8px"><input id="p_newpw" placeholder="New password"><button type="button" class="btn btn-ghost btn-sm" id="p_reset">Set password</button></div>
    </div>`;
  showModal('Permissions · '+esc(user.full_name||user.email),body,async()=>{
    const makeAdmin=$('#p_admin').checked;
    if(makeAdmin!==admin && user.id!==ME.id){await sb.from('adm_profiles').update({is_admin:makeAdmin}).eq('id',user.id);}
    if(!makeAdmin){
      const rows=PAGES.map(p=>{const view=$(`[data-view="${p.key}"]`).checked;const edit=$(`[data-edit="${p.key}"]`).checked;return {user_id:user.id,page:p.key,can_view:view||edit,can_edit:edit};});
      const {error}=await sb.from('adm_permissions').upsert(rows,{onConflict:'user_id,page'});
      if(error){toast(error.message,'err');return false;}
    }
    toast('Permissions saved','ok');await loadUsers();return true;
  });
  setTimeout(()=>{
    const ac=$('#p_admin');if(ac)ac.onchange=()=>{$('#permBox').innerHTML=permGridHTML(existing,ac.checked);};
    const rb=$('#p_reset');if(rb)rb.onclick=async()=>{const pw=$('#p_newpw').value;if(!pw){toast('Enter a new password','err');return;}try{await callFn('set_password',{user_id:user.id,password:pw});toast('Password updated','ok');$('#p_newpw').value='';}catch(err){toast(err.message,'err');}};
  },0);
}
async function deleteUser(id){
  if(!confirm('Delete this user’s account and access? This cannot be undone.'))return;
  try{await callFn('delete',{user_id:id});toast('User deleted','ok');await loadUsers();}catch(err){toast(err.message,'err');}
}
async function callFn(action,payload){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SUPABASE_URL}/functions/v1/adm-users`,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON},
    body:JSON.stringify({action,...payload})});
  let json={};try{json=await res.json();}catch(e){}
  if(!res.ok||json.error)throw new Error(json.error||('Request failed ('+res.status+')'));
  return json;
}

/* ================= CHANGE PASSWORD ================= */
function openChangePw(){
  const body=`<div class="field"><label>New password</label><input id="cp_pw" type="password" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm new password</label><input id="cp_pw2" type="password"></div>`;
  showModal('Change password',body,async()=>{
    const a=$('#cp_pw').value,b=$('#cp_pw2').value;
    if(a.length<6){toast('Password too short','err');return false;}
    if(a!==b){toast('Passwords don’t match','err');return false;}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){toast(error.message,'err');return false;}
    toast('Password changed','ok');return true;
  });
}

/* ================= MODAL ================= */
function showModal(title,bodyHTML,onSave){
  const ov=$('#overlay');
  ov.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="x" id="mx">×</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mcancel">Cancel</button><button class="btn btn-primary" id="msave">Save</button></div></div>`;
  ov.style.display='flex';
  const close=()=>{ov.style.display='none';ov.innerHTML='';};
  $('#mx').onclick=close;$('#mcancel').onclick=close;
  ov.onclick=e=>{if(e.target===ov)close();};
  $('#msave').onclick=async()=>{const btn=$('#msave');btn.disabled=true;btn.textContent='Saving…';const ok=await onSave();btn.disabled=false;btn.textContent='Save';if(ok!==false)close();};
}
function randPw(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return s+'!';}

/* ================= START ================= */
boot();
